<svg xmlns="http://www.w3.org/2000/svg" width="420" height="450" viewBox="0 0 420 450" role="img" aria-label="Reported penicillin allergy">
<title>Reported penicillin allergy</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Reported penicillin allergy</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Mild rash or a remote childhood reaction:</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">often eligible for a graded challenge or a</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">cephalosporin.</text>
<rect x="24" y="160" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Hives, angioedema, bronchospasm, or</text>
<text x="36" y="204" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">anaphylaxis: avoid the same side chain.</text>
<text x="36" y="226" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Use a non-beta-lactam or desensitize.</text>
<rect x="24" y="250" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="272" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Side-chain similarity matters more than</text>
<text x="36" y="294" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">the class label.</text>
<rect x="24" y="318" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="340" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Most labels are not IgE allergy. A</text>
<text x="36" y="362" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">structured history comes before automatic</text>
<text x="36" y="384" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">avoidance.</text>
<text x="28" y="416" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">AAAAI and IDSA penicillin-allergy pathways</text>
</svg>
