<svg xmlns="http://www.w3.org/2000/svg" width="420" height="338" viewBox="0 0 420 338" role="img" aria-label="Cancer-associated VTE">
<title>Cancer-associated VTE</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Cancer-associated VTE</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">A direct oral anticoagulant or</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">low-molecular-weight heparin is preferred</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">to warfarin for many patients.</text>
<rect x="24" y="160" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Gastrointestinal and genitourinary cancers</text>
<text x="36" y="204" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">raise the bleeding risk of some DOACs.</text>
<rect x="24" y="228" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="250" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Treat at least 3 to 6 months, and longer</text>
<text x="36" y="272" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">while cancer is active.</text>
<text x="28" y="304" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">ASCO and ISTH cancer thrombosis guidance</text>
</svg>
