<svg xmlns="http://www.w3.org/2000/svg" width="420" height="434" viewBox="0 0 420 434" role="img" aria-label="CKD anemia and mineral bone disease">
<title>CKD anemia and mineral bone disease</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">CKD anemia and mineral bone</text>
<text x="28" y="64" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">disease</text>
<rect x="24" y="98" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="120" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Anemia of CKD: evaluate iron before an</text>
<text x="36" y="142" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">ESA.</text>
<rect x="24" y="166" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="188" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">ESA is not started to chase a normal</text>
<text x="36" y="210" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">hemoglobin.</text>
<rect x="24" y="234" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="256" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Phosphate binders with meals. Separate</text>
<text x="36" y="278" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">from other drugs.</text>
<rect x="24" y="302" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="324" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Active vitamin D or a calcimimetic is for</text>
<text x="36" y="346" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">secondary hyperparathyroidism, not for a</text>
<text x="36" y="368" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">normal PTH.</text>
<text x="28" y="400" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">KDIGO CKD guideline</text>
</svg>
