<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-label="Two clocks after last known well">
<title>Two clocks after last known well</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">Last known well starts two clocks</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="14" fill="#1C2830">
  <rect x="24" y="56" width="632" height="40" rx="8" fill="#0F766E"/>
  <text x="36" y="81" fill="#FFFFFF">Start: last known well. Glucose. Non-contrast CT before any contrast study.</text>
  <rect x="24" y="112" width="300" height="128" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="40" y="140" font-weight="700">Thrombolysis clock</text>
  <text x="40" y="166">No blood on the CT.</text>
  <text x="40" y="188">Selected patients inside</text>
  <text x="40" y="210">the AHA/ASA window.</text>
  <rect x="356" y="112" width="300" height="128" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="372" y="140" font-weight="700">Thrombectomy clock</text>
  <text x="372" y="166">Large-vessel occlusion.</text>
  <text x="372" y="188">Imaging can select patients</text>
  <text x="372" y="210">well after the drug window.</text>
  <text x="28" y="276">Blood on the CT stops the drug. It does not stop the hunt for a surgical or pressure problem.</text>
  <text x="28" y="304" fill="#5C6B73">Confirm the current AHA/ASA hours before you treat. This figure does not print a dose.</text>
</g>
</svg>
