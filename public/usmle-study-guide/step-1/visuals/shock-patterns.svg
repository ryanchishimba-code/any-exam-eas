<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Shock patterns by pump, tank, and pipes">
<title>Shock patterns</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">Shock: pump, tank, or pipes</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="14" fill="#1C2830">
  <rect x="24" y="58" width="290" height="64" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="84">Pump fails — cardiogenic, obstructive</text>
  <text x="36" y="106" fill="#5C6B73">Cardiac output down. Skin is cold. JVD may be up.</text>
  <rect x="326" y="58" width="290" height="64" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="338" y="84">Tank empty — hypovolemic</text>
  <text x="338" y="106" fill="#5C6B73">Cardiac output down. JVD down. Skin cold.</text>
  <rect x="24" y="136" width="592" height="64" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="162">Pipes leak — distributive (sepsis, anaphylaxis, neurogenic)</text>
  <text x="36" y="184" fill="#5C6B73">Vascular tone down. Skin is often warm. Cardiac output is usually up until the heart fails.</text>
</g>
<text x="28" y="236" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">Obstructive shock is a pump that cannot fill or eject: tamponade, tension pneumothorax, massive PE.</text>
<text x="28" y="268" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">Physiology, not a treatment protocol. Management lives in the Step 2 and Step 3 books.</text>
</svg>
