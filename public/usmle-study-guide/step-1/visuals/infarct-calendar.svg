<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img" aria-label="Order of complications after myocardial necrosis">
<title>Infarct calendar</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="34" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">After the muscle dies, the clock matters</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="14" fill="#1C2830">
  <rect x="24" y="54" width="150" height="130" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="82" font-weight="700">First hours</text>
  <text x="36" y="110">Irritable muscle</text>
  <text x="36" y="134">Arrhythmia</text>
  <rect x="186" y="54" width="150" height="130" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="198" y="82" font-weight="700">Several days</text>
  <text x="198" y="110">Soft necrotic wall</text>
  <text x="198" y="134">Rupture risk</text>
  <rect x="348" y="54" width="150" height="130" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="360" y="82" font-weight="700">Later scar</text>
  <text x="360" y="110">Thin fibrous wall</text>
  <text x="360" y="134">Aneurysm</text>
  <rect x="510" y="54" width="146" height="130" rx="8" fill="#0F766E"/>
  <text x="522" y="82" fill="#FFFFFF" font-weight="700">Weeks</text>
  <text x="522" y="110" fill="#FFFFFF">Immune</text>
  <text x="522" y="134" fill="#D1FAF4">Late pericarditis</text>
</g>
<text x="28" y="220" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="14" fill="#1C2830">The order is the question. Exact day-counts should be checked against a pathology source.</text>
<text x="28" y="252" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">Mechanism only. Reperfusion decisions are in the Step 2 book.</text>
</svg>
