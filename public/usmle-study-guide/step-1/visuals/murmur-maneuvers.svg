<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="How preload changes two murmurs and not the others">
<title>Murmur maneuvers</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">More preload, then listen again</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">
  <rect x="24" y="56" width="310" height="150" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="84" font-weight="700">Louder when the heart is fuller</text>
  <text x="36" y="112">Aortic stenosis</text>
  <text x="36" y="136">Mitral regurgitation</text>
  <text x="36" y="160">Aortic regurgitation</text>
  <text x="36" y="184">Most flow murmurs</text>
  <rect x="350" y="56" width="306" height="150" rx="8" fill="#0F766E"/>
  <text x="364" y="84" fill="#FFFFFF" font-weight="700">Softer when the heart is fuller</text>
  <text x="364" y="112" fill="#FFFFFF">Hypertrophic obstruction</text>
  <text x="364" y="136" fill="#FFFFFF">Mitral valve prolapse</text>
  <text x="364" y="168" fill="#D1FAF4">Stand and Valsalva do the opposite.</text>
</g>
<text x="28" y="240" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="14" fill="#1C2830">Squat and passive leg raise add preload. Handgrip adds afterload.</text>
<text x="28" y="268" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">A physiology map. It is not a reason to perform a maneuver on an unstable patient.</text>
</svg>
