<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Step 1 mechanism ladder from normal process to the finding">
<title>Step 1 mechanism ladder</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">Read every stem as a mechanism</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">
  <rect x="24" y="58" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="88">Normal process</text>
  <text x="36" y="110" fill="#5C6B73">what should happen</text>
  <rect x="184" y="58" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="196" y="88">Broken step</text>
  <text x="196" y="110" fill="#5C6B73">one lesion or drug</text>
  <rect x="344" y="58" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="356" y="88">Compensation</text>
  <text x="356" y="110" fill="#5C6B73">what the body does</text>
  <rect x="504" y="58" width="112" height="72" rx="8" fill="#0F766E"/>
  <text x="516" y="88" fill="#FFFFFF">Finding</text>
  <text x="516" y="110" fill="#D1FAF4">what you see</text>
</g>
<text x="28" y="168" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">Most wrong answers are the neighboring step: a cause, a consequence, or a different system.</text>
<text x="28" y="196" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">Name the normal process before you name the disease.</text>
<text x="28" y="248" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">USMLE Step 1 physician tasks: foundational science, then diagnosis</text>
</svg>
