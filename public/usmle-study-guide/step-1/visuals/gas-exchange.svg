<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-label="Five causes of low arterial oxygen">
<title>Why arterial oxygen falls</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="34" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#102027">Low oxygen: gradient, then oxygen</text>
<g font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#1C2830">
  <rect x="24" y="54" width="310" height="120" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
  <text x="36" y="84" font-weight="700">Normal A-a gradient</text>
  <text x="36" y="112">Thin air, or not enough breathing.</text>
  <text x="36" y="136">Extra oxygen helps.</text>
  <rect x="350" y="54" width="306" height="120" rx="8" fill="#0F766E"/>
  <text x="364" y="84" fill="#FFFFFF" font-weight="700">High A-a gradient</text>
  <text x="364" y="112" fill="#FFFFFF">Mismatch usually yields to oxygen.</text>
  <text x="364" y="140" fill="#D1FAF4">Shunt does not fully yield.</text>
</g>
<text x="28" y="214" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">Physiology only. The oxygen device and the ventilator are later Steps.</text>
</svg>
