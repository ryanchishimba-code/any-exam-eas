<svg xmlns="http://www.w3.org/2000/svg" width="420" height="384" viewBox="0 0 420 384" role="img" aria-label="Heart failure in clinic">
<title>Heart failure in clinic</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Heart failure in clinic</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Congestion: a loop diuretic and a</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">same-week review if the patient is hypoxic</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">or hypotensive.</text>
<rect x="24" y="160" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">HFrEF: four drug classes (2022 guideline).</text>
<rect x="24" y="206" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="228" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Do not start a non-dihydropyridine</text>
<text x="36" y="250" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">calcium-channel blocker.</text>
<rect x="24" y="274" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="296" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Daily weight. Call for a gain of 2 to 3</text>
<text x="36" y="318" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">pounds in a day.</text>
<text x="28" y="350" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">2022 AHA/ACC/HFSA heart failure guideline</text>
</svg>
