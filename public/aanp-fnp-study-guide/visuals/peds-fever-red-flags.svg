<svg xmlns="http://www.w3.org/2000/svg" width="420" height="338" viewBox="0 0 420 338" role="img" aria-label="Fever in children">
<title>Fever in children</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Fever in children</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Under 28 days with a fever of 38.0 °C:</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">full evaluation. Do not send the infant</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">home.</text>
<rect x="24" y="160" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Sickle cell disease and fever of 38.5 °C</text>
<text x="36" y="204" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">or higher: parenteral antibiotics.</text>
<rect x="24" y="228" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="250" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Petechiae with fever, a stiff neck, or</text>
<text x="36" y="272" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">poor perfusion: emergency care.</text>
<text x="28" y="304" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">AAP febrile infant guidance</text>
</svg>
