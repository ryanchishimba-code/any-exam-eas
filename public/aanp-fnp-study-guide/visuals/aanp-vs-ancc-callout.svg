<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="aanp-ancc-title">
  <title id="aanp-ancc-title">NPCB FNP-C vs ANCC FNP-BC blueprint comparison</title>
  <rect width="720" height="360" fill="#f8fafc"/>
  <text x="360" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0f172a">NPCB (FNP-C) vs ANCC (FNP-BC)</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#475569">Both test entry-level FNP competence  official blueprints differ</text>

  <rect x="24" y="72" width="300" height="220" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/>
  <rect x="24" y="72" width="300" height="40" rx="10" fill="#0d9488"/>
  <text x="174" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">NPCB FNP-C (this book)</text>
  <text x="40" y="132" font-size="12" fill="#334155">" Domain I: Assess / Diagnose / Plan / Evaluate</text>
  <text x="40" y="154" font-size="12" fill="#334155">" Domain II: patient age bands (official %)</text>
  <text x="40" y="176" font-size="12" fill="#334155">" 150 items (135 scored + 15 pretest)</text>
  <text x="40" y="198" font-size="12" fill="#334155">" 3-hour testing appointment</text>
  <text x="40" y="220" font-size="12" fill="#334155">" Verify aanpcert.org Candidate Handbook</text>

  <circle cx="360" cy="182" r="28" fill="#1e3a5f"/>
  <text x="360" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">VS</text>

  <rect x="396" y="72" width="300" height="220" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <rect x="396" y="72" width="300" height="40" rx="10" fill="#f97316"/>
  <text x="546" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ANCC FNP-BC</text>
  <text x="412" y="132" font-size="12" fill="#334155">" Different official content outline</text>
  <text x="412" y="154" font-size="12" fill="#334155">" Clinical overlap  weights do not match</text>
  <text x="412" y="176" font-size="12" fill="#334155">" Recalibrate study time to ANCC outline</text>
  <text x="412" y="198" font-size="12" fill="#334155">" Do not import NPCB % onto ANCC</text>
  <text x="412" y="220" font-size="12" fill="#334155">" ADPE depth still useful</text>

  <rect x="24" y="304" width="672" height="40" rx="8" fill="#ccfbf1"/>
  <text x="360" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">TRAP: Treating the two blueprints as identical. Confirm your board handbook.</text>
</svg>
