<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 900" role="img" aria-labelledby="cat-ngn-title cat-ngn-desc">
  <title id="cat-ngn-title">How the NCLEX works: CAT and NGN</title>
  <desc id="cat-ngn-desc">Computerized adaptive testing and Next Generation NCLEX item types: stand-alone bow-tie and trend, plus case-study formats.</desc>
  <rect width="375" height="900" fill="#f1f5f9"/>
  <text x="187.5" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#0f172a">How the NCLEX Works</text>
  <text x="187.5" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#475569">CAT + Next Generation NCLEX (NGN)</text>

  <rect x="16" y="68" width="343" height="280" rx="12" fill="#0d9488"/>
  <text x="187.5" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">CAT &#8212; Computerized Adaptive Testing</text>
  <text x="187.5" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ecfdf5">Difficulty adapts after each response.</text>
  <rect x="32" y="136" width="88" height="36" rx="6" fill="#fff" fill-opacity="0.95"/>
  <text x="76" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Start</text>
  <line x1="122" y1="154" x2="136" y2="154" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="136,154 150,146 150,162" fill="#fff"/>
  <rect x="148" y="136" width="195" height="36" rx="6" fill="#fff" fill-opacity="0.95"/>
  <text x="245.5" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Harder / easier items</text>
  <text x="187.5" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ecfdf5">Stops when the computer is confident</text>
  <text x="187.5" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ecfdf5">you are above or below the passing standard.</text>
  <text x="187.5" y="252" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff">Typical length: 85&#8211;150 items</text>
  <text x="187.5" y="272" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#fff">Up to 5 hours (verify NCSBN)</text>

  <rect x="16" y="364" width="343" height="480" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="187.5" y="392" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">NGN &#8212; Next Generation NCLEX</text>
  <text x="187.5" y="414" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Unfolding case studies (often 6 items per case)</text>

  <text x="28" y="442" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Stand-alone NGN types</text>
  <text x="28" y="460" font-family="system-ui,sans-serif" font-size="12" fill="#475569">Only bow-tie and trend (per NCSBN)</text>

  <rect x="28" y="472" width="319" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="40" y="494" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#0369a1">Bow-tie</text>
  <text x="40" y="514" font-family="system-ui,sans-serif" font-size="12" fill="#334155">2 actions &#183; 1 condition &#183; 2 parameters</text>

  <rect x="28" y="536" width="319" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="40" y="558" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b45309">Trend</text>
  <text x="40" y="578" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Vitals or labs over time &#8212; identify change</text>

  <text x="28" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Common in case studies</text>

  <rect x="28" y="624" width="319" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="40" y="652" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Enhanced hot spot (highlighting)</text>

  <rect x="28" y="676" width="319" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="704" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Extended drag and drop</text>

  <rect x="28" y="728" width="319" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Cloze (drop-down)</text>

  <rect x="28" y="780" width="319" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="40" y="808" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Extended multiple response</text>

  <text x="187.5" y="876" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Study aid &#183; AnyExamEasy</text>
</svg>
