<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="cat-ngn-title cat-ngn-desc">
  <title id="cat-ngn-title">How the NCLEX works: CAT and NGN</title>
  <desc id="cat-ngn-desc">Overview of computerized adaptive testing and Next Generation NCLEX clinical judgment item types including bow-tie, matrix grid, and trend.</desc>
  <rect width="900" height="480" fill="#f1f5f9"/>
  <text x="450" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#0f172a">How the NCLEX Works  CAT + NGN</text>

  <rect x="20" y="56" width="420" height="380" rx="12" fill="#0d9488"/>
  <text x="230" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#fff">CAT  Computerized Adaptive Testing</text>
  <text x="230" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#ecfdf5">Difficulty adapts after each response.</text>
  <rect x="48" y="140" width="120" height="36" rx="6" fill="#fff" fill-opacity="0.95"/>
  <text x="108" y="164" text-anchor="middle" font-size="12" fill="#0f172a">Start</text>
  <text x="200" y="164" font-size="18" fill="#fff">’</text>
  <rect x="220" y="140" width="160" height="36" rx="6" fill="#fff" fill-opacity="0.95"/>
  <text x="300" y="164" text-anchor="middle" font-size="11" fill="#0f172a">Harder / easier items</text>
  <text x="230" y="210" text-anchor="middle" font-size="12" fill="#ecfdf5">Stops when the computer is confident</text>
  <text x="230" y="232" text-anchor="middle" font-size="12" fill="#ecfdf5">you are above or below the passing standard.</text>
  <text x="230" y="280" text-anchor="middle" font-size="12" fill="#fff">Typical length: 85150 items · up to 5 hours</text>

  <rect x="460" y="56" width="420" height="380" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="670" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1e3a5f">NGN  Next Generation NCLEX</text>
  <text x="670" y="112" text-anchor="middle" font-size="12" fill="#475569">Unfolding case studies (often 6 items per case)</text>

  <text x="480" y="148" font-size="13" font-weight="700" fill="#0f172a">Stand-alone NGN item types (examples)</text>
  <rect x="480" y="160" width="380" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="490" y="182" font-size="12" font-weight="700" fill="#0369a1">Bow-tie</text>
  <text x="490" y="200" font-size="11" fill="#334155">2 actions · 1 condition · 2 parameters to monitor</text>

  <rect x="480" y="222" width="380" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="490" y="244" font-size="12" font-weight="700" fill="#15803d">Matrix / grid</text>
  <text x="490" y="262" font-size="11" fill="#334155">Rows and columns of clinical findings or options</text>

  <rect x="480" y="284" width="380" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="306" font-size="12" font-weight="700" fill="#b45309">Trend</text>
  <text x="490" y="324" font-size="11" fill="#334155">Vital signs or labs over time  identify change</text>

  <rect x="480" y="346" width="380" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="490" y="368" font-size="12" font-weight="700" fill="#334155">Also: extended multiple response (SATA), highlight, drag-and-drop</text>
  <text x="490" y="386" font-size="11" fill="#64748b">Use official NCSBN names  not generic multiple response for bow-tie</text>

  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#64748b">Study aid  AnyExamEasy</text>
</svg>
