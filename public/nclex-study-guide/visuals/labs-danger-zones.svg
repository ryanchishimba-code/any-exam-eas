<svg xmlns="http://www.w3.org/2000/svg" width="420" height="434" viewBox="0 0 420 434" role="img" aria-label="Laboratory values that change the plan">
<title>Laboratory values that change the plan</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Laboratory values that change</text>
<text x="28" y="64" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">the plan</text>
<rect x="24" y="98" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="120" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Potassium under 3.0 or over 6.0, or any</text>
<text x="36" y="142" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">potassium with ECG changes.</text>
<rect x="24" y="166" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="188" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Sodium under 120, or any sodium with a</text>
<text x="36" y="210" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">seizure.</text>
<rect x="24" y="234" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="256" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Glucose under 70 is hypoglycemia. Under 54</text>
<text x="36" y="278" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">is clinically significant.</text>
<rect x="24" y="302" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="324" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">INR above the therapeutic range with</text>
<text x="36" y="346" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">bleeding. Platelets under 10,000, or under</text>
<text x="36" y="368" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">50,000 with bleeding.</text>
<text x="28" y="400" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">Study aid. Confirm the laboratory&#x27;s reference range.</text>
</svg>
