<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" aria-labelledby="qTitle qDesc">
  <title id="qTitle">How to work every PANCE question</title>
  <desc id="qDesc">Four steps. Read the clues. Name the most likely diagnosis before the choices. If the patient is unstable, stabilize, then choose the initial test or the best test. Pick the guideline treatment and check pregnancy and kidney function.</desc>
  <rect width="420" height="480" fill="#ffffff"/>
  <text x="210" y="34" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">How to work every PANCE question</text>

  <rect x="16" y="52" width="388" height="88" rx="10" fill="#fff4e0" stroke="#2b5797" stroke-width="1.5"/>
  <text x="32" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42">1. Clues</text>
  <text x="32" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a3d6d">Age, timing, and the key exam or lab</text>

  <rect x="16" y="152" width="388" height="88" rx="10" fill="#eaf1fa" stroke="#2b5797" stroke-width="1.5"/>
  <text x="32" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42">2. Most likely diagnosis</text>
  <text x="32" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a3d6d">Name it before reading the choices</text>

  <rect x="16" y="252" width="388" height="100" rx="10" fill="#eaf1fa" stroke="#2b5797" stroke-width="1.5"/>
  <text x="32" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42">3. Next step</text>
  <text x="32" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a3d6d">If unstable, stabilize first.</text>
  <text x="32" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a3d6d">Then pick the initial test or the best test.</text>

  <rect x="16" y="364" width="388" height="78" rx="10" fill="#eaf1fa" stroke="#2b5797" stroke-width="1.5"/>
  <text x="32" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42">4. First-line treatment</text>
  <text x="32" y="418" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1a3d6d">Guideline choice. Check pregnancy and kidneys.</text>

  <text x="210" y="462" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4a6a7b">NCCPA blueprint, January 2025. AnyExamEasy study aid.</text>
</svg>
