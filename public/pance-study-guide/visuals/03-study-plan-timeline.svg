<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" role="img" aria-labelledby="planTitle planDesc">
  <title id="planTitle">Study-plan timelines</title>
  <desc id="planDesc">Three PANCE plans. Two weeks: systems review and two mocks. Six weeks: systems with mocks in weeks 3 and 5, then a sprint. Twelve weeks: build, apply with mocks in weeks 6 and 9, then peak.</desc>
  <rect width="420" height="340" fill="#ffffff"/>
  <text x="210" y="32" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Study-plan timelines</text>

  <text x="20" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42">2-week</text>
  <rect x="20" y="78" width="64" height="16" rx="4" fill="#2b5797"/>
  <text x="96" y="91" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a3d6d">Systems review and 2 mocks</text>

  <text x="20" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42">6-week</text>
  <rect x="20" y="142" width="168" height="16" rx="4" fill="#2b5797"/>
  <rect x="192" y="142" width="48" height="16" rx="4" fill="#1a3d6d"/>
  <text x="20" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a3d6d">Systems and mocks in weeks 3 and 5</text>
  <text x="20" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a3d6d">Dark segment: final sprint</text>

  <text x="20" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42">12-week</text>
  <rect x="20" y="246" width="100" height="16" rx="4" fill="#8fb0dc"/>
  <rect x="124" y="246" width="140" height="16" rx="4" fill="#2b5797"/>
  <rect x="268" y="246" width="72" height="16" rx="4" fill="#1a3d6d"/>
  <text x="20" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a3d6d">Build, then apply</text>
  <text x="20" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1a3d6d">Mocks in weeks 6 and 9, then peak</text>

  <text x="210" y="328" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4a6a7b">AnyExamEasy study plans in this guide. Study aid only.</text>
</svg>
