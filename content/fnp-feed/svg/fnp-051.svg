<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 351" width="340" height="351" role="img" aria-label="Snoring, sleepiness and hypertension: how is OSA confirmed?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Snoring, sleepiness and hypertension: how is OSA confirmed?</title><defs><marker id="fnp051a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Sleep study, not a questionnaire</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">alone.</text><rect x="8.0" y="84" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: STOP-BANG flags risk: snoring,</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">tiredness, observed apnea, BP, BMI, age,</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">neck, sex.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp051a)"/><rect x="8.0" y="179" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Diagnosis: AHI ≥5 with</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">symptoms or ≥15; CPAP is first-line</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">treatment.</text><path d="M170.0 153 L170.0 178" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp051a)"/><rect x="8.0" y="274" width="324.0" height="69" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Significant cardiopulmonary</text><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">disease or negative home test: in-lab</text><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">polysomnography.</text><path d="M170.0 248 L170.0 273" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp051a)"/></svg>