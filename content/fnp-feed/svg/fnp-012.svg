<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>Palpable thyroid nodule</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Palpable thyroid nodule</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Low TSH:</tspan><tspan x="28.0" dy="22">radionuclide</tspan><tspan x="28.0" dy="22">scan; a hot</tspan><tspan x="28.0" dy="22">nodule rarely</tspan><tspan x="28.0" dy="22">needs FNA.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Normal or high</tspan><tspan x="228.0" dy="22">TSH: ultrasound;</tspan><tspan x="228.0" dy="22">FNA by</tspan><tspan x="228.0" dy="22">sonographic</tspan><tspan x="228.0" dy="22">pattern and</tspan><tspan x="228.0" dy="22">size.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">High-suspicion nodules ≥1 cm get FNA; very</tspan><tspan x="20.0" dy="22">low-suspicion may be observed.</tspan></text></svg>
