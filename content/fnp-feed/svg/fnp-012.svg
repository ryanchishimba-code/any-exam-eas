<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Endocrine ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Endocrine ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Low TSH:</tspan><tspan x="32.0" dy="22">radionuclide scan; a</tspan><tspan x="32.0" dy="22">hot nodule rarely</tspan><tspan x="32.0" dy="22">needs FNA.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Normal or high TSH:</tspan><tspan x="32.0" dy="22">ultrasound; FNA by</tspan><tspan x="32.0" dy="22">sonographic pattern and</tspan><tspan x="32.0" dy="22">size.</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. High-suspicion nodules ≥1</tspan><tspan x="32.0" dy="22">cm get FNA; very</tspan><tspan x="32.0" dy="22">low-suspicion may be</tspan><tspan x="32.0" dy="22">observed.</tspan></text></svg>
