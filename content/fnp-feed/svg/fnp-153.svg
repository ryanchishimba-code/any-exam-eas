<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>MSK ordered steps</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">MSK ordered steps</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Alendronate,</tspan><tspan x="32.0" dy="22">risedronate or</tspan><tspan x="32.0" dy="22">zoledronic acid.</tspan></text><rect x="20" y="162" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Very high risk:</tspan><tspan x="32.0" dy="22">anabolic agent first,</tspan><tspan x="32.0" dy="22">then antiresorptive;</tspan><tspan x="32.0" dy="22">ensure calcium and</tspan><tspan x="32.0" dy="22">vitamin D.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Oral: empty stomach,</tspan><tspan x="32.0" dy="22">water, upright 30 minutes;</tspan><tspan x="32.0" dy="22">avoid at eGFR &lt;35.</tspan></text></svg>
