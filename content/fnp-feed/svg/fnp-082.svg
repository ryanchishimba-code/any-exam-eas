<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>GI ordered steps</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">GI ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Iron deficiency,</tspan><tspan x="32.0" dy="22">diarrhea, dermatitis</tspan><tspan x="32.0" dy="22">herpetiformis, type 1</tspan><tspan x="32.0" dy="22">diabetes.</tspan></text><rect x="20" y="184" width="290" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Positive: duodenal</tspan><tspan x="32.0" dy="22">biopsy to confirm.</tspan></text><rect x="20" y="272" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Patient must eat gluten</tspan><tspan x="32.0" dy="22">during testing; IgA</tspan><tspan x="32.0" dy="22">deficiency gives false</tspan><tspan x="32.0" dy="22">negatives.</tspan></text></svg>
