<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 370" width="420" height="370" role="img" data-layout="ladder"><title>Psych ordered steps</title><rect width="420" height="370" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Psych ordered steps</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. GAD-7; children</tspan><tspan x="32.0" dy="22">8–18 are also</tspan><tspan x="32.0" dy="22">screened.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Positive screen:</tspan><tspan x="32.0" dy="22">confirm diagnosis and</tspan><tspan x="32.0" dy="22">assess function.</tspan></text><rect x="20" y="272" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Adults 65 and older:</tspan><tspan x="32.0" dy="22">insufficient evidence (I).</tspan></text></svg>
