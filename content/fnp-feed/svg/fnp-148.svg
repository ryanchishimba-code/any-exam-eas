<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 348" width="420" height="348" role="img" data-layout="ladder"><title>Contraception</title><rect width="420" height="348" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Contraception</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Age ≥35 and ≥15</tspan><tspan x="32.0" dy="22">cigarettes daily;</tspan><tspan x="32.0" dy="22">migraine with aura.</tspan></text><rect x="20" y="162" width="290" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. IUD, implant, DMPA or</tspan><tspan x="32.0" dy="22">progestin pill instead.</tspan></text><rect x="20" y="250" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. &lt;21 days postpartum is</tspan><tspan x="32.0" dy="22">also category 4.</tspan></text></svg>
