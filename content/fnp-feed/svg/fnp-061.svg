<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>Heme schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Heme schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Methylmalonic acid high:</tspan><tspan x="188.0" dy="22">B12 deficiency; normal:</tspan><tspan x="188.0" dy="22">folate deficiency.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Long-term metformin:</tspan><tspan x="188.0" dy="22">check B12 periodically.</tspan></text><rect x="176.0" y="238.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="262.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Folate alone can mask</tspan><tspan x="188.0" dy="22">worsening B12</tspan><tspan x="188.0" dy="22">neuropathy; replace B12</tspan><tspan x="188.0" dy="22">first.</tspan></text></svg>
