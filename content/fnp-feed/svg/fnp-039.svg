<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="When should infants and teens be screened for iron deficiency?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>When should infants and teens be screened for iron deficiency?</title><defs><marker id="fnp039a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CBC plus ferritin at 9–12 months if</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">breastfed.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Formula-fed infants: 15–18 months;</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">also menstruating adolescents.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp039a)"/><rect x="8.0" y="162" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Low ferritin identifies</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">deficiency before anemia develops.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp039a)"/><rect x="8.0" y="240" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Excess cow's milk intake is a</text><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">classic toddler cause.</text><path d="M170.0 214 L170.0 239" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp039a)"/></svg>