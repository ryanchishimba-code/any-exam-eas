<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>With ear pain</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">With ear pain</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Mild bulging plus</tspan><tspan x="32.0" dy="22">ear pain under 48</tspan><tspan x="32.0" dy="22">hours, or intense TM</tspan><tspan x="32.0" dy="22">redness.</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Pneumatic otoscopy</tspan><tspan x="32.0" dy="22">confirms middle ear</tspan><tspan x="32.0" dy="22">effusion.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. No effusion: not otitis</tspan><tspan x="32.0" dy="22">media; don't treat red TM</tspan><tspan x="32.0" dy="22">alone.</tspan></text></svg>
