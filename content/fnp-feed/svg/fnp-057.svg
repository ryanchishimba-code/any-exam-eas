<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>EENT schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">EENT schematic</text><path d="M120 60 C90 60 70 90 78 120 C84 146 110 160 120 140 C128 124 112 120 112 100 C112 84 128 80 120 60 Z" fill="#f4f8f8" stroke="#0f2e42" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Mild bulging plus ear</tspan><tspan x="188.0" dy="22">pain under 48 hours, or</tspan><tspan x="188.0" dy="22">intense TM redness.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Pneumatic otoscopy</tspan><tspan x="188.0" dy="22">confirms middle ear</tspan><tspan x="188.0" dy="22">effusion.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">No effusion: not otitis</tspan><tspan x="188.0" dy="22">media; don't treat red</tspan><tspan x="188.0" dy="22">TM alone.</tspan></text></svg>
