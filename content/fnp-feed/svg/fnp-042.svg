<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 192" width="420" height="192" role="img" aria-labelledby="tfnp042"><title id="tfnp042">Exertional syncope, chest pain or early family sudden death.</title><rect width="420" height="192" fill="#ffffff"/><rect x="16" y="16" width="388" height="88" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Exertional syncope, chest pain</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">or early family sudden death.</text><text x="28" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Murmur louder with Valsalva or</text><text x="28" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">standing, softer with squatting.</text></svg>
