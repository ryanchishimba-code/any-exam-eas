<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 422" width="420" height="422" role="img" data-layout="anatomy"><title>Cardiovascular schematic</title><rect width="420" height="422" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Cardiovascular schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Murmur louder with</tspan><tspan x="188.0" dy="22">Valsalva or standing,</tspan><tspan x="188.0" dy="22">softer with squatting.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Refer for ECG,</tspan><tspan x="188.0" dy="22">echocardiogram and</tspan><tspan x="188.0" dy="22">cardiology evaluation.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">HCM no longer means</tspan><tspan x="188.0" dy="22">automatic</tspan><tspan x="188.0" dy="22">disqualification; shared</tspan><tspan x="188.0" dy="22">decision after</tspan><tspan x="188.0" dy="22">evaluation.</tspan></text></svg>
