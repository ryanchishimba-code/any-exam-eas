<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Adult with hypertension: who gets screened for primary aldosteronism, and how?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adult with hypertension: who gets screened for primary aldosteronism, and how?</title><defs><marker id="fnp065a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">All adults with hypertension.</text><rect x="8.0" y="67" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Aldosterone-renin ratio; check</text><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">potassium too.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp065a)"/><rect x="8.0" y="145" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Positive: confirm with</text><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">specialist; unilateral disease may be</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">surgical, bilateral gets an MRA.</text><path d="M170.0 119 L170.0 144" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp065a)"/><rect x="8.0" y="240" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Normal potassium does not rule out</text><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">primary aldosteronism.</text><path d="M170.0 214 L170.0 239" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp065a)"/></svg>