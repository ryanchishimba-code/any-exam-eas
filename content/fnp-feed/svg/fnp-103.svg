<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 368" width="340" height="368" role="img" aria-label="Headache: how do you tell migraine, tension-type and cluster apart?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Headache: how do you tell migraine, tension-type and cluster apart?</title><defs><marker id="fnp103a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="69" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Migraine: pulsating, nausea;</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">tension: bilateral pressing;</text><text x="170.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">cluster: orbital.</text><rect x="8.0" y="101" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Cluster: severe unilateral orbital</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">pain, 15–180 minutes, tearing,</text><text x="170.0" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">restlessness.</text><path d="M170.0 75 L170.0 100" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp103a)"/><rect x="8.0" y="196" width="324.0" height="86" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Migraine: 4–72 hours with</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">nausea or light and sound sensitivity;</text><text x="170.0" y="252" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">tension: 30 minutes to 7 days, no</text><text x="170.0" y="269" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">nausea.</text><path d="M170.0 170 L170.0 195" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp103a)"/><rect x="8.0" y="308" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Thunderclap onset: exclude</text><text x="170.0" y="347" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">subarachnoid hemorrhage first.</text><path d="M170.0 282 L170.0 307" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp103a)"/></svg>