<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 351" width="340" height="351" role="img" aria-label="What lab values diagnose diabetes and prediabetes?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>What lab values diagnose diabetes and prediabetes?</title><defs><marker id="fnp007a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A1C ≥6.5%, fasting glucose ≥126,</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2-hour OGTT ≥200.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Prediabetes: A1C 5.7–6.4%, fasting</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">100–125, 2-hour 140–199 mg/dL.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp007a)"/><rect x="8.0" y="162" width="324.0" height="86" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Confirm with a second</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">abnormal test unless hyperglycemic</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">crisis or classic symptoms with glucose</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">≥200.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp007a)"/><rect x="8.0" y="274" width="324.0" height="69" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: A1C misleads in anemia,</text><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">hemoglobinopathies, pregnancy and recent</text><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">transfusion.</text><path d="M170.0 248 L170.0 273" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp007a)"/></svg>