<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Lab values diagnose diabetes</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Lab values diagnose diabetes</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Prediabetes: A1C</tspan><tspan x="32.0" dy="22">5.7–6.4%, fasting</tspan><tspan x="32.0" dy="22">100–125, 2-hour</tspan><tspan x="32.0" dy="22">140–199 mg/dL.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Confirm with a second</tspan><tspan x="32.0" dy="22">abnormal test unless</tspan><tspan x="32.0" dy="22">hyperglycemic crisis or</tspan><tspan x="32.0" dy="22">classic symptoms with</tspan><tspan x="32.0" dy="22">glucose ≥200.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. A1C misleads in anemia,</tspan><tspan x="32.0" dy="22">hemoglobinopathies, pregnancy</tspan><tspan x="32.0" dy="22">and recent transfusion.</tspan></text></svg>
