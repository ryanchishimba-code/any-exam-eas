<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>Cardiovascular schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Cardiovascular schematic</text><ellipse cx="92" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><ellipse cx="132" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Symptoms in large</tspan><tspan x="188.0" dy="22">muscles, often</tspan><tspan x="188.0" dy="22">bilateral.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Stop if severe or CK</tspan><tspan x="188.0" dy="22">&gt;10× ULN; rechallenge</tspan><tspan x="188.0" dy="22">lower dose or another</tspan><tspan x="188.0" dy="22">statin.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Routine baseline CK</tspan><tspan x="188.0" dy="22">isn't needed.</tspan></text></svg>
