<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 317" width="340" height="317" role="img" aria-label="Adult hepatitis B screening: who gets it, and what does each serology mean?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adult hepatitis B screening: who gets it, and what does each serology mean?</title><defs><marker id="fnp021a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Screen once with HBsAg, anti-HBs and</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">total anti-HBc.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: HBsAg positive: infection; anti-</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">HBc IgM: acute infection.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp021a)"/><rect x="8.0" y="162" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Anti-HBs alone: vaccinated;</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">anti-HBs plus anti-HBc: resolved</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">infection.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp021a)"/><rect x="8.0" y="257" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Isolated anti-HBc needs HBV DNA</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">and follow-up.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp021a)"/></svg>