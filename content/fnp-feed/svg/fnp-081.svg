<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 262" width="420" height="262" role="img" data-layout="timeline"><title>Chronic abdominal pain with altered</title><rect width="420" height="262" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Chronic abdominal pain with altered</text><line x1="36" y1="78" x2="384" y2="78" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><circle cx="78" cy="78" r="7" fill="#0d7f8c"/><text x="78.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">1 day</tspan></text><circle cx="342" cy="78" r="7" fill="#0d7f8c"/><text x="342.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">3 months</tspan></text><text x="20.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Pain ≥1 day/week for 3 months, with stool</tspan><tspan x="20.0" dy="22">frequency or form change.</tspan></text><text x="20.0" y="204.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">CBC, CRP or calprotectin, and celiac serology</tspan><tspan x="20.0" dy="22">in diarrhea.</tspan></text></svg>
