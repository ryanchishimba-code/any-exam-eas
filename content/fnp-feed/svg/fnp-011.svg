<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 294" width="420" height="294" role="img" data-layout="cycle"><title>Endocrine repeat cycle</title><rect width="420" height="294" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Endocrine repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">High TSH, low free T4: primary</tspan><tspan x="24.0" dy="22">hypothyroidism; Hashimoto is most common.</tspan></text><text x="24.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">High TSH with normal free T4 is</tspan><tspan x="24.0" dy="22">subclinical; repeat in 2–3 months.</tspan></text><text x="24.0" y="232.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Pituitary disease: TSH misleads; measure</tspan><tspan x="24.0" dy="22">free T4.</tspan></text></svg>
