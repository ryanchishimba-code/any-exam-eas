<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" data-layout="anatomy"><title>Reproductive schematic</title><rect width="420" height="400" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Reproductive schematic</text><ellipse cx="88" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><ellipse cx="132" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Proteinuria: ≥300 mg/24</tspan><tspan x="188.0" dy="22">h or protein/creatinine</tspan><tspan x="188.0" dy="22">≥0.3.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Severe: BP ≥160/110,</tspan><tspan x="188.0" dy="22">platelets &lt;100,000,</tspan><tspan x="188.0" dy="22">creatinine &gt;1.1,</tspan><tspan x="188.0" dy="22">pulmonary edema.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Proteinuria is not</tspan><tspan x="188.0" dy="22">required; preeclampsia</tspan><tspan x="188.0" dy="22">can start postpartum.</tspan></text></svg>
