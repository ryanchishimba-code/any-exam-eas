<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 238" width="420" height="238" role="img"><title>Finding table</title><rect width="420" height="238" fill="#ffffff"/><rect x="16" y="16" width="388" height="36" rx="8" fill="#0f2e42"/><text x="32" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Finding</text><text x="168" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Use it this way</text><rect x="16" y="52" width="388" height="64" fill="#ffffff" stroke="#d5e2e4"/><text x="28" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7f8c" text-anchor="start">Clue</text><text x="168" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">HCG above discriminatory</text><text x="168" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">zone with empty uterus</text><rect x="16" y="116" width="388" height="64" fill="#f4f8f8" stroke="#d5e2e4"/><text x="28" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7f8c" text-anchor="start">Action</text><text x="168" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Stable and unruptured:</text><text x="168" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">methotrexate</text><rect x="16" y="180" width="388" height="42" fill="#ffffff" stroke="#d5e2e4"/><text x="28" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d7f8c" text-anchor="start">Avoid</text><text x="168" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Unstable: surgery</text></svg>
