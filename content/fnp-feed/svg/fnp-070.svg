<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Leg pain with walking</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Leg pain with walking</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">0.91–0.99 is</tspan><tspan x="28.0" dy="22">borderline;</tspan><tspan x="28.0" dy="22">&gt;1.40 is</tspan><tspan x="28.0" dy="22">noncompressible.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Supervised</tspan><tspan x="228.0" dy="22">exercise,</tspan><tspan x="228.0" dy="22">high-intensity</tspan><tspan x="228.0" dy="22">statin,</tspan><tspan x="228.0" dy="22">antiplatelet;</tspan><tspan x="228.0" dy="22">noncompressible:</tspan><tspan x="228.0" dy="22">toe-brachial</tspan><tspan x="228.0" dy="22">index.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Rest pain or nonhealing wound is chronic</tspan><tspan x="20.0" dy="22">limb-threatening ischemia; refer urgently.</tspan></text></svg>
