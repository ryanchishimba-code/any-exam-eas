<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 254" width="420" height="254" role="img" aria-labelledby="tfnp037"><title id="tfnp037">M-CHAT-R/F at 18 and 24 months.</title><rect width="420" height="254" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">M-CHAT-R/F at 18 and 24 months.</text><rect x="16" y="44" width="388" height="102" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a" text-anchor="start">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Positive: refer for diagnosis,</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">early intervention and hearing</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">test at once.</text><rect x="16" y="158" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a" text-anchor="start">Not this</text><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Do not wait for a diagnosis to</text><text x="32" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">start early intervention.</text></svg>
