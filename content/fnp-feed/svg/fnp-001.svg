<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 334" width="340" height="334" role="img" aria-label="Adult with one high office BP: how do you measure it correctly, and how do you confirm hypertension?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adult with one high office BP: how do you measure it correctly, and how do you confirm hypertension?</title><defs><marker id="fnp001a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Average ≥2 readings on ≥2 visits;</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">confirm out of office.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Seated 5 minutes, back supported,</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">arm at heart level, right cuff.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp001a)"/><rect x="8.0" y="162" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Home BP or ambulatory</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">monitoring confirms; stage 1 is</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">130–139/80–89.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp001a)"/><rect x="8.0" y="257" width="324.0" height="69" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: A small cuff overestimates BP;</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">rule out white-coat and masked</text><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">hypertension.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp001a)"/></svg>