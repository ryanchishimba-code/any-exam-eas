<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 266" width="340" height="266" role="img" aria-label="Metformin and kidney function: what eGFR thresholds matter?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Metformin and kidney function: what eGFR thresholds matter?</title><defs><marker id="fnp187a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Contraindicated below eGFR 30.</text><rect x="8.0" y="67" width="324.0" height="35" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Don't start at eGFR 30–45.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp187a)"/><rect x="8.0" y="128" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="150" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Reassess benefit if eGFR</text><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">falls below 45.</text><path d="M170.0 102 L170.0 127" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp187a)"/><rect x="8.0" y="206" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Hold metformin for iodinated</text><text x="170.0" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">contrast if eGFR 30–60, then recheck.</text><path d="M170.0 180 L170.0 205" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp187a)"/></svg>