<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Endocrine ordered steps</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Endocrine ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. ADA screens all</tspan><tspan x="32.0" dy="22">adults from 35,</tspan><tspan x="32.0" dy="22">earlier with BMI ≥25</tspan><tspan x="32.0" dy="22">(≥23 Asian American)</tspan><tspan x="32.0" dy="22">plus a risk factor.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Normal result:</tspan><tspan x="32.0" dy="22">rescreen at least every 3</tspan><tspan x="32.0" dy="22">years.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Prediabetes: refer to</tspan><tspan x="32.0" dy="22">lifestyle intervention;</tspan><tspan x="32.0" dy="22">metformin can be considered.</tspan></text></svg>
