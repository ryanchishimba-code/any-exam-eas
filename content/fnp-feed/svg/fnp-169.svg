<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 166" width="420" height="166" role="img" aria-labelledby="tfnp169"><title id="tfnp169">Intensive behavioral treatment.</title><rect width="420" height="166" fill="#ffffff"/><rect x="16" y="16" width="388" height="62" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Intensive behavioral treatment.</text><text x="28" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">At least 26 contact hours over 3–12</text><text x="28" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">months, family-based.</text></svg>
