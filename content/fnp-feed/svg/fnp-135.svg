<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 184" width="420" height="184" role="img" aria-labelledby="tfnp135"><title id="tfnp135">Nitrofurantoin 5 days, TMP-SMX 3 days, or fosfomycin.</title><rect width="420" height="184" fill="#ffffff"/><rect x="16" y="16" width="388" height="8" rx="4" fill="#0d7f8c"/><text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">Nitrofurantoin 5 days,</text><text x="24" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">TMP-SMX 3 days, or</text><text x="24" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">fosfomycin.</text><text x="24" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">TMP-SMX if local resistance &lt;20%.</text></svg>
