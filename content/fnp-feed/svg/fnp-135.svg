<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Uncomplicated cystitis in a woman: first-line antibiotics?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Uncomplicated cystitis in a woman: first-line antibiotics?</title><defs><marker id="fnp135a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Nitrofurantoin 5 days, TMP-SMX 3</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">days, or fosfomycin.</text><rect x="8.0" y="84" width="324.0" height="35" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: TMP-SMX if local resistance &lt;20%.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp135a)"/><rect x="8.0" y="145" width="324.0" height="35" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Fosfomycin 3 g single dose.</text><path d="M170.0 119 L170.0 144" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp135a)"/><rect x="8.0" y="206" width="324.0" height="86" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Fluoroquinolones are not first-</text><text x="170.0" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">line for simple cystitis; the US label</text><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">contraindicates nitrofurantoin at CrCl</text><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">&lt;60.</text><path d="M170.0 180 L170.0 205" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp135a)"/></svg>