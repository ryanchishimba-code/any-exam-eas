<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img"><title>Cutoff axis</title><rect width="420" height="190" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Where the cutoffs sit</text><line x1="36" y1="92" x2="384" y2="92" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="82" x2="70" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="70.0" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a3d4a" text-anchor="middle">5 years</text><line x1="350" y1="82" x2="350" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="350.0" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a3d4a" text-anchor="middle">3 years</text><text x="20" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">High risk: continue treatment</text></svg>
