<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 222" width="420" height="222" role="img" data-layout="timeline"><title>Bisphosphonate after 5 years</title><rect width="420" height="222" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Bisphosphonate after 5 years</text><line x1="36" y1="78" x2="384" y2="78" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><circle cx="78" cy="78" r="7" fill="#0d7f8c"/><text x="78.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">5 years</tspan></text><circle cx="342" cy="78" r="7" fill="#0d7f8c"/><text x="342.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">3 years</tspan></text><text x="20.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Reassess after 5 years oral or 3 years IV.</tspan></text><text x="20.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">High risk: continue treatment.</tspan></text></svg>
