<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 392" width="420" height="392" role="img" data-layout="ladder"><title>Diagnosis and imaging</title><rect width="420" height="392" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Diagnosis and imaging</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Left lower</tspan><tspan x="32.0" dy="22">quadrant tenderness,</tspan><tspan x="32.0" dy="22">fever, leukocytosis.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Uncomplicated and</tspan><tspan x="32.0" dy="22">immunocompetent:</tspan><tspan x="32.0" dy="22">antibiotics selectively.</tspan></text><rect x="20" y="272" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Abscess or perforation is</tspan><tspan x="32.0" dy="22">complicated; colonoscopy</tspan><tspan x="32.0" dy="22">after recovery if not recent.</tspan></text></svg>
