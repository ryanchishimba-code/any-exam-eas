<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" data-layout="anatomy"><title>Reproductive schematic</title><rect width="420" height="400" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Reproductive schematic</text><ellipse cx="92" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><ellipse cx="132" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Ovulatory dysfunction,</tspan><tspan x="188.0" dy="22">hyperandrogenism,</tspan><tspan x="188.0" dy="22">polycystic ovaries or</tspan><tspan x="188.0" dy="22">high AMH.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Exclude thyroid disease,</tspan><tspan x="188.0" dy="22">high prolactin and</tspan><tspan x="188.0" dy="22">nonclassic CAH.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Within 8 years of</tspan><tspan x="188.0" dy="22">menarche, do not use</tspan><tspan x="188.0" dy="22">ultrasound or AMH.</tspan></text></svg>
