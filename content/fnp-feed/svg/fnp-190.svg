<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 168" width="420" height="168" role="img" aria-labelledby="tfnp190"><title id="tfnp190">Fourfold RPR decline within 6–12 months.</title><rect width="420" height="168" fill="#ffffff"/><rect x="16" y="16" width="388" height="88" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Fourfold RPR decline within 6–12</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">months.</text><text x="28" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Same nontreponemal test each time.</text></svg>
