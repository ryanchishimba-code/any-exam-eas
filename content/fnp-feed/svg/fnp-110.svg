<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 351" width="340" height="351" role="img" aria-label="Infant rash: atopic dermatitis or seborrheic dermatitis?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Infant rash: atopic dermatitis or seborrheic dermatitis?</title><defs><marker id="fnp110a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="69" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Atopic: itchy, cheeks and extensors;</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">seborrheic: greasy scale, little</text><text x="170.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">itch.</text><rect x="8.0" y="101" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Seborrheic: scalp (cradle cap),</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">face and folds, often the diaper area;</text><text x="170.0" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">little itch.</text><path d="M170.0 75 L170.0 100" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp110a)"/><rect x="8.0" y="196" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Atopic dermatitis:</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">moisturizers plus a low-potency topical</text><text x="170.0" y="252" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">steroid on the face and folds.</text><path d="M170.0 170 L170.0 195" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp110a)"/><rect x="8.0" y="291" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Atopic dermatitis usually spares</text><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">the groin and axillae.</text><path d="M170.0 265 L170.0 290" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp110a)"/></svg>