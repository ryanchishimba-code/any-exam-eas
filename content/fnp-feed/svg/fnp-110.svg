<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Atopic dermatitis or seborrheic</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Atopic dermatitis or seborrheic</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Seborrheic: scalp</tspan><tspan x="32.0" dy="22">(cradle cap), face</tspan><tspan x="32.0" dy="22">and folds, often the</tspan><tspan x="32.0" dy="22">diaper area; little</tspan><tspan x="32.0" dy="22">itch.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Atopic dermatitis:</tspan><tspan x="32.0" dy="22">moisturizers plus a</tspan><tspan x="32.0" dy="22">low-potency topical</tspan><tspan x="32.0" dy="22">steroid on the face and</tspan><tspan x="32.0" dy="22">folds.</tspan></text><rect x="20" y="360" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Atopic dermatitis usually</tspan><tspan x="32.0" dy="22">spares the groin and axillae.</tspan></text></svg>
