<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 317" width="340" height="317" role="img" aria-label="Sinusitis: when is it bacterial instead of viral?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Sinusitis: when is it bacterial instead of viral?</title><defs><marker id="fnp075a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Persistent, severe or double-</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">worsening symptoms.</text><rect x="8.0" y="84" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Persistent: ≥10 days without</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">improvement; severe: fever ≥39 °C with</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">purulence.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp075a)"/><rect x="8.0" y="179" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Amoxicillin with or without</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">clavulanate, or watchful waiting.</text><path d="M170.0 153 L170.0 178" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp075a)"/><rect x="8.0" y="257" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: No imaging for uncomplicated</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">sinusitis.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp075a)"/></svg>