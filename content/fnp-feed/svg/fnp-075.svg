<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" data-layout="contrast"><title>It bacterial instead of viral</title><rect width="420" height="260" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">It bacterial instead of viral</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Persistent: ≥10</tspan><tspan x="28.0" dy="22">days without</tspan><tspan x="28.0" dy="22">improvement;</tspan><tspan x="28.0" dy="22">severe: fever</tspan><tspan x="28.0" dy="22">≥39 °C with</tspan><tspan x="28.0" dy="22">purulence.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Amoxicillin with</tspan><tspan x="228.0" dy="22">or without</tspan><tspan x="228.0" dy="22">clavulanate, or</tspan><tspan x="228.0" dy="22">watchful</tspan><tspan x="228.0" dy="22">waiting.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">No imaging for uncomplicated sinusitis.</tspan></text></svg>
