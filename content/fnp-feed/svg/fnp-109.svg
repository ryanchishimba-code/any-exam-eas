<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 317" width="340" height="317" role="img" aria-label="Adolescent with weight loss: what red flags suggest an eating disorder needing admission?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adolescent with weight loss: what red flags suggest an eating disorder needing admission?</title><defs><marker id="fnp109a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">HR &lt;50 by day or &lt;45 at night, BP</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">&lt;90/45, or temperature &lt;35.6 °C.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Orthostatic pulse rise &gt;20, or BP</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">drop &gt;20 systolic or &gt;10 diastolic.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp109a)"/><rect x="8.0" y="162" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Also admit: ≤75% median BMI,</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">electrolyte or ECG abnormality, syncope,</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">acute food refusal.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp109a)"/><rect x="8.0" y="257" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Refeeding risks low phosphorus;</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">monitor electrolytes closely.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp109a)"/></svg>