<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 208" width="420" height="208" role="img" aria-labelledby="tfnp109"><title id="tfnp109">HR &lt;50 by day or &lt;45 at night, BP &lt;90/45, or temperature &lt;35.6 °C.</title><rect width="420" height="208" fill="#ffffff"/><rect x="16" y="16" width="388" height="8" rx="4" fill="#0d7f8c"/><text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">HR &lt;50 by day or &lt;45 at</text><text x="24" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">night, BP &lt;90/45, or</text><text x="24" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">temperature &lt;35.6 °C.</text><text x="24" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Orthostatic pulse rise &gt;20, or BP</text><text x="24" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">drop &gt;20 systolic or &gt;10 diastolic.</text></svg>
