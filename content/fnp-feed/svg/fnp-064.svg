<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="Suspected kidney stone: which imaging first?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Suspected kidney stone: which imaging first?</title><defs><marker id="fnp064a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Noncontrast CT in most adults.</text><rect x="8.0" y="67" width="324.0" height="35" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Colicky flank pain and hematuria.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp064a)"/><rect x="8.0" y="128" width="324.0" height="86" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="150" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Ultrasound first in</text><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">pregnancy and children; NSAIDs for</text><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">colic; tamsulosin for distal stones ≤10</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">mm.</text><path d="M170.0 102 L170.0 127" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp064a)"/><rect x="8.0" y="240" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Fever with obstruction needs</text><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">urgent decompression.</text><path d="M170.0 214 L170.0 239" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp064a)"/></svg>