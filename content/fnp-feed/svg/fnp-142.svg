<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 202" width="420" height="202" role="img" aria-labelledby="tfnp142"><title id="tfnp142">Oral F/TDF or F/TAF, injectable cabotegravir, or injectable lenacapavir.</title><rect width="420" height="202" fill="#ffffff"/><rect x="16" y="16" width="388" height="170" rx="14" fill="#f4f7f8"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Oral F/TDF or F/TAF, injectable</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">cabotegravir, or injectable</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">lenacapavir.</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">F/TAF is not for receptive vaginal</text><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">sex.</text></svg>
