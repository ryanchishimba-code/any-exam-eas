<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 334" width="420" height="334" role="img" data-layout="cycle"><title>Peds repeat cycle</title><rect width="420" height="334" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Peds repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">SSHADESS: strengths, school, home,</tspan><tspan x="24.0" dy="22">activities, drugs, emotions, sexuality,</tspan><tspan x="24.0" dy="22">safety.</tspan></text><text x="24.0" y="202.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Screen behavior and emotions at every</tspan><tspan x="24.0" dy="22">visit; depression and suicide risk yearly</tspan><tspan x="24.0" dy="22">from age 12.</tspan></text><text x="24.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Confidentiality has limits set by state</tspan><tspan x="24.0" dy="22">law; know your state's rules.</tspan></text></svg>
