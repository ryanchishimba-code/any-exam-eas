<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 334" width="340" height="334" role="img" aria-label="Adolescent preventive visit: how do you run the psychosocial interview?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adolescent preventive visit: how do you run the psychosocial interview?</title><defs><marker id="fnp041a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Offer confidential time alone with</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">the teen.</text><rect x="8.0" y="84" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: SSHADESS: strengths, school, home,</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">activities, drugs, emotions, sexuality,</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">safety.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp041a)"/><rect x="8.0" y="179" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Screen behavior and emotions</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">at every visit; depression and suicide</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">risk yearly from age 12.</text><path d="M170.0 153 L170.0 178" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp041a)"/><rect x="8.0" y="274" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Confidentiality has limits set by</text><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">state law; know your state's rules.</text><path d="M170.0 248 L170.0 273" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp041a)"/></svg>