<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 317" width="340" height="317" role="img" aria-label="Migraine: when are triptans contraindicated, and what prevents attacks?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Migraine: when are triptans contraindicated, and what prevents attacks?</title><defs><marker id="fnp162a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="69" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Ischemic heart disease, stroke or</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">TIA, uncontrolled hypertension,</text><text x="170.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">hemiplegic or basilar migraine.</text><rect x="8.0" y="101" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: With vascular disease, gepants,</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">ditans or devices may be useful.</text><path d="M170.0 75 L170.0 100" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp162a)"/><rect x="8.0" y="179" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: CGRP-targeting agents are a</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">first-line prevention option.</text><path d="M170.0 153 L170.0 178" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp162a)"/><rect x="8.0" y="257" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Triptans on 10 or more days a</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">month risk medication overuse headache.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp162a)"/></svg>