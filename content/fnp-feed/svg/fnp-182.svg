<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 283" width="340" height="283" role="img" aria-label="Asthma follow-up: how do you assess control and step down?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Asthma follow-up: how do you assess control and step down?</title><defs><marker id="fnp182a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Symptoms over the past 4 weeks.</text><rect x="8.0" y="67" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Daytime symptoms or reliever use</text><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">&gt;2/week, night waking, activity limit.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp182a)"/><rect x="8.0" y="145" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Step down after 3 months of</text><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">good control.</text><path d="M170.0 119 L170.0 144" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp182a)"/><rect x="8.0" y="223" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Check technique and adherence</text><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">before stepping up.</text><path d="M170.0 197 L170.0 222" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp182a)"/></svg>