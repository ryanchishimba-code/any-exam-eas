<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>Pulmonary schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Pulmonary schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Heart rate &gt;100,</tspan><tspan x="188.0" dy="22">respiratory rate &gt;24,</tspan><tspan x="188.0" dy="22">temperature &gt;38 °C.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Suspected pneumonia:</tspan><tspan x="188.0" dy="22">chest X-ray; bronchitis:</tspan><tspan x="188.0" dy="22">symptom care.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Acute bronchitis cough</tspan><tspan x="188.0" dy="22">lasts up to 3 weeks; no</tspan><tspan x="188.0" dy="22">antibiotics.</tspan></text></svg>
