<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 188" width="420" height="188" role="img" aria-labelledby="tfnp119"><title id="tfnp119">Thiazide-type, ACEi or ARB, or dihydropyridine CCB; race does not pick the drug.</title><rect width="420" height="188" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Thiazide-type, ACEi or ARB, or</text><rect x="16" y="44" width="388" height="58" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a" text-anchor="start">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Goal &lt;130/80 for most adults.</text><rect x="16" y="114" width="388" height="58" rx="12" fill="#fdecec"/><text x="32" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a" text-anchor="start">Not this</text><text x="32" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Never combine an ACEi with an ARB.</text></svg>
