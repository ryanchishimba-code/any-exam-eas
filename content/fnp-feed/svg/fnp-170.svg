<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 322" width="420" height="322" role="img" data-layout="contrast"><title>EENT two paths</title><rect width="420" height="322" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">EENT two paths</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Oral</tspan><tspan x="28.0" dy="22">antihistamine:</tspan><tspan x="28.0" dy="22">second-generation</tspan><tspan x="28.0" dy="22">preferred over</tspan><tspan x="28.0" dy="22">first-generation.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Adding an</tspan><tspan x="228.0" dy="22">intranasal</tspan><tspan x="228.0" dy="22">antihistamine to</tspan><tspan x="228.0" dy="22">the steroid</tspan><tspan x="228.0" dy="22">spray gives</tspan><tspan x="228.0" dy="22">additive</tspan><tspan x="228.0" dy="22">benefit.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Montelukast only after inadequate</tspan><tspan x="20.0" dy="22">response; depot steroid injections are not</tspan><tspan x="20.0" dy="22">recommended.</tspan></text></svg>
