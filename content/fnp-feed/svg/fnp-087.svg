<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Low TSH, high free T4</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Low TSH, high free T4</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. TSH receptor</tspan><tspan x="32.0" dy="22">antibodies, eye</tspan><tspan x="32.0" dy="22">findings, or</tspan><tspan x="32.0" dy="22">radioactive iodine</tspan><tspan x="32.0" dy="22">uptake.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Beta-blocker for</tspan><tspan x="32.0" dy="22">symptoms; antithyroid</tspan><tspan x="32.0" dy="22">drug for Graves.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Thyroiditis has low</tspan><tspan x="32.0" dy="22">uptake; antithyroid drugs do</tspan><tspan x="32.0" dy="22">not help.</tspan></text></svg>
