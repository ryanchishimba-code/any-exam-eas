<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 370" width="420" height="370" role="img" data-layout="ladder"><title>CKD, with or without diabetes</title><rect width="420" height="370" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">CKD, with or without diabetes</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Without diabetes:</tspan><tspan x="32.0" dy="22">UACR ≥200 mg/g or</tspan><tspan x="32.0" dy="22">heart failure.</tspan></text><rect x="20" y="162" width="290" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Continue until</tspan><tspan x="32.0" dy="22">dialysis or transplant.</tspan></text><rect x="20" y="250" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. An early eGFR dip is</tspan><tspan x="32.0" dy="22">expected; hold during acute</tspan><tspan x="32.0" dy="22">illness.</tspan></text></svg>
