<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 351" width="340" height="351" role="img" aria-label="Adult 30–79 without ASCVD, LDL 70–189: how does PREVENT risk decide on a statin?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adult 30–79 without ASCVD, LDL 70–189: how does PREVENT risk decide on a statin?</title><defs><marker id="fnp003a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Statin at intermediate or high</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PREVENT risk.</text><rect x="8.0" y="84" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: 10-year risk: &lt;3% low, 3–&lt;5%</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">borderline, 5–&lt;10% intermediate, ≥10%</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">high.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp003a)"/><rect x="8.0" y="179" width="324.0" height="86" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Moderate-intensity statin at</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">intermediate risk; high-intensity at</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">high risk; borderline: weigh risk</text><text x="170.0" y="252" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">enhancers.</text><path d="M170.0 153 L170.0 178" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp003a)"/><rect x="8.0" y="291" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: LDL ≥190 or diabetes ages 40–75</text><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">gets a statin regardless of score.</text><path d="M170.0 265 L170.0 290" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp003a)"/></svg>