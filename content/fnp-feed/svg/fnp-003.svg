<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 442" width="420" height="442" role="img" data-layout="branch"><title>PREVENT risk decide on a statin</title><rect width="420" height="442" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">PREVENT risk decide on a statin</text><rect x="48.0" y="48.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">10-year risk: &lt;3% low, 3–&lt;5%</tspan><tspan x="60.0" dy="22">borderline, 5–&lt;10% intermediate,</tspan><tspan x="60.0" dy="22">≥10% high.</tspan></text><circle cx="26" cy="96.0" r="12" fill="#0d7f8c"/><text x="26.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="144.0" x2="210" y2="160.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="162.0" width="352.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Moderate-intensity statin at</tspan><tspan x="60.0" dy="22">intermediate risk;</tspan><tspan x="60.0" dy="22">high-intensity at high risk;</tspan><tspan x="60.0" dy="22">borderline: weigh risk</tspan><tspan x="60.0" dy="22">enhancers.</tspan></text><circle cx="26" cy="232.0" r="12" fill="#0d7f8c"/><text x="26.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="302.0" x2="210" y2="318.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="320.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="344.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">LDL ≥190 or diabetes ages 40–75</tspan><tspan x="60.0" dy="22">gets a statin regardless of</tspan><tspan x="60.0" dy="22">score.</tspan></text><circle cx="26" cy="368.0" r="12" fill="#0d7f8c"/><text x="26.0" y="373.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
