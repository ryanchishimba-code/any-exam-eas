<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 317" width="340" height="317" role="img" aria-label="How do you screen for preeclampsia during pregnancy?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>How do you screen for preeclampsia during pregnancy?</title><defs><marker id="fnp045a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Measure BP at every prenatal visit</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(B).</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Gestational hypertension: ≥140/90</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">twice, 4 hours apart, after 20 weeks.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp045a)"/><rect x="8.0" y="162" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Elevated BP: check</text><text x="170.0" y="201" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">proteinuria, platelets, creatinine and</text><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">liver enzymes.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp045a)"/><rect x="8.0" y="257" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Routine urine dipstick screening</text><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">has low accuracy.</text><path d="M170.0 231 L170.0 256" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp045a)"/></svg>