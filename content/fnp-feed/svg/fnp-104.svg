<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 430" width="420" height="430" role="img" data-layout="ladder"><title>Facial weakness</title><rect width="420" height="430" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Facial weakness</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Forehead sparing</tspan><tspan x="32.0" dy="22">suggests central</tspan><tspan x="32.0" dy="22">lesion.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Bell palsy: oral</tspan><tspan x="32.0" dy="22">steroids within 72 hours;</tspan><tspan x="32.0" dy="22">eye protection.</tspan></text><rect x="20" y="272" width="380" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. No routine labs or imaging</tspan><tspan x="32.0" dy="22">for typical Bell palsy. Low</tspan><tspan x="32.0" dy="22">threshold to exclude stroke if</tspan><tspan x="32.0" dy="22">the onset is sudden or other</tspan><tspan x="32.0" dy="22">deficits are present.</tspan></text></svg>
