<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>You tell otitis externa from otitis</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">You tell otitis externa from otitis</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Canal edema and</tspan><tspan x="28.0" dy="22">debris; TM may</tspan><tspan x="28.0" dy="22">be normal.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Topical</tspan><tspan x="228.0" dy="22">antibiotic</tspan><tspan x="228.0" dy="22">drops;</tspan><tspan x="228.0" dy="22">nonototoxic</tspan><tspan x="228.0" dy="22">drops if TM</tspan><tspan x="228.0" dy="22">perforation.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Older adult with diabetes and severe pain:</tspan><tspan x="20.0" dy="22">malignant otitis externa.</tspan></text></svg>
