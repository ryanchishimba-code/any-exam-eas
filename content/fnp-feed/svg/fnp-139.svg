<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 283" width="340" height="283" role="img" aria-label="BV and trichomonas: which treatment, and who else is treated?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>BV and trichomonas: which treatment, and who else is treated?</title><defs><marker id="fnp139a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="52" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Metronidazole 500 mg twice daily for</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7 days.</text><rect x="8.0" y="84" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Trichomonas in men: metronidazole</text><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">2 g once; women: 7 days.</text><path d="M170.0 58 L170.0 83" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp139a)"/><rect x="8.0" y="162" width="324.0" height="35" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Treat trichomonas partners.</text><path d="M170.0 136 L170.0 161" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp139a)"/><rect x="8.0" y="223" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: BV partners don't need treatment;</text><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">recurrent BV may need suppression.</text><path d="M170.0 197 L170.0 222" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp139a)"/></svg>