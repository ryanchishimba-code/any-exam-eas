<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 354" width="420" height="354" role="img" data-layout="branch"><title>COPD maintenance</title><rect width="420" height="354" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">COPD maintenance</text><rect x="48.0" y="48.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Add ICS if eosinophils ≥300, or</tspan><tspan x="60.0" dy="22">≥100 with exacerbations.</tspan></text><circle cx="26" cy="85.0" r="12" fill="#0d7f8c"/><text x="26.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="122.0" x2="210" y2="138.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="140.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Single-inhaler triple therapy;</tspan><tspan x="60.0" dy="22">pulmonary rehab.</tspan></text><circle cx="26" cy="177.0" r="12" fill="#0d7f8c"/><text x="26.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="214.0" x2="210" y2="230.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="232.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="256.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">No ICS monotherapy; eosinophils</tspan><tspan x="60.0" dy="22">&lt;100 predict little ICS benefit,</tspan><tspan x="60.0" dy="22">and ICS raises pneumonia risk.</tspan></text><circle cx="26" cy="280.0" r="12" fill="#0d7f8c"/><text x="26.0" y="285.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
