<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Reproductive ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Reproductive ordered steps</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Urine culture for</tspan><tspan x="32.0" dy="22">asymptomatic</tspan><tspan x="32.0" dy="22">bacteriuria;</tspan><tspan x="32.0" dy="22">first-trimester</tspan><tspan x="32.0" dy="22">ultrasound dates most</tspan><tspan x="32.0" dy="22">accurately.</tspan></text><rect x="20" y="228" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Rh-negative and</tspan><tspan x="32.0" dy="22">unsensitized: anti-D at</tspan><tspan x="32.0" dy="22">28 weeks.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Screen chlamydia and</tspan><tspan x="32.0" dy="22">gonorrhea at 24 and younger,</tspan><tspan x="32.0" dy="22">or at risk.</tspan></text></svg>
