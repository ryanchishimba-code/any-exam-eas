<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 348" width="420" height="348" role="img" data-layout="ladder"><title>After starting antihypertensives</title><rect width="420" height="348" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">After starting antihypertensives</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Home BP: two</tspan><tspan x="32.0" dy="22">readings morning and</tspan><tspan x="32.0" dy="22">evening.</tspan></text><rect x="20" y="162" width="290" height="54" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Titrate to &lt;130/80.</tspan></text><rect x="20" y="228" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Check technique and</tspan><tspan x="32.0" dy="22">adherence before adding</tspan><tspan x="32.0" dy="22">drugs.</tspan></text></svg>
