<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 192" width="420" height="192" role="img" aria-labelledby="tfnp030"><title id="tfnp030">Ask about falls, unsteadiness and fear of falling.</title><rect width="420" height="192" fill="#ffffff"/><rect x="16" y="16" width="388" height="88" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Ask about falls, unsteadiness</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">and fear of falling.</text><text x="28" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Timed Up and Go ≥12 seconds suggests</text><text x="28" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">risk.</text></svg>
