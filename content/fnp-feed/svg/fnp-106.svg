<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" role="img" aria-labelledby="tfnp106"><title id="tfnp106">Rest tremor versus action tremor.</title><rect width="420" height="160" fill="#ffffff"/><rect x="16" y="16" width="188" height="128" rx="12" fill="#e7f3f5"/><rect x="216" y="16" width="188" height="128" rx="12" fill="#f4f7f8"/><text x="28" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start">Rest tremor</text><text x="228" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start">action tremor..</text><text x="228" y="66" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start">Essential tremor:</text><text x="228" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start">bilateral action</text><text x="228" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start">tremor, often</text></svg>
