<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 334" width="340" height="334" role="img" aria-label="Who should be offered BRCA1/2 risk assessment and genetic counseling?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Who should be offered BRCA1/2 risk assessment and genetic counseling?</title><defs><marker id="fnp018a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="69" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Women with breast, ovarian, tubal or</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">peritoneal cancer history or</text><text x="170.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ancestry risk.</text><rect x="8.0" y="101" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Use a brief familial risk tool</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">first, such as a pedigree assessment</text><text x="170.0" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">tool.</text><path d="M170.0 75 L170.0 100" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp018a)"/><rect x="8.0" y="196" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Positive tool: genetic</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">counseling, then testing if indicated.</text><path d="M170.0 170 L170.0 195" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp018a)"/><rect x="8.0" y="274" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Routine genetic testing without</text><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">risk history: not recommended (D).</text><path d="M170.0 248 L170.0 273" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp018a)"/></svg>