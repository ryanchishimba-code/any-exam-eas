<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 228" width="420" height="228" role="img" data-layout="threshold"><title>Chronic cough and dyspnea</title><rect width="420" height="228" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Chronic cough and dyspnea</text><line x1="28" y1="92" x2="392" y2="92" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><line x1="78" y1="82" x2="78" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="78.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">80 %</tspan></text><line x1="166" y1="82" x2="166" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="166.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="166.0" dy="0">50–79 %</tspan></text><line x1="254" y1="82" x2="254" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="254.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="254.0" dy="0">30–49 %</tspan></text><line x1="342" y1="82" x2="342" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="342.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">30 %</tspan></text><text x="20.0" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Symptoms plus exposure history, such as</tspan><tspan x="20.0" dy="22">tobacco or biomass smoke.</tspan></text></svg>
