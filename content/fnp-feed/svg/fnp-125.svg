<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 312" width="420" height="312" role="img" data-layout="anatomy"><title>Endocrine schematic</title><rect width="420" height="312" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Endocrine schematic</text><path d="M80 70 C120 60 150 90 140 130 C130 160 90 160 80 130 C70 110 60 90 80 70 Z" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">ASCVD: GLP-1 RA or</tspan><tspan x="188.0" dy="22">SGLT2i; HF: SGLT2i.</tspan></text><rect x="176.0" y="132.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">CKD: SGLT2i, or GLP-1</tspan><tspan x="188.0" dy="22">RA.</tspan></text><rect x="176.0" y="216.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Don't wait for A1C to</tspan><tspan x="188.0" dy="22">rise first.</tspan></text></svg>
