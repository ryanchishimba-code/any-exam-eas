<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 524" width="420" height="524" role="img" data-layout="ladder"><title>Pulmonary ordered steps</title><rect width="420" height="524" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Pulmonary ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Alternatives:</tspan><tspan x="32.0" dy="22">doxycycline, or a</tspan><tspan x="32.0" dy="22">macrolide only if</tspan><tspan x="32.0" dy="22">local resistance is</tspan><tspan x="32.0" dy="22">&lt;25%.</tspan></text><rect x="20" y="206" width="290" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Comorbidities:</tspan><tspan x="32.0" dy="22">amox-clav or</tspan><tspan x="32.0" dy="22">cephalosporin plus</tspan><tspan x="32.0" dy="22">macrolide or doxycycline,</tspan><tspan x="32.0" dy="22">or a respiratory</tspan><tspan x="32.0" dy="22">fluoroquinolone.</tspan></text><rect x="20" y="382" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="404.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Outpatients stable: under</tspan><tspan x="32.0" dy="22">5 days (minimum 3); no</tspan><tspan x="32.0" dy="22">steroids for hospitalized</tspan><tspan x="32.0" dy="22">nonsevere CAP.</tspan></text></svg>
