<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Ankle or knee injury</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ankle or knee injury</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Ankle: malleolus</tspan><tspan x="32.0" dy="22">edge or tip; foot:</tspan><tspan x="32.0" dy="22">navicular or 5th</tspan><tspan x="32.0" dy="22">metatarsal base.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Knee: age ≥55, fibular</tspan><tspan x="32.0" dy="22">head or isolated patellar</tspan><tspan x="32.0" dy="22">tenderness, no 90°</tspan><tspan x="32.0" dy="22">flexion.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Not valid with</tspan><tspan x="32.0" dy="22">intoxication or distracting</tspan><tspan x="32.0" dy="22">injuries.</tspan></text></svg>
