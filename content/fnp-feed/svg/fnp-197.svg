<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" data-layout="contrast"><title>Derm two paths</title><rect width="420" height="300" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Derm two paths</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Stage 1: intact</tspan><tspan x="28.0" dy="22">skin,</tspan><tspan x="28.0" dy="22">non-blanchable</tspan><tspan x="28.0" dy="22">redness.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Offload</tspan><tspan x="228.0" dy="22">pressure:</tspan><tspan x="228.0" dy="22">reposition,</tspan><tspan x="228.0" dy="22">support surface;</tspan><tspan x="228.0" dy="22">Braden scale for</tspan><tspan x="228.0" dy="22">risk.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Slough or eschar hiding the base:</tspan><tspan x="20.0" dy="22">unstageable; maroon intact skin: deep</tspan><tspan x="20.0" dy="22">tissue injury.</tspan></text></svg>
