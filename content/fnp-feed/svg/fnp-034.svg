<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>EENT schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">EENT schematic</text><ellipse cx="110" cy="110" rx="52" ry="28" fill="#f4f8f8" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="110" r="14" fill="#0d7f8c"/><circle cx="110" cy="110" r="6" fill="#0f2e42"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Visual acuity charts,</tspan><tspan x="188.0" dy="22">stereoacuity or</tspan><tspan x="188.0" dy="22">instrument-based</tspan><tspan x="188.0" dy="22">photoscreening.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Failed screen: pediatric</tspan><tspan x="188.0" dy="22">eye referral.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Under 3: insufficient</tspan><tspan x="188.0" dy="22">evidence for screening</tspan><tspan x="188.0" dy="22">(I).</tspan></text></svg>
