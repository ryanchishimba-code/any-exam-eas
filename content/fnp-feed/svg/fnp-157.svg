<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140" role="img" aria-labelledby="tfnp157"><title id="tfnp157">Varenicline first-line.</title><rect width="420" height="140" fill="#ffffff"/><rect x="0" y="0" width="8" height="140" fill="#0d7f8c"/><text x="28" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Varenicline first-line.</text><text x="28" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Start varenicline 1 week before quit</text><text x="28" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">date; treat at least 12 weeks.</text></svg>
