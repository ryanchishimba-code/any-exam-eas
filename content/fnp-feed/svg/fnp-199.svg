<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 214" width="420" height="214" role="img" data-layout="contrast"><title>After hospital discharge</title><rect width="420" height="214" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">After hospital discharge</text><rect x="16" y="48" width="188" height="106" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="106" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Face-to-face</tspan><tspan x="28.0" dy="22">visit within 7</tspan><tspan x="28.0" dy="22">or 14 days.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Medication</tspan><tspan x="228.0" dy="22">reconciliation</tspan><tspan x="228.0" dy="22">at the visit.</tspan></text><text x="20.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Readmission risk is highest in the first</tspan><tspan x="20.0" dy="22">weeks; reconcile every medication.</tspan></text></svg>
