<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Painful red eye with halos</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Painful red eye with halos</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Mid-dilated, fixed</tspan><tspan x="32.0" dy="22">pupil; hard eye;</tspan><tspan x="32.0" dy="22">nausea.</tspan></text><rect x="20" y="162" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Emergency</tspan><tspan x="32.0" dy="22">ophthalmology; lower</tspan><tspan x="32.0" dy="22">pressure, then laser</tspan><tspan x="32.0" dy="22">iridotomy.</tspan></text><rect x="20" y="294" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Dim light,</tspan><tspan x="32.0" dy="22">anticholinergics or</tspan><tspan x="32.0" dy="22">decongestants can trigger an</tspan><tspan x="32.0" dy="22">attack.</tspan></text></svg>
