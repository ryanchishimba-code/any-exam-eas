<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" width="420" height="180" role="img" aria-labelledby="tfnp191"><title id="tfnp191">Viral load 4–8 weeks after start.</title><rect width="420" height="180" fill="#ffffff"/><rect x="16" y="16" width="388" height="8" rx="4" fill="#0d7f8c"/><text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">Viral load 4–8 weeks after</text><text x="24" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">start.</text><text x="24" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Then every 4–8 weeks until</text><text x="24" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">suppressed.</text></svg>
