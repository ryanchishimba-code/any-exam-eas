<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 314" width="420" height="314" role="img" data-layout="cycle"><title>Pulmonary repeat cycle</title><rect width="420" height="314" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Pulmonary repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">5 A's: Ask, Advise, Assess, Assist,</tspan><tspan x="24.0" dy="22">Arrange follow-up.</tspan></text><text x="24.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Nonpregnant adults: counseling plus</tspan><tspan x="24.0" dy="22">FDA-approved medication (A).</tspan></text><text x="24.0" y="232.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Pregnancy: behavioral counseling;</tspan><tspan x="24.0" dy="22">e-cigarettes have insufficient evidence</tspan><tspan x="24.0" dy="22">for cessation (I).</tspan></text></svg>
