<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>You ask and offer at every visit</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">You ask and offer at every visit</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. 5 A's: Ask,</tspan><tspan x="32.0" dy="22">Advise, Assess,</tspan><tspan x="32.0" dy="22">Assist, Arrange</tspan><tspan x="32.0" dy="22">follow-up.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Nonpregnant adults:</tspan><tspan x="32.0" dy="22">counseling plus</tspan><tspan x="32.0" dy="22">FDA-approved medication</tspan><tspan x="32.0" dy="22">(A).</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Pregnancy: behavioral</tspan><tspan x="32.0" dy="22">counseling; e-cigarettes have</tspan><tspan x="32.0" dy="22">insufficient evidence for</tspan><tspan x="32.0" dy="22">cessation (I).</tspan></text></svg>
