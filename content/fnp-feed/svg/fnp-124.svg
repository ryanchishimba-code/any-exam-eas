<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 356" width="420" height="356" role="img" data-layout="anatomy"><title>Endocrine schematic</title><rect width="420" height="356" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Endocrine schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="52.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">A1C goal often &lt;7%.</tspan></text><rect x="176.0" y="110.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="134.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Start low and titrate to</tspan><tspan x="188.0" dy="22">limit GI effects;</tspan><tspan x="188.0" dy="22">extended release helps.</tspan></text><rect x="176.0" y="216.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Contraindicated at eGFR</tspan><tspan x="188.0" dy="22">&lt;30; check B12</tspan><tspan x="188.0" dy="22">periodically on</tspan><tspan x="188.0" dy="22">long-term use.</tspan></text></svg>
