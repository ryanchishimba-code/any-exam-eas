<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 370" width="420" height="370" role="img" data-layout="ladder"><title>Bacteria in urine without symptoms</title><rect width="420" height="370" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Bacteria in urine without symptoms</text><rect x="20" y="52" width="250" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Pregnancy: screen</tspan><tspan x="32.0" dy="22">early and treat.</tspan></text><rect x="20" y="140" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Older adults, diabetes</tspan><tspan x="32.0" dy="22">or catheters: do not</tspan><tspan x="32.0" dy="22">screen or treat.</tspan></text><rect x="20" y="250" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Confusion without urinary</tspan><tspan x="32.0" dy="22">symptoms: look for another</tspan><tspan x="32.0" dy="22">cause.</tspan></text></svg>
