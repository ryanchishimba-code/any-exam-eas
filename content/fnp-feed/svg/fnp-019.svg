<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Gets osteoporosis screening with DXA</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Gets osteoporosis screening with DXA</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Use a risk tool,</tspan><tspan x="32.0" dy="22">such as FRAX, under</tspan><tspan x="32.0" dy="22">65.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. T-score ≤−2.5 at hip</tspan><tspan x="32.0" dy="22">or spine defines</tspan><tspan x="32.0" dy="22">osteoporosis.</tspan></text><rect x="20" y="272" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Men: insufficient evidence</tspan><tspan x="32.0" dy="22">(I); fragility fracture means</tspan><tspan x="32.0" dy="22">osteoporosis regardless of</tspan><tspan x="32.0" dy="22">T-score.</tspan></text></svg>
