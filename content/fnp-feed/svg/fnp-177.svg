<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-label="ACEi plus spironolactone: what is the main risk, and how do you monitor?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>ACEi plus spironolactone: what is the main risk, and how do you monitor?</title><defs><marker id="fnp177a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Hyperkalemia.</text><rect x="8.0" y="67" width="324.0" height="52" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Start MRA only if eGFR &gt;30 and K</text><text x="170.0" y="106" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">&lt;5.0.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp177a)"/><rect x="8.0" y="145" width="324.0" height="52" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="167" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Check K and creatinine</text><text x="170.0" y="184" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">within 1 week, then periodically.</text><path d="M170.0 119 L170.0 144" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp177a)"/><rect x="8.0" y="223" width="324.0" height="69" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Avoid NSAIDs and potassium</text><text x="170.0" y="262" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">supplements; reduce or stop MRA if K</text><text x="170.0" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">&gt;5.5.</text><path d="M170.0 197 L170.0 222" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp177a)"/></svg>