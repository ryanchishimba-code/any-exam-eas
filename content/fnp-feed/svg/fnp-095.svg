<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Missed periods at 48</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Missed periods at 48</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Age 45 or older</tspan><tspan x="32.0" dy="22">with symptoms, no</tspan><tspan x="32.0" dy="22">period for 12 months</tspan><tspan x="32.0" dy="22">and no hormonal</tspan><tspan x="32.0" dy="22">contraception:</tspan><tspan x="32.0" dy="22">menopause.</tspan></text><rect x="20" y="228" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Amenorrhea workup adds</tspan><tspan x="32.0" dy="22">FSH, LH, prolactin and</tspan><tspan x="32.0" dy="22">TSH.</tspan></text><rect x="20" y="338" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Healthy and 45 or older</tspan><tspan x="32.0" dy="22">with symptoms: no lab tests</tspan><tspan x="32.0" dy="22">are needed to identify</tspan><tspan x="32.0" dy="22">menopause.</tspan></text></svg>
