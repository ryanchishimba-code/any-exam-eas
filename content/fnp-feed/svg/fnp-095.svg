<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 322" width="420" height="322" role="img" data-layout="contrast"><title>Reproductive two paths</title><rect width="420" height="322" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Reproductive two paths</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Age 45 or older</tspan><tspan x="28.0" dy="22">with symptoms,</tspan><tspan x="28.0" dy="22">no period for 12</tspan><tspan x="28.0" dy="22">months and no</tspan><tspan x="28.0" dy="22">hormonal</tspan><tspan x="28.0" dy="22">contraception:</tspan><tspan x="28.0" dy="22">menopause.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Amenorrhea</tspan><tspan x="228.0" dy="22">workup adds FSH,</tspan><tspan x="228.0" dy="22">LH, prolactin</tspan><tspan x="228.0" dy="22">and TSH.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Healthy and 45 or older with symptoms: no</tspan><tspan x="20.0" dy="22">lab tests are needed to identify</tspan><tspan x="20.0" dy="22">menopause.</tspan></text></svg>
