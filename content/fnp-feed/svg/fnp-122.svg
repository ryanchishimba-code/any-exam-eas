<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 368" width="340" height="368" role="img" aria-label="Overt hypothyroidism: what is the starting levothyroxine dose and how is it taken?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Overt hypothyroidism: what is the starting levothyroxine dose and how is it taken?</title><defs><marker id="fnp122a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="69" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Levothyroxine alone; full</text><text x="170.0" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">replacement is about 1.6 mcg/kg</text><text x="170.0" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">daily.</text><rect x="8.0" y="101" width="324.0" height="69" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="123" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Start low, 12.5–25 mcg daily, with</text><text x="170.0" y="140" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">known CAD; also lower doses for mild</text><text x="170.0" y="157" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">disease.</text><path d="M170.0 75 L170.0 100" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp122a)"/><rect x="8.0" y="196" width="324.0" height="69" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Take it 60 minutes before</text><text x="170.0" y="235" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">breakfast or at bedtime, 3 or more hours</text><text x="170.0" y="252" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">after dinner.</text><path d="M170.0 170 L170.0 195" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp122a)"/><rect x="8.0" y="291" width="324.0" height="69" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="313" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Thyroid extract and liothyronine</text><text x="170.0" y="330" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">combinations show no proven advantage</text><text x="170.0" y="347" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">over levothyroxine.</text><path d="M170.0 265 L170.0 290" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp122a)"/></svg>