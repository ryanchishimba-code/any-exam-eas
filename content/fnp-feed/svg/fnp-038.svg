<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="420" height="310" role="img" data-layout="branch"><title>Children get blood lead testing</title><rect width="420" height="310" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Children get blood lead testing</text><rect x="48.0" y="48.0" width="352.0" height="52.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">CDC reference value: 3.5 µg/dL.</tspan></text><circle cx="26" cy="74.0" r="12" fill="#0d7f8c"/><text x="26.0" y="79.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="100.0" x2="210" y2="116.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="118.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="142.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Elevated capillary sample:</tspan><tspan x="60.0" dy="22">confirm with venous test.</tspan></text><circle cx="26" cy="155.0" r="12" fill="#0d7f8c"/><text x="26.0" y="160.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="192.0" x2="210" y2="208.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="210.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="234.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Source removal is first-line;</tspan><tspan x="60.0" dy="22">chelation is for ≥45 µg/dL.</tspan></text><circle cx="26" cy="247.0" r="12" fill="#0d7f8c"/><text x="26.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
