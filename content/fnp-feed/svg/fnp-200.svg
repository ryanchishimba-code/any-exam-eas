<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 249" width="340" height="249" role="img" aria-label="Weight-loss medication: when do you judge response?" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Weight-loss medication: when do you judge response?</title><defs><marker id="fnp200a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs><rect x="8.0" y="6" width="324.0" height="35" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/><text x="170.0" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">At 12 weeks on maintenance dose.</text><rect x="8.0" y="67" width="324.0" height="35" rx="11" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/><text x="170.0" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#134e4a">Clue: Goal: at least 5% weight loss.</text><path d="M170.0 41 L170.0 66" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp200a)"/><rect x="8.0" y="128" width="324.0" height="35" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="170.0" y="150" text-anchor="middle" font-size="13" font-weight="500" fill="#064e3b">First-line: Below 5%: stop or switch.</text><path d="M170.0 102 L170.0 127" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp200a)"/><rect x="8.0" y="189" width="324.0" height="52" rx="11" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.6"/><text x="170.0" y="211" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">Trap: Not for use in pregnancy; stop if</text><text x="170.0" y="228" text-anchor="middle" font-size="13" font-weight="500" fill="#881337">pregnancy occurs.</text><path d="M170.0 163 L170.0 188" stroke="#0f766e" stroke-width="1.8" fill="none" marker-end="url(#fnp200a)"/></svg>