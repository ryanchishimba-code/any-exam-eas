<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 206" width="420" height="206" role="img" aria-labelledby="tusmle2064"><title id="tusmle2064">Do not bridge with heparin.</title><rect width="420" height="206" fill="#ffffff"/><rect x="0" y="0" width="8" height="206" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="46" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not bridge with heparin.</text><text x="24" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Bridging adds bleeding. It is for the</text><text x="24" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">rare very high thrombotic risk, such as</text><text x="24" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">a mechanical mitral valve or a very</text><text x="24" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">recent clot.</text></svg>
