<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 266" width="420" height="266" role="img" aria-labelledby="tusmle2036"><title id="tusmle2036">One dose of doxycycline is enough, and only because the rules are met.</title><rect width="420" height="266" fill="#ffffff"/><rect x="0" y="0" width="8" height="266" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="106" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">One dose of doxycycline is enough,</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">and only because the rules are</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">met.</text><text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Prophylaxis needs the right tick, enough</text><text x="24" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">attachment time, a high local rate, and a</text><text x="24" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">start within 72 hours. A tick brushed off</text><text x="24" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">in an hour does not qualify.</text></svg>
