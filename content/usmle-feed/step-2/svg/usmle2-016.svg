<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 216" width="420" height="216" role="img" aria-labelledby="tusmle2016"><title id="tusmle2016">Do not order a CT to prove what the lipase already showed.</title><rect width="420" height="216" fill="#ffffff"/><rect x="0" y="0" width="8" height="216" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not order a CT to prove what</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">the lipase already showed.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Early feeding as pain allows is better</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">than days of nothing by mouth. Fluids are</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">given, not drowned.</text></svg>
