<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230" role="img" aria-labelledby="tusmle2126"><title id="tusmle2126">Do not start a lifelong drug tonight.</title><rect width="420" height="230" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Do not start a lifelong drug</text><text x="20" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">tonight.</text><rect x="16" y="64" width="388" height="58" rx="12" fill="#e7f5ef"/><text x="32" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Counsel and arrange the workup.</text><rect x="16" y="134" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not load a chronic drug by</text><text x="32" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">reflex.</text></svg>
