<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-labelledby="tusmle2076"><title id="tusmle2076">Plot the level and start the antidote if it is above the line. Do not wait for the enzymes.</title><rect width="420" height="260" fill="#ffffff"/><rect x="0" y="0" width="8" height="260" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="124" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Plot the level and start the</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">antidote if it is above the</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">line. Do not wait for the</text><text x="32" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">enzymes.</text><text x="24" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Injury shows up after the enzymes do. A</text><text x="24" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">normal ALT at six hours is expected and</text><text x="24" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">useless as reassurance.</text></svg>
