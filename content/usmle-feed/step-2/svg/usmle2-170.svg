<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 252" width="420" height="252" role="img" aria-labelledby="tusmle2170"><title id="tusmle2170">Continuous nebulizer, steroid, and magnesium.</title><rect width="420" height="252" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Continuous nebulizer, steroid, and</text><text x="20" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">magnesium.</text><rect x="16" y="64" width="388" height="80" rx="12" fill="#e7f5ef"/><text x="32" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Treat and admit if there is little</text><text x="32" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">response.</text><rect x="16" y="156" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not discharge after one</text><text x="32" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">treatment.</text></svg>
