<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 264" width="420" height="264" role="img" aria-labelledby="tusmle2005"><title id="tusmle2005">Most murmurs do not get prophylaxis.</title><rect width="420" height="264" fill="#ffffff"/><rect x="0" y="0" width="8" height="264" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Most murmurs do not get</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">prophylaxis.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Prophylaxis is for the highest-risk</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">hearts: a prosthetic valve, a prior</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">infection of the valve, certain congenital</text><text x="24" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">repairs, and a transplant heart with</text><text x="24" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">valvulopathy.</text></svg>
