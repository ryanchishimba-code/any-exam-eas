<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 234" width="420" height="234" role="img" aria-labelledby="tusmle2062"><title id="tusmle2062">This is thrombotic thrombocytopenic purpura. Exchange the plasma.</title><rect width="420" height="234" fill="#ffffff"/><rect x="0" y="0" width="8" height="234" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="98" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">This is thrombotic</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">thrombocytopenic purpura.</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Exchange the plasma.</text><text x="24" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Normal coagulation times separate it</text><text x="24" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">from disseminated intravascular</text><text x="24" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">coagulation. Platelets will be consumed.</text></svg>
