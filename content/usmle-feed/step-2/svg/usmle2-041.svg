<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 216" width="420" height="216" role="img" aria-labelledby="tusmle2041"><title id="tusmle2041">Operate. This is rupture until proven otherwise.</title><rect width="420" height="216" fill="#ffffff"/><rect x="0" y="0" width="8" height="216" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Operate. This is rupture until</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">proven otherwise.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Methotrexate is only for a stable patient</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">who can return for serial hormone checks</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">and has no rupture.</text></svg>
