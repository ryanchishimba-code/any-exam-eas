<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 208" width="420" height="208" role="img" aria-labelledby="tusmle2070"><title id="tusmle2070">Offer a yearly low-dose chest CT.</title><rect width="420" height="208" fill="#ffffff"/><rect x="0" y="0" width="8" height="208" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="72" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Offer a yearly low-dose chest</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">CT.</text><text x="24" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The window is age 50 to 80, at least 20</text><text x="24" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">pack-years, and current smoking or</text><text x="24" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">quitting within 15 years.</text></svg>
