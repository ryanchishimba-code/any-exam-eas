<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-labelledby="tusmle2021"><title id="tusmle2021">The renal vein may have clotted.</title><rect width="420" height="190" fill="#ffffff"/><rect x="0" y="0" width="8" height="190" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="54" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">The renal vein may have clotted.</text><text x="24" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Nephrotic syndrome, especially membranous,</text><text x="24" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">is a clotting state. The pain is the clot,</text><text x="24" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">not a new stone by default.</text></svg>
