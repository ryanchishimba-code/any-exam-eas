<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-labelledby="tusmle2051"><title id="tusmle2051">Start a steroid now. Do not wait for the biopsy.</title><rect width="420" height="240" fill="#ffffff"/><rect x="0" y="0" width="8" height="240" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Start a steroid now. Do not wait</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">for the biopsy.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Vision loss in giant cell arteritis is a</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">same-hour problem. The sedimentation rate</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">supports the story and must not delay</text><text x="24" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">treatment.</text></svg>
