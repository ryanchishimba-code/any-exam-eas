<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" width="420" height="232" role="img" aria-labelledby="tusmle2031"><title id="tusmle2031">Treat the pregnancy. Do not treat the other patient.</title><rect width="420" height="232" fill="#ffffff"/><rect x="0" y="0" width="8" height="232" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="72" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Treat the pregnancy. Do not</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">treat the other patient.</text><text x="24" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Asymptomatic bacteriuria matters in</text><text x="24" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">pregnancy and before some urologic</text><text x="24" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">procedures. It does not matter in a well</text><text x="24" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">nonpregnant adult.</text></svg>
