<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-labelledby="tusmle2056"><title id="tusmle2056">Admit for medical danger. Outpatient therapy is not the first step.</title><rect width="420" height="190" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Admit for medical danger. Outpatient</text><text x="20" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">therapy is not the first step.</text><circle cx="36" cy="88" r="14" fill="#0d7f8c"/><text x="31" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="60" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Monitored refeeding, electrolyte</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">replacement, and</text><line x1="36" y1="104" x2="36" y2="134" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="148" r="14" fill="#0d7f8c"/><text x="31" y="153" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="60" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">the eating-disorder treatment</text></svg>
