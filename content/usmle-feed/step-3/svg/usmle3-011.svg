<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 234" width="420" height="234" role="img" aria-labelledby="tusmle3011"><title id="tusmle3011">Find the cause of the delirium. Do not lead with a restraint or a benzodiazepine.</title><rect width="420" height="234" fill="#ffffff"/><rect x="0" y="0" width="8" height="234" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="98" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Find the cause of the delirium.</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not lead with a restraint or</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">a benzodiazepine.</text><text x="24" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Infection, drugs, urine retention,</text><text x="24" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">constipation, pain, and withdrawal are</text><text x="24" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">the usual causes.</text></svg>
