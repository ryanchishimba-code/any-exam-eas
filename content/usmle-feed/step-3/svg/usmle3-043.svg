<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-labelledby="tusmle3043"><title id="tusmle3043">Offer naltrexone or acamprosate, not disulfiram as a casual first drug.</title><rect width="420" height="210" fill="#ffffff"/><rect x="0" y="0" width="8" height="210" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="98" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Offer naltrexone or acamprosate,</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">not disulfiram as a casual first</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">drug.</text><text x="24" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">A short screen that is positive deserves</text><text x="24" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">a treatment offer, not a lecture.</text></svg>
