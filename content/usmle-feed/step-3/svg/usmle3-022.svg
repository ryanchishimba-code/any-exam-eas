<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 218" width="420" height="218" role="img" aria-labelledby="tusmle3022"><title id="tusmle3022">This syncope is cardiac. Do not send the patient home with a hydration sheet.</title><rect width="420" height="218" fill="#ffffff"/><rect x="0" y="0" width="8" height="218" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="106" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">This syncope is cardiac. Do not</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">send the patient home with a</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">hydration sheet.</text><text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">No prodrome, occurrence while seated, and</text><text x="24" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">a pause are high-risk features.</text></svg>
