<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-labelledby="tusmle3014"><title id="tusmle3014">Do not renumber it as a stage 2.</title><rect width="420" height="190" fill="#ffffff"/><rect x="0" y="0" width="8" height="190" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="54" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not renumber it as a stage 2.</text><text x="24" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Pressure injuries are not reverse-staged</text><text x="24" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">as they heal. The original depth stays in</text><text x="24" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">the record.</text></svg>
