<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 218" width="420" height="218" role="img" aria-labelledby="tusmle3071"><title id="tusmle3071">Hold warfarin and give oral vitamin K. Do not transfuse plasma for a number.</title><rect width="420" height="218" fill="#ffffff"/><rect x="0" y="0" width="8" height="218" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="106" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Hold warfarin and give oral</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">vitamin K. Do not transfuse plasma</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">for a number.</text><text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Plasma is for serious bleeding. A high INR</text><text x="24" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">without bleeding is reversed more gently.</text></svg>
