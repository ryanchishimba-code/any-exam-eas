<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-labelledby="tusmle3076"><title id="tusmle3076">They may not drive. Follow your state's reporting rule.</title><rect width="420" height="240" fill="#ffffff"/><rect x="0" y="0" width="8" height="240" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">They may not drive. Follow your</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">state's reporting rule.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The seizure-free interval is set by the</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">state. Some states require the physician</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">to report. Some put the duty on the</text><text x="24" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">driver.</text></svg>
