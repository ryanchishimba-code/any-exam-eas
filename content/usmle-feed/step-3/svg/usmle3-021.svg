<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 214" width="420" height="214" role="img" aria-labelledby="tusmle3021"><title id="tusmle3021">Do not cardiovert this afternoon.</title><rect width="420" height="214" fill="#ffffff"/><rect x="0" y="0" width="8" height="214" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="54" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not cardiovert this afternoon.</text><text x="24" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Elective cardioversion needs a plan for</text><text x="24" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">thrombus: three weeks of anticoagulation</text><text x="24" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">or a clear transesophageal echo, then</text><text x="24" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">anticoagulation after.</text></svg>
