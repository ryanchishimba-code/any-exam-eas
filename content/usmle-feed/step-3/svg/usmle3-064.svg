<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 212" width="420" height="212" role="img" aria-labelledby="tusmle3064"><title id="tusmle3064">Do not start a stimulant on one observation.</title><rect width="420" height="212" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Do not start a stimulant on one</text><text x="20" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">observation.</text><circle cx="36" cy="88" r="14" fill="#0d7f8c"/><text x="31" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="60" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Collect home and school reports,</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">rule out sleep and learning</text><text x="60" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">problems, and</text><line x1="36" y1="104" x2="36" y2="156" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="170" r="14" fill="#0d7f8c"/><text x="31" y="175" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="60" y="174" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">decide</text></svg>
