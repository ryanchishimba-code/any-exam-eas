<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 252" width="420" height="252" role="img" aria-labelledby="tusmle3182"><title id="tusmle3182">A PPI is reasonable if other bleed risks exist.</title><rect width="420" height="252" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">A PPI is reasonable if other bleed</text><text x="20" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">risks exist.</text><rect x="16" y="64" width="388" height="80" rx="12" fill="#e7f5ef"/><text x="32" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Add protection if an NSAID or a</text><text x="32" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">prior bleed is present.</text><rect x="16" y="156" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="202" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not start a PPI for every short</text><text x="32" y="224" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">steroid burst.</text></svg>
