<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 242" width="420" height="242" role="img" aria-labelledby="tusmle3066"><title id="tusmle3066">Treat meningococcal disease now. Do not wait for the rash to look classic.</title><rect width="420" height="242" fill="#ffffff"/><rect x="0" y="0" width="8" height="242" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="106" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Treat meningococcal disease now.</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Do not wait for the rash to look</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">classic.</text><text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Non-blanching rash plus toxicity is</text><text x="24" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">enough. The lumbar puncture must not delay</text><text x="24" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">the antibiotic.</text></svg>
