<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 208" width="420" height="208" role="img" aria-labelledby="tusmle3178"><title id="tusmle3178">The diuretic follows the weight. The other drugs do not.</title><rect width="420" height="208" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">The diuretic follows the weight. The</text><text x="20" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">other drugs do not.</text><rect x="16" y="64" width="388" height="58" rx="12" fill="#e7f5ef"/><text x="32" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Adjust the loop to weight.</text><rect x="16" y="134" width="388" height="58" rx="12" fill="#fdecec"/><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not freeze a high diuretic dose.</text></svg>
