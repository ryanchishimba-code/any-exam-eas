<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 192" width="420" height="192" role="img" aria-labelledby="tusmle3029"><title id="tusmle3029">Restart the basal insulin and check for ketones.</title><rect width="420" height="192" fill="#ffffff"/><rect x="0" y="0" width="8" height="192" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Restart the basal insulin and</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">check for ketones.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Illness raises insulin need. Fasting does</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">not remove it in type 1 diabetes.</text></svg>
