<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 188" width="420" height="188" role="img" aria-labelledby="tusmle3204"><title id="tusmle3204">Too much oxygen.</title><rect width="420" height="188" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Too much oxygen.</text><rect x="16" y="44" width="388" height="58" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Turn the flow down.</text><rect x="16" y="114" width="388" height="58" rx="12" fill="#fdecec"/><text x="32" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not chase 98 percent.</text></svg>
