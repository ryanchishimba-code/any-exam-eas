<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 234" width="420" height="234" role="img" aria-labelledby="tusmle3019"><title id="tusmle3019">Switch to an angiotensin receptor blocker. Do not leave the pathway untreated.</title><rect width="420" height="234" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Switch to an angiotensin receptor</text><text x="20" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">blocker. Do not leave the pathway</text><circle cx="36" cy="88" r="14" fill="#0d7f8c"/><text x="31" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="60" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">An angiotensin receptor blocker,</text><text x="60" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">or an angiotensin</text><text x="60" y="136" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">receptor-neprilysin inhibitor</text><text x="60" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">when that is the right</text><line x1="36" y1="104" x2="36" y2="178" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="192" r="14" fill="#0d7f8c"/><text x="31" y="197" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="60" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">step</text></svg>
