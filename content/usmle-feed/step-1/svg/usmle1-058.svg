<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 184" width="420" height="184" role="img" aria-labelledby="tusmle1058"><title id="tusmle1058">The shift is to the right, and hemoglobin unloads oxygen.</title><rect width="420" height="184" fill="#ffffff"/><rect x="0" y="0" width="8" height="184" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="72" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">The shift is to the right, and</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">hemoglobin unloads oxygen.</text><text x="24" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">A right shift raises the partial</text><text x="24" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">pressure needed for a given saturation.</text></svg>
