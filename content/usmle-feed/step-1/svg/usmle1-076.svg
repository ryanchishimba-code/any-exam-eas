<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 158" width="420" height="158" role="img" aria-labelledby="tusmle1076"><title id="tusmle1076">21-hydroxylase is deficient.</title><rect width="420" height="158" fill="#ffffff"/><rect x="0" y="0" width="8" height="158" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="46" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">21-hydroxylase is deficient.</text><text x="24" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Cortisol and aldosterone fall. ACTH</text><text x="24" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">rises and drives adrenal androgens.</text></svg>
