<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" aria-labelledby="tusmle1070"><title id="tusmle1070">Tubular injury, interstitial or pyelonephritis, and glomerulonephritis, in that order.</title><rect width="420" height="236" fill="#ffffff"/><rect x="0" y="0" width="8" height="236" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="124" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Tubular injury, interstitial or</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">pyelonephritis, and</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">glomerulonephritis, in that</text><text x="32" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">order.</text><text x="24" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The cast is a mold of the nephron, so</text><text x="24" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">its contents point at the compartment.</text></svg>
