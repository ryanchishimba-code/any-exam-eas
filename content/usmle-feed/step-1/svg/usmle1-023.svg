<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 184" width="420" height="184" role="img" aria-labelledby="tusmle1023"><title id="tusmle1023">Terminal complement, C5 through C9, is missing.</title><rect width="420" height="184" fill="#ffffff"/><rect x="0" y="0" width="8" height="184" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="72" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Terminal complement, C5 through</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">C9, is missing.</text><text x="24" y="120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The same risk appears in a patient</text><text x="24" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">treated with a C5 inhibitor.</text></svg>
