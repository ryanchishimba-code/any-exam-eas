<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 216" width="420" height="216" role="img" aria-labelledby="tusmle1016"><title id="tusmle1016">Competitive inhibition. Vmax is unchanged.</title><rect width="420" height="216" fill="#ffffff"/><rect x="0" y="0" width="8" height="216" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="80" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Competitive inhibition. Vmax is</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">unchanged.</text><text x="24" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">On a double-reciprocal plot the lines meet</text><text x="24" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">on the y-axis, because 1 over Vmax is the</text><text x="24" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">same.</text></svg>
