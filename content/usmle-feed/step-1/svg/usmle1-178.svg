<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 168" width="420" height="168" role="img" aria-labelledby="tusmle1178"><title id="tusmle1178">Warfarin, lithium, digoxin, phenytoin, and theophylline.</title><rect width="420" height="168" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Warfarin, lithium, digoxin,</text><text x="20" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">phenytoin, and theophylline.</text><circle cx="36" cy="88" r="14" fill="#0d7f8c"/><text x="31" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="60" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Check levels and kidneys,</text><line x1="36" y1="104" x2="36" y2="112" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="126" r="14" fill="#0d7f8c"/><text x="31" y="131" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="60" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">do not refill a doubled dose</text></svg>
