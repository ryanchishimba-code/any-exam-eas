<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-labelledby="tusmle1032"><title id="tusmle1032">Factor VIII is missing.</title><rect width="420" height="190" fill="#ffffff"/><rect x="0" y="0" width="8" height="190" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="54" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Factor VIII is missing.</text><text x="24" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The inheritance is X-linked. Factor IX</text><text x="24" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">deficiency looks similar and does not</text><text x="24" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">correct with factor VIII.</text></svg>
