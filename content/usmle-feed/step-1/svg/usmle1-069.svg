<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 234" width="420" height="234" role="img" aria-labelledby="tusmle1069"><title id="tusmle1069">The first is distal renal tubular acidosis. The second is the low-aldosterone type.</title><rect width="420" height="234" fill="#ffffff"/><rect x="0" y="0" width="8" height="234" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="98" rx="12" fill="#0f2e42"/><text x="32" y="46" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">The first is distal renal</text><text x="32" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">tubular acidosis. The second is</text><text x="32" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">the low-aldosterone type.</text><text x="24" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Distal cells fail to secrete hydrogen.</text><text x="24" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The hyperkalemic type fails because</text><text x="24" y="194" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">aldosterone is missing or blocked.</text></svg>
