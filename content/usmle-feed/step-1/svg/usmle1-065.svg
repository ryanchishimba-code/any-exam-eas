<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 218" width="420" height="218" role="img" aria-labelledby="tusmle1065"><title id="tusmle1065">Gluten is driving an immune injury in a person with HLA-DQ2 or HLA-DQ8.</title><rect width="420" height="218" fill="#ffffff"/><rect x="0" y="0" width="8" height="218" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="106" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Gluten is driving an immune injury</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">in a person with HLA-DQ2 or</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">HLA-DQ8.</text><text x="24" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The rash is dermatitis herpetiformis, IgA</text><text x="24" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">at the dermal papillae.</text></svg>
