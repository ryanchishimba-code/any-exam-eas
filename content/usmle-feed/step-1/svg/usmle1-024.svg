<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 298" width="420" height="298" role="img" aria-labelledby="tusmle1024"><title id="tusmle1024">CD40 ligand is missing.</title><rect width="420" height="298" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">CD40 ligand is missing.</text><rect x="16" y="44" width="388" height="102" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">This is cell-mediated failure as</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">well as antibody failure, which is</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">why Pneumocystis appears.</text><rect x="16" y="158" width="388" height="124" rx="12" fill="#fdecec"/><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Calling it isolated</text><text x="32" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">agammaglobulinemia. Those patients</text><text x="32" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">lack B cells and do not have this</text><text x="32" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">opportunistic pattern.</text></svg>
