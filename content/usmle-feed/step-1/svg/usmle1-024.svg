<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 142" width="420" height="142" role="img" aria-labelledby="tusmle1024"><title id="tusmle1024">CD40 ligand is missing.</title><rect width="420" height="142" fill="#ffffff"/><rect x="0" y="0" width="8" height="142" fill="#0d7f8c"/><rect x="16" y="16" width="388" height="54" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">CD40 ligand is missing.</text><text x="24" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Without that signal, B cells stay on IgM.</text></svg>
