<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-labelledby="tusmle1082"><title id="tusmle1082">HGPRT is missing.</title><rect width="420" height="210" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">HGPRT is missing.</text><rect x="16" y="44" width="388" height="80" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Allopurinol lowers the urate. It</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">does not stop the behavior.</text><rect x="16" y="136" width="388" height="58" rx="12" fill="#fdecec"/><text x="32" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not call this ordinary gout.</text></svg>
