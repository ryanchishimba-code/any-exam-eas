<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" width="420" height="276" role="img" aria-labelledby="tusmle1074"><title id="tusmle1074">Turner syndrome, 45,X.</title><rect width="420" height="276" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Turner syndrome, 45,X.</text><rect x="16" y="44" width="388" height="124" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">The extra-X karyotype with small</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">testes, tall stature, and</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">azoospermia is Klinefelter, not</text><text x="32" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">this.</text><rect x="16" y="180" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Promising fertility. The streak</text><text x="32" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">gonads do not produce eggs.</text></svg>
