<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 254" width="420" height="254" role="img" aria-labelledby="tusmle1101"><title id="tusmle1101">Glucocerebrosidase is missing.</title><rect width="420" height="254" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42">Glucocerebrosidase is missing.</text><rect x="16" y="44" width="388" height="102" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Replace the enzyme. A cherry-red</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">spot means a different storage</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">disease.</text><rect x="16" y="158" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a">Not this</text><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">Do not name Tay-Sachs when the</text><text x="32" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a">spleen is huge.</text></svg>
