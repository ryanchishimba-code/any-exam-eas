<svg xmlns="http://www.w3.org/2000/svg" width="420" height="434" viewBox="0 0 420 434" role="img" aria-label="Abnormal uterine bleeding: PALM-COEIN">
<title>Abnormal uterine bleeding: PALM-COEIN</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Abnormal uterine bleeding:</text>
<text x="28" y="64" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">PALM-COEIN</text>
<rect x="24" y="98" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="120" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">PALM is structural: Polyp, Adenomyosis,</text>
<text x="36" y="142" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Leiomyoma, Malignancy or hyperplasia.</text>
<rect x="24" y="166" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="188" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">COEIN is not structural: Coagulopathy,</text>
<text x="36" y="210" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Ovulatory dysfunction, Endometrial,</text>
<text x="36" y="232" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Iatrogenic, Not yet classified.</text>
<rect x="24" y="256" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="278" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Pregnancy test first in reproductive</text>
<text x="36" y="300" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">years.</text>
<rect x="24" y="324" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="346" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Postmenopausal bleeding is evaluated for</text>
<text x="36" y="368" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">cancer.</text>
<text x="28" y="400" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">FIGO PALM-COEIN</text>
</svg>
