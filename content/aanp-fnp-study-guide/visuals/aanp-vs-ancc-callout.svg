<svg xmlns="http://www.w3.org/2000/svg" width="420" height="382" viewBox="0 0 420 382" role="img" aria-label="Two FNP exams">
<title>Two FNP exams</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Two FNP exams</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">AANPCB FNP-C Domain I: Assess 32%,</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Diagnose 27%, Plan 27%, Evaluate 15% (June</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">2026 handbook).</text>
<rect x="24" y="160" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Age mix: newborn 2, infant 3, toddler 4,</text>
<text x="36" y="204" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">child 4, adolescent 9, young adult 22,</text>
<text x="36" y="226" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">middle adult 26, older adult 30.</text>
<rect x="24" y="250" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="272" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">The ANCC FNP-BC outline is a different</text>
<text x="36" y="294" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">document. Do not copy these percentages</text>
<text x="36" y="316" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">onto it.</text>
<text x="28" y="348" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">AANPCB FNP candidate handbook, June 2026</text>
</svg>
