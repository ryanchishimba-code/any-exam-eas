<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 214" width="420" height="214" role="img" data-layout="contrast"><title>20 kg child, amoxicillin 90</title><rect width="420" height="214" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">20 kg child, amoxicillin 90</text><rect x="16" y="48" width="188" height="106" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="106" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">90 × 20 = 1,800</tspan><tspan x="28.0" dy="22">mg/day; 900 mg</tspan><tspan x="28.0" dy="22">per dose.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">900 mg ÷ 400 mg</tspan><tspan x="228.0" dy="22">× 5 mL = 11.25</tspan><tspan x="228.0" dy="22">mL BID.</tspan></text><text x="20.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Mg/kg/day is the daily total; divide</tspan><tspan x="20.0" dy="22">before converting to mL.</tspan></text></svg>
