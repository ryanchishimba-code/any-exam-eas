text x="14.0" y="123.0" font-size="1" fill="#5b7370" text-anchor="start" xml:space="preserve" ><tspan font-weight="500"></tspan></text><text x="16" y="208.0" font-size="11" fill="#5b7370" text-anchor="middle" font-weight="500" transform="rotate(-90 16 208.0)">Level (mcg/mL)</text><text x="7.0" y="350.0" font-size="11.5" fill="#5b7370" text-anchor="start" xml:space="preserve" ><tspan font-weight="600">Illustrative patient: Km 4 mg/L, Vmax 450 mg/day.</tspan></text><text x="7.0" y="366.0" font-size="11.5" fill="#5b7370" text-anchor="start" xml:space="preserve" ><tspan font-weight="600">Level = Km × dose ÷ (Vmax − dose).</tspan></text><clipPath id="n10c2"><rect x="4" y="379" width="312" height="97.0" rx="13"/></clipPath><rect x="4" y="379" width="312" height="97.0" rx="13" fill="#ffffff" filter="url(#n10s)"/><g clip-path="url(#n10c2)"><rect x="4" y="379" width="5" height="97.0" fill="#0d9488"/></g><rect x="4.5" y="379.5" width="311" height="96.0" rx="12.5" fill="none" stroke="#c9ebe6" stroke-width="1"/><text x="20.0" y="399.0" font-size="10" fill="#0d9488" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">PHARMACIST MOVE</tspan></text><text x="20.0" y="421.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Raise by 30–100 mg/day</tspan></text><text x="20.0" y="441.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Recheck after the new steady state (often 1–2</tspan></text><text x="20.0" y="459.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">weeks or longer).</tspan></text><rect x="4" y="486.0" width="312" height="72.0" rx="13" fill="#fff1f3" stroke="#fbcfd8"/><circle cx="20" cy="505.5" r="3.4" fill="#e11d48"/><text x="30.0" y="509.2" font-size="10.5" fill="#e11d48" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="524.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Low albumin or renal failure: judge by the free</tspan></text><text x="18.0" y="542.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">level (1–2 mcg/mL), not the total.</tspan></text></svg>