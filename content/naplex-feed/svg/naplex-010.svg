<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 562" width="320" height="562" role="img" aria-label="Phenytoin Michaelis-Menten curve: steady-state level rises disproportionately as dose nears Vmax. Illustrative patient (Km 4 mg/L, Vmax 450 mg/day): 300 mg/day gives 8, 350 gives 14, 400 gives 32 mcg/mL." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Phenytoin Michaelis-Menten curve: steady-state level rises disproportionately as dose nears Vmax. Illustrative patient (Km 4 mg/L, Vmax 450 mg/day): 300 mg/day gives 8, 350 gives 14, 400 gives 32 mcg/mL.</title><defs><linearGradient id="n10g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n10s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n10c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n10c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n10g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">PHARMACOKINETICS</tspan></text><rect x="230.1" y="15" width="67.9" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="264.0" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">Nonlinear</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Phenytoin: small dose step, big</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" lette