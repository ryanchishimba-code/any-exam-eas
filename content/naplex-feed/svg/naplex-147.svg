<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Cross-reactivity</tspan><tspan x="32.0" dy="22">is low (~1–2%) and</tspan><tspan x="32.0" dy="22">driven by side</tspan><tspan x="32.0" dy="22">chains; cefazolin's</tspan><tspan x="32.0" dy="22">is unique.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Low-risk histories can</tspan><tspan x="32.0" dy="22">get a direct oral</tspan><tspan x="32.0" dy="22">amoxicillin challenge to</tspan><tspan x="32.0" dy="22">remove the label.</tspan></text><rect x="20" y="338" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Even after penicillin</tspan><tspan x="32.0" dy="22">anaphylaxis, a</tspan><tspan x="32.0" dy="22">dissimilar-side-chain</tspan><tspan x="32.0" dy="22">cephalosporin can be given.</tspan></text></svg>
