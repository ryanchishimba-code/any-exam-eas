<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 322" width="420" height="322" role="img" data-layout="contrast"><title>History of penicillin hives 20</title><rect width="420" height="322" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">History of penicillin hives 20</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Cross-reactivity</tspan><tspan x="28.0" dy="22">is low (~1–2%)</tspan><tspan x="28.0" dy="22">and driven by</tspan><tspan x="28.0" dy="22">side chains;</tspan><tspan x="28.0" dy="22">cefazolin's is</tspan><tspan x="28.0" dy="22">unique.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Low-risk</tspan><tspan x="228.0" dy="22">histories can</tspan><tspan x="228.0" dy="22">get a direct</tspan><tspan x="228.0" dy="22">oral amoxicillin</tspan><tspan x="228.0" dy="22">challenge to</tspan><tspan x="228.0" dy="22">remove the</tspan><tspan x="228.0" dy="22">label.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Even after penicillin anaphylaxis, a</tspan><tspan x="20.0" dy="22">dissimilar-side-chain cephalosporin can be</tspan><tspan x="20.0" dy="22">given.</tspan></text></svg>
