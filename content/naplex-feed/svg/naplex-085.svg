<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 278" width="420" height="278" role="img" data-layout="contrast"><title>Patient on phenelzine asks about</title><rect width="420" height="278" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Patient on phenelzine asks about</text><rect x="16" y="48" width="188" height="150" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="150" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">High tyramine:</tspan><tspan x="28.0" dy="22">aged cheese,</tspan><tspan x="28.0" dy="22">cured meats, soy</tspan><tspan x="28.0" dy="22">sauce, tap beer.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Counsel a</tspan><tspan x="228.0" dy="22">tyramine-restricted</tspan><tspan x="228.0" dy="22">diet during and</tspan><tspan x="228.0" dy="22">2 weeks after</tspan><tspan x="228.0" dy="22">MAOI therapy.</tspan></text><text x="20.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Grapefruit raises simvastatin and</tspan><tspan x="20.0" dy="22">lovastatin levels; vitamin K just needs</tspan><tspan x="20.0" dy="22">consistency with warfarin.</tspan></text></svg>
