<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Steps 3–5:</tspan><tspan x="32.0" dy="22">maintenance-and-reliever</tspan><tspan x="32.0" dy="22">(MART) with</tspan><tspan x="32.0" dy="22">budesonide-formoterol.</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. SABA-only treatment</tspan><tspan x="32.0" dy="22">raises exacerbation and</tspan><tspan x="32.0" dy="22">death risk.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. MART uses the same</tspan><tspan x="32.0" dy="22">inhaler; don't add a separate</tspan><tspan x="32.0" dy="22">SABA as routine reliever.</tspan></text></svg>
