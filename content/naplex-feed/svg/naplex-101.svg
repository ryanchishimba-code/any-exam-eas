<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 208" width="420" height="208" role="img" aria-labelledby="tnaplex101"><title id="tnaplex101">Yes: two first-line drugs, ideally one pill; goal &lt;130/80.</title><rect width="420" height="208" fill="#ffffff"/><rect x="16" y="16" width="388" height="8" rx="4" fill="#0d7f8c"/><text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">Yes: two first-line drugs,</text><text x="24" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">ideally one pill; goal</text><text x="24" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">&lt;130/80.</text><text x="24" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Drugs at ≥140/90, or ≥130/80 with</text><text x="24" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">CVD, diabetes, CKD or PREVENT risk</text></svg>
