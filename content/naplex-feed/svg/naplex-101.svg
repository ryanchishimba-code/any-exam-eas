<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="466" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><path d="M80 70 C120 60 150 90 140 130 C130 160 90 160 80 130 C70 110 60 90 80 70 Z" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Drugs at ≥140/90, or</tspan><tspan x="188.0" dy="22">≥130/80 with CVD,</tspan><tspan x="188.0" dy="22">diabetes, CKD or PREVENT</tspan><tspan x="188.0" dy="22">risk ≥7.5%.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Thiazide-type,</tspan><tspan x="188.0" dy="22">dihydropyridine CCB,</tspan><tspan x="188.0" dy="22">ACEi or ARB. Stage 2:</tspan><tspan x="188.0" dy="22">two drugs, ideally one</tspan><tspan x="188.0" dy="22">pill.</tspan></text><rect x="176.0" y="326.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Stage 2 (≥140/90) starts</tspan><tspan x="188.0" dy="22">with two drugs; never</tspan><tspan x="188.0" dy="22">combine an ACEi with an</tspan><tspan x="188.0" dy="22">ARB.</tspan></text></svg>
