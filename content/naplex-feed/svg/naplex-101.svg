<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Newly diagnosed BP 148/94, no</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Newly diagnosed BP 148/94, no</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Drugs at ≥140/90,</tspan><tspan x="32.0" dy="22">or ≥130/80 with CVD,</tspan><tspan x="32.0" dy="22">diabetes, CKD or</tspan><tspan x="32.0" dy="22">PREVENT risk ≥7.5%.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Thiazide-type,</tspan><tspan x="32.0" dy="22">dihydropyridine CCB, ACEi</tspan><tspan x="32.0" dy="22">or ARB. Stage 2: two</tspan><tspan x="32.0" dy="22">drugs, ideally one pill.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Stage 2 (≥140/90) starts</tspan><tspan x="32.0" dy="22">with two drugs; never combine</tspan><tspan x="32.0" dy="22">an ACEi with an ARB.</tspan></text></svg>
