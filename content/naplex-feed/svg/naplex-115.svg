<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 618" width="320" height="618" role="img" aria-label="HIT algorithm: platelet fall over 50 percent at day 5 to 10 or new clot, calculate 4Ts; if intermediate or high, stop all heparin including flushes and LMWH, start a non-heparin anticoagulant, send the PF4 test; delay warfarin until platelets are at least 150,000 and give vitamin K if already on warfarin." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>HIT algorithm: platelet fall over 50 percent at day 5 to 10 or new clot, calculate 4Ts; if intermediate or high, stop all heparin including flushes and LMWH, start a non-heparin anticoagulant, send the PF4 test; delay warfarin until platelets are at least 150,000 and give vitamin K if already on warfarin.</title><defs><linearGradient id="n115g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n115s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n115c1"><rect x="4" y="0" width="312" height="79" rx="18"/></clipPath><g clip-path="url(#n115c1)"><rect x="4" y="0" width="312" height="79" fill="url(#n115g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="87" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">HEMATOLOGY</tspan></text><rect x="230.1" y="15" width="67.9" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="264.0" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">ASH 2018</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Suspected HIT: what to do now</tspan></text><clipPath id="n115c2"><rect x="4" y="93" width="312" height="115.0" rx="13"/></clipPath><rect x="4" y="93" width="312" height="115.0" rx="13" fill="#ffffff" filter="url(#n115s)"/><g clip-path="url(#n115c2)"><rect x="4" y="93" width="5" height="115.0" fill="#475569"/></g><rect x="4.5" y="93.5" width="311" height="114.0" rx="12.5" fill="none" stroke="#dde3ea" stroke-width="1"/><text x="20.0" y="113.0" font-size="10" fill="#475569" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">CLUE</tspan></text><text x="20.0" y="135.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Platelets fall &gt;50%, day 5–10, or new</tspan></text><text x="20.0" y="153.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">clot</tspan></text><text x="20.0" y="173.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Score the </tspan><tspan font-weight="700">4Ts</tspan><tspan font-weight="500">: Thrombocytopenia, Timing,</tspan></text><text x="20.0" y="191.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Thrombosis, oTher causes.</tspan></text><path d="M160.0 211.0 L160.0 239.0" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 235.0 L160.0 241.0 L164.5 235.0" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="85.9" y="217.0" width="148.2" height="18" rx="9" fill="#ffffff" stroke="#c9ebe6"/><text x="160.0" y="229.7" font-size="10.5" fill="#0f766e" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">Intermediate or high 4Ts</tspan></text><clipPath id="n115c3"><rect x="4" y="244.0" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="244.0" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n115s)"/><g clip-path="url(#n115c3)"><rect x="4" y="244.0" width="5" height="68.5" fill="#e11d48"/></g><rect x="4.5" y="244.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#fbcfd8" stroke-width="1"/><circle cx="30" cy="267.0" r="10.5" fill="#e11d48"/><text x="30.0" y="271.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">1</tspan></text><text x="46.0" y="271.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Stop ALL heparin</tspan></text><text x="20.0" y="295.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Includes LMWH and heparin flushes.</tspan></text><clipPath id="n115c4"><rect x="4" y="320.5" width="312" height="117.5" rx="13"/></clipPath><rect x="4" y="320.5" width="312" height="117.5" rx="13" fill="#ffffff" filter="url(#n115s)"/><g clip-path="url(#n115c4)"><rect x="4" y="320.5" width="5" height="117.5" fill="#059669"/></g><rect x="4.5" y="321.0" width="311" height="116.5" rx="12.5" fill="none" stroke="#bdebd5" stroke-width="1"/><circle cx="30" cy="343.5" r="10.5" fill="#059669"/><text x="30.0" y="347.9" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">2</tspan></text><text x="46.0" y="348.1" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Start a non-heparin anticoagulant</tspan></text><line x1="20" y1="360.5" x2="304" y2="360.5" stroke="#bdebd5" stroke-width="1"/><text x="20.0" y="377.0" font-size="12" fill="#059669" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">IV</tspan></text><text x="96.0" y="377.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Argatroban (hepatic) or</tspan></text><text x="96.0" y="394.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">bivalirudin</tspan></text><line x1="20" y1="404.5" x2="304" y2="404.5" stroke="#bdebd5" stroke-width="1"/><text x="20.0" y="421.0" font-size="12" fill="#059669" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">SC / oral</tspan></text><text x="96.0" y="421.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Fondaparinux or a DOAC</tspan></text><clipPath id="n115c5"><rect x="4" y="446.0" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="446.0" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n115s)"/><g clip-path="url(#n115c5)"><rect x="4" y="446.0" width="5" height="68.5" fill="#0d9488"/></g><rect x="4.5" y="446.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#c9ebe6" stroke-width="1"/><circle cx="30" cy="469.0" r="10.5" fill="#0d9488"/><text x="30.0" y="473.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">3</tspan></text><text x="46.0" y="473.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Send PF4 immunoassay</tspan></text><text x="20.0" y="497.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Confirm with a functional assay if positive.</tspan></text><rect x="4" y="524.5" width="312" height="89.5" rx="13" fill="#fffaeb" stroke="#f6e0b0"/><circle cx="20" cy="544.0" r="3.4" fill="#d97706"/><text x="30.0" y="547.7" font-size="10.5" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="563.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">No warfarin until platelets ≥150,000. Already</tspan></text><text x="18.0" y="580.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">on it? Give vitamin K. Avoid platelet</tspan></text><text x="18.0" y="598.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">transfusion unless bleeding.</tspan></text></svg>