<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Patient stable on warfarin gets</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Patient stable on warfarin gets</text><rect x="20" y="52" width="250" height="186" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Raise INR:</tspan><tspan x="32.0" dy="22">TMP-SMX,</tspan><tspan x="32.0" dy="22">metronidazole,</tspan><tspan x="32.0" dy="22">fluconazole,</tspan><tspan x="32.0" dy="22">amiodarone. Lower</tspan><tspan x="32.0" dy="22">INR: rifampin,</tspan><tspan x="32.0" dy="22">carbamazepine.</tspan></text><rect x="20" y="250" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Pick a non-interacting</tspan><tspan x="32.0" dy="22">drug, or check INR in 3–5</tspan><tspan x="32.0" dy="22">days and adjust.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Vitamin K: keep intake</tspan><tspan x="32.0" dy="22">consistent, don't eliminate</tspan><tspan x="32.0" dy="22">it.</tspan></text></svg>
