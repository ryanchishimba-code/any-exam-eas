<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 502" width="420" height="502" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="502" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="208" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Macrolides,</tspan><tspan x="32.0" dy="22">fluoroquinolones,</tspan><tspan x="32.0" dy="22">ondansetron,</tspan><tspan x="32.0" dy="22">methadone,</tspan><tspan x="32.0" dy="22">citalopram,</tspan><tspan x="32.0" dy="22">haloperidol, sotalol,</tspan><tspan x="32.0" dy="22">dofetilide,</tspan><tspan x="32.0" dy="22">amiodarone.</tspan></text><rect x="20" y="272" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Baseline ECG; correct</tspan><tspan x="32.0" dy="22">potassium and magnesium;</tspan><tspan x="32.0" dy="22">choose a non-QT</tspan><tspan x="32.0" dy="22">alternative.</tspan></text><rect x="20" y="404" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="426.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Citalopram: max 20 mg/day</tspan><tspan x="32.0" dy="22">over age 60.</tspan></text></svg>
