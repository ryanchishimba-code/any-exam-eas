<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 326" width="420" height="326" role="img" data-layout="contrast"><title>Common drugs stack QT risk</title><rect width="420" height="326" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Common drugs stack QT risk</text><rect x="16" y="48" width="188" height="238" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="238" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Macrolides,</tspan><tspan x="28.0" dy="22">fluoroquinolones,</tspan><tspan x="28.0" dy="22">ondansetron,</tspan><tspan x="28.0" dy="22">methadone,</tspan><tspan x="28.0" dy="22">citalopram,</tspan><tspan x="28.0" dy="22">haloperidol,</tspan><tspan x="28.0" dy="22">sotalol,</tspan><tspan x="28.0" dy="22">dofetilide,</tspan><tspan x="28.0" dy="22">amiodarone.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Baseline ECG;</tspan><tspan x="228.0" dy="22">correct</tspan><tspan x="228.0" dy="22">potassium and</tspan><tspan x="228.0" dy="22">magnesium;</tspan><tspan x="228.0" dy="22">choose a non-QT</tspan><tspan x="228.0" dy="22">alternative.</tspan></text><text x="20.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Citalopram: max 20 mg/day over age 60.</tspan></text></svg>
