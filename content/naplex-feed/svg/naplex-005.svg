<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" width="420" height="390" role="img" data-layout="contrast"><title>Foundational Knowledge two paths</title><rect width="420" height="390" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Foundational Knowledge two paths</text><rect x="16" y="48" width="188" height="282" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="282" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Inhibitors:</tspan><tspan x="28.0" dy="22">clarithromycin,</tspan><tspan x="28.0" dy="22">ketoconazole,</tspan><tspan x="28.0" dy="22">itraconazole,</tspan><tspan x="28.0" dy="22">ritonavir,</tspan><tspan x="28.0" dy="22">grapefruit</tspan><tspan x="28.0" dy="22">juice. Inducers:</tspan><tspan x="28.0" dy="22">rifampin,</tspan><tspan x="28.0" dy="22">carbamazepine,</tspan><tspan x="28.0" dy="22">phenytoin, St.</tspan><tspan x="28.0" dy="22">John's wort.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Simvastatin or</tspan><tspan x="228.0" dy="22">lovastatin plus</tspan><tspan x="228.0" dy="22">strong 3A4</tspan><tspan x="228.0" dy="22">inhibitor:</tspan><tspan x="228.0" dy="22">contraindicated;</tspan><tspan x="228.0" dy="22">hold statin or</tspan><tspan x="228.0" dy="22">switch</tspan><tspan x="228.0" dy="22">antibiotic.</tspan></text><text x="20.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Azithromycin is not a meaningful 3A4</tspan><tspan x="20.0" dy="22">inhibitor.</tspan></text></svg>
