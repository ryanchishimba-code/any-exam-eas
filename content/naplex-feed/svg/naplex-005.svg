<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 464" width="420" height="464" role="img" data-layout="branch"><title>A patient on simvastatin</title><rect width="420" height="464" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">A patient on simvastatin</text><rect x="48.0" y="48.0" width="352.0" height="162.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Inhibitors: clarithromycin,</tspan><tspan x="60.0" dy="22">ketoconazole, itraconazole,</tspan><tspan x="60.0" dy="22">ritonavir, grapefruit juice.</tspan><tspan x="60.0" dy="22">Inducers: rifampin,</tspan><tspan x="60.0" dy="22">carbamazepine, phenytoin, St.</tspan><tspan x="60.0" dy="22">John's wort.</tspan></text><circle cx="26" cy="129.0" r="12" fill="#0d7f8c"/><text x="26.0" y="134.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="210.0" x2="210" y2="226.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="228.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Simvastatin or lovastatin plus</tspan><tspan x="60.0" dy="22">strong 3A4 inhibitor:</tspan><tspan x="60.0" dy="22">contraindicated; hold statin or</tspan><tspan x="60.0" dy="22">switch antibiotic.</tspan></text><circle cx="26" cy="287.0" r="12" fill="#0d7f8c"/><text x="26.0" y="292.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="346.0" x2="210" y2="362.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="364.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="388.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Azithromycin is not a meaningful</tspan><tspan x="60.0" dy="22">3A4 inhibitor.</tspan></text><circle cx="26" cy="401.0" r="12" fill="#0d7f8c"/><text x="26.0" y="406.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
