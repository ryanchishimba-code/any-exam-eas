<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 464" width="420" height="464" role="img" data-layout="branch"><title>Quetiapine requested</title><rect width="420" height="464" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Quetiapine requested</text><rect x="48.0" y="48.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Applies to all antipsychotics,</tspan><tspan x="60.0" dy="22">typical and atypical; not</tspan><tspan x="60.0" dy="22">approved for dementia psychosis.</tspan></text><circle cx="26" cy="96.0" r="12" fill="#0d7f8c"/><text x="26.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="144.0" x2="210" y2="160.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="162.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Use only for severe, dangerous</tspan><tspan x="60.0" dy="22">or distressing symptoms after</tspan><tspan x="60.0" dy="22">nondrug measures; reassess in 4</tspan><tspan x="60.0" dy="22">weeks; taper if no benefit.</tspan></text><circle cx="26" cy="221.0" r="12" fill="#0d7f8c"/><text x="26.0" y="226.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="280.0" x2="210" y2="296.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="298.0" width="352.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Mortality is mostly</tspan><tspan x="60.0" dy="22">cardiovascular or infectious.</tspan><tspan x="60.0" dy="22">Brexpiprazole is approved for</tspan><tspan x="60.0" dy="22">Alzheimer's agitation but keeps</tspan><tspan x="60.0" dy="22">the warning.</tspan></text><circle cx="26" cy="368.0" r="12" fill="#0d7f8c"/><text x="26.0" y="373.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
