<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 408" width="420" height="408" role="img" data-layout="contrast"><title>Medication Use Process two paths</title><rect width="420" height="408" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process two paths</text><rect x="16" y="48" width="188" height="260" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="260" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Applies to all</tspan><tspan x="28.0" dy="22">antipsychotics,</tspan><tspan x="28.0" dy="22">typical and</tspan><tspan x="28.0" dy="22">atypical; not</tspan><tspan x="28.0" dy="22">approved for</tspan><tspan x="28.0" dy="22">dementia</tspan><tspan x="28.0" dy="22">psychosis.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Use only for</tspan><tspan x="228.0" dy="22">severe,</tspan><tspan x="228.0" dy="22">dangerous or</tspan><tspan x="228.0" dy="22">distressing</tspan><tspan x="228.0" dy="22">symptoms after</tspan><tspan x="228.0" dy="22">nondrug</tspan><tspan x="228.0" dy="22">measures;</tspan><tspan x="228.0" dy="22">reassess in 4</tspan><tspan x="228.0" dy="22">weeks; taper if</tspan><tspan x="228.0" dy="22">no benefit.</tspan></text><text x="20.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Mortality is mostly cardiovascular or</tspan><tspan x="20.0" dy="22">infectious. Brexpiprazole is approved for</tspan><tspan x="20.0" dy="22">Alzheimer's agitation but keeps the</tspan><tspan x="20.0" dy="22">warning.</tspan></text></svg>
