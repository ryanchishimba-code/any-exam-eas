<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 304" width="420" height="304" role="img" data-layout="contrast"><title>Cirrhosis with prior SBP</title><rect width="420" height="304" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Cirrhosis with prior SBP</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Lactulose</tspan><tspan x="28.0" dy="22">titrated to 2–3</tspan><tspan x="28.0" dy="22">soft stools</tspan><tspan x="28.0" dy="22">daily.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Add rifaximin</tspan><tspan x="228.0" dy="22">550 mg BID after</tspan><tspan x="228.0" dy="22">a recurrence;</tspan><tspan x="228.0" dy="22">NSBB for</tspan><tspan x="228.0" dy="22">varices, but</tspan><tspan x="228.0" dy="22">reduce or stop</tspan><tspan x="228.0" dy="22">with hypotension</tspan><tspan x="228.0" dy="22">or AKI.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Avoid NSAIDs: renal injury and bleeding.</tspan></text></svg>
