<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Since 2025, what changed</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Since 2025, what changed</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Boxed warning:</tspan><tspan x="28.0" dy="22">severe</tspan><tspan x="28.0" dy="22">neutropenia,</tspan><tspan x="28.0" dy="22">orthostasis,</tspan><tspan x="28.0" dy="22">seizures,</tspan><tspan x="28.0" dy="22">myocarditis,</tspan><tspan x="28.0" dy="22">dementia</tspan><tspan x="28.0" dy="22">mortality.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">No REMS</tspan><tspan x="228.0" dy="22">enrollment or</tspan><tspan x="228.0" dy="22">ANC check to</tspan><tspan x="228.0" dy="22">dispense; follow</tspan><tspan x="228.0" dy="22">label ANC</tspan><tspan x="228.0" dy="22">monitoring.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Baseline ANC must be at least 1,500 to</tspan><tspan x="20.0" dy="22">start (general population).</tspan></text></svg>
