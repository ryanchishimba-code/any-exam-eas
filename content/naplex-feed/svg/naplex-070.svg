<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Boxed warning: severe</tspan><tspan x="188.0" dy="22">neutropenia,</tspan><tspan x="188.0" dy="22">orthostasis, seizures,</tspan><tspan x="188.0" dy="22">myocarditis, dementia</tspan><tspan x="188.0" dy="22">mortality.</tspan></text><rect x="176.0" y="198.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">No REMS enrollment or</tspan><tspan x="188.0" dy="22">ANC check to dispense;</tspan><tspan x="188.0" dy="22">follow label ANC</tspan><tspan x="188.0" dy="22">monitoring.</tspan></text><rect x="176.0" y="326.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Baseline ANC must be at</tspan><tspan x="188.0" dy="22">least 1,500 to start</tspan><tspan x="188.0" dy="22">(general population).</tspan></text></svg>
