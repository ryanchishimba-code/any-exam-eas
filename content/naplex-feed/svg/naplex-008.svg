<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Both alleles</tspan><tspan x="32.0" dy="22">predict SJS/TEN</tspan><tspan x="32.0" dy="22">(allopurinol: also</tspan><tspan x="32.0" dy="22">DRESS).</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Positive: avoid the</tspan><tspan x="32.0" dy="22">drug and choose an</tspan><tspan x="32.0" dy="22">alternative (febuxostat</tspan><tspan x="32.0" dy="22">for gout).</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. ACR 2020: test HLA-B*58:01</tspan><tspan x="32.0" dy="22">before allopurinol in</tspan><tspan x="32.0" dy="22">Southeast Asian and African</tspan><tspan x="32.0" dy="22">American patients.</tspan></text></svg>
