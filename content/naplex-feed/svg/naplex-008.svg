<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" data-layout="contrast"><title>HLA tests come before carbamazepine</title><rect width="420" height="300" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">HLA tests come before carbamazepine</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Both alleles</tspan><tspan x="28.0" dy="22">predict SJS/TEN</tspan><tspan x="28.0" dy="22">(allopurinol:</tspan><tspan x="28.0" dy="22">also DRESS).</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Positive: avoid</tspan><tspan x="228.0" dy="22">the drug and</tspan><tspan x="228.0" dy="22">choose an</tspan><tspan x="228.0" dy="22">alternative</tspan><tspan x="228.0" dy="22">(febuxostat for</tspan><tspan x="228.0" dy="22">gout).</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">ACR 2020: test HLA-B*58:01 before</tspan><tspan x="20.0" dy="22">allopurinol in Southeast Asian and African</tspan><tspan x="20.0" dy="22">American patients.</tspan></text></svg>
