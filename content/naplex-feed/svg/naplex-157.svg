<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 398" width="420" height="398" role="img" data-layout="branch"><title>Knee OA pain in a 70-year-old</title><rect width="420" height="398" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Knee OA pain in a 70-year-old</text><rect x="48.0" y="48.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Oral NSAIDs if needed,</tspan><tspan x="60.0" dy="22">considering GI, renal and CV</tspan><tspan x="60.0" dy="22">risk.</tspan></text><circle cx="26" cy="96.0" r="12" fill="#0d7f8c"/><text x="26.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="144.0" x2="210" y2="160.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="162.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Acetaminophen and tramadol:</tspan><tspan x="60.0" dy="22">conditional; other opioids:</tspan><tspan x="60.0" dy="22">conditionally against.</tspan></text><circle cx="26" cy="210.0" r="12" fill="#0d7f8c"/><text x="26.0" y="215.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="258.0" x2="210" y2="274.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="276.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Glucosamine, chondroitin and</tspan><tspan x="60.0" dy="22">hydroxychloroquine aren't</tspan><tspan x="60.0" dy="22">recommended.</tspan></text><circle cx="26" cy="324.0" r="12" fill="#0d7f8c"/><text x="26.0" y="329.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
