6666667" y="247.5" width="98.66666666666667" height="132.5" rx="13"/></clipPath><rect x="110.66666666666667" y="247.5" width="98.66666666666667" height="132.5" rx="13" fill="#ffffff" filter="url(#n122s)"/><g clip-path="url(#n122c4)"><rect x="110.66666666666667" y="247.5" width="5" height="132.5" fill="#059669"/></g><rect x="111.16666666666667" y="248.0" width="97.66666666666667" height="131.5" rx="12.5" fill="none" stroke="#bdebd5" stroke-width="1"/><text x="126.7" y="267.5" font-size="10" fill="#059669" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">K 3.5–5</tspan></text><text x="126.7" y="290.0" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Insulin +</tspan></text><text x="126.7" y="308.0" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">K</tspan></text><text x="126.7" y="328.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">0.1</tspan></text><text x="126.7" y="345.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">units/kg/h</tspan></text><text x="126.7" y="363.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">IV.</tspan></text><clipPath id="n122c5"><rect x="217.33333333333334" y="247.5" width="98.66666666666667" height="132.5" rx="13"/></clipPath><rect x="217.33333333333334" y="247.5" width="98.66666666666667" height="132.5" rx="13" fill="#ffffff" filter="url(#n122s)"/><g clip-path="url(#n122c5)"><rect x="217.33333333333334" y="247.5" width="5" height="132.5" fill="#d97706"/></g><rect x="217.83333333333334" y="248.0" width="97.66666666666667" height="131.5" rx="12.5" fill="none" stroke="#f6e0b0" stroke-width="1"/><text x="233.3" y="267.5" font-size="10" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">K &gt;5</tspan></text><text x="233.3" y="290.0" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Insulin only</tspan></text><text x="233.3" y="308.0" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">no K</tspan></text><text x="233.3" y="328.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Recheck K</tspan></text><text x="233.3" y="345.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">every 2 h.</tspan></text><clipPath id="n122c6"><rect x="4" y="392.0" width="312" height="97.0" rx="13"/></clipPath><rect x="4" y="392.0" width="312" height="97.0" rx="13" fill="#ffffff" filter="url(#n122s)"/><g clip-path="url(#n122c6)"><rect x="4" y="392.0" width="5" height="97.0" fill="#0d9488"/></g><rect x="4.5" y="392.5" width="311" height="96.0" rx="12.5" fill="none" stroke="#c9ebe6" stroke-width="1"/><text x="20.0" y="412.0" font-size="10" fill="#0d9488" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">THEN</tspan></text><text x="20.0" y="434.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Glucose &lt;250: add dextrose 5–10%</tspan></text><text x="20.0" y="454.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Basal SC insulin about </tspan><tspan font-weight="700">2 h </tspan><tspan font-weight="500">before stopping the</tspan></text><text x="20.0" y="472.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">drip.</tspan></text></svg>