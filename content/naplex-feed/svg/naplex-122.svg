<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 493" width="320" height="493" role="img" aria-label="DKA potassium gate: fluids first, 1 to 1.5 L isotonic crystalloid in hour one. Potassium below 3.5: hold insulin and replace potassium. 3.5 to 5: insulin 0.1 units/kg/h plus potassium in fluids. Above 5: insulin, no potassium, recheck. Add dextrose when glucose falls below 250; basal insulin about 2 hours before stopping the drip." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>DKA potassium gate: fluids first, 1 to 1.5 L isotonic crystalloid in hour one. Potassium below 3.5: hold insulin and replace potassium. 3.5 to 5: insulin 0.1 units/kg/h plus potassium in fluids. Above 5: insulin, no potassium, recheck. Add dextrose when glucose falls below 250; basal insulin about 2 hours before stopping the drip.</title><defs><linearGradient id="n122g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n122s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n122c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n122c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n122g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">ENDOCRINE</tspan></text><rect x="192.7" y="15" width="105.3" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="245.4" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">2024 consensus</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">DKA: check potassium before</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">insulin</tspan></text><clipPath id="n122c2"><rect x="4" y="115" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="115" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n122s)"/><g clip-path="url(#n122c2)"><rect x="4" y="115" width="5" height="68.5" fill="#475569"/></g><rect x="4.5" y="115.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#dde3ea" stroke-width="1"/><circle cx="30" cy="138" r="10.5" fill="#475569"/><text x="30.0" y="142.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">1</tspan></text><text x="46.0" y="142.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Fluids first</tspan></text><text x="20.0" y="166.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Isotonic crystalloid </tspan><tspan font-weight="700">1–1.5 L </tspan><tspan font-weight="500">in the first hour.</tspan></text><path d="M160.0 186.5 L160.0 214.5" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 210.5 L160.0 216.5 L164.5 210.5" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="91.0" y="192.5" width="138.0" height="18" rx="9" fill="#ffffff" stroke="#c9ebe6"/><text x="160.0" y="205.2" font-size="10.5" fill="#0f766e" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">Check K before insulin</tspan></text><path d="M160.0 221.5 L160.0 230.5 M53.333333333333336 230.5 L266.6666666666667 230.5" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M53.333333333333336 230.5 L53.333333333333336 242.5" 