<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 502" width="420" height="502" role="img" data-layout="ladder"><title>A drug gets an Emergency Use</title><rect width="420" height="502" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">A drug gets an Emergency Use</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Phase 1 safety and</tspan><tspan x="32.0" dy="22">dosing; 2 efficacy</tspan><tspan x="32.0" dy="22">and dose-finding; 3</tspan><tspan x="32.0" dy="22">large confirmatory</tspan><tspan x="32.0" dy="22">trials; 4</tspan><tspan x="32.0" dy="22">postmarketing.</tspan></text><rect x="20" y="228" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. EUA under FD&amp;C Act</tspan><tspan x="32.0" dy="22">section 564 during a</tspan><tspan x="32.0" dy="22">declared emergency;</tspan><tspan x="32.0" dy="22">trials run under an IND</tspan><tspan x="32.0" dy="22">(21 CFR 312).</tspan></text><rect x="20" y="382" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="404.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. REMS can be required at or</tspan><tspan x="32.0" dy="22">after approval if labeling</tspan><tspan x="32.0" dy="22">alone isn't enough.</tspan></text></svg>
