<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 442" width="420" height="442" role="img" data-layout="branch"><title>Decision flow</title><rect width="420" height="442" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Decision flow</text><rect x="48.0" y="48.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Phase 1 safety and dosing; 2</tspan><tspan x="60.0" dy="22">efficacy and dose-finding; 3</tspan><tspan x="60.0" dy="22">large confirmatory trials; 4</tspan><tspan x="60.0" dy="22">postmarketing.</tspan></text><circle cx="26" cy="107.0" r="12" fill="#0d7f8c"/><text x="26.0" y="112.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="166.0" x2="210" y2="182.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="184.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">EUA under FD&amp;C Act section 564</tspan><tspan x="60.0" dy="22">during a declared emergency;</tspan><tspan x="60.0" dy="22">trials run under an IND (21 CFR</tspan><tspan x="60.0" dy="22">312).</tspan></text><circle cx="26" cy="243.0" r="12" fill="#0d7f8c"/><text x="26.0" y="248.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="302.0" x2="210" y2="318.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="320.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="344.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">REMS can be required at or after</tspan><tspan x="60.0" dy="22">approval if labeling alone isn't</tspan><tspan x="60.0" dy="22">enough.</tspan></text><circle cx="26" cy="368.0" r="12" fill="#0d7f8c"/><text x="26.0" y="373.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
