<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 679" width="320" height="679" role="img" aria-label="Convulsive status epilepticus timeline: at 5 minutes a benzodiazepine (IV lorazepam 0.1 mg/kg up to 4 mg, may repeat once, or IM midazolam 10 mg if over 40 kg); at 20 minutes a second-line drug: fosphenytoin 20 mg PE/kg, levetiracetam 60 mg/kg or valproate 40 mg/kg, which work about equally." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Convulsive status epilepticus timeline: at 5 minutes a benzodiazepine (IV lorazepam 0.1 mg/kg up to 4 mg, may repeat once, or IM midazolam 10 mg if over 40 kg); at 20 minutes a second-line drug: fosphenytoin 20 mg PE/kg, levetiracetam 60 mg/kg or valproate 40 mg/kg, which work about equally.</title><defs><linearGradient id="n167g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n167s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n167c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n167c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n167g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">NEUROLOGY</tspan></text><rect x="231.4" y="15" width="66.6" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="264.7" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">AES 2016</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Status epilepticus: drug</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">timeline</tspan></text><text x="14.0" y="127.0" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="600">Stabilize: airway, glucose</tspan></text><rect x="14" y="135.5" width="292" height="14" rx="7" fill="#e8eef0"/><rect x="14.0" y="135.5" width="24.3" height="14" rx="7" fill="#475569"/><text x="14.0" y="174.5" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="600">Benzodiazepine</tspan></text><rect x="14" y="183.0" width="292" height="14" rx="7" fill="#e8eef0"/><rect x="38.3" y="183.0" width="73.0" height="14" rx="7" fill="#e11d48"/><text x="14.0" y="222.0" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="600">Second-line drug</tspan></text><rect x="14" y="230.5" width="292" height="14" rx="7" fill="#e8eef0"/><rect x="111.3" y="230.5" width="97.3" height="14" rx="7" fill="#5b4bd1"/><line x1="14" y1="255.5" x2="306" y2="255.5" stroke="#9fb9b5" stroke-width="1.5"/><line x1="14.0" y1="255.5" x2="14.0" y2="260.5" stroke="#9fb9b5" stroke-width="1.5"/><text x="14.0" y="274.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">0</tspan></text><line x1="38.3" y1="255.5" x2="38.3" y2="260.5" stroke="#9fb9b5" stroke-width="1.5"/><text x="38.3" y="274.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">5</tspan></text><line x1="111.3" y1="255.5" x2="111.3" y2="260.5" stroke="#9fb9b5" stroke-width="1.5"/><text x="111.3" y="274.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">20</tspan></text><line x1="208.7" y1="255.5" x2="208.7" y2="260.5" stroke="#9fb9b5" stroke-width="1.5"/><text x="208.7" y="274.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">40</tspan></text><line x1="306.0" y1="255.5" x2="306.0" y2="260.5" stroke="#9fb9b5" stroke-width="1.5"/><text x="306.0" y="274.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">60</tspan></text><text x="160.0" y="292.5" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="500">minutes from seizure onset</tspan></text><clipPath id="n167c2"><rect x="4" y="301.5" width="312" height="128.5" rx="13"/></clipPath><rect x="4" y="301.5" width="312" height="128.5" rx="13" fill="#ffffff" filter="url(#n167s)"/><g clip-path="url(#n167c2)"><rect x="4" y="301.5" width="5" height="128.5" fill="#e11d48"/></g><rect x="4.5" y="302.0" width="311" height="127.5" rx="12.5" fill="none" stroke="#fbcfd8" stroke-width="1"/><text x="20.0" y="321.5" font-size="10" fill="#e11d48" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">5–20 MIN</tspan></text><text x="20.0" y="344.0" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Benzodiazepine</tspan></text><line x1="20" y1="352.5" x2="304" y2="352.5" stroke="#fbcfd8" stroke-width="1"/><text x="20.0" y="369.0" font-size="12" fill="#e11d48" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">IV access</tspan></text><text x="98.0" y="369.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Lorazepam </tspan><tspan font-weight="700">0.1 mg/kg </tspan><tspan font-weight="500">(max 4</tspan></text><text x="98.0" y="386.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">mg/dose); may repeat once</tspan></text><line x1="20" y1="396.5" x2="304" y2="396.5" stroke="#fbcfd8" stroke-width="1"/><text x="20.0" y="413.0" font-size="12" fill="#e11d48" text-anchor=