roke="#d9d3fb" stroke-width="1"/><text x="20.0" y="576.0" font-size="12" fill="#5b4bd1" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Valproate</tspan></text><text x="122.0" y="576.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">40 mg/kg (max 3,000 mg)</tspan></text><rect x="4" y="603.0" width="312" height="72.0" rx="13" fill="#fffaeb" stroke="#f6e0b0"/><circle cx="20" cy="622.5" r="3.4" fill="#d97706"/><text x="30.0" y="626.2" font-size="10.5" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="641.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">ESETT: the three second-line drugs work</tspan></text><text x="18.0" y="659.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">about equally.</tspan></text></svg>