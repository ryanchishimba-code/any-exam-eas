<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" width="320" height="512" role="img" aria-label="Risk calculation flow: control event rate 20 percent, treatment 15 percent. ARR 5 percent, RRR 25 percent, NNT 20." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Risk calculation flow: control event rate 20 percent, treatment 15 percent. ARR 5 percent, RRR 25 percent, NNT 20.</title><defs><linearGradient id="n47g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n47s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n47c1"><rect x="4" y="0" width="312" height="79" rx="18"/></clipPath><g clip-path="url(#n47c1)"><rect x="4" y="0" width="312" height="79" fill="url(#n47g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="87" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">BIOSTATISTICS</tspan></text><rect x="258.2" y="15" width="39.8" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="278.1" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">Calc</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">ARR → RRR → NNT</tspan></text><clipPath id="n47c2"><rect x="4.0" y="93" width="152.0" height="53" rx="13"/></clipPath><rect x="4.0" y="93" width="152.0" height="53" rx="13" fill="#ffffff" filter="url(#n47s)"/><g clip-path="url(#n47c2)"><rect x="4.0" y="93" width="5" height="53" fill="#475569"/></g><rect x="4.5" y="93.5" width="151.0" height="52" rx="12.5" fill="none" stroke="#dde3ea" stroke-width="1"/><text x="20.0" y="113.0" font-size="10" fill="#475569" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">CONTROL (CER)</tspan></text><text x="20.0" y="135.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">20%</tspan></text><clipPath id="n47c3"><rect x="164.0" y="93" width="152.0" height="53" rx="13"/></clipPath><rect x="164.0" y="93" width="152.0" height="53" rx="13" fill="#ffffff" filter="url(#n47s)"/><g clip-path="url(#n47c3)"><rect x="164.0" y="93" width="5" height="53" fill="#0d9488"/></g><rect x="164.5" y="93.5" width="151.0" height="52" rx="12.5" fill="none" stroke="#c9ebe6" stroke-width="1"/><text x="180.0" y="113.0" font-size="10" fill="#0d9488" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">TREATMENT (EER)</tspan></text><text x="180.0" y="135.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">15%</tspan></text><path d="M80.0 148 L80.0 157" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M240.0 148 L240.0 157" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M80.0 157 L240.0 157 M160.0 157 L160.0 163" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M155.5 159 L160.0 165 L164.5 159" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><clipPath id="n47c4"><rect x="4" y="168" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="168" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n47s)"/><g clip-path="url(#n47c4)"><rect x="4" y="168" width="5" height="68.5" fill="#0d9488"/></g><rect x="4.5" y="168.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#c9ebe6" stroke-width="1"/><circle cx="30" cy="191" r="10.5" fill="#0d9488"/><text x="30.0" y="195.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">1</tspan></text><text x="46.0" y="195.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">ARR = CER − EER</tspan></text><text x="20.0" y="219.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">20% − 15% = </tspan><tspan font-weight="700">5%</tspan></text><path d="M160.0 239.5 L160.0 257.5" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 253.5 L160.0 259.5 L164.5 253.5" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><clipPath id="n47c5"><rect x="4" y="262.5" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="262.5" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n47s)"/><g clip-path="url(#n47c5)"><rect x="4" y="262.5" width="5" height="68.5" fill="#5b4bd1"/></g><rect x="4.5" y="263.0" width="311" height="67.5" rx="12.5" fill="none" stroke="#d9d3fb" stroke-width="1"/><circle cx="30" cy="285.5" r="10.5" fill="#5b4bd1"/><text x="30.0" y="289.9" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">2</tspan></text><text x="46.0" y="290.1" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">RRR = ARR ÷ CER</tspan></text><text x="20.0" y="314.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">5% ÷ 20% = </tspan><tspan font-weight="700">25%</tspan></text><path d="M160.0 334.0 L160.0 352.0" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 348.0 L160.0 354.0 L164.5 348.0" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><clipPath id="n47c6"><rect x="4" y="357.0" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="357.0" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n47s)"/><g clip-path="url(#n47c6)"><rect x="4" y="357.0" width="5" height="68.5" fill="#059669"/></g><rect x="4.5" y="357.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#bdebd5" stroke-width="1"/><circle cx="30" cy="380.0" r="10.5" fill="#059669"/><text x="30.0" y="384.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">3</tspan></text><text x="46.0" y="384.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">NNT = 1 ÷ ARR</tspan></text><text x="20.0" y="408.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">1 ÷ 0.05 = </tspan><tspan font-weight="700">20 </tspan><tspan font-weight="500">(round up)</tspan></text><rect x="4" y="435.5" width="312" height="72.0" rx="13" fill="#fffaeb" stroke="#f6e0b0"/><circle cx="20" cy="455.0" r="3.4" fill="#d97706"/><text x="30.0" y="458.7" font-size="10.5" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="474.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">RRR always looks bigger than ARR. NNT uses</tspan></text><text x="18.0" y="491.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">ARR as a decimal.</tspan></text></svg>