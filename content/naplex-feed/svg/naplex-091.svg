<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 258" width="420" height="258" role="img" data-layout="contrast"><title>Starting atorvastatin</title><rect width="420" height="258" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Starting atorvastatin</text><rect x="16" y="48" width="188" height="150" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="150" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">No routine liver</tspan><tspan x="28.0" dy="22">or CK monitoring</tspan><tspan x="28.0" dy="22">once started.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Recheck lipids</tspan><tspan x="228.0" dy="22">after starting</tspan><tspan x="228.0" dy="22">to confirm</tspan><tspan x="228.0" dy="22">response and</tspan><tspan x="228.0" dy="22">adherence.</tspan></text><text x="20.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Muscle aches: check CK, thyroid and</tspan><tspan x="20.0" dy="22">vitamin D; don't stop all statins forever.</tspan></text></svg>
