<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="466" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Neural tube defects and</tspan><tspan x="188.0" dy="22">lower IQ in exposed</tspan><tspan x="188.0" dy="22">children.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">AAN/AES 2024: avoid</tspan><tspan x="188.0" dy="22">valproate when possible</tspan><tspan x="188.0" dy="22">in people who could</tspan><tspan x="188.0" dy="22">become pregnant; folic</tspan><tspan x="188.0" dy="22">acid.</tspan></text><rect x="176.0" y="304.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Contraindicated in</tspan><tspan x="188.0" dy="22">pregnancy for migraine</tspan><tspan x="188.0" dy="22">prevention;</tspan><tspan x="188.0" dy="22">hepatotoxicity risk</tspan><tspan x="188.0" dy="22">highest under age 2.</tspan></text></svg>
