<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Before azathioprine</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Before azathioprine</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Low enzyme</tspan><tspan x="32.0" dy="22">activity causes</tspan><tspan x="32.0" dy="22">life-threatening</tspan><tspan x="32.0" dy="22">myelosuppression or</tspan><tspan x="32.0" dy="22">toxicity.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Thiopurine poor</tspan><tspan x="32.0" dy="22">metabolizer: drastic dose</tspan><tspan x="32.0" dy="22">cut or alternative. DPYD</tspan><tspan x="32.0" dy="22">poor metabolizer: avoid</tspan><tspan x="32.0" dy="22">5-FU and capecitabine.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. DPYD intermediate</tspan><tspan x="32.0" dy="22">metabolizer: start at 50%</tspan><tspan x="32.0" dy="22">dose.</tspan></text></svg>
