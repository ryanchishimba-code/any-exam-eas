<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 176" width="420" height="176" role="img" aria-labelledby="tnaplex096"><title id="tnaplex096">MDI: slow, deep breath. DPI: fast, forceful breath.</title><rect width="420" height="176" fill="#ffffff"/><rect x="16" y="16" width="388" height="144" rx="14" fill="#f4f7f8"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">MDI: slow, deep breath. DPI:</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">fast, forceful breath.</text><text x="32" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">MDI: shake, exhale, press and inhale</text><text x="32" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">slowly, hold 10 seconds; spacer</text></svg>
