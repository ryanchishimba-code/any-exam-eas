<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Age 65–74 (1) +</tspan><tspan x="32.0" dy="22">female (1) +</tspan><tspan x="32.0" dy="22">hypertension (1) = 3.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Anticoagulate at ≥2 in</tspan><tspan x="32.0" dy="22">men or ≥3 in women; dose</tspan><tspan x="32.0" dy="22">DOACs by label criteria.</tspan></text><rect x="20" y="272" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Mechanical valve or</tspan><tspan x="32.0" dy="22">moderate-severe mitral</tspan><tspan x="32.0" dy="22">stenosis: warfarin, not a</tspan><tspan x="32.0" dy="22">DOAC.</tspan></text></svg>
