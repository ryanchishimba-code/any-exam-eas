<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Beta-blockers are beta-1 selective</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Beta-blockers are beta-1 selective</text><rect x="20" y="52" width="250" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Selectivity fades</tspan><tspan x="32.0" dy="22">at high doses.</tspan></text><rect x="20" y="140" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Carvedilol and</tspan><tspan x="32.0" dy="22">labetalol add alpha-1</tspan><tspan x="32.0" dy="22">blockade. HFrEF: only</tspan><tspan x="32.0" dy="22">metoprolol succinate,</tspan><tspan x="32.0" dy="22">carvedilol or bisoprolol.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Pindolol and acebutolol</tspan><tspan x="32.0" dy="22">have ISA: avoid after MI and</tspan><tspan x="32.0" dy="22">in HFrEF.</tspan></text></svg>
