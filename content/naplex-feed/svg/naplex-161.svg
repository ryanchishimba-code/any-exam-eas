<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Asks for zolpidem for sleep. Better</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Asks for zolpidem for sleep. Better</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Beers: avoid</tspan><tspan x="32.0" dy="22">benzodiazepines and</tspan><tspan x="32.0" dy="22">Z-drugs in older</tspan><tspan x="32.0" dy="22">adults (falls,</tspan><tspan x="32.0" dy="22">delirium).</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. If a drug is needed:</tspan><tspan x="32.0" dy="22">low-dose doxepin ≤6 mg;</tspan><tspan x="32.0" dy="22">for anxiety, SSRI/SNRI or</tspan><tspan x="32.0" dy="22">buspirone.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Diphenhydramine is</tspan><tspan x="32.0" dy="22">strongly anticholinergic:</tspan><tspan x="32.0" dy="22">avoid too.</tspan></text></svg>
