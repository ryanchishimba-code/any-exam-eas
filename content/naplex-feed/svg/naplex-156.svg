<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 166" width="420" height="166" role="img" aria-labelledby="tnaplex156"><title id="tnaplex156">Once weekly, plus folic acid.</title><rect width="420" height="166" fill="#ffffff"/><rect x="16" y="16" width="388" height="62" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Once weekly, plus folic acid.</text><text x="28" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Methotrexate is first-line, titrated</text><text x="28" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">to ~25 mg weekly as tolerated.</text></svg>
