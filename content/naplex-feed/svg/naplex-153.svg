<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>AKI on day 3 in a patient</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">AKI on day 3 in a patient</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Stop the NSAID;</tspan><tspan x="32.0" dy="22">hold the ACEi and</tspan><tspan x="32.0" dy="22">other nephrotoxins</tspan><tspan x="32.0" dy="22">while kidney function</tspan><tspan x="32.0" dy="22">is unstable.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Avoid aminoglycosides</tspan><tspan x="32.0" dy="22">when alternatives exist;</tspan><tspan x="32.0" dy="22">use isotonic crystalloid,</tspan><tspan x="32.0" dy="22">not colloids.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Loop diuretics don't treat</tspan><tspan x="32.0" dy="22">AKI; use only for volume</tspan><tspan x="32.0" dy="22">overload.</tspan></text></svg>
