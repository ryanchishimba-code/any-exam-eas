<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="466" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><path d="M80 70 C120 60 150 90 140 130 C130 160 90 160 80 130 C70 110 60 90 80 70 Z" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Stop the NSAID; hold the</tspan><tspan x="188.0" dy="22">ACEi and other</tspan><tspan x="188.0" dy="22">nephrotoxins while</tspan><tspan x="188.0" dy="22">kidney function is</tspan><tspan x="188.0" dy="22">unstable.</tspan></text><rect x="176.0" y="198.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Avoid aminoglycosides</tspan><tspan x="188.0" dy="22">when alternatives exist;</tspan><tspan x="188.0" dy="22">use isotonic</tspan><tspan x="188.0" dy="22">crystalloid, not</tspan><tspan x="188.0" dy="22">colloids.</tspan></text><rect x="176.0" y="348.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Loop diuretics don't</tspan><tspan x="188.0" dy="22">treat AKI; use only for</tspan><tspan x="188.0" dy="22">volume overload.</tspan></text></svg>
