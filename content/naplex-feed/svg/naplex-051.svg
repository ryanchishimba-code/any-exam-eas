<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Match the generics</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Match the generics</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Also: Lipitor</tspan><tspan x="32.0" dy="22">atorvastatin, Crestor</tspan><tspan x="32.0" dy="22">rosuvastatin, Plavix</tspan><tspan x="32.0" dy="22">clopidogrel, Coreg</tspan><tspan x="32.0" dy="22">carvedilol.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Confirm salt and</tspan><tspan x="32.0" dy="22">release form when</tspan><tspan x="32.0" dy="22">substituting.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Toprol-XL (succinate, ER)</tspan><tspan x="32.0" dy="22">is not Lopressor (tartrate,</tspan><tspan x="32.0" dy="22">IR).</tspan></text></svg>
