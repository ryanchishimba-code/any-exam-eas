<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Egg allergy: any</tspan><tspan x="32.0" dy="22">age-appropriate flu</tspan><tspan x="32.0" dy="22">vaccine; no extra</tspan><tspan x="32.0" dy="22">precautions beyond</tspan><tspan x="32.0" dy="22">usual.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Use the current-season</tspan><tspan x="32.0" dy="22">formulation; COVID-19</tspan><tspan x="32.0" dy="22">vaccine by</tspan><tspan x="32.0" dy="22">individual-based (shared)</tspan><tspan x="32.0" dy="22">decision-making.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Live nasal flu vaccine</tspan><tspan x="32.0" dy="22">(LAIV): not in pregnancy or</tspan><tspan x="32.0" dy="22">immunocompromise, or ≥50.</tspan></text></svg>
