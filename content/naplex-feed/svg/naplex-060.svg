<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" data-layout="branch"><title>With egg allergy wants a flu shot</title><rect width="420" height="420" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">With egg allergy wants a flu shot</text><rect x="48.0" y="48.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Egg allergy: any age-appropriate</tspan><tspan x="60.0" dy="22">flu vaccine; no extra</tspan><tspan x="60.0" dy="22">precautions beyond usual.</tspan></text><circle cx="26" cy="96.0" r="12" fill="#0d7f8c"/><text x="26.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="144.0" x2="210" y2="160.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="162.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Use the current-season</tspan><tspan x="60.0" dy="22">formulation; COVID-19 vaccine by</tspan><tspan x="60.0" dy="22">individual-based (shared)</tspan><tspan x="60.0" dy="22">decision-making.</tspan></text><circle cx="26" cy="221.0" r="12" fill="#0d7f8c"/><text x="26.0" y="226.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="280.0" x2="210" y2="296.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="298.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Live nasal flu vaccine (LAIV):</tspan><tspan x="60.0" dy="22">not in pregnancy or</tspan><tspan x="60.0" dy="22">immunocompromise, or ≥50.</tspan></text><circle cx="26" cy="346.0" r="12" fill="#0d7f8c"/><text x="26.0" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
