<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="400" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Lower risk: lamotrigine,</tspan><tspan x="188.0" dy="22">levetiracetam,</tspan><tspan x="188.0" dy="22">oxcarbazepine.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Folic acid ≥0.4 mg</tspan><tspan x="188.0" dy="22">daily; enzyme inducers</tspan><tspan x="188.0" dy="22">lower hormonal</tspan><tspan x="188.0" dy="22">contraceptive effect.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Lamotrigine levels fall</tspan><tspan x="188.0" dy="22">in pregnancy: monitor</tspan><tspan x="188.0" dy="22">and adjust.</tspan></text></svg>
