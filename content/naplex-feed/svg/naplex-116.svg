<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 562" width="320" height="562" role="img" aria-label="Adult cardiac arrest, shockable rhythm: CPR and shock, epinephrine 1 mg every 3 to 5 minutes after the second shock, amiodarone 300 mg after the third shock then 150 mg, or lidocaine 1 to 1.5 mg/kg then 0.5 to 0.75 mg/kg." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Adult cardiac arrest, shockable rhythm: CPR and shock, epinephrine 1 mg every 3 to 5 minutes after the second shock, amiodarone 300 mg after the third shock then 150 mg, or lidocaine 1 to 1.5 mg/kg then 0.5 to 0.75 mg/kg.</title><defs><linearGradient id="n116g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n116s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n116c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n116c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n116g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">EMERGENCY</tspan></text><rect x="227.0" y="15" width="71.0" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="262.5" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">AHA 2025</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Pulseless VF/pVT: drug</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">sequence</tspan></text><clipPath id="n116c2"><rect x="4" y="115" width="312" height="86.0" rx="13"/></clipPath><rect x="4" y="115" width="312" height="86.0" rx="13" fill="#ffffff" filter="url(#n116s)"/><g clip-path="url(#n116c2)"><rect x="4" y="115" width="5" height="86.0" fill="#475569"/></g><rect x="4.5" y="115.5" width="311" height="85.0" rx="12.5" fill="none" stroke="#dde3ea" stroke-width="1"/><circle cx="30" cy="138" r="10.5" fill="#475569"/><text x="30.0" y="142.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">1</tspan></text><text x="46.0" y="142.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">CPR + shock</tspan></text><text x="20.0" y="166.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Shock about every 2 min; resume CPR right</tspan></text><text x="20.0" y="184.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">away.</tspan></text><path d="M160.0 204.0 L160.0 232.0" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 228.0 L160.0 234.0 L164.5 228.0" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="98.6" y="210.0" width="122.8" height="18" rx="9" fill="#ffffff" stroke="#c9ebe6"/><text x="160.0" y="222.7" font-size="10.5" fill="#0f766e" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">After the 2nd shock</tspan></text><clipPath id="n116c3"><rect x="4" y="237.0" width="312" height="68.5" rx="13"/></clipPath><rect x="4" y="237.0" width="312" height="68.5" rx="13" fill="#ffffff" filter="url(#n116s)"/><g clip-path="url(#n116c3)"><rect x="4" y="237.0" width="5" height="68.5" fill="#e11d48"/></g><rect x="4.5" y="237.5" width="311" height="67.5" rx="12.5" fill="none" stroke="#fbcfd8" stroke-width="1"/><circle cx="30" cy="260.0" r="10.5" fill="#e11d48"/><text x="30.0" y="264.4" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">2</tspan></text><text x="46.0" y="264.6" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Epinephrine 1 mg IV/IO</tspan></text><text x="20.0" y="288.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Repeat every </tspan><tspan font-weight="700">3–5 min</tspan><tspan font-weight="500">.</tspan></text><path d="M160.0 308.5 L160.0 336.5" stroke="#7fc7bf" stroke-width="2" stroke-linecap="round"/><path d="M155.5 332.5 L160.0 338.5 L164.5 332.5" fill="none" stroke="#3fa89d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="67.4" y="314.5" width="185.3" height="18" rx="9" fill="#ffffff" stroke="#c9ebe6"/><text x="160.0" y="327.2" font-size="10.5" fill="#0f766e" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">After the 3rd shock (refractory)</tspan></text><clipPath id="n116c4"><rect x="4" y="341.5" width="312" height="117.5" rx="13"/></clipPath><rect x="4" y="341.5" width="312" height="117.5" rx="13" fill="#ffffff" filter="url(#n116s)"/><g clip-path="url(#n116c4)"><rect x="4" y="341.5" width="5" height="117.5" fill="#5b4bd1"/></g><rect x="4.5" y="342.0" width="311" height="116.5" rx="12.5" fill="none" stroke="#d9d3fb" stroke-width="1"/><circle cx="30" cy="364.5" r="10.5" fill="#5b4bd1"/><text x="30.0" y="368.9" font-size="12.5" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">3</tspan></text><text x="46.0" y="369.1" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Amiodarone or lidocaine</tspan></text><line x1="20" y1="381.5" x2="304" y2="381.5" stroke="#d9d3fb" stroke-width="1"/><text x="20.0" y="398.0" font-size="12" fill="#5b4bd1" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Amiodarone</tspan></text><text x="112.0" y="398.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">300 mg</tspan><tspan font-weight="500">, then </tspan><tspan font-weight="700">150 mg</tspan></text><line x1="20" y1="408.0" x2="304" y2="408.0" stroke="#d9d3fb" stroke-width="1"/><text x="20.0" y="424.5" font-size="12" fill="#5b4bd1" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Lidocaine</tspan></text><text x="112.0" y="424.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">1–1.5 mg/kg, then 0.5–0.75</tspan></text><text x="112.0" y="442.4" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">mg/kg</tspan></text><rect x="4" y="469.0" width="312" height="89.5" rx="13" fill="#fffaeb" stroke="#f6e0b0"/><circle cx="20" cy="488.5" r="3.4" fill="#d97706"/><text x="30.0" y="492.2" font-size="10.5" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="507.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Vasopressin is not in the adult arrest</tspan></text><text x="18.0" y="525.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">algorithm. Asystole/PEA: epinephrine ASAP,</tspan></text><text x="18.0" y="542.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">no shock.</tspan></text></svg>