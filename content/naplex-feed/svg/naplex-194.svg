<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 326" width="420" height="326" role="img" data-layout="ladder"><title>'reasonable probability of serious</title><rect width="420" height="326" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">'reasonable probability of serious</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Pull affected</tspan><tspan x="32.0" dy="22">lots; contact</tspan><tspan x="32.0" dy="22">patients when the</tspan><tspan x="32.0" dy="22">recall reaches</tspan><tspan x="32.0" dy="22">consumer level.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Market withdrawal</tspan><tspan x="32.0" dy="22">isn't a recall: no FDA</tspan><tspan x="32.0" dy="22">violation.</tspan></text></svg>
