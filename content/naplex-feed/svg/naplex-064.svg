<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img" data-layout="contrast"><title>Why is levofloxacin a poor pick</title><rect width="420" height="302" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Why is levofloxacin a poor pick</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Tendinitis/rupture,</tspan><tspan x="28.0" dy="22">peripheral</tspan><tspan x="28.0" dy="22">neuropathy, CNS</tspan><tspan x="28.0" dy="22">effects,</tspan><tspan x="28.0" dy="22">myasthenia</tspan><tspan x="28.0" dy="22">gravis</tspan><tspan x="28.0" dy="22">worsening.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Reserve for</tspan><tspan x="228.0" dy="22">sinusitis,</tspan><tspan x="228.0" dy="22">bronchitis</tspan><tspan x="228.0" dy="22">exacerbation or</tspan><tspan x="228.0" dy="22">uncomplicated</tspan><tspan x="228.0" dy="22">UTI only when no</tspan><tspan x="228.0" dy="22">alternative.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Highest tendon risk: age &gt;60,</tspan><tspan x="20.0" dy="22">corticosteroids, transplant.</tspan></text></svg>
