<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Tendinitis/rupture,</tspan><tspan x="188.0" dy="22">peripheral neuropathy,</tspan><tspan x="188.0" dy="22">CNS effects, myasthenia</tspan><tspan x="188.0" dy="22">gravis worsening.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Reserve for sinusitis,</tspan><tspan x="188.0" dy="22">bronchitis exacerbation</tspan><tspan x="188.0" dy="22">or uncomplicated UTI</tspan><tspan x="188.0" dy="22">only when no</tspan><tspan x="188.0" dy="22">alternative.</tspan></text><rect x="176.0" y="326.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Highest tendon risk: age</tspan><tspan x="188.0" dy="22">&gt;60, corticosteroids,</tspan><tspan x="188.0" dy="22">transplant.</tspan></text></svg>
