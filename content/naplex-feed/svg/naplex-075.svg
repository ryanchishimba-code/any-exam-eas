<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">FDA asked to remove</tspan><tspan x="188.0" dy="22">boxed warnings on</tspan><tspan x="188.0" dy="22">cardiovascular disease,</tspan><tspan x="188.0" dy="22">breast cancer and</tspan><tspan x="188.0" dy="22">probable dementia.</tspan></text><rect x="176.0" y="198.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Women with a uterus need</tspan><tspan x="188.0" dy="22">a progestogen with</tspan><tspan x="188.0" dy="22">systemic estrogen.</tspan></text><rect x="176.0" y="304.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Best benefit-risk when</tspan><tspan x="188.0" dy="22">started under 60 or</tspan><tspan x="188.0" dy="22">within 10 years of</tspan><tspan x="188.0" dy="22">menopause.</tspan></text></svg>
