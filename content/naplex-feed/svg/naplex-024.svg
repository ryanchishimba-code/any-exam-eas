<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 376" width="420" height="376" role="img" data-layout="branch"><title>TC 200, HDL 50, TG 150 mg/dL</title><rect width="420" height="376" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">TC 200, HDL 50, TG 150 mg/dL</text><rect x="48.0" y="48.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">LDL = TC − HDL − TG/5. Non-HDL =</tspan><tspan x="60.0" dy="22">TC − HDL.</tspan></text><circle cx="26" cy="85.0" r="12" fill="#0d7f8c"/><text x="26.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="122.0" x2="210" y2="138.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="140.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">200 − 50 − 30 = 120. Non-HDL =</tspan><tspan x="60.0" dy="22">200 − 50 = 150.</tspan></text><circle cx="26" cy="177.0" r="12" fill="#0d7f8c"/><text x="26.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="214.0" x2="210" y2="230.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="232.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="256.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">2026 guideline prefers</tspan><tspan x="60.0" dy="22">Martin/Hopkins or Sampson/NIH</tspan><tspan x="60.0" dy="22">over Friedewald; Friedewald</tspan><tspan x="60.0" dy="22">fails at TG ≥400.</tspan></text><circle cx="26" cy="291.0" r="12" fill="#0d7f8c"/><text x="26.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
