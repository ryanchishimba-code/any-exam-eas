<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 234" width="420" height="234" role="img" data-layout="contrast"><title>Foundational Knowledge two paths</title><rect width="420" height="234" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Foundational Knowledge two paths</text><rect x="16" y="48" width="188" height="106" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="106" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">LDL = TC − HDL −</tspan><tspan x="28.0" dy="22">TG/5. Non-HDL =</tspan><tspan x="28.0" dy="22">TC − HDL.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">200 − 50 − 30 =</tspan><tspan x="228.0" dy="22">120. Non-HDL =</tspan><tspan x="228.0" dy="22">200 − 50 = 150.</tspan></text><text x="20.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">2026 guideline prefers Martin/Hopkins or</tspan><tspan x="20.0" dy="22">Sampson/NIH over Friedewald; Friedewald</tspan><tspan x="20.0" dy="22">fails at TG ≥400.</tspan></text></svg>
