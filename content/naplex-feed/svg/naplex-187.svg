<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Coworker smells of alcohol</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Coworker smells of alcohol</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Remove the</tspan><tspan x="32.0" dy="22">colleague from</tspan><tspan x="32.0" dy="22">patient care; tell</tspan><tspan x="32.0" dy="22">the supervisor or</tspan><tspan x="32.0" dy="22">pharmacist-in-charge.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Refer to the state's</tspan><tspan x="32.0" dy="22">pharmacist recovery (PRN)</tspan><tspan x="32.0" dy="22">program or board per law.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Covering for a colleague</tspan><tspan x="32.0" dy="22">puts patients at risk.</tspan></text></svg>
