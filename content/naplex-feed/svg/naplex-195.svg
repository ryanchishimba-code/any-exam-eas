<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Biennial</tspan><tspan x="32.0" dy="22">inventory: exact</tspan><tspan x="32.0" dy="22">count for CII;</tspan><tspan x="32.0" dy="22">estimate CIII–V</tspan><tspan x="32.0" dy="22">unless container</tspan><tspan x="32.0" dy="22">&gt;1,000 units.</tspan></text><rect x="20" y="228" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Report theft to the</tspan><tspan x="32.0" dy="22">DEA field office within 1</tspan><tspan x="32.0" dy="22">business day, then file</tspan><tspan x="32.0" dy="22">Form 106.</tspan></text><rect x="20" y="360" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Keep controlled substance</tspan><tspan x="32.0" dy="22">records at least 2 years.</tspan></text></svg>
