<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>Ordering oxycodone, taking</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordering oxycodone, taking</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Biennial</tspan><tspan x="28.0" dy="22">inventory: exact</tspan><tspan x="28.0" dy="22">count for CII;</tspan><tspan x="28.0" dy="22">estimate CIII–V</tspan><tspan x="28.0" dy="22">unless container</tspan><tspan x="28.0" dy="22">&gt;1,000 units.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Report theft to</tspan><tspan x="228.0" dy="22">the DEA field</tspan><tspan x="228.0" dy="22">office within 1</tspan><tspan x="228.0" dy="22">business day,</tspan><tspan x="228.0" dy="22">then file Form</tspan><tspan x="228.0" dy="22">106.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Keep controlled substance records at least</tspan><tspan x="20.0" dy="22">2 years.</tspan></text></svg>
