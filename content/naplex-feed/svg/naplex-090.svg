<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Carbamazepine level dropped three</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Carbamazepine level dropped three</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Carbamazepine</tspan><tspan x="32.0" dy="22">induces its own</tspan><tspan x="32.0" dy="22">metabolism over 3–5</tspan><tspan x="32.0" dy="22">weeks.</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Recheck the level and</tspan><tspan x="32.0" dy="22">titrate; target 4–12</tspan><tspan x="32.0" dy="22">mcg/mL.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. It also induces CYP3A4:</tspan><tspan x="32.0" dy="22">hormonal contraceptives can</tspan><tspan x="32.0" dy="22">fail.</tspan></text></svg>
