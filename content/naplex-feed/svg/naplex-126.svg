<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" width="420" height="276" role="img" aria-labelledby="tnaplex126"><title id="tnaplex126">Empty stomach, plain water, upright 30 minutes.</title><rect width="420" height="276" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Empty stomach, plain water, upright</text><rect x="16" y="44" width="388" height="102" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a" text-anchor="start">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Consider a drug holiday after 5</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">years (oral) or 3 years (IV</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">zoledronic acid) if risk is lower.</text><rect x="16" y="158" width="388" height="102" rx="12" fill="#fdecec"/><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a" text-anchor="start">Not this</text><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Never stop denosumab without a</text><text x="32" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">follow-on drug: rebound vertebral</text><text x="32" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">fractures.</text></svg>
