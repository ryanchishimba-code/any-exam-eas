<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img" data-layout="contrast"><title>New tramadol on top of sertraline</title><rect width="420" height="302" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">New tramadol on top of sertraline</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Hunter criteria:</tspan><tspan x="28.0" dy="22">spontaneous,</tspan><tspan x="28.0" dy="22">inducible or</tspan><tspan x="28.0" dy="22">ocular clonus</tspan><tspan x="28.0" dy="22">with a</tspan><tspan x="28.0" dy="22">serotonergic</tspan><tspan x="28.0" dy="22">drug.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Stop</tspan><tspan x="228.0" dy="22">serotonergic</tspan><tspan x="228.0" dy="22">drugs;</tspan><tspan x="228.0" dy="22">supportive care,</tspan><tspan x="228.0" dy="22">benzodiazepines;</tspan><tspan x="228.0" dy="22">cyproheptadine</tspan><tspan x="228.0" dy="22">if needed.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">NMS: antipsychotic, days of onset,</tspan><tspan x="20.0" dy="22">lead-pipe rigidity, bradyreflexia.</tspan></text></svg>
