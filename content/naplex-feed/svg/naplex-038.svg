<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Make 100 g of 40% ointment from 70%</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Make 100 g of 40% ointment from 70%</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Alligation: parts</tspan><tspan x="32.0" dy="22">of high = 40 − 30 =</tspan><tspan x="32.0" dy="22">10; parts of low = 70</tspan><tspan x="32.0" dy="22">− 40 = 30.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. 10/40 × 100 = 25 g;</tspan><tspan x="32.0" dy="22">30/40 × 100 = 75 g.</tspan><tspan x="32.0" dy="22">Check: 17.5 + 22.5 = 40</tspan><tspan x="32.0" dy="22">g.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Parts come from the</tspan><tspan x="32.0" dy="22">opposite corner of the grid.</tspan></text></svg>
