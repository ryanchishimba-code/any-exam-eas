<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Pregnancy letter categories</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Pregnancy letter categories</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. 8.1 pregnancy, 8.2</tspan><tspan x="32.0" dy="22">lactation, 8.3</tspan><tspan x="32.0" dy="22">reproductive</tspan><tspan x="32.0" dy="22">potential.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Avoid ACEi/ARB,</tspan><tspan x="32.0" dy="22">warfarin, isotretinoin,</tspan><tspan x="32.0" dy="22">valproate in pregnancy;</tspan><tspan x="32.0" dy="22">use labetalol or</tspan><tspan x="32.0" dy="22">nifedipine for BP.</tspan></text><rect x="20" y="338" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. 'Category X' language is</tspan><tspan x="32.0" dy="22">outdated on current labels.</tspan></text></svg>
