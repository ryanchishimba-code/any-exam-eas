<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Medication Use Process two paths</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process two paths</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">8.1 pregnancy,</tspan><tspan x="28.0" dy="22">8.2 lactation,</tspan><tspan x="28.0" dy="22">8.3 reproductive</tspan><tspan x="28.0" dy="22">potential.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Avoid ACEi/ARB,</tspan><tspan x="228.0" dy="22">warfarin,</tspan><tspan x="228.0" dy="22">isotretinoin,</tspan><tspan x="228.0" dy="22">valproate in</tspan><tspan x="228.0" dy="22">pregnancy; use</tspan><tspan x="228.0" dy="22">labetalol or</tspan><tspan x="228.0" dy="22">nifedipine for</tspan><tspan x="228.0" dy="22">BP.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">'Category X' language is outdated on</tspan><tspan x="20.0" dy="22">current labels.</tspan></text></svg>
