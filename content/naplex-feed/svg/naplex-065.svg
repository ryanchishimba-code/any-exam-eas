<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Starting sertraline in a 19-year-old</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Starting sertraline in a 19-year-old</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Boxed warning:</tspan><tspan x="32.0" dy="22">children, adolescents</tspan><tspan x="32.0" dy="22">and young adults</tspan><tspan x="32.0" dy="22">through age 24.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Close follow-up in the</tspan><tspan x="32.0" dy="22">first weeks and after</tspan><tspan x="32.0" dy="22">dose changes; tell family</tspan><tspan x="32.0" dy="22">to watch for agitation or</tspan><tspan x="32.0" dy="22">mood change.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. No increased risk over 24;</tspan><tspan x="32.0" dy="22">reduced at 65+. Don't</tspan><tspan x="32.0" dy="22">withhold needed therapy.</tspan></text></svg>
