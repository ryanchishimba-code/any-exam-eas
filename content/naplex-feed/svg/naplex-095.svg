<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 502" width="320" height="502" role="img" aria-label="Rumack-Matthew nomogram treatment line on a log scale: 150 mcg/mL at 4 hours, halving every 4 hours to about 4.7 at 24 hours. A 4-hour level of 180 is above the line, so start acetylcysteine." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Rumack-Matthew nomogram treatment line on a log scale: 150 mcg/mL at 4 hours, halving every 4 hours to about 4.7 at 24 hours. A 4-hour level of 180 is above the line, so start acetylcysteine.</title><defs><linearGradient id="n95g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n95s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n95c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n95c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n95g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">TOXICOLOGY</tspan></text><rect x="192.9" y="15" width="105.1" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="245.4" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">2023 consensus</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Acetaminophen:</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Rumack-Matthew line</tspan></text><rect x="4" y="115" width="312" height="222" rx="13" fill="#ffffff" stroke="#dde3ea"/><line x1="44" y1="276.0" x2="304" y2="276.0" stroke="#eef2f4"/><text x="39.0" y="280.0" font-size="10.5" fill="#5b7370" text-anchor="end" xml:space="preserve" ><tspan font-weight="600">5</tspan></text><line x1="44" y1="253.0" x2="304" y2="253.0" stroke="#eef2f4"/><text x="39.0" y="257.0" font-size="10.5" fill="#5b7370" text-anchor="end" xml:space="preserve" ><tspan font-weight="600">10</tspan></text><line x1="44" y1="199.5" x2="304" y2="199.5" stroke="#eef2f4"/><text x="39.0" y="203.5" font-size="10.5" fill="#5b7370" text-anchor="end" xml:space="preserve" ><tspan font-weight="600">50</tspan></text><line x1="44" y1="163.0" x2="304" y2="163.0" stroke="#eef2f4"/><text x="39.0" y="167.0" font-size="10.5" fill="#5b7370" text-anchor="end" xml:space="preserve" ><tspan font-weight="600">150</tspan></text><line x1="44" y1="123.0" x2="304" y2="123.0" stroke="#eef2f4"/><text x="39.0" y="127.0" font-size="10.5" fill="#5b7370" text-anchor="end" xml:space="preserve" ><tspan font-weight="600">500</tspan></text><text x="87.3" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">4</tspan></text><text x="130.7" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">8</tspan></text><text x="174.0" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">12</tspan></text><text x="217.3" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">16</tspan></text><text x="260.7" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">20</tspan></text><text x="304.0" y="308.0" font-size="10.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">24</tspan></text><path d="M44 123 L44 293 L304 293" stroke="#9fb9b5" stroke-width="1.5" fill="none"/><path d="M87.3 163.0 L98.2 168.8 L109.0 174.5 L119.8 180.3 L130.7 186.0 L141.5 191.8 L152.3 197.6 L163.2 203.3 L174.0 209.1 L184.8 214.8 L195.7 220.6 L206.5 226.3 L217.3 232.1 L228.2 237.9 L239.0 243.6 L249.8 249.4 L260.7 255.1 L271.5 260.9 L282.3 266.7 L293.2 272.4 L304.0 278.2" stroke="#e11d48" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87.3" cy="156.9" r="5" fill="#0f2f2c" stroke="#fff" stroke-width="2"/><text x="98.2" y="147.4" font-size="11" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Patient: 180 at 4 h</tspan></text><text x="184.8" y="188.3" font-size="11" fill="#e11d48" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Treat above the line</tspan></text><text x="98.2" y="253.0" font-size="11" fill="#059669" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Below the line: no NAC</tspan></text><text x="174.0" y="324.0" font-size="11" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="500">Hours after a single ingestion</tspan></text><text x="14.0" y="123.0" font-size="1" fill="#5b7370" text-anchor="start" xml:space="preserve" ><tspan font-weight="500"></tspan></text><text x="16" y="208.0" font-size="11" fill="#5b7370" text-anchor="middle" font-weight="500" transform="rotate(-90 16 208.0)">APAP level (mcg/mL)</text><clipPath id="n95c2"><rect x="4" y="337" width="312" height="79.5" rx="13"/></clipPath><rect x="4" y="337" width="312" height="79.5" rx="13" fill="#ffffff" filter="url(#n95s)"/><g clip-path="url(#n95c2)"><rect x="4" y="337" width="5" height="79.5" fill="#e11d48"/></g><rect x="4.5" y="337.5" width="311" height="78.5" rx="12.5" fill="none" stroke="#fbcfd8" stroke-width="1"/><text x="20.0" y="357.0" font-size="10" fill="#e11d48" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">AT OR ABOVE THE LINE</tspan></text><text x="20.0" y="379.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Start acetylcysteine</tspan></text><text x="20.0" y="399.9" font-size="12.5" fill="#2b4541" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Most effective within </tspan><tspan font-weight="700">8 h </tspan><tspan font-weight="500">of ingestion.</tspan></text><rect x="4" y="426.5" width="312" height="72.0" rx="13" fill="#fffaeb" stroke="#f6e0b0"/><circle cx="20" cy="446.0" r="3.4" fill="#d97706"/><text x="30.0" y="449.7" font-size="10.5" fill="#d97706" text-anchor="start" xml:space="preserve" letter-spacing="1.2"><tspan font-weight="700">EXAM TRAP</tspan></text><text x="18.0" y="465.4" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">Unknown time or repeated ingestions: the</tspan></text><text x="18.0" y="482.9" font-size="12.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="500">nomogram doesn't apply. Treat.</tspan></text></svg>