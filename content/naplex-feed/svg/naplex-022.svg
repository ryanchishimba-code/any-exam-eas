<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" role="img" aria-labelledby="tnaplex022"><title id="tnaplex022">AG 28; osmolal gap 30: think toxic alcohol.</title><rect width="420" height="170" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">AG 28; osmolal gap 30: think toxic</text><circle cx="36" cy="68" r="14" fill="#0d7f8c"/><text x="36" y="73" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">AG = 140 − 112 = 28. Calc osm =</text><text x="60" y="94" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">280 + 5 + 5 = 290</text><line x1="36" y1="84" x2="36" y2="114" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="128" r="14" fill="#0d7f8c"/><text x="36" y="133" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="60" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">gap = 320 − 290 = 30</text></svg>
