<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Starting semaglutide for weight</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Starting semaglutide for weight</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Nausea, vomiting,</tspan><tspan x="32.0" dy="22">diarrhea,</tspan><tspan x="32.0" dy="22">constipation;</tspan><tspan x="32.0" dy="22">gallbladder disease;</tspan><tspan x="32.0" dy="22">pancreatitis.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Stop and seek care for</tspan><tspan x="32.0" dy="22">severe abdominal pain;</tspan><tspan x="32.0" dy="22">don't combine with a</tspan><tspan x="32.0" dy="22">DPP-4 inhibitor.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Boxed warning: no use with</tspan><tspan x="32.0" dy="22">personal or family MTC or MEN</tspan><tspan x="32.0" dy="22">2.</tspan></text></svg>
