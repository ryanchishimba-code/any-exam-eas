<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 322" width="420" height="322" role="img" data-layout="contrast"><title>Pregnant patient asks for MMR</title><rect width="420" height="322" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Pregnant patient asks for MMR</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Live vaccines</tspan><tspan x="28.0" dy="22">(MMR, varicella,</tspan><tspan x="28.0" dy="22">LAIV):</tspan><tspan x="28.0" dy="22">contraindicated</tspan><tspan x="28.0" dy="22">in pregnancy and</tspan><tspan x="28.0" dy="22">severe</tspan><tspan x="28.0" dy="22">immunosuppression.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Screen before</tspan><tspan x="228.0" dy="22">every dose;</tspan><tspan x="228.0" dy="22">defer for</tspan><tspan x="228.0" dy="22">moderate or</tspan><tspan x="228.0" dy="22">severe illness</tspan><tspan x="228.0" dy="22">only.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Severe allergic reaction to a prior dose</tspan><tspan x="20.0" dy="22">or component is the universal</tspan><tspan x="20.0" dy="22">contraindication.</tspan></text></svg>
