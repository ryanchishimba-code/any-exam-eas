<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 334" width="420" height="334" role="img" data-layout="cycle"><title>Repeat cycle</title><rect width="420" height="334" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Live vaccines (MMR, varicella, LAIV):</tspan><tspan x="24.0" dy="22">contraindicated in pregnancy and severe</tspan><tspan x="24.0" dy="22">immunosuppression.</tspan></text><text x="24.0" y="202.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Screen before every dose; defer for</tspan><tspan x="24.0" dy="22">moderate or severe illness only.</tspan></text><text x="24.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Severe allergic reaction to a prior dose</tspan><tspan x="24.0" dy="22">or component is the universal</tspan><tspan x="24.0" dy="22">contraindication.</tspan></text></svg>
