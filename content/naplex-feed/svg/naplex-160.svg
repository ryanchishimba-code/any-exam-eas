<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Schizophrenia failed two</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schizophrenia failed two</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. The clozapine REMS</tspan><tspan x="32.0" dy="22">ended in 2025; ANC</tspan><tspan x="32.0" dy="22">monitoring per</tspan><tspan x="32.0" dy="22">labeling still</tspan><tspan x="32.0" dy="22">applies.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Watch myocarditis,</tspan><tspan x="32.0" dy="22">constipation/ileus and</tspan><tspan x="32.0" dy="22">seizures; metabolic</tspan><tspan x="32.0" dy="22">monitoring for all SGAs.</tspan></text><rect x="20" y="338" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Nonadherence: offer a</tspan><tspan x="32.0" dy="22">long-acting injectable.</tspan></text></svg>
