<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img" data-layout="contrast"><title>Foundational Knowledge two paths</title><rect width="420" height="236" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Foundational Knowledge two paths</text><rect x="16" y="48" width="188" height="128" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="128" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">0.9% = 9 g/L;</tspan><tspan x="28.0" dy="22">NaCl dissociates</tspan><tspan x="28.0" dy="22">into 2</tspan><tspan x="28.0" dy="22">particles.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">9 ÷ 58.5 = 0.154</tspan><tspan x="228.0" dy="22">mol/L × 2 = 308</tspan><tspan x="228.0" dy="22">mOsm/L.</tspan></text><text x="20.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Peripheral PN: keep osmolarity ≤900</tspan><tspan x="20.0" dy="22">mOsm/L.</tspan></text></svg>
