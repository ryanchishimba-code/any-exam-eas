<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 422" width="420" height="422" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="422" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Avoid non-DHP CCBs in</tspan><tspan x="188.0" dy="22">HFrEF.</tspan></text><rect x="176.0" y="132.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Flecainide or</tspan><tspan x="188.0" dy="22">propafenone only without</tspan><tspan x="188.0" dy="22">structural heart</tspan><tspan x="188.0" dy="22">disease; add an AV nodal</tspan><tspan x="188.0" dy="22">blocker.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">HFrEF rhythm control:</tspan><tspan x="188.0" dy="22">amiodarone or</tspan><tspan x="188.0" dy="22">dofetilide; ablation is</tspan><tspan x="188.0" dy="22">often first-line.</tspan></text></svg>
