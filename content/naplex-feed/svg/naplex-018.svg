<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>70-year-old man, 5'10", 80 kg, SCr</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">70-year-old man, 5'10", 80 kg, SCr</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. IBW = 50 + 2.3 ×</tspan><tspan x="32.0" dy="22">10 = 73 kg (actual is</tspan><tspan x="32.0" dy="22">within 120%, use</tspan><tspan x="32.0" dy="22">IBW).</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. (140 − 70) × 73 ÷ (72</tspan><tspan x="32.0" dy="22">× 1.2) = 5110 ÷ 86.4 =</tspan><tspan x="32.0" dy="22">59.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Women: multiply by 0.85.</tspan><tspan x="32.0" dy="22">Obese (&gt;120% IBW): use</tspan><tspan x="32.0" dy="22">adjusted weight.</tspan></text></svg>
