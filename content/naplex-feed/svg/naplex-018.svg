<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 152" width="420" height="152" role="img" aria-labelledby="tnaplex018"><title id="tnaplex018">CrCl ≈ 59 mL/min.</title><rect width="420" height="152" fill="#ffffff"/><rect x="16" y="16" width="388" height="8" rx="4" fill="#0d7f8c"/><text x="24" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f2e42" text-anchor="start">CrCl ≈ 59 mL/min.</text><text x="24" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">IBW = 50 + 2.3 × 10 = 73 kg (actual</text><text x="24" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">is within 120%, use IBW).</text></svg>
