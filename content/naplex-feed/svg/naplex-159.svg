<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 228" width="420" height="228" role="img" data-layout="threshold"><title>Bipolar patient on valproate</title><rect width="420" height="228" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Bipolar patient on valproate</text><line x1="28" y1="92" x2="392" y2="92" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><line x1="78" y1="82" x2="78" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="78.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">25 mg</tspan></text><line x1="210" y1="82" x2="210" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="210.0" dy="0">50 mg</tspan></text><line x1="342" y1="82" x2="342" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="342.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">0.6–1.0</tspan><tspan x="342.0" dy="22">mEq</tspan></text><text x="20.0" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Any rash on lamotrigine: stop and seek care</tspan><tspan x="20.0" dy="22">(SJS risk).</tspan></text></svg>
