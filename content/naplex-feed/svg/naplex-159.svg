<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" width="420" height="232" role="img" data-layout="trend"><title>Lab trend</title><rect width="420" height="232" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Lab trend</text><line x1="48" y1="150" x2="360" y2="150" stroke="#d5e2e4" stroke-width="2"/><line x1="48" y1="56" x2="48" y2="150" stroke="#d5e2e4" stroke-width="2"/><text x="86.0" y="118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle">25 mg</text><circle cx="86" cy="130" r="5" fill="#0d7f8c"/><text x="206.0" y="88.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle">50 mg</text><circle cx="206" cy="100" r="5" fill="#0d7f8c"/><text x="326.0" y="58.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle">0.6–1.0 mEq</text><circle cx="326" cy="70" r="5" fill="#0d7f8c"/><path d="M 86 130 L 206 100 L 326 70" fill="none" stroke="#0d7f8c" stroke-width="2.5"/><text x="20.0" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Usual start: 25 mg daily for 2 weeks, then 50</tspan><tspan x="20.0" dy="22">mg daily for 2 weeks.</tspan></text></svg>
