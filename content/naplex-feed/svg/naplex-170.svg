<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Also avoid</tspan><tspan x="32.0" dy="22">haloperidol and</tspan><tspan x="32.0" dy="22">prochlorperazine;</tspan><tspan x="32.0" dy="22">psychosis: quetiapine</tspan><tspan x="32.0" dy="22">or pimavanserin.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Carbidopa/levodopa is</tspan><tspan x="32.0" dy="22">most effective; dopamine</tspan><tspan x="32.0" dy="22">agonists can cause</tspan><tspan x="32.0" dy="22">impulse control</tspan><tspan x="32.0" dy="22">disorders.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. MAO-B inhibitors interact</tspan><tspan x="32.0" dy="22">with meperidine and other</tspan><tspan x="32.0" dy="22">serotonergic drugs.</tspan></text></svg>
