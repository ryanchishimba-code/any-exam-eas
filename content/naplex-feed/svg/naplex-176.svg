<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 228" width="420" height="228" role="img" data-layout="threshold"><title>2-year-old, 12 kg, acute otitis</title><rect width="420" height="228" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">2-year-old, 12 kg, acute otitis</text><line x1="28" y1="92" x2="392" y2="92" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><line x1="78" y1="82" x2="78" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="78.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">80–90 mg</tspan></text><line x1="166" y1="82" x2="166" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="166.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="166.0" dy="0">1080 mg</tspan></text><line x1="254" y1="82" x2="254" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="254.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="254.0" dy="0">540 mg</tspan></text><line x1="342" y1="82" x2="342" y2="102" stroke="#0d7f8c" stroke-width="3"/><text x="342.0" y="122.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">15 mg</tspan></text><text x="20.0" y="168.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">12 kg × 90 = 1080 mg/day → 540 mg BID.</tspan><tspan x="20.0" dy="22">Amox/clav if amoxicillin in past 30 days.</tspan></text></svg>
