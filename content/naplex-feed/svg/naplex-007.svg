<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" data-layout="branch"><title>Post-PCI patient is a CYP2C19 poor</title><rect width="420" height="420" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Post-PCI patient is a CYP2C19 poor</text><rect x="48.0" y="48.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Clopidogrel is a prodrug</tspan><tspan x="60.0" dy="22">activated by CYP2C19; *2/*3 are</tspan><tspan x="60.0" dy="22">loss-of-function.</tspan></text><circle cx="26" cy="96.0" r="12" fill="#0d7f8c"/><text x="26.0" y="101.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="144.0" x2="210" y2="160.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="162.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="186.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">CPIC 2022 for ACS/PCI: poor or</tspan><tspan x="60.0" dy="22">intermediate metabolizers get</tspan><tspan x="60.0" dy="22">prasugrel or ticagrelor if no</tspan><tspan x="60.0" dy="22">contraindication.</tspan></text><circle cx="26" cy="221.0" r="12" fill="#0d7f8c"/><text x="26.0" y="226.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="280.0" x2="210" y2="296.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="298.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Clopidogrel's boxed warning</tspan><tspan x="60.0" dy="22">(2010): diminished effect in</tspan><tspan x="60.0" dy="22">poor metabolizers.</tspan></text><circle cx="26" cy="346.0" r="12" fill="#0d7f8c"/><text x="26.0" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
