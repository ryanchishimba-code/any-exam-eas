<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>CKD patient on lisinopril</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">CKD patient on lisinopril</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">ACEi/ARB, MRA,</tspan><tspan x="28.0" dy="22">TMP-SMX, NSAIDs,</tspan><tspan x="28.0" dy="22">potassium</tspan><tspan x="28.0" dy="22">supplements all</tspan><tspan x="28.0" dy="22">raise K.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Check potassium</tspan><tspan x="228.0" dy="22">and creatinine;</tspan><tspan x="228.0" dy="22">manage high K</tspan><tspan x="228.0" dy="22">with diet,</tspan><tspan x="228.0" dy="22">diuretics or</tspan><tspan x="228.0" dy="22">binders.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">KDIGO: treat the potassium first instead</tspan><tspan x="20.0" dy="22">of reflexively stopping the RAS inhibitor.</tspan></text></svg>
