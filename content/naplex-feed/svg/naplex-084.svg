<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 422" width="420" height="422" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="422" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><path d="M80 70 C120 60 150 90 140 130 C130 160 90 160 80 130 C70 110 60 90 80 70 Z" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">ACEi/ARB, MRA, TMP-SMX,</tspan><tspan x="188.0" dy="22">NSAIDs, potassium</tspan><tspan x="188.0" dy="22">supplements all raise K.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Check potassium and</tspan><tspan x="188.0" dy="22">creatinine; manage high</tspan><tspan x="188.0" dy="22">K with diet, diuretics</tspan><tspan x="188.0" dy="22">or binders.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">KDIGO: treat the</tspan><tspan x="188.0" dy="22">potassium first instead</tspan><tspan x="188.0" dy="22">of reflexively stopping</tspan><tspan x="188.0" dy="22">the RAS inhibitor.</tspan></text></svg>
