<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 476" width="320" height="476" role="img" aria-label="Chronic hyponatremia correction limits: usual 10 to 12 mEq/L per 24 hours; 8 or less in high osmotic demyelination risk (sodium 105 or less, alcohol use disorder, malnutrition, hypokalemia, liver disease). Severe symptoms: 3 percent saline 100 mL bolus. Overcorrection: D5W with or without desmopressin." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><title>Chronic hyponatremia correction limits: usual 10 to 12 mEq/L per 24 hours; 8 or less in high osmotic demyelination risk (sodium 105 or less, alcohol use disorder, malnutrition, hypokalemia, liver disease). Severe symptoms: 3 percent saline 100 mL bolus. Overcorrection: D5W with or without desmopressin.</title><defs><linearGradient id="n154g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b5e57"/><stop offset=".55" stop-color="#0d8277"/><stop offset="1" stop-color="#14a79a"/></linearGradient><filter id="n154s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#0f3d3a" flood-opacity=".10"/></filter></defs><clipPath id="n154c1"><rect x="4" y="0" width="312" height="101" rx="18"/></clipPath><g clip-path="url(#n154c1)"><rect x="4" y="0" width="312" height="101" fill="url(#n154g)"/><circle cx="302" cy="-8" r="78" fill="#ffffff" opacity=".07"/><circle cx="246" cy="109" r="56" fill="#ffffff" opacity=".05"/></g><text x="22.0" y="29.0" font-size="10.5" fill="#99f6e4" text-anchor="start" xml:space="preserve" letter-spacing="1.3"><tspan font-weight="700">RENAL</tspan></text><rect x="206.1" y="15" width="91.9" height="19" rx="9.5" fill="#ffffff" fill-opacity=".16"/><text x="252.0" y="28.3" font-size="10.5" fill="#ffffff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">US panel 2013</tspan></text><text x="22.0" y="56.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">Hyponatremia: how fast to</tspan></text><text x="22.0" y="78.0" font-size="17" fill="#ffffff" text-anchor="start" xml:space="preserve" letter-spacing="-.2"><tspan font-weight="700">correct</tspan></text><text x="6.0" y="129.0" font-size="10" fill="#0d9488" text-anchor="start" xml:space="preserve" letter-spacing="1"><tspan font-weight="700">MAX RISE IN SERUM NA PER 24 H</tspan></text><rect x="4.0" y="139" width="156.0" height="22" fill="#e11d48" rx="11"/><rect x="16.0" y="139" width="144.0" height="22" fill="#e11d48"/><text x="82.0" y="154.2" font-size="12" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">≤8 mEq/L</tspan></text><text x="82.0" y="176.0" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">High ODS risk</tspan></text><rect x="160.0" y="139" width="156.0" height="22" fill="#d97706" rx="11"/><rect x="160.0" y="139" width="144.0" height="22" fill="#d97706"/><text x="238.0" y="154.2" font-size="12" fill="#fff" text-anchor="middle" xml:space="preserve" ><tspan font-weight="700">10–12 mEq/L</tspan></text><text x="238.0" y="176.0" font-size="11.5" fill="#5b7370" text-anchor="middle" xml:space="preserve" ><tspan font-weight="600">Usual limit</tspan></text><clipPath id="n154c2"><rect x="4" y="183" width="312" height="119.5" rx="13"/></clipPath><rect x="4" y="183" width="312" height="119.5" rx="13" fill="#ffffff" filter="url(#n154s)"/><g clip-path="url(#n154c2)"><rect x="4" y="183" width="5" height="119.5" fill="#e11d48"/></g><rect x="4.5" y="183.5" width="311" height="118.5" rx="12.5" fill="none" stroke="#fbcfd8" stroke-width="1"/><text x="20.0" y="203.0" font-size="10" fill="#e11d48" text-anchor="start" xml:space="preserve" letter-spacing="1.1"><tspan font-weight="700">HIGH ODS RISK</tspan></text><text x="20.0" y="225.5" font-size="13.5" fill="#0f2f2c" text-anchor="start" xml:space="preserve" ><tspan font-weight="700">Stay ≤8 mEq/L 