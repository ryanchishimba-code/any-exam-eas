<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 392" width="420" height="392" role="img" data-layout="ladder"><title>1,000 mL over 8 hours with a 15</title><rect width="420" height="392" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">1,000 mL over 8 hours with a 15</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Rate = volume ÷</tspan><tspan x="32.0" dy="22">time; gtt/min = mL/h</tspan><tspan x="32.0" dy="22">× drop factor ÷ 60.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. 1,000 ÷ 8 = 125 mL/h;</tspan><tspan x="32.0" dy="22">125 × 15 ÷ 60 = 31.25 →</tspan><tspan x="32.0" dy="22">31 gtt/min.</tspan></text><rect x="20" y="272" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Microdrip sets are 60</tspan><tspan x="32.0" dy="22">gtt/mL: then gtt/min equals</tspan><tspan x="32.0" dy="22">mL/h.</tspan></text></svg>
