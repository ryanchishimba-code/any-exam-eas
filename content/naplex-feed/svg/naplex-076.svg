<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" data-layout="branch"><title>Decision flow</title><rect width="420" height="420" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Decision flow</text><rect x="48.0" y="48.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">IPLEDGE: isotretinoin pregnancy</tspan><tspan x="60.0" dy="22">testing and contraception. TIRF</tspan><tspan x="60.0" dy="22">REMS: products discontinued</tspan><tspan x="60.0" dy="22">2024, no new enrollments.</tspan></text><circle cx="26" cy="107.0" r="12" fill="#0d7f8c"/><text x="26.0" y="112.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="166.0" x2="210" y2="182.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="184.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Check the FDA REMS database for</tspan><tspan x="60.0" dy="22">the current list before</tspan><tspan x="60.0" dy="22">dispensing.</tspan></text><circle cx="26" cy="232.0" r="12" fill="#0d7f8c"/><text x="26.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="280.0" x2="210" y2="296.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="298.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Mycophenolate is still</tspan><tspan x="60.0" dy="22">teratogenic: label counseling</tspan><tspan x="60.0" dy="22">continues without the REMS.</tspan></text><circle cx="26" cy="346.0" r="12" fill="#0d7f8c"/><text x="26.0" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
