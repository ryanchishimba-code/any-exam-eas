<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 334" width="420" height="334" role="img" data-layout="cycle"><title>Repeat cycle</title><rect width="420" height="334" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">CDC factor: oxycodone 1.5. 30 × 4 = 120</tspan><tspan x="24.0" dy="22">mg/day.</tspan></text><text x="24.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">120 × 1.5 = 180 MME. For a switch, reduce</tspan><tspan x="24.0" dy="22">the new opioid 25–50% for incomplete</tspan><tspan x="24.0" dy="22">cross-tolerance.</tspan></text><text x="24.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">CDC: MME factors estimate overdose risk;</tspan><tspan x="24.0" dy="22">they aren't a dosing conversion table.</tspan><tspan x="24.0" dy="22">Methadone is nonlinear.</tspan></text></svg>
