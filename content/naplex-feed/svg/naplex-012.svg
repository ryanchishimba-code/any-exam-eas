<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Comparing mean A1c across three</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Comparing mean A1c across three</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Two independent</tspan><tspan x="32.0" dy="22">means: t-test; paired</tspan><tspan x="32.0" dy="22">before/after: paired</tspan><tspan x="32.0" dy="22">t-test.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Nominal outcomes:</tspan><tspan x="32.0" dy="22">chi-square; ordinal or</tspan><tspan x="32.0" dy="22">skewed: Mann-Whitney (2)</tspan><tspan x="32.0" dy="22">or Kruskal-Wallis (3+).</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Don't run repeated t-tests</tspan><tspan x="32.0" dy="22">across 3+ groups: it inflates</tspan><tspan x="32.0" dy="22">type I error.</tspan></text></svg>
