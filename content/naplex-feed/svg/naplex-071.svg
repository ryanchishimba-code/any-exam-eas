<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Patient fills oxycodone</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Patient fills oxycodone</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Boxed warning on</tspan><tspan x="32.0" dy="22">both opioids and</tspan><tspan x="32.0" dy="22">benzodiazepines since</tspan><tspan x="32.0" dy="22">2016.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Talk to the prescriber</tspan><tspan x="32.0" dy="22">about avoiding the combo;</tspan><tspan x="32.0" dy="22">lowest doses; offer</tspan><tspan x="32.0" dy="22">naloxone.</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. CDC 2022: use particular</tspan><tspan x="32.0" dy="22">caution co-prescribing;</tspan><tspan x="32.0" dy="22">consider tapering benzo when</tspan><tspan x="32.0" dy="22">safe.</tspan></text></svg>
