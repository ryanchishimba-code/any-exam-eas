<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img" data-layout="contrast"><title>Medication Use Process two paths</title><rect width="420" height="302" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process two paths</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Also: Zoloft</tspan><tspan x="28.0" dy="22">sertraline,</tspan><tspan x="28.0" dy="22">Keppra</tspan><tspan x="28.0" dy="22">levetiracetam,</tspan><tspan x="28.0" dy="22">Adderall mixed</tspan><tspan x="28.0" dy="22">amphetamine</tspan><tspan x="28.0" dy="22">salts.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Verify</tspan><tspan x="228.0" dy="22">indication on</tspan><tspan x="228.0" dy="22">psych scripts to</tspan><tspan x="228.0" dy="22">catch name</tspan><tspan x="228.0" dy="22">mix-ups.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Lamictal (lamotrigine) vs Lamisil</tspan><tspan x="20.0" dy="22">(terbinafine) is a classic mix-up.</tspan></text></svg>
