<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Medication Use Process two paths</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process two paths</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">High-alert:</tspan><tspan x="28.0" dy="22">insulin,</tspan><tspan x="28.0" dy="22">opioids,</tspan><tspan x="28.0" dy="22">concentrated</tspan><tspan x="28.0" dy="22">potassium,</tspan><tspan x="28.0" dy="22">anticoagulants,</tspan><tspan x="28.0" dy="22">oral</tspan><tspan x="28.0" dy="22">methotrexate.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Verify</tspan><tspan x="228.0" dy="22">indication and</tspan><tspan x="228.0" dy="22">weekly schedule;</tspan><tspan x="228.0" dy="22">default systems</tspan><tspan x="228.0" dy="22">to weekly;</tspan><tspan x="228.0" dy="22">counsel with the</tspan><tspan x="228.0" dy="22">day of the week.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">High-alert doesn't mean errors are more</tspan><tspan x="20.0" dy="22">common; harm is worse when they happen.</tspan></text></svg>
