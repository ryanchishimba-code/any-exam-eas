<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 502" width="420" height="502" role="img" data-layout="ladder"><title>Oral methotrexate is prescribed</title><rect width="420" height="502" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Oral methotrexate is prescribed</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. High-alert:</tspan><tspan x="32.0" dy="22">insulin, opioids,</tspan><tspan x="32.0" dy="22">concentrated</tspan><tspan x="32.0" dy="22">potassium,</tspan><tspan x="32.0" dy="22">anticoagulants, oral</tspan><tspan x="32.0" dy="22">methotrexate.</tspan></text><rect x="20" y="228" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Verify indication and</tspan><tspan x="32.0" dy="22">weekly schedule; default</tspan><tspan x="32.0" dy="22">systems to weekly;</tspan><tspan x="32.0" dy="22">counsel with the day of</tspan><tspan x="32.0" dy="22">the week.</tspan></text><rect x="20" y="382" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="404.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. High-alert doesn't mean</tspan><tspan x="32.0" dy="22">errors are more common; harm</tspan><tspan x="32.0" dy="22">is worse when they happen.</tspan></text></svg>
