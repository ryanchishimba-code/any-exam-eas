<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><ellipse cx="92" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><ellipse cx="132" cy="110" rx="22" ry="36" fill="#fde8d8" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">GLP-1 RA:</tspan><tspan x="188.0" dy="22">contraindicated with</tspan><tspan x="188.0" dy="22">personal or family MTC</tspan><tspan x="188.0" dy="22">or MEN 2.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Screen family history</tspan><tspan x="188.0" dy="22">before GLP-1 RA; counsel</tspan><tspan x="188.0" dy="22">neck lump, hoarseness,</tspan><tspan x="188.0" dy="22">dysphagia.</tspan></text><rect x="176.0" y="304.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Exenatide twice daily</tspan><tspan x="188.0" dy="22">(Byetta) and</tspan><tspan x="188.0" dy="22">lixisenatide lack this</tspan><tspan x="188.0" dy="22">boxed warning.</tspan></text></svg>
