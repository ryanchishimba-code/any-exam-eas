<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" data-layout="timeline"><title>NSTEMI going to PCI. Which P2Y12</title><rect width="420" height="282" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">NSTEMI going to PCI. Which P2Y12</text><line x1="36" y1="78" x2="384" y2="78" stroke="#0f2e42" stroke-width="3" stroke-linecap="round"/><circle cx="78" cy="78" r="7" fill="#0d7f8c"/><text x="78.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="78.0" dy="0">12 months</tspan></text><circle cx="342" cy="78" r="7" fill="#0d7f8c"/><text x="342.0" y="102.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f2e42" text-anchor="middle"><tspan x="342.0" dy="0">1 month</tspan></text><text x="20.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">DAPT usually 12 months; selected patients can</tspan><tspan x="20.0" dy="22">drop aspirin after 1 month on ticagrelor.</tspan></text><text x="20.0" y="204.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Prasugrel: contraindicated after stroke or</tspan><tspan x="20.0" dy="22">TIA; generally avoid ≥75; &lt;60 kg consider 5 mg</tspan><tspan x="20.0" dy="22">daily.</tspan></text></svg>
