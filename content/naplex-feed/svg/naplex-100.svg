<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Also avoid PPIs</tspan><tspan x="32.0" dy="22">beyond 8 weeks</tspan><tspan x="32.0" dy="22">without a clear</tspan><tspan x="32.0" dy="22">reason; avoid aspirin</tspan><tspan x="32.0" dy="22">for primary</tspan><tspan x="32.0" dy="22">prevention.</tspan></text><rect x="20" y="228" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Prefer apixaban; avoid</tspan><tspan x="32.0" dy="22">starting warfarin and</tspan><tspan x="32.0" dy="22">long-term rivaroxaban for</tspan><tspan x="32.0" dy="22">AF/VTE.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. If a sulfonylurea is used,</tspan><tspan x="32.0" dy="22">choose short-acting</tspan><tspan x="32.0" dy="22">(glipizide), not glyburide.</tspan></text></svg>
