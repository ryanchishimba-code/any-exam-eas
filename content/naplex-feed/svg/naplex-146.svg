<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 262" width="420" height="262" role="img"><title>Named pieces</title><rect width="420" height="262" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Name the pieces</text><rect x="20" y="52" width="172" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="106.0" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Also: meropenem</text><rect x="202" y="52" width="103" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="253.5" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Imipenem</text><rect x="20" y="102" width="133" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="86.5" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Ceftazidime</text><rect x="163" y="102" width="113" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="219.5" y="128" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Aztreonam</text><rect x="20" y="152" width="202" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="121.0" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Cipro/levofloxacin</text><rect x="20" y="202" width="172" height="40" rx="20" fill="#f4f8f8" stroke="#0d7f8c"/><text x="106.0" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="middle">Aminoglycosides</text></svg>
