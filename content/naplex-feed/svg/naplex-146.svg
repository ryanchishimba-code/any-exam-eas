<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><ellipse cx="88" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><ellipse cx="132" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="140.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Also: meropenem,</tspan><tspan x="188.0" dy="22">imipenem, ceftazidime,</tspan><tspan x="188.0" dy="22">aztreonam,</tspan><tspan x="188.0" dy="22">cipro/levofloxacin,</tspan><tspan x="188.0" dy="22">aminoglycosides.</tspan></text><rect x="176.0" y="198.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="222.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">MRSA: vancomycin,</tspan><tspan x="188.0" dy="22">linezolid, daptomycin,</tspan><tspan x="188.0" dy="22">ceftaroline, TMP-SMX,</tspan><tspan x="188.0" dy="22">doxycycline.</tspan></text><rect x="176.0" y="326.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="350.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Daptomycin fails in</tspan><tspan x="188.0" dy="22">pneumonia: surfactant</tspan><tspan x="188.0" dy="22">inactivates it.</tspan></text></svg>
