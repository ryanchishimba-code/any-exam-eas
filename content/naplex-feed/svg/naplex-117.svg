<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>PAD with claudication and HFrEF</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">PAD with claudication and HFrEF</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Single</tspan><tspan x="32.0" dy="22">antiplatelet (aspirin</tspan><tspan x="32.0" dy="22">or clopidogrel) for</tspan><tspan x="32.0" dy="22">symptomatic PAD.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Consider rivaroxaban</tspan><tspan x="32.0" dy="22">2.5 mg BID plus aspirin;</tspan><tspan x="32.0" dy="22">high-intensity statin;</tspan><tspan x="32.0" dy="22">supervised exercise.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Cilostazol boxed warning</tspan><tspan x="32.0" dy="22">covers HF of any severity.</tspan></text></svg>
