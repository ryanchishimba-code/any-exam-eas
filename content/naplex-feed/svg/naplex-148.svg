<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 378" width="420" height="378" role="img" data-layout="anatomy"><title>Schematic</title><rect width="420" height="378" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Schematic</text><rect x="96" y="62" width="28" height="100" rx="14" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="62" r="16" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="162" r="16" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">After response, step</tspan><tspan x="188.0" dy="22">down to the lowest</tspan><tspan x="188.0" dy="22">effective dose or stop.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Long-term risks: C.</tspan><tspan x="188.0" dy="22">difficile, fractures,</tspan><tspan x="188.0" dy="22">low B12 and magnesium.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Don't stop abruptly</tspan><tspan x="188.0" dy="22">after long use: taper to</tspan><tspan x="188.0" dy="22">limit rebound acid.</tspan></text></svg>
