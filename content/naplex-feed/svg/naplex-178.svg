<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. High GI risk</tspan><tspan x="32.0" dy="22">alone: celecoxib plus</tspan><tspan x="32.0" dy="22">a PPI. High CV risk</tspan><tspan x="32.0" dy="22">alone: naproxen plus</tspan><tspan x="32.0" dy="22">PPI if GI risk.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Acetaminophen max 4</tspan><tspan x="32.0" dy="22">g/day; lower (e.g., 3 g)</tspan><tspan x="32.0" dy="22">with liver disease or</tspan><tspan x="32.0" dy="22">heavy alcohol use.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Check OTC combination</tspan><tspan x="32.0" dy="22">products for hidden</tspan><tspan x="32.0" dy="22">acetaminophen.</tspan></text></svg>
