<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>COPD with frequent exacerbations</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">COPD with frequent exacerbations</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Most symptomatic</tspan><tspan x="32.0" dy="22">patients start on</tspan><tspan x="32.0" dy="22">LAMA/LABA.</tspan></text><rect x="20" y="162" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Add ICS when</tspan><tspan x="32.0" dy="22">eosinophils ≥300; on</tspan><tspan x="32.0" dy="22">triple with eos ≥300 and</tspan><tspan x="32.0" dy="22">chronic bronchitis,</tspan><tspan x="32.0" dy="22">consider dupilumab.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. LABA/ICS without a LAMA</tspan><tspan x="32.0" dy="22">isn't encouraged in COPD.</tspan></text></svg>
