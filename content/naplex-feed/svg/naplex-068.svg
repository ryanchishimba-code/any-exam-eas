<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Starting amiodarone</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Starting amiodarone</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Baseline and every</tspan><tspan x="32.0" dy="22">6 months: TFTs and</tspan><tspan x="32.0" dy="22">LFTs; baseline chest</tspan><tspan x="32.0" dy="22">X-ray, PFTs and eye</tspan><tspan x="32.0" dy="22">exam.</tspan></text><rect x="20" y="206" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Cut warfarin dose by</tspan><tspan x="32.0" dy="22">one-third to one-half and</tspan><tspan x="32.0" dy="22">digoxin by half.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Effects build for weeks:</tspan><tspan x="32.0" dy="22">interactions persist long</tspan><tspan x="32.0" dy="22">after a dose change.</tspan></text></svg>
