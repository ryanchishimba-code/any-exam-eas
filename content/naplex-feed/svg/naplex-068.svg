<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 422" width="420" height="422" role="img" data-layout="anatomy"><title>Medication Use Process schematic</title><rect width="420" height="422" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medication Use Process schematic</text><ellipse cx="110" cy="110" rx="52" ry="28" fill="#f4f8f8" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="110" r="14" fill="#0d7f8c"/><circle cx="110" cy="110" r="6" fill="#0f2e42"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Baseline and every 6</tspan><tspan x="188.0" dy="22">months: TFTs and LFTs;</tspan><tspan x="188.0" dy="22">baseline chest X-ray,</tspan><tspan x="188.0" dy="22">PFTs and eye exam.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Cut warfarin dose by</tspan><tspan x="188.0" dy="22">one-third to one-half</tspan><tspan x="188.0" dy="22">and digoxin by half.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Effects build for weeks:</tspan><tspan x="188.0" dy="22">interactions persist</tspan><tspan x="188.0" dy="22">long after a dose</tspan><tspan x="188.0" dy="22">change.</tspan></text></svg>
