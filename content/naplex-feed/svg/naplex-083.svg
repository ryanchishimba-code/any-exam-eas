<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 392" width="420" height="392" role="img" data-layout="ladder"><title>Ordered steps</title><rect width="420" height="392" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Raisers: ACEi,</tspan><tspan x="32.0" dy="22">ARBs, thiazides,</tspan><tspan x="32.0" dy="22">NSAIDs, dehydration,</tspan><tspan x="32.0" dy="22">low sodium intake.</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Avoid the combo or</tspan><tspan x="32.0" dy="22">check a level within</tspan><tspan x="32.0" dy="22">about 5 days and adjust.</tspan></text><rect x="20" y="294" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Toxicity: coarse tremor,</tspan><tspan x="32.0" dy="22">confusion, ataxia, vomiting.</tspan></text></svg>
