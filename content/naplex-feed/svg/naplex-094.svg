<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Match the antidote</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Match the antidote</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Also: opioids</tspan><tspan x="28.0" dy="22">naloxone;</tspan><tspan x="28.0" dy="22">digoxin DigiFab;</tspan><tspan x="28.0" dy="22">warfarin vitamin</tspan><tspan x="28.0" dy="22">K plus 4F-PCC.</tspan><tspan x="28.0" dy="22">Andexanet left</tspan><tspan x="28.0" dy="22">the US market in</tspan><tspan x="28.0" dy="22">Dec 2025.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Know which</tspan><tspan x="228.0" dy="22">antidotes must</tspan><tspan x="228.0" dy="22">be stocked for</tspan><tspan x="228.0" dy="22">immediate use in</tspan><tspan x="228.0" dy="22">the ED.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Flumazenil can trigger seizures in chronic</tspan><tspan x="20.0" dy="22">benzodiazepine users.</tspan></text></svg>
