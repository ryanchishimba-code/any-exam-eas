<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Medicare patient</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Medicare patient</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Part B: flu,</tspan><tspan x="32.0" dy="22">pneumococcal, hep B,</tspan><tspan x="32.0" dy="22">COVID vaccines; drugs</tspan><tspan x="32.0" dy="22">given incident to a</tspan><tspan x="32.0" dy="22">physician service.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Part D covers ACIP</tspan><tspan x="32.0" dy="22">vaccines at $0</tspan><tspan x="32.0" dy="22">cost-sharing;</tspan><tspan x="32.0" dy="22">out-of-pocket cap $2,100</tspan><tspan x="32.0" dy="22">in 2026.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. 340B: no duplicate</tspan><tspan x="32.0" dy="22">Medicaid discounts, no</tspan><tspan x="32.0" dy="22">diversion to non-patients.</tspan></text></svg>
