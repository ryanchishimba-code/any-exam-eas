<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Match the toxicity to the protection</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Match the toxicity to the protection</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Doxorubicin</tspan><tspan x="32.0" dy="22">cardiotoxicity rises</tspan><tspan x="32.0" dy="22">with cumulative dose;</tspan><tspan x="32.0" dy="22">check LVEF.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. High-dose MTX:</tspan><tspan x="32.0" dy="22">leucovorin rescue, urine</tspan><tspan x="32.0" dy="22">alkalinization;</tspan><tspan x="32.0" dy="22">glucarpidase for toxic</tspan><tspan x="32.0" dy="22">levels.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Leucovorin rescues</tspan><tspan x="32.0" dy="22">methotrexate, not 5-FU (it</tspan><tspan x="32.0" dy="22">boosts 5-FU).</tspan></text></svg>
