<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 488" width="420" height="488" role="img" data-layout="anatomy"><title>Foundational Knowledge schematic</title><rect width="420" height="488" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Foundational Knowledge schematic</text><ellipse cx="110" cy="110" rx="52" ry="28" fill="#f4f8f8" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="110" r="14" fill="#0d7f8c"/><circle cx="110" cy="110" r="6" fill="#0f2e42"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Dry mouth, constipation,</tspan><tspan x="188.0" dy="22">urinary retention,</tspan><tspan x="188.0" dy="22">blurred vision,</tspan><tspan x="188.0" dy="22">tachycardia, delirium.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="162.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Stop or swap strongly</tspan><tspan x="188.0" dy="22">anticholinergic drugs:</tspan><tspan x="188.0" dy="22">diphenhydramine,</tspan><tspan x="188.0" dy="22">hydroxyzine, oxybutynin,</tspan><tspan x="188.0" dy="22">amitriptyline,</tspan><tspan x="188.0" dy="22">paroxetine.</tspan></text><rect x="176.0" y="348.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Burden is cumulative:</tspan><tspan x="188.0" dy="22">minimize combined</tspan><tspan x="188.0" dy="22">anticholinergics, not</tspan><tspan x="188.0" dy="22">just one drug.</tspan></text></svg>
