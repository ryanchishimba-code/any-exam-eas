<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-labelledby="ronTitle ronDesc">
  <title id="ronTitle">Burn Assessment &#8212; Rule of Nines (Adult)</title>
  <desc id="ronDesc">Adult Rule of Nines with percentages split per body view. Head 4.5 percent per view, each arm 4.5 percent per view, each leg 9 percent per view, anterior trunk 18 percent, posterior trunk 18 percent, perineum 1 percent. Front and back each total 50 percent for a whole-body total of 100 percent.</desc>
  <style>
    .bg      { fill: #ffffff; }
    .ink     { fill: #0f2e42; }
    .teal    { fill: #0d7f8c; }
    .muted   { fill: #4a6a7b; }
    .white   { fill: #ffffff; }
    .panel   { fill: #f2f8f9; }
    .navy    { fill: #0f2e42; }
    .amber   { fill: #fdf5e6; }
    .card    { fill: #ffffff; stroke: #cfe0e5; stroke-width: 1.5; }
    .hair    { stroke: #cfe0e5; stroke-width: 1.5; fill: none; }
    text     { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h1      { font-size: 31px; font-weight: 700; }
    .step    { font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
    .stepno  { font-size: 34px; font-weight: 700; }
    .lead    { font-size: 19px; font-weight: 700; }
    .body    { font-size: 14px; }
    .small   { font-size: 12.5px; }
    .tiny    { font-size: 11.5px; }
    .hdr     { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; }
    .val     { font-size: 15px; font-weight: 700; }
    .footer  { font-size: 15px; font-weight: 600; }

    .bodyfill { fill: #dff0f2; stroke: #0d7f8c; stroke-width: 2; stroke-linejoin: round; }
    .seam   { stroke: #0d7f8c; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .leadl  { stroke: #7fa3b0; stroke-width: 1.2; fill: none; }
    .viewhd { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
    .lbl    { font-size: 13px; font-weight: 700; }
    .pct    { font-size: 16px; font-weight: 700; }
    .total  { font-size: 14px; font-weight: 700; }
  </style>

  <rect class="bg" width="1100" height="760"/>

  <circle class="navy" cx="70" cy="44" r="24"/>
  <text class="pct white" x="70" y="51" text-anchor="middle">9%</text>
  <text class="h1 ink" x="110" y="41">Burn Assessment &#8212; <tspan class="teal">Rule of Nines</tspan> (Adult)</text>
  <text class="body muted" x="112" y="64">Each view carries half of its region. Front and back together total 100%.</text>

  
  <rect class="navy" x="63" y="98" width="224" height="28" rx="5"/>
  <text class="viewhd white" x="175" y="117" text-anchor="middle">ANTERIOR (FRONT)</text>

  <g transform="translate(175 52.1) scale(0.68)">
    <ellipse class="bodyfill" cx="0" cy="176" rx="27" ry="32"/>
    <path class="bodyfill" d="M-8 206 h16 v14 h-16 z"/>
    <path class="bodyfill" d="M0 218 c-30 0 -52 10 -56 22 l-6 74 c-1 14 2 26 6 34 h112 c4 -8 7 -20 6 -34 l-6 -74 c-4 -12 -26 -22 -56 -22 z"/>
    <path class="bodyfill" d="M-56 242 c-14 4 -22 14 -25 28 l-12 76 c-2 12 -1 22 3 30 l14 -2 c2 -10 4 -20 6 -30 l16 -70 z"/>
    <path class="bodyfill" d="M56 242 c14 4 22 14 25 28 l12 76 c2 12 1 22 -3 30 l-14 -2 c-2 -10 -4 -20 -6 -30 l-16 -70 z"/>
    <path class="bodyfill" d="M-50 348 l4 88 c1 30 4 62 8 88 l6 44 h26 l2 -44 c1 -28 2 -60 2 -88 l2 -88 z"/>
    <path class="bodyfill" d="M50 348 l-4 88 c-1 30 -4 62 -8 88 l-6 44 h-26 l-2 -44 c-1 -28 -2 -60 -2 -88 l-2 -88 z"/>
    <line class="seam" x1="-56" y1="242" x2="56" y2="242"/>
    <line class="seam" x1="-54" y1="348" x2="54" y2="348"/>
    
  </g>

  <text class="lbl ink" x="113" y="166" text-anchor="end">HEAD</text>
  <text class="pct teal" x="113" y="184" text-anchor="end">4.5%</text>
  <line class="leadl" x1="117" y1="172" x2="156" y2="172"/>

  <text class="lbl ink" x="113" y="250" text-anchor="end">RIGHT ARM</text>
  <text class="pct teal" x="113" y="268" text-anchor="end">4.5%</text>
  <line class="leadl" x1="117" y1="256" x2="127" y2="256"/>

  <text class="lbl ink" x="113" y="359" text-anchor="end">RIGHT LEG</text>
  <text class="pct teal" x="113" y="377" text-anchor="end">9%</text>
  <line class="leadl" x1="117" y1="365" x2="153" y2="365"/>

  <text class="lbl ink" x="237" y="186">ANTERIOR</text>
  <text class="lbl ink" x="237" y="202">TRUNK</text>
  <text class="pct teal" x="237" y="222">18%</text>
  <line class="leadl" x1="233" y1="211" x2="197" y2="242"/>

  <text class="lbl ink" x="237" y="262">LEFT ARM</text>
  <text class="pct teal" x="237" y="280">4.5%</text>
  <line class="leadl" x1="233" y1="268" x2="223" y2="258"/>

  <text class="lbl ink" x="237" y="369">LEFT LEG</text>
  <text class="pct teal" x="237" y="387">9%</text>
  <line class="leadl" x1="233" y1="375" x2="197" y2="368"/>

  <text class="lbl ink" x="113" y="424" text-anchor="end">PERINEUM</text>
  <text class="pct teal" x="113" y="442" text-anchor="end">1%</text>
  <line class="leadl" x1="117" y1="430" x2="165" y2="285"/>

  <rect class="panel" x="63" y="470" width="224" height="30" rx="5"/>
  <text class="total ink" x="175" y="490" text-anchor="middle">Front total = 50%</text>

  
  <rect class="navy" x="383" y="98" width="224" height="28" rx="5"/>
  <text class="viewhd white" x="495" y="117" text-anchor="middle">POSTERIOR (BACK)</text>

  <g transform="translate(495 52.1) scale(0.68)">
    <ellipse class="bodyfill" cx="0" cy="176" rx="27" ry="32"/>
    <path class="bodyfill" d="M-8 206 h16 v14 h-16 z"/>
    <path class="bodyfill" d="M0 218 c-30 0 -52 10 -56 22 l-6 74 c-1 14 2 26 6 34 h112 c4 -8 7 -20 6 -34 l-6 -74 c-4 -12 -26 -22 -56 -22 z"/>
    <path class="bodyfill" d="M-56 242 c-14 4 -22 14 -25 28 l-12 76 c-2 12 -1 22 3 30 l14 -2 c2 -10 4 -20 6 -30 l16 -70 z"/>
    <path class="bodyfill" d="M56 242 c14 4 22 14 25 28 l12 76 c2 12 1 22 -3 30 l-14 -2 c-2 -10 -4 -20 -6 -30 l-16 -70 z"/>
    <path class="bodyfill" d="M-50 348 l4 88 c1 30 4 62 8 88 l6 44 h26 l2 -44 c1 -28 2 -60 2 -88 l2 -88 z"/>
    <path class="bodyfill" d="M50 348 l-4 88 c-1 30 -4 62 -8 88 l-6 44 h-26 l-2 -44 c-1 -28 -2 -60 -2 -88 l-2 -88 z"/>
    <line class="seam" x1="-56" y1="242" x2="56" y2="242"/>
    <line class="seam" x1="-54" y1="348" x2="54" y2="348"/>
    <line class="seam" x1="0" y1="240" x2="0" y2="348"/>
  </g>

  <text class="lbl ink" x="433" y="166" text-anchor="end">HEAD</text>
  <text class="pct teal" x="433" y="184" text-anchor="end">4.5%</text>
  <line class="leadl" x1="437" y1="172" x2="476" y2="172"/>

  <text class="lbl ink" x="433" y="250" text-anchor="end">LEFT ARM</text>
  <text class="pct teal" x="433" y="268" text-anchor="end">4.5%</text>
  <line class="leadl" x1="437" y1="256" x2="447" y2="256"/>

  <text class="lbl ink" x="433" y="359" text-anchor="end">LEFT LEG</text>
  <text class="pct teal" x="433" y="377" text-anchor="end">9%</text>
  <line class="leadl" x1="437" y1="365" x2="473" y2="365"/>

  <text class="lbl ink" x="557" y="186">POSTERIOR</text>
  <text class="lbl ink" x="557" y="202">TRUNK</text>
  <text class="pct teal" x="557" y="222">18%</text>
  <line class="leadl" x1="553" y1="211" x2="517" y2="242"/>

  <text class="lbl ink" x="557" y="262">RIGHT ARM</text>
  <text class="pct teal" x="557" y="280">4.5%</text>
  <line class="leadl" x1="553" y1="268" x2="543" y2="258"/>

  <text class="lbl ink" x="557" y="369">RIGHT LEG</text>
  <text class="pct teal" x="557" y="387">9%</text>
  <line class="leadl" x1="553" y1="375" x2="517" y2="368"/>


  <rect class="panel" x="383" y="470" width="224" height="30" rx="5"/>
  <text class="total ink" x="495" y="490" text-anchor="middle">Back total = 50%</text>


  <rect class="card" x="680" y="98" width="380" height="238" rx="10"/>
  <rect class="teal" x="680" y="98" width="380" height="30" rx="10"/>
  <rect class="teal" x="680" y="118" width="380" height="10"/>
  <text class="hdr white" x="700" y="118">KEY POINTS</text>
  <text class="body ink" x="700" y="152"><tspan font-weight="700">Halve the region for a single view</tspan> &#8212; the</text>
  <text class="body ink" x="700" y="170">front of one arm is 4.5%, not 9%.</text>
  <text class="body ink" x="700" y="198">Count <tspan font-weight="700">partial-thickness and full-thickness</tspan></text>
  <text class="body ink" x="700" y="216">burns. <tspan font-weight="700" fill="#b3402c">Superficial (first-degree) burns</tspan></text>
  <text class="body ink" x="700" y="234"><tspan font-weight="700" fill="#b3402c">are NOT counted</tspan> toward TBSA.</text>
  <text class="body ink" x="700" y="262">Do not double-count overlapping areas.</text>
  <text class="body ink" x="700" y="290">TBSA drives fluid resuscitation &#8212; an</text>
  <text class="body ink" x="700" y="308">overestimate means over-resuscitation.</text>

  <rect class="panel" x="680" y="354" width="380" height="96" rx="10"/>
  <text class="hdr teal" x="700" y="380">CHECK YOUR MATH</text>
  <text class="small ink" x="700" y="404">Head 9 + arms 18 + legs 36 + trunk 36</text>
  <text class="small ink" x="700" y="422">+ perineum 1 = <tspan font-weight="700">100% whole body</tspan></text>
  <text class="small muted" x="700" y="441">Over 100%? You counted a whole region on one view.</text>

  <rect class="amber" x="680" y="468" width="380" height="152" rx="10"/>
  <rect class="navy" x="680" y="468" width="380" height="30" rx="10"/>
  <rect class="navy" x="680" y="488" width="380" height="10"/>
  <text class="hdr white" x="700" y="488">NOTE</text>
  <text class="body ink" x="700" y="522">The Rule of Nines is for <tspan font-weight="700">ADULTS</tspan>.</text>
  <text class="body ink" x="700" y="546">Children have proportionally larger heads &#8212;</text>
  <text class="body ink" x="700" y="564">use the <tspan font-weight="700">Lund&#8211;Browder chart</tspan> for pediatrics.</text>
  <text class="body ink" x="700" y="592">The <tspan font-weight="700">palm method</tspan> (client&#8217;s palm &#8776; 1%)</text>
  <text class="body ink" x="700" y="610">helps with scattered or irregular burns.</text>

  <rect class="navy" x="0" y="686" width="1100" height="74"/>
  <text class="footer white" x="550" y="730" text-anchor="middle">Study aid &#8212; AnyExam<tspan fill="#5ec8d4">Easy</tspan></text>
</svg>
