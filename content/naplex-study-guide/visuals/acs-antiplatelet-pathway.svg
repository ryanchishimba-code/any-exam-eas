<svg xmlns="http://www.w3.org/2000/svg" width="420" height="406" viewBox="0 0 420 406" role="img" aria-label="ACS antiplatelet therapy">
<title>ACS antiplatelet therapy</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">ACS antiplatelet therapy</text>
<rect x="24" y="70" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Aspirin at presentation.</text>
<rect x="24" y="116" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="138" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Add a P2Y12 inhibitor for NSTE-ACS and for</text>
<text x="36" y="160" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">PCI.</text>
<rect x="24" y="184" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="206" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">High bleeding risk shortens dual therapy.</text>
<text x="36" y="228" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">It does not omit aspirin in the acute</text>
<text x="36" y="250" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">phase.</text>
<rect x="24" y="274" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="296" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">A fibrinolytic is for STEMI only when PCI</text>
<text x="36" y="318" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">cannot happen within 120 minutes (2025 ACS</text>
<text x="36" y="340" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">guideline).</text>
<text x="28" y="372" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">2025 ACC/AHA ACS guideline</text>
</svg>
