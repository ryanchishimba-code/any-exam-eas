<svg xmlns="http://www.w3.org/2000/svg" width="420" height="362" viewBox="0 0 420 362" role="img" aria-label="Asthma steps, GINA 2026">
<title>Asthma steps, GINA 2026</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Asthma steps, GINA 2026</text>
<rect x="24" y="70" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Track 1, age 12 and older: as-needed</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">low-dose ICS-formoterol at steps 1–2.</text>
<rect x="24" y="138" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="160" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Step 3: low-dose maintenance and reliever</text>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">therapy.</text>
<rect x="24" y="206" width="372" height="38" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="228" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Step 4: medium-dose maintenance.</text>
<rect x="24" y="252" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="274" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Step 5: add a LAMA and refer. Never a LABA</text>
<text x="36" y="296" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">without an inhaled corticosteroid.</text>
<text x="28" y="328" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">GINA 2026</text>
</svg>
