<svg xmlns="http://www.w3.org/2000/svg" width="420" height="450" viewBox="0 0 420 450" role="img" aria-label="OTC self-care triage">
<title>OTC self-care triage</title>
<rect width="100%" height="100%" fill="#F6F3EE"/>
<rect width="8" height="100%" fill="#0F766E"/>
<text x="28" y="36" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">OTC self-care triage</text>
<rect x="24" y="70" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="92" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Refer now: chest pain, dyspnea, neurologic</text>
<text x="36" y="114" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">deficit, GI bleeding, pregnancy with pain,</text>
<text x="36" y="136" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">infant under 3 months with fever.</text>
<rect x="24" y="160" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="182" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Self-care is reasonable for a mild, short,</text>
<text x="36" y="204" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">recognizable illness in an otherwise well</text>
<text x="36" y="226" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">adult.</text>
<rect x="24" y="250" width="372" height="60" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="272" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Avoid oral decongestants in young</text>
<text x="36" y="294" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">children.</text>
<rect x="24" y="318" width="372" height="82" rx="8" fill="#FFFFFF" stroke="#E4DDD2"/>
<text x="36" y="340" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">Acetaminophen max is 3 to 4 g/day from all</text>
<text x="36" y="362" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">sources. NSAIDs are avoided in late</text>
<text x="36" y="384" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#1C2830">pregnancy, CKD, and high GI risk.</text>
<text x="28" y="416" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="13" fill="#5C6B73">Self-care and FDA labeling</text>
</svg>
