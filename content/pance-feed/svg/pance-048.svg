span></text><text x="97.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">HRCT: </tspan><tspan font-weight="500">UIP pattern, exclude</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">exposures and CTD</tspan></tspan></text><rect x="18.0" y="373.0" width="43.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PFTs</tspan></tspan></text><text x="97.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">Restrictive: </tspan><tspan font-weight="500">low FVC and TLC,</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">normal ratio</tspan></tspan></text><rect x="18.0" y="415.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="97.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">Nintedanib or pirfenidone;</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">oxygen, rehab, transplant</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">referral</tspan></tspan></text><clipPath id="p48p3"><rect x="2" y="488" width="300" height="140" rx="14"/></clipPath><rect x="2" y="488" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="488" width="5" height="140" fill="#B7410E" clip-path="url(#p48p3)"/><text x="18" y="512" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y=