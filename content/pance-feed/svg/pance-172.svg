<svg width="304" height="454" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 454" role="img" aria-label="Heparin-induced thrombocytopenia: platelet fall of more than 50 percent at days 5 to 10; use the 4Ts score, stop heparin, give a non-heparin anticoagulant." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h172"><defs></defs><clipPath id="h172p1"><rect x="2" y="2" width="300" height="158" rx="14"/></clipPath><rect x="2" y="2" width="300" height="158" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="158" fill="#0B5CAD" clip-path="url(#h172p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><text x="18.0" y="53.0" font-size="12" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="800" fill="#92400E" letter-spacing=".8">MNEMONIC</tspan><tspan> </tspan><tspan font-weight="600">4Ts: Thrombocytopenia,</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="600">Timing, Thrombosis, oTher</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="600">cause</tspan></tspan></text><rect x="18.0" y="96.0" width="135.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fall &gt;50%, day 5–10</tspan></tspan></text><rect x="159.3" y="96.0" width="126.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="166.3" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="166.3" dy="0"><tspan font-weight="700">PF4 immunoassay</tspan></tspan></text><rect x="18.0" y="124.0" width="138.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="139.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HIT clots, not bleeds</tspan></tspan></text><clipPath id="h172p2"><rect x="2" y="168" width="300" height="188" rx="14"/></clipPath><rect x="2" y="168" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="168" width="5" height="188" fill="#0F766E" clip-path="url(#h172p2)"/><text x="18" y="192" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="206.0" width="49.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="221.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Score</tspan></tspan></text><text x="75.4" y="221.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.4" dy="0"><tspan font-weight="700">4Ts </tspan><tspan font-weight="500">before any lab test</tspan></tspan></text><rect x="18.0" y="236.0" width="42.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="251.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stop</tspan></tspan></text><text x="75.4" y="251.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.4" dy="0"><tspan font-weight="700">All heparin, </tspan><tspan font-weight="500">including flushes</tspan></tspan></text><rect x="18.0" y="266.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="281.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="75.4" y="281.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.4" dy="0"><tspan font-weight="700">Argatroban, </tspan><tspan font-weight="500">bivalirudin,</tspan></tspan><tspan x="75.4" dy="17"><tspan font-weight="500">fondaparinux or DOAC</tspan></tspan></text><rect x="18.0" y="308.0" width="35.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="323.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">DIC</tspan></tspan></text><text x="75.4" y="323.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.4" dy="0"><tspan font-weight="700">↓Plt, ↑PT, ↓fibrinogen,</tspan></tspan><tspan x="75.4" dy="17"><tspan font-weight="700">↑D-dimer; </tspan><tspan font-weight="500">treat the cause</tspan></tspan></text><clipPath id="h172p3"><rect x="2" y="364" width="300" height="86" rx="14"/></clipPath><rect x="2" y="364" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="364" width="5" height="86" fill="#B7410E" clip-path="url(#h172p3)"/><text x="18" y="388" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="413.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Low 4Ts score </tspan><tspan font-weight="500">makes HIT unlikely: avoid</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">testing and empiric treatment.</tspan></tspan></text></svg>