 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="177.3" cy="115.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="177.2" cy="110.0" r="22" fill="transparent"/></g><rect x="18.0" y="160.0" width="212.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="175.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Louder with Valsalva or standing</tspan></tspan></text><rect x="18.0" y="188.0" width="112.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="203.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Softer squatting</tspan></tspan></text><clipPath id="s31p2"><rect x="2" y="232" width="300" height="148" rx="14"/></clipPath><rect x="2" y="232" width="300" height="148" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="232" width="5" height="148" fill="#0F766E" clip-path="url(#s31p2)"/><text x="18" y="256" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Drug ladder</tspan></text><rect x="18.0" y="270.0" width="72.0" height="52.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="54.0" y="300.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="54.0" dy="0"><tspan font-weight="700">Beta-blocker</tspan></tspan></text><rect x="104.0" y="270.0" width="80.0" height="52.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="144.0" y="285.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="144.0" dy="0"><tspan font-weight="700">Verapamil</tspan></tspan><tspan x="144.0" dy="15"><tspan font-weight="700">or</tspan></tspan><tspan x="144.0" dy="15"><tspan font-weight="700">diltiazem</tspan></tspan></text><rect x="198.0" y="270.0" width="90.0" height="52.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="243.0" y="285.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="243.0" dy="0"><tspan font-weight="700">Mavacamten</tspan></tspan><tspan x="243.0" dy="15"><tspan font-weight="700">or</tspan></tspan><tspan x="243.0" dy="15"><tspan font-weight="700">disopyramide</tspan></tspan></text><line x1="91.0" y1="296.0" x2="98.2" y2="296.0" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/><polygon points="103.0,296.0 97.6,298.6 97.6,293.4" fill="#0F766E"/><line x1="185.0" y1="296.0" x2="192.2" y2="296.0" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/><polygon points="197.0,296.0 191.6,298.6 191.6,293.4" fill="#0F766E"/><text x="18.0" y="343.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Choose a </tspan><tspan font-weight="700">non-vasodilating </tspan><tspan font-weight="500">beta-blocker;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">add the next step if symptoms persist.</tspan></tspan></text><clipPath id="s31p3"><rect x="2" y="388" width="300" height="124" rx="14"/></clipPath><rect x="2" y="388" width="300" height="124" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="388" width="5" height="124" fill="#B7410E" clip-path="url(#s31p3)"/><text x="18" y="412" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="437.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Avoid what worsens obstruction:</tspan></tspan></text><rect x="18.0" y="448.0" width="90.5" height="22" rx="11" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="