<svg width="304" height="516" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 516" role="img" aria-label="Obstructive hypertrophic cardiomyopathy. Schematic left ventricle with a thick septum narrowing the outflow. The murmur gets louder with Valsalva or standing and softer with squatting. First-line: non-vasodilating beta-blocker, then verapamil or diltiazem, then mavacamten or disopyramide. Avoid vasodilators, digoxin and high-dose diuretics." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s31"><defs><linearGradient id="s31mu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E08F82"/><stop offset="1" stop-color="#B9584F"/></linearGradient></defs><clipPath id="s31p1"><rect x="2" y="2" width="300" height="222" rx="14"/></clipPath><rect x="2" y="2" width="300" height="222" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="222" fill="#0B5CAD" clip-path="url(#s31p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Septal hypertrophy (schematic)</tspan></text><ellipse cx="88.0" cy="92.0" rx="52" ry="46" fill="url(#s31mu)" stroke="#7C2F2B" stroke-width="1.6"/><path d="M84.0,52.0 C88.7,50.3 95.3,55.3 98.0,62.0 C100.7,68.7 100.7,82.0 100.0,92.0 C99.3,102.0 97.0,115.0 94.0,122.0 C91.0,129.0 86.0,135.7 82.0,134.0 C78.0,132.3 72.0,122.3 70.0,112.0 C68.0,101.7 67.7,82.0 70.0,72.0 C72.3,62.0 79.3,53.7 84.0,52.0 Z" fill="#B04A52" stroke="#7C2F2B" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="110.0" cy="94.0" rx="24" ry="30" fill="#F6D9D3" stroke="#9C4B43" stroke-width="1.2"/><path d="M128.0,66.0 C129.7,65.3 133.0,82.0 132.0,86.0 C131.0,90.0 122.7,93.3 122.0,90.0 C121.3,86.7 126.3,66.7 128.0,66.0 Z" fill="#F4E3B0" stroke="#8A5A12" stroke-width="1.2" stroke-linejoin="round" stroke-lin