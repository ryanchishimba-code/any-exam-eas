.8" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="103.8" dy="0"><tspan font-weight="700">Dilated </tspan><tspan font-weight="500">retinal exam</tspan></tspan></text><clipPath id="t149p3"><rect x="2" y="284" width="300" height="104" rx="14"/></clipPath><rect x="2" y="284" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="104" fill="#B7410E" clip-path="url(#t149p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">New flashes or floaters </tspan><tspan font-weight="500">can't be told</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">apart from a retinal tear by symptoms; a</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">dilated peripheral exam is required.</tspan></tspan></text></svg>