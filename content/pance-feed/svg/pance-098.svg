<svg width="304" height="434" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 434" role="img" aria-label="Status epilepticus timeline: stabilize and check glucose, benzodiazepine at 5 minutes, then fosphenytoin, valproate or levetiracetam at 20 to 40 minutes, then anesthetic infusion with EEG." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n98"><defs></defs><clipPath id="n98p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n98p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Define</tspan></text><rect x="18.0" y="40.0" width="108.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≥5 min = status</tspan></tspan></text><rect x="132.3" y="40.0" width="104.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="139.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="139.3" dy="0"><tspan font-weight="700">Check glucose</tspan></tspan></text><rect x="18.0" y="68.0" width="47.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ABCs</tspan></tspan></text><clipPath id="n98p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#n98p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Timeline</tspan></text><rect x="18.0" y="150.0" width="61.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">0–5 min</tspan></tspan></text><text x="104.9" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.9" dy="0"><tspan font-weight="700">ABCs, </tspan><tspan font-weight="500">glucose, IV access</tspan></tspan></text><rect x="18.0" y="180.0" width="69.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">5–20 min</tspan></tspan></text><text x="104.9" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.9" dy="0"><tspan font-weight="700">Lorazepam </tspan><tspan font-weight="500">IV, IM midazolam,</tspan></tspan><tspan x="104.9" dy="17"><tspan font-weight="500">or diazepam</tspan></tspan></text><rect x="18.0" y="222.0" width="78.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">20–40 min</tspan></tspan></text><text x="104.9" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.9" dy="0"><tspan font-weight="700">Fosphenytoin, </tspan><tspan font-weight="500">valproate or</tspan></tspan><tspan x="104.9" dy="17"><tspan font-weight="500">levetiracetam</tspan></tspan></text><rect x="18.0" y="264.0" width="64.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">40+ min</tspan></tspan></text><text x="104.9" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.9" dy="0"><tspan font-weight="700">Anesthetic </tspan><tspan font-weight="500">infusion, EEG</tspan></tspan></text><clipPath id="n98p3"><rect x="2" y="308" width="300" height="122" rx="14"/></clipPath><rect x="2" y="308" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="122" fill="#B7410E" clip-path="url(#n98p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Second-line agents are equal </tspan><tspan font-weight="500">(ESETT):</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">any one, full dose. First unprovoked</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">seizure: medication lowers 2-year</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">recurrence but not long-term remission.</tspan></tspan></text></svg>