<svg width="304" height="615" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 615" role="img" aria-label="Erythema migrans target rash after an Ixodes tick bite, treated clinically without serology using doxycycline for 10 days; a single 200 mg doxycycline dose within 72 hours prevents Lyme after a high-risk bite." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i88"><defs></defs><clipPath id="i88p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#i88p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Skin (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><rect x="30.0" y="52.0" width="246.0" height="100.0" rx="8" fill="#E8C9B5" stroke="#B98C70" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="70" ry="40" fill="#D9826F" stroke="none" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="52" ry="28" fill="#E8C9B5" stroke="none" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="30" ry="16" fill="#D9826F" stroke="none" stroke-width="1"/><circle cx="153.0" cy="102.0" r="4" fill="#7A3B2E" stroke="none" stroke-width="1"/><g class="lb" data-n="1"><line class="ld" x1="203.0" y1="80.0" x2="150.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="203.0" cy="80.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="126" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Erythema migrans</tspan></tspan></text></g><g class="q"><circle cx="145.1" cy="195.8" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M141.9,193.2 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="145.2" cy="201.0" r="1.2" fill="#fff"/></g><circle class="hit" cx="145.1" cy="195.8" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="173.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Northeast, upper Midwest</tspan></tspan></text><rect x="197.3" y="221.0" width="79.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="204.3" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="204.3" dy="0"><tspan font-weight="700">Ixodes tick</tspan></tspan></text><rect x="18.0" y="249.0" width="135.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Attached ≥36 hours</tspan></tspan></text><clipPath id="i88p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#i88p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat clinically</tspan></text><rect x="18.0" y="331.0" width="33.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">EM</tspan></tspan></text><text x="114.6" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="114.6" dy="0"><tspan font-weight="700">Doxycycline </tspan><tspan font-weight="500">10 days, no</tspan></tspan><tspan x="114.6" dy="17"><tspan font-weight="500">serology</tspan></tspan></text><rect x="18.0" y="373.0" width="88.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Alternatives</tspan></tspan></text><text x="114.6" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="114.6" dy="0"><tspan font-weight="700">Amoxicillin </tspan><tspan font-weight="500">or cefuroxime</tspan></tspan><tspan x="114.6" dy="17"><tspan font-weight="500">14 days</tspan></tspan></text><rect x="18.0" y="415.0" width="85.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prophylaxis</tspan></tspan></text><text x="114.6" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="114.6" dy="0"><tspan font-weight="700">Doxycycline 200 mg </tspan><tspan font-weight="500">once</tspan></tspan><tspan x="114.6" dy="17"><tspan font-weight="500">within 72 h</tspan></tspan></text><clipPath id="i88p3"><rect x="2" y="471" width="300" height="140" rx="14"/></clipPath><rect x="2" y="471" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="140" fill="#B7410E" clip-path="url(#i88p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Do not order serology </tspan><tspan font-weight="500">for typical</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">erythema migrans: early antibodies are</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">often negative. Single-dose prophylaxis</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">only for a high-risk bite (Ixodes, endemic</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">area, attached ≥36 h).</tspan></tspan></text></svg>