<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Intracerebral hemorrhage: lower systolic BP to 140 and keep 130 to 150, reverse anticoagulation. Subarachnoid hemorrhage: nimodipine 60 mg every 4 hours for 21 days and early aneurysm repair." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n97"><defs></defs><clipPath id="n97p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n97p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="125.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Thunderclap: SAH</tspan></tspan></text><rect x="149.3" y="40.0" width="117.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="156.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="156.3" dy="0"><tspan font-weight="700">Focal deficit: ICH</tspan></tspan></text><rect x="18.0" y="68.0" width="169.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CT first; LP if CT negative</tspan></tspan></text><clipPath id="n97p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#n97p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="55.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ICH BP</tspan></tspan></text><text x="105.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="105.5" dy="0"><tspan font-weight="700">SBP 140, </tspan><tspan font-weight="500">keep 130–150</tspan></tspan></text><rect x="18.0" y="180.0" width="74.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ICH drugs</tspan></tspan></text><text x="105.5" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="105.5" dy="0"><tspan font-weight="700">Reverse </tspan><tspan font-weight="500">anticoagulation</tspan></tspan></text><rect x="18.0" y="210.0" width="40.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SAH</tspan></tspan></text><text x="105.5" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="105.5" dy="0"><tspan font-weight="700">Nimodipine </tspan><tspan font-weight="500">60 mg q4h, 21</tspan></tspan><tspan x="105.5" dy="17"><tspan font-weight="500">days</tspan></tspan></text><rect x="18.0" y="252.0" width="79.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SAH repair</tspan></tspan></text><text x="105.5" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="105.5" dy="0"><tspan font-weight="700">Coil or clip </tspan><tspan font-weight="500">early</tspan></tspan></text><clipPath id="n97p3"><rect x="2" y="296" width="300" height="104" rx="14"/></clipPath><rect x="2" y="296" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="104" fill="#B7410E" clip-path="url(#n97p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">ICH: </tspan><tspan font-weight="500">avoid SBP &lt;130. </tspan><tspan font-weight="700">SAH: </tspan><tspan font-weight="500">nimodipine</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">prevents delayed cerebral ischemia; it is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">not a BP drug choice.</tspan></tspan></text></svg>