<svg width="304" height="434" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 434" role="img" aria-label="Suspected child abuse in children under 2 gets a full exam and skeletal survey and a report on reasonable suspicion; women of reproductive age are screened for partner violence; suspected elder abuse is reported to adult protective services." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p119"><defs></defs><clipPath id="p119p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p119p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Red flags</tspan></text><rect x="18.0" y="40.0" width="118.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Story does not fit</tspan></tspan></text><rect x="142.9" y="40.0" width="92.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="149.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="149.9" dy="0"><tspan font-weight="700">Delay in care</tspan></tspan></text><rect x="18.0" y="68.0" width="122.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Patterned bruises</tspan></tspan></text><clipPath id="p119p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#p119p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Act</tspan></text><rect x="18.0" y="150.0" width="62.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Under 2</tspan></tspan></text><text x="88.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.1" dy="0"><tspan font-weight="700">Skeletal survey, </tspan><tspan font-weight="500">head imaging</tspan></tspan><tspan x="88.1" dy="17"><tspan font-weight="500">if &lt;1 y</tspan></tspan></text><rect x="18.0" y="192.0" width="54.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Report</tspan></tspan></text><text x="88.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.1" dy="0"><tspan font-weight="700">CPS </tspan><tspan font-weight="500">on reasonable suspicion</tspan></tspan></text><rect x="18.0" y="222.0" width="53.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Adults</tspan></tspan></text><text x="88.1" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.1" dy="0"><tspan font-weight="700">IPV screen </tspan><tspan font-weight="500">reproductive-age</tspan></tspan><tspan x="88.1" dy="17"><tspan font-weight="500">women</tspan></tspan></text><rect x="18.0" y="264.0" width="52.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Elders</tspan></tspan></text><text x="88.1" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.1" dy="0"><tspan font-weight="700">APS </tspan><tspan font-weight="500">report</tspan></tspan></text><clipPath id="p119p3"><rect x="2" y="308" width="300" height="122" rx="14"/></clipPath><rect x="2" y="308" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="122" fill="#B7410E" clip-path="url(#p119p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">You report suspicion, not proof.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">USPSTF: screen reproductive-age women</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">for intimate partner violence (B);</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">elder-abuse screening is an I statement.</tspan></tspan></text></svg>