<svg width="304" height="374" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 374" role="img" aria-label="Acute bacterial prostatitis: fever and a tender boggy prostate; do not massage; urine culture then antibiotics for two to four weeks." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="u200"><defs></defs><clipPath id="u200p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#u200p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Examine</tspan></text><rect x="18.0" y="40.0" width="108.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever + dysuria</tspan></tspan></text><rect x="132.4" y="40.0" width="99.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="139.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="139.4" dy="0"><tspan font-weight="700">Boggy, tender</tspan></tspan></text><rect x="18.0" y="68.0" width="89.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">No massage</tspan></tspan></text><clipPath id="u200p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#u200p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="47.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Exam</tspan></tspan></text><text x="92.3" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Gentle DRE </tspan><tspan font-weight="500">only</tspan></tspan></text><rect x="18.0" y="180.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="92.3" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Urine culture </tspan><tspan font-weight="500">before antibiotics</tspan></tspan></text><rect x="18.0" y="210.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="92.3" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">IV </tspan><tspan font-weight="500">if septic, then oral</tspan></tspan></text><rect x="18.0" y="240.0" width="66.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Duration</tspan></tspan></text><text x="92.3" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">2–4 weeks</tspan></tspan></text><clipPath id="u200p3"><rect x="2" y="284" width="300" height="86" rx="14"/></clipPath><rect x="2" y="284" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="86" fill="#B7410E" clip-path="url(#u200p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Massage </tspan><tspan font-weight="500">can seed the blood: examine</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">gently.</tspan></tspan></text></svg>