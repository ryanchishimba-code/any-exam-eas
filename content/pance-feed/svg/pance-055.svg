<svg width="304" height="531" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 531" role="img" aria-label="Chest X-ray pattern matching: Kerley B lines and cephalization in heart failure, lobar consolidation with air bronchograms in pneumonia, hyperinflation in COPD, Westermark sign and Hampton hump in pulmonary embolism, and a spiculated mass in lung cancer." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p55"><defs></defs><clipPath id="p55p1"><rect x="2" y="2" width="300" height="158" rx="14"/></clipPath><rect x="2" y="2" width="300" height="158" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="158" fill="#0B5CAD" clip-path="url(#p55p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Pattern to diagnosis</tspan></text><rect x="18.0" y="40.0" width="88.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Kerley B: HF</tspan></tspan></text><rect x="18.0" y="68.0" width="199.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Air bronchograms: pneumonia</tspan></tspan></text><rect x="18.0" y="96.0" width="155.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Flat diaphragms: COPD</tspan></tspan></text><rect x="18.0" y="124.0" width="229.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="139.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Deep sulcus: supine pneumothorax</tspan></tspan></text><clipPath id="p55p2"><rect x="2" y="168" width="300" height="229" rx="14"/></clipPath><rect x="2" y="168" width="300" height="229" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="168" width="5" height="229" fill="#0F766E" clip-path="url(#p55p2)"/><text x="18" y="192" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Classic signs</tspan></text><rect x="18.0" y="206.0" width="30.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="221.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HF</tspan></tspan></text><text x="108.5" y="221.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.5" dy="0"><tspan font-weight="700">Cephalization, </tspan><tspan font-weight="500">Kerley B</tspan></tspan><tspan x="108.5" dy="17"><tspan font-weight="500">lines, bat-wing edema,</tspan></tspan><tspan x="108.5" dy="17"><tspan font-weight="500">effusions</tspan></tspan></text><rect x="18.0" y="265.0" width="82.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="280.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pneumonia</tspan></tspan></text><text x="108.5" y="280.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.5" dy="0"><tspan font-weight="700">Lobar consolidation </tspan><tspan font-weight="500">with air</tspan></tspan><tspan x="108.5" dy="17"><tspan font-weight="500">bronchograms</tspan></tspan></text><rect x="18.0" y="307.0" width="29.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="322.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PE</tspan></tspan></text><text x="108.5" y="322.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.5" dy="0"><tspan font-weight="500">Usually </tspan><tspan font-weight="700">normal; </tspan><tspan font-weight="500">Westermark</tspan></tspan><tspan x="108.5" dy="17"><tspan font-weight="500">sign, Hampton hump</tspan></tspan></text><rect x="18.0" y="349.0" width="58.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="364.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cancer</tspan></tspan></text><text x="108.5" y="364.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.5" dy="0"><tspan font-weight="700">Spiculated </tspan><tspan font-weight="500">mass; hilar</tspan></tspan><tspan x="108.5" dy="17"><tspan font-weight="500">enlargement</tspan></tspan></text><clipPath id="p55p3"><rect x="2" y="405" width="300" height="122" rx="14"/></clipPath><rect x="2" y="405" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="405" width="5" height="122" fill="#B7410E" clip-path="url(#p55p3)"/><text x="18" y="429" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="454.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A </tspan><tspan font-weight="700">normal chest X-ray does not rule out</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">PE</tspan><tspan font-weight="500">; it mainly excludes other causes. Use</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">pretest probability, D-dimer or CT</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">pulmonary angiography.</tspan></tspan></text></svg>