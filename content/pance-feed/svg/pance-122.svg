<svg width="304" height="392" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 392" role="img" aria-label="Prenatal timeline: first-visit labs, Rh antibody repeat at 24 to 28 weeks, Tdap 27 to 36 weeks, GBS culture 36 to 37 weeks." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r122"><defs></defs><clipPath id="r122p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#r122p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Screen</tspan></text><rect x="18.0" y="40.0" width="98.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First visit labs</tspan></tspan></text><rect x="122.6" y="40.0" width="138.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="129.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="129.6" dy="0"><tspan font-weight="700">Rh: repeat 24–28 wk</tspan></tspan></text><rect x="18.0" y="68.0" width="101.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GBS 36–37 wk</tspan></tspan></text><clipPath id="r122p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#r122p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="70.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First visit</tspan></tspan></text><text x="99.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Type/Rh, </tspan><tspan font-weight="500">HIV, syphilis, HBsAg</tspan></tspan></text><rect x="18.0" y="180.0" width="73.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">24–28 wk</tspan></tspan></text><text x="99.1" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Antibody screen </tspan><tspan font-weight="500">if Rh−</tspan></tspan></text><rect x="18.0" y="210.0" width="72.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">27–36 wk</tspan></tspan></text><text x="99.1" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Tdap </tspan><tspan font-weight="500">every pregnancy</tspan></tspan></text><rect x="18.0" y="240.0" width="72.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">36–37 wk</tspan></tspan></text><tex