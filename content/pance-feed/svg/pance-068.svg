<svg width="304" height="517" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 517" role="img" aria-label="Three pediatric GI emergencies: pyloric stenosis with projectile nonbilious vomiting and an olive mass, intussusception with currant-jelly stool and a target sign, and Hirschsprung disease with delayed meconium confirmed by rectal biopsy." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g68"><defs></defs><clipPath id="g68p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#g68p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Three classic infants</tspan></text><rect x="18.0" y="40.0" width="128.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pyloric: 2–8 weeks</tspan></tspan></text><rect x="18.0" y="68.0" width="174.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Intussusception: 6 mo–3 y</tspan></tspan></text><rect x="18.0" y="96.0" width="158.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hirschsprung: newborn</tspan></tspan></text><clipPath id="g68p2"><rect x="2" y="140" width="300" height="225" rx="14"/></clipPath><rect x="2" y="140" width="300" height="225" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="225" fill="#0F766E" clip-path="url(#g68p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Image, then fix</tspan></text><rect x="18.0" y="178.0" width="56.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pyloric</tspan></tspan></text><text x="18.0" y="215.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Ultrasound; </tspan><tspan font-weight="500">correct fluids and K, then</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">pyloromyotomy</tspan></tspan></text><rect x="18.0" y="244.0" width="112.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="259.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Intussusception</tspan></tspan></text><text x="18.0" y="281.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Ultrasound </tspan><tspan font-weight="500">target sign; air or contrast</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">enema</tspan></tspan></text><rect x="18.0" y="310.0" width="97.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="325.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hirschsprung</tspan></tspan></text><text x="18.0" y="347.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Suction rectal biopsy: </tspan><tspan font-weight="500">no ganglion cells</tspan></tspan></text><clipPath id="g68p3"><rect x="2" y="373" width="300" height="140" rx="14"/></clipPath><rect x="2" y="373" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="373" width="5" height="140" fill="#B7410E" clip-path="url(#g68p3)"/><text x="18" y="397" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="422.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Pyloric stenosis </tspan><tspan font-weight="500">causes hypochloremic,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hypokalemic metabolic alkalosis: correct</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">it </tspan><tspan font-weight="700">before </tspan><tspan font-weight="500">surgery. Peritonitis or perforation</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">in intussusception means surgery, not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">enema.</tspan></tspan></text></svg>