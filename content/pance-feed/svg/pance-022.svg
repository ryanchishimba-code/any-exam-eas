<svg width="304" height="614" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 614" role="img" aria-label="Chronic coronary disease. A coronary artery with a fixed plaque limits flow on exertion. First-line antianginal drug: beta-blocker, calcium channel blocker or long-acting nitrate; add a second class if symptoms persist, then ranolazine; sublingual nitroglycerin for attacks. Long-term beta-blocker only with MI in the past year, LVEF 50 percent or less, or another indication." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s22"><defs><linearGradient id="s22wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D88F85"/><stop offset="1" stop-color="#B8574D"/></linearGradient><linearGradient id="s22lu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C6BE"/><stop offset="1" stop-color="#E39C92"/></linearGradient><linearGradient id="s22pq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D58E"/><stop offset="1" stop-color="#E2AA4E"/></linearGradient></defs><clipPath id="s22p1"><rect x="2" y="2" width="300" height="206" rx="14"/></clipPath><rect x="2" y="2" width="300" height="206" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="206" fill="#0B5CAD" clip-path="url(#s22p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Stable plaque (schematic)</tspan></text><path d="M20.0,50.0 C24.5,47.1 80.8,49.9 88.0,50.0 C95.2,50.1 123.7,51.2 128.0,52.0 C132.3,52.8 149.7,62.0 153.0,62.0 C156.3,62.0 173.7,52.8 178.0,52.0 C182.3,51.2 210.8,50.1 218.0,50.0 C225.2,49.9 281.5,47.1 286.0,50.0 C290.5,52.9 290.5,91.1 286.0,94.0 C281.5,96.9 225.2,94.1 218.0,94.0 C210.8,93.9 182.3,92.8 178.0,92.0 C173.7,91.2 156.3,82.0 153.0,82.0 C149.7,82.0 132.3,91.2 128.0,92.0 C123.7,92.8 95.2,93.9 88.0,94.0 C80.8,94.1 2