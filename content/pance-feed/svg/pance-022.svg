ill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="55.0" y="121.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="55.0" dy="0"><tspan font-weight="700">Fixed plaque</tspan></tspan></text></g><g class="q"><circle cx="135.2" cy="111.9" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M132.0,109.3 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="135.3" cy="117.1" r="1.2" fill="#fff"/></g><circle class="hit" cx="135.2" cy="111.9" r="22" fill="transparent"/></g><g class="lb" data-n="2"><line class="ld" x1="225.0" y1="80.0" x2="225.0" y2="102.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="225.0" cy="80.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="168.0" y="102.0" width="121" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="175.0" y="121.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="175.0" dy="0"><tspan font-weight="700">Less flow beyond</tspan></tspan></text></g><g class="q"><circle cx="225.0" cy="113.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M221.8,110.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="225.1" cy="118.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="225.0" cy="113.0" r="22" fill="transparent"/></g><rect x="18.0" y="144.0" width="132.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="159.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Exertional pressure</tspan></tspan></text><rect x="156.3" y="144.0" width="110.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="163.3" y="159.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="163.3" dy="0"><tspan font-weight="700">Relieved by rest</tspan></tspan></text><rect x="18.0" y="172.0" width="130.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="187.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Predictable pattern</tspan></tspan></text><clipPath id="s22p2"><rect x="2" y="216" width="300" height="246" rx="14"/></clipPath><rect x="2" y="216" width="300" height="246" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="216" width="5" height="246" fill="#0F766E" clip-path="url(#s22p2)"/><text x="18" y="240" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Relieve symptoms</tspan></text><text x="18.0" y="262.0" font-size="12" font-weight="700" fill="#0F766E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Any one first:</tspan></tspan></text><rect x="18.0" y="268.0" width="80.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="58.0" y="293.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="58.0" dy="0"><tspan font-weight="700">Beta-blocker</tspan></tspan></text><rect x="104.0" y="268.0" width="100.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="154.0" y="278.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="154.0" dy="0"><tspan font-weight="700">Calcium</tspan></tspan><tspan x="154.0" dy="15"><tspan font-weight="700">channel</tspan></tspan><tspan x="154.0" dy="15"><tspan font-weight="700">blocker</tspan></tspan></text><rect x="210.0" y="268.0" width="76.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="248.0" y="285.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="248.0" dy="0"><tspan font-weight="700">Long-acting</tspan></tspan><tspan x="248.0" dy="15"><tspan font-weight="700">nitrate</tspan></tspan></text><rect x="18.0" y="320.0" width="38.8" height="22" rx="11" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><text x="25.0" y="335.5" font-size="12" font-weight="700" fill="#0F766E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Add</tspan></tspan></text><text x="70.0" y="335.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.0" dy="0"><tspan font-weight="700">second class </tspan><tspan font-weight="500">if symptoms persist,</tspan></tspan><tspan x="70.0" dy="17"><tspan font-weight="500">then </tspan><tspan font-weight="700">ranolazine</tspan></tspan></text><rect x="18.0" y="362.0" width="53.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="377.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Attack</tspan></tspan></text><text x="79.9" y="377.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="79.9" dy="0"><tspan font-weight="700">Sublingual nitroglycerin </tspan><tspan font-weight="500">or spray</tspan></tspan></text><text x="18.0" y="407.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Every patient: </tspan><tspan font-weight="500">statin; SGLT2 inhibitor or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">GLP-1 RA if type 2 diabetes; yearly flu</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">vaccine.</tspan></tspan></text><clipPath id="s22p3"><rect x="2" y="470" width="300" height="140" rx="14"/></clipPath><rect x="2" y="470" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="470" width="5" height="140" fill="#B7410E" clip-path="url(#s22p3)"/><text x="18" y="494" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="519.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Do not continue a beta-blocker long term</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">for outcomes unless MI in the past year,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">LVEF ≤50%, or another indication.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Ivabradine is harmful with normal LV</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">function.</tspan></tspan></text></svg>