<svg width="304" height="388" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 388" role="img" aria-label="After high-risk TIA or minor stroke, aspirin plus clopidogrel for 21 days then a single antiplatelet, high-intensity statin to LDL under 70, carotid imaging and heart-rhythm monitoring." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n96"><defs></defs><clipPath id="n96p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#n96p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who qualifies</tspan></text><rect x="18.0" y="40.0" width="77.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ABCD2 ≥4</tspan></tspan></text><rect x="101.5" y="40.0" width="72.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="108.5" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="108.5" dy="0"><tspan font-weight="700">NIHSS ≤3</tspan></tspan></text><rect x="179.7" y="40.0" width="83.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="186.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="186.7" dy="0"><tspan font-weight="700">Within 24 h</tspan></tspan></text><clipPath id="n96p2"><rect x="2" y="84" width="300" height="188" rx="14"/></clipPath><rect x="2" y="84" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="188" fill="#0F766E" 