<svg width="304" height="386" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 386" role="img" aria-label="Bell palsy involving the forehead treated with oral steroids within 72 hours and eye protection; painful diabetic neuropathy treated with gabapentinoids, SNRIs, tricyclics or sodium-channel blockers." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n107"><defs></defs><clipPath id="n107p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n107p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="126.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Forehead involved</tspan></tspan></text><rect x="150.1" y="40.0" width="87.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="157.1" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="157.1" dy="0"><tspan font-weight="700">Acute onset</tspan></tspan></text><rect x="18.0" y="68.0" width="147.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Feet: stocking pattern</tspan></tspan></text><clipPath id="n107p2"><rect x="2" y="112" width="300" height="158" rx="14"/></clipPath><rect x="2" y="112" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="158" fill="#0F766E" clip-path="url(#n107p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="36.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bell</tspan></tspan></text><text x="112.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.1" dy="0"><tspan font-weight="700">Steroids </tspan><tspan font-weight="500">within 72 h;</tspan></tspan><tspan x="112.1" dy="17"><tspan font-weight="500">antiviral only added</tspan></tspan></text><rect x="18.0" y="192.0" width="36.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Eye</tspan></tspan></text><text x="112.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.1" dy="0"><tspan font-weight="700">Lubricate, </tspan><tspan font-weight="500">tape at night</tspan></tspan></text><rect x="18.0" y="222.0" width="86.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Neuropathy</tspan></tspan></text><text x="112.1" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.1" dy="0"><tspan font-weight="700">Gabapentinoid, </tspan><tspan font-weight="500">SNRI, TCA</tspan></tspan><tspan x="112.1" dy="17"><tspan font-weight="500">or Na channel blocker</tspan></tspan></text><clipPath id="n107p3"><rect x="2" y="278" width="300" height="104" rx="14"/></clipPath><rect x="2" y="278" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="278" width="5" height="104" fill="#B7410E" clip-path="url(#n107p3)"/><text x="18" y="302" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="327.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Forehead sparing </tspan><tspan font-weight="500">points to a central</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">lesion such as stroke. Antivirals alone are</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">not recommended for Bell palsy.</tspan></tspan></text></svg>