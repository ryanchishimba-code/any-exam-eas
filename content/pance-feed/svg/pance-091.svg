<svg width="304" height="510" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 510" role="img" aria-label="C. difficile infection after antibiotics treated first with fidaxomicin for 10 days or oral vancomycin, then fidaxomicin, vancomycin taper or bezlotoxumab for recurrence, and fecal microbiota therapy after two or more recurrences." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i91"><defs></defs><clipPath id="i91p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#i91p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Risk factors</tspan></text><rect x="18.0" y="40.0" width="123.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Recent antibiotics</tspan></tspan></text><rect x="147.7" y="40.0" width="58.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="154.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="154.7" dy="0"><tspan font-weight="700">PPI use</tspan></tspan></text><rect x="18.0" y="68.0" width="121.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age &gt;65, hospital</tspan></tspan></text><clipPath id="i91p2"><rect x="2" y="112" width="300" height="246" rx="14"/></clipPath><rect x="2" y="112" width="300" height="246" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="246" fill="#0F766E" clip-path="url(#i91p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treatment ladder</tspan></text><rect x="18.0" y="150.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First</tspan></tspan></text><text x="133.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="133.5" dy="0"><tspan font-weight="700">Fidaxomicin </tspan><tspan font-weight="500">10 days (or</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="500">oral vancomycin)</tspan></tspan></text><rect x="18.0" y="192.0" width="84.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Recurrence</tspan></tspan></text><text x="133.5" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="133.5" dy="0"><tspan font-weight="700">Fidaxomicin </tspan><tspan font-weight="500">or</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="500">vancomycin taper-pulse;</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="500">bezlotoxumab</tspan></tspan></text><rect x="18.0" y="251.0" width="107.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="266.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≥2 recurrences</tspan></tspan></text><text x="133.5" y="266.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="133.5" dy="0"><tspan font-weight="700">Fecal microbiota</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="500">therapy</tspan></tspan></text><rect x="18.0" y="293.0" width="74.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="308.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fulminant</tspan></tspan></text><text x="133.5" y="308.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="133.5" dy="0"><tspan font-weight="700">Oral vanc + IV</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="700">metronidazole; </tspan><tspan font-weight="500">surgery</tspan></tspan><tspan x="133.5" dy="17"><tspan font-weight="500">consult</tspan></tspan></text><clipPath id="i91p3"><rect x="2" y="366" width="300" height="140" rx="14"/></clipPath><rect x="2" y="366" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="366" width="5" height="140" fill="#B7410E" clip-path="url(#i91p3)"/><text x="18" y="390" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="415.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Do not test formed stool </tspan><tspan font-weight="500">or test for cure.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Stop the inciting antibiotic when possible.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Oral metronidazole is only for mild cases</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">when fidaxomicin and vancomycin are</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">unavailable.</tspan></tspan></text></svg>