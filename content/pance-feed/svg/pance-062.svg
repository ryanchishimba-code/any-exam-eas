<svg width="304" height="569" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 569" role="img" aria-label="Acute sigmoid diverticulitis. Antibiotics are used selectively in mild uncomplicated disease; an abscess is drained; colonoscopy after recovery if none was done within a year." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g62"><defs></defs><clipPath id="g62p1"><rect x="2" y="2" width="300" height="255" rx="14"/></clipPath><rect x="2" y="2" width="300" height="255" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="255" fill="#0B5CAD" clip-path="url(#g62p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Sigmoid colon (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><polyline points="78.0,148.0 78.0,68.0 228.0,68.0 228.0,136.0 188.0,150.0 168.0,140.0" fill="none" stroke="#A8705F" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/><polyline points="78.0,148.0 78.0,68.0 228.0,68.0 228.0,136.0 188.0,150.0 168.0,140.0" fill="none" stroke="#E8B7A8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><circle cx="238.0" cy="96.0" r="5" fill="#E8B7A8" stroke="#A8705F" stroke-width="1"/><circle cx="232.0" cy="122.0" r="5" fill="#E8B7A8" stroke="#A8705F" stroke-width="1"/><circle cx="206.0" cy="152.0" r="5" fill="#E8B7A8" stroke="#A8705F" stroke-width="1"/><circle cx="194.0" cy="152.0" r="7" fill="#E0533F" stroke="#8E2A1E" stroke-width="1"/><g class="lb" data-n="1"><line class="ld" x1="194.0" y1="152.0" x2="194.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="194.0" cy="152.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="2