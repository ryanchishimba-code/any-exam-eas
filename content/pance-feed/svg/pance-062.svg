/text><rect x="18.0" y="303.0" width="40.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="318.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mild</tspan></tspan></text><text x="106.2" y="318.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Selective antibiotics;</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">outpatient, clear diet</tspan></tspan></text><rect x="18.0" y="345.0" width="80.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="360.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Antibiotics</tspan></tspan></text><text x="106.2" y="360.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Frail, immunosuppressed,</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">high CRP or WBC, vomiting</tspan></tspan></text><rect x="18.0" y="387.0" width="66.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="402.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Abscess</tspan></tspan></text><text x="106.2" y="402.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Percutaneous drainage</tspan><tspan font-weight="500">;</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">perforation: surgery</tspan></tspan></text><clipPath id="g62p3"><rect x="2" y="443" width="300" height="122" rx="14"/></clipPath><rect x="2" y="443" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="443" width="5" height="122" fill="#B7410E" clip-path="url(#g62p3)"/><text x="18" y="467" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="492.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">After recovery, </tspan><tspan font-weight="700">colonoscopy </tspan><tspan font-weight="500">(6–8 weeks)</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">if none in the past year, to exclude</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cancer. Nuts and seeds do not need to be</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">avoided.</tspan></tspan></text></svg>