tspan font-weight="700">Trial</tspan></tspan></text><text x="117.0" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="117.0" dy="0"><tspan font-weight="700">Once-daily PPI </tspan><tspan font-weight="500">before a</tspan></tspan><tspan x="117.0" dy="17"><tspan font-weight="500">meal, 8 weeks</tspan></tspan></text><rect x="18.0" y="373.0" width="74.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Response</tspan></tspan></text><text x="117.0" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="117.0" dy="0"><tspan font-weight="500">Try to </tspan><tspan font-weight="700">stop or step down</tspan></tspan></text><rect x="18.0" y="403.0" width="91.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">No response</tspan></tspan></text><text x="117.0" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="117.0" dy="0"><tspan font-weight="700">Endoscopy </tspan><tspan font-weight="500">off PPI 2–4</tspan></tspan><tspan x="117.0" dy="17"><tspan font-weight="500">weeks</tspan></tspan></text><rect x="18.0" y="445.0" width="55.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="460.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Barrett</tspan></tspan></text><text x="117.0" y="460.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="117.0" dy="0"><tspan font-weight="500">Screen once if GERD + </tspan><tspan font-weight="700">≥3</tspan></tspan><tspan x="117.0" dy="17"><tspan font-weight="700">risk factors</tspan></tspan></text><clipPath id="g56p3"><rect x="2" y="501" width="300" height="140" rx="14"/></clipPath><rect x="2" y="501" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="501" width="5" height="140" fill="#B7410E" clip-path="url(#g56p3)"/><text x="18" y="525" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="550.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Alarm features </tspan><tspan font-weight="500">(dysphagia, weight loss,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">GI bleeding, vomiting, anemia) mean</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">endoscopy, not an empiric trial. Barrett</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">risk factors: male, age &gt;50, White,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">smoking, obesity, family history.</tspan></tspan></text></svg>