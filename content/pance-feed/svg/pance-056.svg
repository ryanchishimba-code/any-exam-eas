<svg xmlns="http://www.w3.org/2000/svg" width="400" height="278" viewBox="0 0 400 278" role="img" aria-label="Screen adults 18 and older, including pregnant patients, and offer a brief intervention">
<title>Screen adults 18 and older, including pregnant patients, and offer a brief intervention</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">GASTROINTESTINAL/NUTRITION</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Screen adults 18 and older,</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">including pregnant patients, and</text>
<text x="28" y="112" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">offer a brief intervention</text>
<line x1="28" y1="148" x2="372" y2="148" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="176" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">AUDIT-C is a short screen.</text>
<rect x="28" y="196" width="344" height="72" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="214" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">A brief intervention is not treatment for</text>
<text x="42" y="236" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">withdrawal or severe use disorder.</text>
</svg>
