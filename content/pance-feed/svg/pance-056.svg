<svg width="304" height="645" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 645" role="img" aria-label="Gastroesophageal reflux across a weak lower esophageal sphincter. An 8-week once-daily PPI trial for typical symptoms without alarm features; endoscopy for alarm features or no response; one-time Barrett screening with three or more risk factors." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g56"><defs></defs><clipPath id="g56p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#g56p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Reflux (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M138.0,48.0 C138.3,55.7 139.7,86.3 140.0,94.0" fill="none" stroke="#A8705F" stroke-width="16.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M138.0,48.0 C138.3,55.7 139.7,86.3 140.0,94.0" fill="none" stroke="#E8B7A8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,94 Q118,152 178,152 Q228,150 214,110 Q198,90 150,94 Z" fill="#E8B7A8" stroke="#A8705F" stroke-width="1.2" /><path d="M142,102 q-10,-5 0,-10" fill="none" stroke="#E0533F" stroke-width="2" /><path d="M142,90 q-10,-5 0,-10" fill="none" stroke="#E0533F" stroke-width="2" /><path d="M142,78 q-10,-5 0,-10" fill="none" stroke="#E0533F" stroke-width="2" /><g class="lb" data-n="1"><line class="ld" x1="140.0" y1="94.0" x2="140.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="140.0" cy="94.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><