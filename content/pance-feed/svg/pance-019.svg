<svg width="304" height="580" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 580" role="img" aria-label="Primary or secondary syphilis. Schematic painless chancre and diffuse rash. Diagnose with darkfield or PCR of a lesion, or a nontreponemal test plus a treponemal test. Treat with one dose of benzathine penicillin G, 2.4 million units intramuscularly. Fever within 24 hours is the Jarisch-Herxheimer reaction, not allergy. Never use Bicillin C-R." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s19"><defs><linearGradient id="s19sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DCC8"/><stop offset="1" stop-color="#E0BFA6"/></linearGradient></defs><clipPath id="s19p1"><rect x="2" y="2" width="300" height="256" rx="14"/></clipPath><rect x="2" y="2" width="300" height="256" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="256" fill="#0B5CAD" clip-path="url(#s19p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Chancre, then rash (schematic)</tspan></text><path d="M22.0,94.0 C27.7,86.3 47.7,93.7 56.0,92.0 C64.3,90.3 66.7,86.0 72.0,84.0 C77.3,82.0 82.7,80.0 88.0,80.0 C93.3,80.0 98.7,82.0 104.0,84.0 C109.3,86.0 112.3,90.3 120.0,92.0 C127.7,93.7 145.0,86.3 150.0,94.0 C155.0,101.7 171.3,130.7 150.0,138.0 C128.7,145.3 43.3,145.3 22.0,138.0 C0.7,130.7 16.3,101.7 22.0,94.0 Z" fill="url(#s19sk)" stroke="#C9A58A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M66.0,86.0 C67.3,87.3 70.3,91.7 74.0,94.0 C77.7,96.3 83.3,100.0 88.0,100.0 C92.7,100.0 98.3,96.3 102.0,94.0 C105.7,91.7 108.7,87.3 110.0,86.0" fill="#D9786C" stroke="#9C4A40" stroke-width="1.4"/><path d="M58.0,90.0 C59.3,88.3 61.0,82.7 66.0,80.0 C71.0,77.3 80.7,74.0 88.0,74.0 C95.3,74.0 105.0,77.3 110.0,80.0 C115.0,82.7 116.7,88.3 118.0,90.0" fill="none" stroke="#C9A58A" stroke-width="1.6"/><g class="lb" data-n="1"><line class="ld" x1="88.0" y1="94.0" x2="88.0" y2="150.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="88.0" cy="94.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="150.0" width="118" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="169.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Painless chancre</tspan></tspan></text></g><g class="q"><circle cx="88.0" cy="161.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M84.8,158.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="88.1" cy="166.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="88.0" cy="161.0" r="22" fill="transparent"/></g><rect x="194.0" y="84.0" width="76.0" height="66.0" rx="20" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><rect x="198.0" y="52.0" width="15.0" height="52.0" rx="8" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><rect x="216.0" y="46.0" width="15.0" height="52.0" rx="8" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><rect x="234.0" y="48.0" width="15.0" height="52.0" rx="8" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><rect x="252.0" y="52.0" width="15.0" height="52.0" rx="8" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><rect x="178.0" y="102.0" width="36.0" height="15.0" rx="8" fill="#F3DCC8" stroke="#C9A58A" stroke-width="1.4"/><circle cx="206.7" cy="81.1" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="224.1" cy="76.0" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="241.6" cy="84.0" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="257.2" cy="74.6" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="211.0" cy="109.0" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="231.3" cy="105.1" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="248.4" cy="111.3" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="219.2" cy="132.3" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="240.8" cy="130.3" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="204.8" cy="60.2" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="223.6" cy="62.9" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="243.2" cy="63.7" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><circle cx="256.4" cy="62.9" r="3.2" fill="#C65A4E" stroke="none" stroke-width="1"/><g class="lb" data-n="2"><line class="ld" x1="242.0" y1="110.0" x2="242.0" y2="160.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="242.0" cy="110.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="176.0" y="160.0" width="88" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="183.0" y="179.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="183.0" dy="0"><tspan font-weight="700">Diffuse rash</tspan></tspan></text></g><g class="q"><circle cx="242.0" cy="171.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M238.8,168.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="242.1" cy="176.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="242.0" cy="171.0" r="22" fill="transparent"/></g><rect x="18.0" y="190.0" width="154.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="205.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Primary: painless ulcer</tspan></tspan></text><rect x="18.0" y="218.0" width="199.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="233.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Secondary: rash, lymph nodes</tspan></tspan></text><clipPath id="s19p2"><rect x="2" y="266" width="300" height="198" rx="14"/></clipPath><rect x="2" y="266" width="300" height="198" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="266" width="5" height="198" fill="#0F766E" clip-path="url(#s19p2)"/><text x="18" y="290" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  One injection</tspan></text><text x="18.0" y="315.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Diagnose: </tspan><tspan font-weight="500">darkfield or PCR of a lesion, or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">a nontreponemal test (RPR/VDRL) plus a</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">treponemal test.</tspan></tspan></text><text x="18.0" y="377.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Treat: </tspan><tspan font-weight="500">benzathine penicillin G, one dose.</tspan></tspan></text><rect x="18.0" y="384.0" width="162.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="399.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2.4 million units IM once</tspan></tspan></text><text x="18.0" y="426.0" font-size="12" font-weight="500" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Penicillin allergy, not pregnant: doxycycline</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="500">100 mg twice daily for 14 days. Pregnant:</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="500">desensitize.</tspan></tspan></text><clipPath id="s19p3"><rect x="2" y="472" width="300" height="104" rx="14"/></clipPath><rect x="2" y="472" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="472" width="5" height="104" fill="#B7410E" clip-path="url(#s19p3)"/><text x="18" y="496" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="521.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Fever within 24 hours is the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Jarisch–Herxheimer reaction, not allergy.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Never use Bicillin C-R.</tspan></tspan></text></svg>