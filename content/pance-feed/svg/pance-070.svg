<svg width="304" height="645" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 645" role="img" aria-label="Knee osteoarthritis with joint-space narrowing and an osteophyte. Exercise and weight loss first, topical then oral NSAIDs, steroid injection for flares, and joint replacement at end stage." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m70"><defs></defs><clipPath id="m70p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#m70p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Knee (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><rect x="123.0" y="48.0" width="60.0" height="46.0" rx="14" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><rect x="123.0" y="104.0" width="60.0" height="46.0" rx="14" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><path d="M123.0,90.0 C121.3,89.7 113.0,96.3 113.0,98.0 C113.0,99.7 121.3,101.3 123.0,100.0 C124.7,98.7 124.7,90.3 123.0,90.0 Z" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><g class="lb" data-n="1"><line class="ld" x1="117.0" y1="98.0" x2="117.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="117.0" cy="98.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="229" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Joint-space narrowing, osteophyte</tspan></tspan></text></g><g class="q"><circle cx="117.0" cy="197.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M113.8,194.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="117.1" cy="202.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="117.0" cy="197.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="66.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age &gt;45</tspan></tspan></text><rect x="90.0" y="221.0" width="122.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="97.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="97.0" dy="0"><tspan font-weight="700">Stiffness &lt;30 min</tspan></tspan></text><rect x="18.0" y="249.0" width="114.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Heberden nodes</tspan></tspan></text><clipPath id="m70p2"><rect x="2" y="293" width="300" height="200" rx="14"/></clipPath><rect x="2" y="293" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="200" fill="#0F766E" clip-path="url(#m70p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Step-up care</tspan></text><rect x="18.0" y="331.0" width="43.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Core</tspan></tspan></text><text x="100.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.4" dy="0"><tspan font-weight="700">Exercise, </tspan><tspan font-weight="500">weight loss,</tspan></tspan><tspan x="100.4" dy="17"><tspan font-weight="500">self-management</tspan></tspan></text><rect x="18.0" y="373.0" width="43.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drug</tspan></tspan></text><text x="100.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.4" dy="0"><tspan font-weight="700">Topical NSAID </tspan><tspan font-weight="500">(knee, hand),</tspan></tspan><tspan x="100.4" dy="17"><tspan font-weight="500">then oral NSAID</tspan></tspan></text><rect x="18.0" y="415.0" width="44.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Flare</tspan></tspan></text><text x="100.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.4" dy="0"><tspan font-weight="700">Intra-articular steroid</tspan></tspan><tspan x="100.4" dy="17"><tspan font-weight="500">injection</tspan></tspan></text><rect x="18.0" y="457.0" width="74.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="472.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">End stage</tspan></tspan></text><text x="100.4" y="472.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.4" dy="0"><tspan font-weight="700">Joint replacement </tspan><tspan font-weight="500">referral</tspan></tspan></text><clipPath id="m70p3"><rect x="2" y="501" width="300" height="140" rx="14"/></clipPath><rect x="2" y="501" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="501" width="5" height="140" fill="#B7410E" clip-path="url(#m70p3)"/><text x="18" y="525" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="550.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">The 2019 ACR guideline is </tspan><tspan font-weight="700">strongly</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">against glucosamine </tspan><tspan font-weight="500">and chondroitin</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(knee, hip). Tramadol only if NSAIDs fail</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">or are contraindicated, preferred over</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">other opioids.</tspan></tspan></text></svg>