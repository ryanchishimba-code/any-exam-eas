<svg xmlns="http://www.w3.org/2000/svg" width="400" height="272" viewBox="0 0 400 272" role="img" aria-label="Community-dwelling adults 65 and older who are at increased risk">
<title>Community-dwelling adults 65 and older who are at increased risk</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">MUSCULOSKELETAL</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Community-dwelling adults 65 and</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">older who are at increased risk</text>
<line x1="28" y1="120" x2="372" y2="120" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="148" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">A prior fall or a gait or balance problem</text>
<text x="28" y="170" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">raises risk.</text>
<rect x="28" y="190" width="344" height="72" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="208" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">Do not start vitamin D solely to prevent</text>
<text x="42" y="230" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">falls in community-dwelling adults.</text>
</svg>
