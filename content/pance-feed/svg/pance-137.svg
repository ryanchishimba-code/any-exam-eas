<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="The thyroid failed. Pituitary TSH rises because the feedback signal is gone">
<title>The thyroid failed. Pituitary TSH rises because the feedback signal is gone</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">ENDOCRINE</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">The thyroid failed. Pituitary TSH</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">rises because the feedback signal is</text>
<text x="28" y="112" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">gone</text>
<line x1="28" y1="148" x2="372" y2="148" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="176" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">A low TSH with a low free T4 is central,</text>
<text x="28" y="198" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">not primary, hypothyroidism.</text>
<rect x="28" y="218" width="344" height="72" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="236" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">Biotin can make free T4 look high and TSH</text>
<text x="42" y="258" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">look low.</text>
</svg>
