<svg width="304" height="587" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 587" role="img" aria-label="Acute cholecystitis with a thick-walled gallbladder and stone. Ultrasound first, HIDA if unclear, then early laparoscopic cholecystectomy; jaundice points to a common bile duct stone." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g60"><defs></defs><clipPath id="g60p1"><rect x="2" y="2" width="300" height="255" rx="14"/></clipPath><rect x="2" y="2" width="300" height="255" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="255" fill="#0B5CAD" clip-path="url(#g60p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Gallbladder (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M38,60 Q168,46 258,70 Q218,110 78,120 Q38,110 38,60 Z" fill="#A0524A" stroke="#6B302A" stroke-width="1.2" /><ellipse cx="128.0" cy="126.0" rx="30" ry="18" fill="#6FA36B" stroke="#E0533F" stroke-width="4"/><circle cx="114.0" cy="132.0" r="6" fill="#F2E2A0" stroke="#9A8A40" stroke-width="1"/><circle cx="130.0" cy="136.0" r="5" fill="#F2E2A0" stroke="#9A8A40" stroke-width="1"/><g class="lb" data-n="1"><line class="ld" x1="146.0" y1="120.0" x2="146.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="146.0" cy="120.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="189" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Thick gallbladder wall, stone</tspan></tspan></text></g><g class="q" display="none"><circle cx="146.0" cy="197.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M142.8,194.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="146.1" cy="202.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="146.0" cy="197.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="90.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Murphy sign</tspan></tspan></text><rect x="114.5" y="221.0" width="48.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="121.5" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="121.5" dy="0"><tspan font-weight="700">Fever</tspan></tspan></text><rect x="168.4" y="221.0" width="95.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="175.4" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="175.4" dy="0"><tspan font-weight="700">Leukocytosis</tspan></tspan></text><clipPath id="g60p2"><rect x="2" y="265" width="300" height="170" rx="14"/></clipPath><rect x="2" y="265" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="265" width="5" height="170" fill="#0F766E" clip-path="url(#g60p2)"/><text x="18" y="289" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Ultrasound, then surgery</tspan></text><rect x="18.0" y="303.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="318.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="87.5" y="318.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">Ultrasound: </tspan><tspan font-weight="500">stones, wall</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="500">thickening, pericholecystic fluid</tspan></tspan></text><rect x="18.0" y="345.0" width="61.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="360.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Unclear</tspan></tspan></text><text x="87.5" y="360.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">HIDA scan: </tspan><tspan font-weight="500">non-filling</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="500">gallbladder</tspan></tspan></text><rect x="18.0" y="387.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="402.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="87.5" y="402.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">Early laparoscopic</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="700">cholecystectomy</tspan></tspan></text><clipPath id="g60p3"><rect x="2" y="443" width="300" height="140" rx="14"/></clipPath><rect x="2" y="443" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="443" width="5" height="140" fill="#B7410E" clip-path="url(#g60p3)"/><text x="18" y="467" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="492.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Biliary colic </tspan><tspan font-weight="500">resolves within hours with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">normal labs. </tspan><tspan font-weight="700">Jaundice or dilated duct</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">suggests a common duct stone: MRCP or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">ERCP. Fever + jaundice + pain is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cholangitis (card 009).</tspan></tspan></text></svg>