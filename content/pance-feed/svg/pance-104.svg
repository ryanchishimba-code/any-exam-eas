xt x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CT if</tspan></tspan></text><text x="95.0" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="95.0" dy="0"><tspan font-weight="700">GCS &lt;15 </tspan><tspan font-weight="500">at 2 h, age ≥65,</tspan></tspan><tspan x="95.0" dy="17"><tspan font-weight="500">vomiting ≥2</tspan></tspan></text><rect x="18.0" y="373.0" width="64.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Epidural</tspan></tspan></text><text x="95.0" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="95.0" dy="0"><tspan font-weight="700">Arterial, </tspan><tspan font-weight="500">lens; surgery</tspan></tspan></text><rect x="18.0" y="403.0" width="69.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Subdural</tspan></tspan></text><text x="95.0" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="95.0" dy="0"><tspan font-weight="700">Venous, </tspan><tspan font-weight="500">crescent; elderly, falls</tspan></tspan></text><clipPath id="n104p3"><rect x="2" y="447" width="300" height="122" rx="14"/></clipPath><rect x="2" y="447" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="447" width="5" height="122" fill="#B7410E" clip-path="url(#n104p3)"/><text x="18" y="471" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="496.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">The lucid interval is classic but</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">unreliable. </tspan><tspan font-weight="500">Canadian CT Head Rule: GCS</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">&lt;15 at 2 h, skull fracture signs, vomiting</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">≥2, age ≥65.</tspan></tspan></text></svg>