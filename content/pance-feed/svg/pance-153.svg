<svg xmlns="http://www.w3.org/2000/svg" width="400" height="294" viewBox="0 0 400 294" role="img" aria-label="It exits through the trabecular meshwork into Schlemm canal">
<title>It exits through the trabecular meshwork into Schlemm canal</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">EENT</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">It exits through the trabecular</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">meshwork into Schlemm canal</text>
<line x1="28" y1="120" x2="372" y2="120" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="148" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">Open-angle glaucoma is impaired outflow,</text>
<text x="28" y="170" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">not a closed angle.</text>
<rect x="28" y="190" width="344" height="94" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="208" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">Acute angle closure is a separate</text>
<text x="42" y="230" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">emergency. Do not treat it as chronic</text>
<text x="42" y="252" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">glaucoma.</text>
</svg>
