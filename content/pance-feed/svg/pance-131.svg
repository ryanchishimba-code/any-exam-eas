<svg width="304" height="468" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 468" role="img" aria-label="Vaginal discharge: bacterial vaginosis has pH above 4.5 and clue cells, trichomoniasis shows motile organisms, Candida has normal pH and hyphae; metronidazole for BV and trichomonas, fluconazole for Candida." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r131"><defs></defs><clipPath id="r131p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#r131p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="150.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">BV: pH &gt;4.5, clue cells</tspan></tspan></text><rect x="18.0" y="68.0" width="157.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Trich: motile organisms</tspan></tspan></text><rect x="18.0" y="96.0" width="186.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Candida: normal pH, hyphae</tspan></tspan></text><clipPath id="r131p2"><rect x="2" y="140" width="300" height="212" rx="14"/></clipPath><rect x="2" y="140" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="212" fill="#0F766E" clip-path="url(#r131p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="31.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">BV</tspan></tspan></text><text x="92.3" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Clue cells, </tspan><tspan font-weight="500">whiff test:</tspan></tspan><tspan x="92.3" dy="17"><tspan font-weight="500">metronidazole</tspan></tspan></text><rect x="18.0" y="220.0" width="45.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Trich</tspan></tspan></text><text x="92.3" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Motile organisms:</tspan></tspan><tspan x="92.3" dy="17"><tspan font-weight="500">metronidazole 7 days</tspan></tspan></text><rect x="18.0" y="262.0" width="64.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Candida</tspan></tspan></text><text x="92.3" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Hyphae on KOH: </tspan><tspan font-weight="500">fluconazole</tspan></tspan><tspan x="92.3" dy="17"><tspan font-weight="500">150 mg</tspan></tspan></text><rect x="18.0" y="304.0" width="66.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="319.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Partners</tspan></tspan></text><text x="92.3" y="319.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.3" dy="0"><tspan font-weight="700">Treat trich partners; </tspan><tspan font-weight="500">NAAT if</tspan></tspan><tspan x="92.3" dy="17"><tspan font-weight="500">wet mount negative</tspan></tspan></text><clipPath id="r131p3"><rect x="2" y="360" width="300" height="104" rx="14"/></clipPath><rect x="2" y="360" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="360" width="5" height="104" fill="#B7410E" clip-path="url(#r131p3)"/><text x="18" y="384" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="409.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Trichomonas: </tspan><tspan font-weight="500">microscopy misses about</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">half of cases; use NAAT, treat partners</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">and retest at 3 months.</tspan></tspan></text></svg>