<svg width="304" height="402" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 402" role="img" aria-label="Menopause: hormone therapy favorable under 60 or within 10 years; progestogen if uterus; fezolinetant as nonhormonal option." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r131"><defs></defs><clipPath id="r131p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#r131p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Assess</tspan></text><rect x="18.0" y="40.0" width="115.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;60 or &lt;10 y: HT</tspan></tspan></text><rect x="18.0" y="68.0" width="165.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Uterus: add progestogen</tspan></tspan></text><rect x="18.0" y="96.0" width="145.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Nonhormonal options</tspan></tspan></text><clipPath id="r131p2"><rect x="2" y="140" width="300" height="164" rx="14"/></clipPath><rect x="2" y="140" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="164" fill="#0F766E" clip-path="url(#r131p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="58.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Assess</tspan></tspan></text><text x="84.6" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.6" dy="0"><tspan font-weight="700">Age, years since </tspan><tspan font-weight="500">menopause</tspan></tspan></text><rect x="18.0" y="208.0" width="54.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Uterus</tspan></tspan></text><text x="84.6" y="223.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.6" dy="0"><tspan font-weight="700">Estrogen + progestogen</tspan></tspan></text><rect x="18.0" y="238.0" width="51.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="253.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">No HT</tspan></tspan></text><text x="84.6" y="253.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.6" dy="0"><tspan font-weight="700">Fezolinetant, </tspan><tspan font-weight="500">SSRI/SNRI</tspan></tspan></text><rect x="18.0" y="268.0" width="43.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="283.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GSM</tspan></tspan></text><text x="84.6" y="283.5" font-size=