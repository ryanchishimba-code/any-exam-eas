<svg width="304" height="633" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 633" role="img" aria-label="Bleeding duodenal ulcer. Restrictive transfusion below hemoglobin 7, endoscopy within 24 hours, high-dose PPI after endoscopic hemostasis, and outpatient care for Glasgow-Blatchford score 0 to 1." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g57"><defs></defs><clipPath id="g57p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#g57p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Upper GI bleed (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M58,80 Q78,150 148,136 Q188,124 194,96 L248,100 L248,120 L198,120 Q188,152 138,154 Q58,156 46,80 Z" fill="#E8B7A8" stroke="#A8705F" stroke-width="1.2" /><ellipse cx="223.0" cy="110.0" rx="7" ry="5" fill="#E0533F" stroke="#8E2A1E" stroke-width="1"/><g class="lb" data-n="1"><line class="ld" x1="223.0" y1="110.0" x2="186.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="223.0" cy="110.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="162" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Bleeding duodenal ulcer</tspan></tspan></text></g><g class="q" display="none"><circle cx="181.2" cy="195.9" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M178.0,193.3 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="181.3" cy="201.1" r="1.2" fill="#fff"/></g><circle class="hit" cx="181.2" cy="195.9" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="173.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Glasgow-Blatchford score</tspan></tspan></text><rect x="18.0" y="249.0" width="129.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Two large-bore IVs</tspan></tspan></text><clipPath id="g57p2"><rect x="2" y="293" width="300" height="188" rx="14"/></clipPath><rect x="2" y="293" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="188" fill="#0F766E" clip-path="url(#g57p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Resuscitate, then scope</tspan></text><rect x="18.0" y="331.0" width="49.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hb &lt;7</tspan></tspan></text><text x="75.9" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.9" dy="0"><tspan font-weight="700">Restrictive transfusion </tspan><tspan font-weight="500">(8 with</tspan></tspan><tspan x="75.9" dy="17"><tspan font-weight="500">CV disease)</tspan></tspan></text><rect x="18.0" y="373.0" width="49.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≤24 h</tspan></tspan></text><text x="75.9" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.9" dy="0"><tspan font-weight="700">Endoscopy; </tspan><tspan font-weight="500">erythromycin before</tspan></tspan></text><rect x="18.0" y="403.0" width="44.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">After</tspan></tspan></text><text x="75.9" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.9" dy="0"><tspan font-weight="700">High-dose PPI </tspan><tspan font-weight="500">3 days, then twice</tspan></tspan><tspan x="75.9" dy="17"><tspan font-weight="500">daily to 2 weeks</tspan></tspan></text><rect x="18.0" y="445.0" width="46.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="460.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ulcer</tspan></tspan></text><text x="75.9" y="460.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.9" dy="0"><tspan font-weight="500">Test and treat </tspan><tspan font-weight="700">H. pylori</tspan></tspan></text><clipPath id="g57p3"><rect x="2" y="489" width="300" height="140" rx="14"/></clipPath><rect x="2" y="489" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="489" width="5" height="140" fill="#B7410E" clip-path="url(#g57p3)"/><text x="18" y="513" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="538.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Glasgow-Blatchford 0–1 </tspan><tspan font-weight="500">= very low risk:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">discharge with outpatient follow-up.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Pre-endoscopy PPI: no recommendation</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">for or against. Suspect varices in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cirrhosis: add octreotide and antibiotics.</tspan></tspan></text></svg>