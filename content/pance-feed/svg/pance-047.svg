></tspan></text><rect x="18.0" y="249.0" width="105.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hypercalcemia</tspan></tspan></text><rect x="129.9" y="249.0" width="80.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="136.9" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="136.9" dy="0"><tspan font-weight="700">Age 20–40</tspan></tspan></text><clipPath id="p47p2"><rect x="2" y="293" width="300" height="204" rx="14"/></clipPath><rect x="2" y="293" width="300" height="204" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="204" fill="#0F766E" clip-path="url(#p47p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Confirm, then treat if needed</tspan></text><rect x="18.0" y="331.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confirm</tspan></tspan></text><text x="89.7" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="500">Compatible picture +</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="700">nonnecrotizing granulomas </tspan><tspan font-weight="500">+</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">other causes excluded</tspan></tspan></text><rect x="18.0" y="390.0" width="59.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="405.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Sample</tspan></tspan></text><text x="89.7" y="405.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">EBUS-guided </tspan><tspan font-weight="500">node biopsy</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">before mediastinoscopy</tspan></tspan></text><rect x="18.0" y="432.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="447.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="89.7" y="447.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="500">Symptomatic or</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">organ-threatening:</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="700">glucocorticoids</tspan></tspan></text><clipPath id="p47p3"><rect x="2" y="505" width="300" height="140" rx="14"/></clipPath><rect x="2" y="505" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="505" width="5" height="140" fill="#B7410E" clip-path="url(#p47p3)"/><text x="18" y="529" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="554.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Löfgren syndrome </tspan><tspan font-weight="500">(hilar nodes, erythema</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">nodosum, fever, ankle arthritis) is typical</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">enough that biopsy is often unnecessary.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Screen all patients for eye, heart and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">calcium involvement.</tspan></tspan></text></svg>