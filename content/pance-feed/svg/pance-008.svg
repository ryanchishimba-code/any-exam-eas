4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="179.1" cy="107.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="179.0" cy="102.0" r="22" fill="transparent"/></g><clipPath id="s8p2"><rect x="2" y="192" width="300" height="196" rx="14"/></clipPath><rect x="2" y="192" width="300" height="196" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="192" width="5" height="196" fill="#0F766E" clip-path="url(#s8p2)"/><text x="18" y="216" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Bismuth quadruple therapy</tspan></text><rect x="18.0" y="230.0" width="131.0" height="50.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="240.0" width="4.0" height="30.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="250.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">PPI</tspan></tspan></text><text x="32.0" y="268.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">Acid suppression</tspan></tspan></text><rect x="157.0" y="230.0" width="131.0" height="50.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="158.0" y="240.0" width="4.0" height="30.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="171.0" y="250.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="700">Bismuth</tspan></tspan></text><text x="171.0" y="268.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="500">Subsalicylate or</tspan></tspan><tspan x="171.0" dy="14"><tspan font-weight="500">subcitrate</tspan></tspan></text><rect x="18.0" y="288.0" width="131.0" height="50.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="298.0" width="4.0" height="30.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="308.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">Tetracycline</tspan></tspan></text><text x="32.0" y="326.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">500 mg four times</tspan></tspan><tspan x="32.0" dy="14"><tspan font-weight="500">daily</tspan></tspan></text><rect x="157.0" y="288.0" width="131.0" height="50.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="158.0" y="298.0" width="4.0" height="30.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="171.0" y="308.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="700">Metronidazole</tspan></tspan></text><text x="171.0" y="326.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="500">500 mg three to</tspan></tspan><tspan x="171.0" dy="14"><tspan font-weight="500">four times daily</tspan></tspan></text><rect x="18.0" y="352.0" width="108.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="367.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">all four, 14 days</tspan></tspan></text><clipPath id="s8p3"><rect x="2" y="396" width="300" height="104" rx="14"/></clipPath><rect x="2" y="396" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="396" width="5" height="104" fill="#B7410E" clip-path="url(#s8p3)"/><text x="18" y="420" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="445.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Skip clarithromycin unless susceptibility is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">known. Test for cure ≥4 weeks later, with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">the PPI stopped about 2 weeks before.</tspan></tspan></text></svg>