<svg width="304" height="446" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 446" role="img" aria-label="Guillain-Barré syndrome with ascending weakness and lost reflexes treated with IVIG or plasma exchange and close breathing monitoring; myasthenia gravis with fatigable ptosis tested with AChR antibodies and treated with pyridostigmine." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n103"><defs></defs><clipPath id="n103p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n103p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Two weaknesses</tspan></text><rect x="18.0" y="40.0" width="99.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GBS: areflexia</tspan></tspan></text><rect x="123.8" y="40.0" width="136.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="130.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="130.8" dy="0"><tspan font-weight="700">MG: fatigable ptosis</tspan></tspan></text><rect x="18.0" y="68.0" width="134.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Both: breathing risk</tspan></tspan></text><clipPath id="n103p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="200" fill="#0F766E" clip-path="url(#n103p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="39.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GBS</tspan></tspan></text><text x="106.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.1" dy="0"><tspan font-weight="700">IVIG </tspan><tspan font-weight="500">5 days or </tspan><tspan font-weight="700">plasma</tspan></tspan><tspan x="106.1" dy="17"><tspan font-weight="700">exchange</tspan></tspan></text><rect x="18.0" y="192.0" width="80.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GBS watch</tspan></tspan></text><text x="106.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.1" dy="0"><tspan font-weight="700">Vital capacity, </tspan><tspan font-weight="500">autonomic</tspan></tspan><tspan x="106.1" dy="17"><tspan font-weight="500">signs</tspan></tspan></text><rect x="18.0" y="234.0" width="61.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">MG test</tspan></tspan></text><text x="106.1" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.1" dy="0"><tspan font-weight="700">AChR antibodies; </tspan><tspan font-weight="500">CT for</tspan></tspan><tspan x="106.1" dy="17"><tspan font-weight="500">thymoma</tspan></tspan></text><rect x="18.0" y="276.0" width="66.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">MG treat</tspan></tspan></text><text x="106.1" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.1" dy="0"><tspan font-weight="700">Pyridostigmine</tspan></tspan></text><clipPath id="n103p3"><rect x="2" y="320" width="300" height="122" rx="14"/></clipPath><rect x="2" y="320" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="122" fill="#B7410E" clip-path="url(#n103p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">IVIG and plasma exchange are equal </tspan><tspan font-weight="500">in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">GBS; do not combine them back to back.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Both conditions can cause respiratory</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">failure.</tspan></tspan></text></svg>