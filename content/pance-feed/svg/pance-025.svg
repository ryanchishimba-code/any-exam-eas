<svg width="304" height="570" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 570" role="img" aria-label="Lipids, 2026 guideline. PREVENT 10-year ASCVD risk bands: low under 3 percent, borderline 3 to under 5, intermediate 5 to under 10, high 10 or more, with the matching statin action. Very-high-risk ASCVD: LDL-C goal under 55. If not at goal on maximal statin, add ezetimibe, then a PCSK9 inhibitor or bempedoic acid." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s25"><defs></defs><clipPath id="s25p1"><rect x="2" y="2" width="300" height="210" rx="14"/></clipPath><rect x="2" y="2" width="300" height="210" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="210" fill="#0B5CAD" clip-path="url(#s25p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Risk bands (schematic)</tspan></text><text x="18.0" y="51.0" font-size="12" font-weight="700" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">PREVENT 10-year ASCVD risk, ages 30–79</tspan></tspan></text><rect x="18.0" y="58.0" width="270.0" height="30.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1"/><text x="28.0" y="77.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">&lt;3% Low: lifestyle</tspan></tspan></text><rect x="18.0" y="93.0" width="270.0" height="30.0" rx="8" fill="#B9D6EE" stroke="none" stroke-width="1"/><text x="28.0" y="112.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">3 to &lt;5% Borderline: discuss statin</tspan></tspan></text><rect x="18.0" y="128.0" width="270.0" height="30.0" rx="8" fill="#7FB0DB" stroke="none" stroke-width="1"/><text x="28.0" y="147.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">5 to &lt;10% Intermediate: ≥ moderate statin</tspan></tspan></text><rect x="18.0" y="163.0" width="270.0" height="30.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="28.0" y="182.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">≥10% High: high-intensity statin</tspan></tspan></text><clipPath id="s25p2"><rect x="2" y="220" width="300" height="216" rx="14"/></clipPath><rect x="2" y="220" width="300" height="216" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="220" width="5" height="216" fill="#0F766E" clip-path="url(#s25p2)"/><text x="18" y="244" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat to goal</tspan></text><rect x="18.0" y="258.0" width="78.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="57.0" y="275.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="57.0" dy="0"><tspan font-weight="700">Max</tspan></tspan><tspan x="57.0" dy="15"><tspan font-weight="700">statin</tspan></tspan></text><rect x="102.0" y="258.0" width="80.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="142.0" y="275.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="142.0" dy="0"><tspan font-weight="700">+</tspan></tspan><tspan x="142.0" dy="15"><tspan font-weight="700">ezetimibe</tspan></tspan></text><rect x="188.0" y="258.0" width="98.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="237.0" y="275.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="237.0" dy="0"><tspan font-weight="700">+ PCSK9i or</tspan></tspan><tspan x="237.0" dy="15"><tspan font-weight="700">bempedoic</tspan></tspan></text><rect x="18.0" y="310.0" width="169.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="325.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Very high risk: LDL-C &lt;55</tspan></tspan></text><rect x="18.0" y="338.0" width="111.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="353.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Non-HDL-C &lt;85</tspan></tspan></text><text x="18.0" y="381.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">LDL ≥190: </tspan><tspan font-weight="500">maximal statin. </tspan><tspan font-weight="700">Diabetes, CKD</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">3–4, HIV </tspan><tspan font-weight="500">at ages 40–75: lower LDL.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">Measure Lp(a) </tspan><tspan font-weight="500">once.</tspan></tspan></text><clipPath id="s25p3"><rect x="2" y="444" width="300" height="122" rx="14"/></clipPath><rect x="2" y="444" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="444" width="5" height="122" fill="#B7410E" clip-path="url(#s25p3)"/><text x="18" y="468" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="493.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Estimate risk with PREVENT, not the old</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Pooled Cohort Equations. The 2026</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">guideline replaces the 2018 cholesterol</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">guideline and brings LDL-C goals back.</tspan></tspan></text></svg>