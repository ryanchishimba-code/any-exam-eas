></text><clipPath id="g59p3"><rect x="2" y="509" width="300" height="140" rx="14"/></clipPath><rect x="2" y="509" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="509" width="5" height="140" fill="#B7410E" clip-path="url(#g59p3)"/><text x="18" y="533" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="558.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Antibiotics-first </tspan><tspan font-weight="500">is a shared-decision</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">option in uncomplicated appendicitis</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">without an appendicolith; recurrence is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">common. Perforation or abscess changes</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">the plan.</tspan></tspan></text></svg>