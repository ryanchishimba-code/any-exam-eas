<svg width="304" height="540" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 540" role="img" aria-label="Acute cholangitis. Schematic biliary tree with a stone blocking the common bile duct and infected, dilated ducts above it. Fever, jaundice and right upper quadrant pain (Charcot triad). Treat with fluids, cultures and antibiotics, and drain early if moderate or urgently once stabilized if severe." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s9"><defs><linearGradient id="s9bi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9C45A"/><stop offset="1" stop-color="#B79C2E"/></linearGradient><linearGradient id="s9lv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9705A"/><stop offset="1" stop-color="#8E4A3A"/></linearGradient></defs><clipPath id="s9p1"><rect x="2" y="2" width="300" height="266" rx="14"/></clipPath><rect x="2" y="2" width="300" height="266" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="266" fill="#0B5CAD" clip-path="url(#s9p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Biliary obstruction (schematic)</tspan></text><path d="M20.0,46.0 C24.7,37.7 43.7,39.3 58.0,40.0 C72.3,40.7 94.7,44.3 106.0,50.0 C117.3,55.7 124.7,66.3 126.0,74.0 C127.3,81.7 123.7,91.0 114.0,96.0 C104.3,101.0 82.0,105.0 68.0,104.0 C54.0,103.0 38.0,99.7 30.0,90.0 C22.0,80.3 15.3,54.3 20.0,46.0 Z" fill="url(#s9lv)" stroke="#6E3A2D" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M214.0,136.0 C221.0,130.0 238.0,127.3 250.0,128.0 C262.0,128.7 279.3,134.3 286.0,140.0 C292.7,145.7 293.3,155.3 290.0,162.0 C286.7,168.7 277.0,177.0 266.0,180.0 C255.0,183.0 233.7,182.7 224.0,180.0 C214.3,177.3 209.7,171.3 208.0,164.0 C206.3,156.7 207.0,142.0 214.0,136.0 Z" fill="#F2D2C6" stroke="#B5766A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M130.0,126.0 C132.3,125.7 141.7,124.3 144.0,124.0" fill="none" stroke="#7C6A18" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M130.0,126.0 C132.3,125.7 141.7,124.3 144.0,124.0" fill="none" stroke="url(#s9bi)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M144.0,114.0 C148.0,111.3 159.7,109.0 164.0,112.0 C168.3,115.0 170.7,126.0 170.0,132.0 C169.3,138.0 164.0,146.0 160.0,148.0 C156.0,150.0 149.3,147.3 146.0,144.0 C142.7,140.7 140.3,133.0 140.0,128.0 C139.7,123.0 140.0,116.7 144.0,114.0 Z" fill="url(#s9bi)" stroke="#7C6A18" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><path d="M48.0,62.0 C53.3,64.7 67.3,71.3 80.0,78.0 C92.7,84.7 116.7,98.0 124.0,102.0" fill="none" stroke="#7C6A18" stroke-width="7.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M48.0,62.0 C53.3,64.7 67.3,71.3 80.0,78.0 C92.7,84.7 116.7,98.0 124.0,102.0" fill="none" stroke="url(#s9bi)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M72.0,86.0 C76.3,87.7 89.3,93.3 98.0,96.0 C106.7,98.7 119.7,101.0 124.0,102.0" fill="none" stroke="#7C6A18" stroke-width="7.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M72.0,86.0 C76.3,87.7 89.3,93.3 98.0,96.0 C106.7,98.7 119.7,101.0 124.0,102.0" fill="none" stroke="url(#s9bi)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M124.0,102.0 C124.7,105.7 126.7,117.0 128.0,124.0 C129.3,131.0 129.7,137.3 132.0,144.0 C134.3,150.7 136.0,159.0 142.0,164.0 C148.0,169.0 159.3,172.7 168.0,174.0 C176.7,175.3 189.7,172.3 194.0,172.0" fill="none" stroke="#7C6A18" stroke-width="10.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M124.0,102.0 C124.7,105.7 126.7,117.0 128.0,124.0 C129.3,131.0 129.7,137.3 132.0,144.0 C134.3,150.7 136.0,159.0 142.0,164.0 C148.0,169.0 159.3,172.7 168.0,174.0 C176.7,175.3 189.7,172.3 194.0,172.0" fill="none" stroke="url(#s9bi)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.0,172.0 C197.0,171.3 207.3,169.7 212.0,168.0 C216.7,166.3 220.3,163.0 222.0,162.0" fill="none" stroke="#9C8B4A" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M194.0,172.0 C197.0,171.3 207.3,169.7 212.0,168.0 C216.7,166.3 220.3,163.0 222.0,162.0" fill="none" stroke="#E6D9A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200.0" cy="171.0" r="7" fill="#7D8B88" stroke="#3F4B49" stroke-width="1.3"/><circle cx="198.0" cy="169.0" r="2.2" fill="#D6DEDC" stroke="none" stroke-width="1"/><g class="lb" data-n="1"><line class="ld" x1="200.0" y1="171.0" x2="200.0" y2="190.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="200.0" cy="171.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="186.0" y="190.0" width="93" height="40" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="193.0" y="209.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="193.0" dy="0"><tspan font-weight="700">Stone blocks</tspan></tspan><tspan x="193.0" dy="15"><tspan font-weight="700">the duct</tspan></tspan></text></g><g class="q" display="none"><circle cx="200.0" cy="201.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M196.8,198.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="200.1" cy="206.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="200.0" cy="201.0" r="22" fill="transparent"/></g><g class="lb" data-n="2"><line class="ld" x1="126.0" y1="110.0" x2="186.0" y2="88.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="126.0" cy="110.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="186.0" y="48.0" width="90" height="40" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="193.0" y="67.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="193.0" dy="0"><tspan font-weight="700">Infected bile</tspan></tspan><tspan x="193.0" dy="15"><tspan font-weight="700">backs up</tspan></tspan></text></g><g class="q" display="none"><circle cx="196.3" cy="84.2" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M193.1,81.6 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="196.4" cy="89.4" r="1.2" fill="#fff"/></g><circle class="hit" cx="196.3" cy="84.2" r="22" fill="transparent"/></g><rect x="18.0" y="230.0" width="48.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="245.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever</tspan></tspan></text><rect x="70.0" y="230.0" width="70.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="77.0" y="245.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="77.0" dy="0"><tspan font-weight="700">Jaundice</tspan></tspan></text><rect x="144.1" y="230.0" width="70.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="151.1" y="245.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="151.1" dy="0"><tspan font-weight="700">RUQ pain</tspan></tspan></text><text x="219.4" y="245.5" font-size="12" font-weight="600" fill="#4A625F" xml:space="preserve"><tspan x="219.4" dy="0"><tspan font-weight="600">Charcot triad</tspan></tspan></text><clipPath id="s9p2"><rect x="2" y="276" width="300" height="148" rx="14"/></clipPath><rect x="2" y="276" width="300" height="148" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="276" width="5" height="148" fill="#0F766E" clip-path="url(#s9p2)"/><text x="18" y="300" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Antibiotics plus drainage</tspan></text><text x="18.0" y="325.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Always: </tspan><tspan font-weight="500">fluids, blood cultures, antibiotics.</tspan></tspan></text><rect x="18.0" y="332.0" width="42.3" height="22.0" rx="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="26.0" y="347.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="26.0" dy="0"><tspan font-weight="700">Mild</tspan></tspan></text><text x="68.3" y="347.5" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="68.3" dy="0"><tspan font-weight="500">Drain if no response to antibiotics</tspan></tspan></text><rect x="18.0" y="360.0" width="74.6" height="22.0" rx="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="26.0" y="375.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="26.0" dy="0"><tspan font-weight="700">Moderate</tspan></tspan></text><text x="100.6" y="375.5" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.6" dy="0"><tspan font-weight="500">Early drainage, usually ERCP</tspan></tspan></text><rect x="18.0" y="388.0" width="58.3" height="22.0" rx="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="26.0" y="403.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="26.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="84.3" y="403.5" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.3" dy="0"><tspan font-weight="500">Urgent drainage once stabilized</tspan></tspan></text><clipPath id="s9p3"><rect x="2" y="432" width="300" height="104" rx="14"/></clipPath><rect x="2" y="432" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="432" width="5" height="104" fill="#B7410E" clip-path="url(#s9p3)"/><text x="18" y="456" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="481.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Add low blood pressure and confusion</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(Reynolds pentad): severe disease, drain</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">urgently.</tspan></tspan></text></svg>