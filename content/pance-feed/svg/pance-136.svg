<svg width="304" height="358" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 358" role="img" aria-label="Hypoglycemia levels: level 1 below 70, level 2 below 54, level 3 severe needing assistance; glucose 15 to 20 grams or glucagon." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="e136"><defs></defs><clipPath id="e136p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#e136p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Classify</tspan></text><rect x="18.0" y="40.0" width="52.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">L1 &lt;70</tspan></tspan></text><rect x="76.8" y="40.0" width="56.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="83.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="83.8" dy="0"><tspan font-weight="700">L2 &lt;54</tspan></tspan></text><rect x="139.3" y="40.0" width="103.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="146.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="146.3" dy="0"><tspan font-weight="700">L3: needs help</tspan></tspan></text><clipPath id="e136p2"><rect x="2" y="84" width="300" height="176" rx="14"/></clipPath><rect x="2" y="84" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="176" fill="#0F766E" clip-path="url(#e136p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="122.0" width="44.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Alert</tspan></tspan></text><text x="125.4" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="125.4" dy="0"><tspan font-weight="700">15–20 g </tspan><tspan font-weight="500">glucose</tspan></tspan></text><rect x="18.0" y="152.0" width="66.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Recheck</tspan></tspan></text><text x="125.4" y="167.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="125.4" dy="0"><tspan font-weight="700">15 minutes</tspan></tspan></text><rect x="18.0" y="182.0" width="99.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="197.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Can't swallow</tspan></tspan></text><text x="125.4" y="197.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="125.4" dy="0"><tspan font-weight="700">Glucagon</tspan></tspan></text><rect x="18.0" y="212.0" width="61.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="227.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prevent</tspan></tspan></text><text x="125.4" y="227.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="125.4" dy="0"><tspan font-weight="700">Prescribe glucagon,</tspan></tspan><tspan x="125.4" dy="17"><tspan font-weight="500">CGM</tspan></tspan></text><clipPath id="e136p3"><rect x="2" y="268" width="300" height="86" rx="14"/></clipPath><rect x="2" y="268" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="268" width="5" height="86" fill="#B7410E" clip-path="url(#e136p3)"/><text x="18" y="292" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="317.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Glucagon </tspan><tspan font-weight="500">should be available for anyone</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">on insulin or at high hypoglycemia risk.</tspan></tspan></text></svg>