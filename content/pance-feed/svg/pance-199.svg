<svg xmlns="http://www.w3.org/2000/svg" width="400" height="272" viewBox="0 0 400 272" role="img" aria-label="Both raise cGMP in vascular smooth muscle, so the effect stacks">
<title>Both raise cGMP in vascular smooth muscle, so the effect stacks</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">GENITOURINARY</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Both raise cGMP in vascular smooth</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">muscle, so the effect stacks</text>
<line x1="28" y1="120" x2="372" y2="120" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="148" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">Nitric oxide activates guanylate cyclase.</text>
<text x="28" y="170" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">PDE-5 breaks cGMP down.</text>
<rect x="28" y="190" width="344" height="72" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="208" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">The washout depends on which PDE-5</text>
<text x="42" y="230" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">inhibitor was taken.</text>
</svg>
