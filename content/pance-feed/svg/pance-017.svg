<svg width="304" height="556" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 556" role="img" aria-label="Thrombotic thrombocytopenic purpura. Schematic blood smear with fragmented red cells (schistocytes) and few platelets. Fever, hemolytic anemia, low platelets, kidney and neurologic signs. Draw ADAMTS13 first, then start plasma exchange plus corticosteroids at once; rituximab or caplacizumab are add-ons. ADAMTS13 activity below 10 percent confirms it, but never wait for the result." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s17"><defs><clipPath id="s17c1"><circle cx="84" cy="106" r="62"/></clipPath></defs><clipPath id="s17p2"><rect x="2" y="2" width="300" height="248" rx="14"/></clipPath><rect x="2" y="2" width="300" height="248" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="248" fill="#0B5CAD" clip-path="url(#s17p2)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Blood smear (schematic)</tspan></text><circle cx="84" cy="106" r="64" fill="#E8D5DD" stroke="#B9A0AD" stroke-width="1.5"/><circle cx="84" cy="106" r="62" fill="#F6E9EE"/><g clip-path="url(#s17c1)"><circle cx="50.1" cy="67.8" r="10" fill="#EBA5A3" stroke="#C9706C" stroke-width="1.2"/><circle cx="50.1" cy="67.8" r="3.8" fill="#F8D6D3"/><circle cx="80.8" cy="58.7" r="10" fill="#EBA5A3" stroke="#C9706C" stroke-width="1.2"/><circle cx="80.8" cy="58.7" r="3.8" fill="#F8D6D3"/><circle cx="109.6" cy="69.2" r="10" fill="#EBA5A3" stroke="#C9706C" stroke-width="1.2"/><circle cx="109.6" cy="69.2" r="3.8" fill="#F8D6D3"/><circle cx="33.0" cy="91.7" r="10" fill="#EBA5A3" stroke="#C9706C" stroke-width="1.2"/><circle cx="33.0" cy="91.7" r="3.8" fill="#F8D6D3"/><path d="M50.2 95.3 Q59.2 77.3 68.2 95.3 L63.2 91.3 L55.2 91.3 Z" fill="#B63E3A" stroke="#7A1F1A"