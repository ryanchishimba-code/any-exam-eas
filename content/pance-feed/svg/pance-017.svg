/text></g><g class="q"><circle cx="173.0" cy="80.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M169.8,77.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="173.1" cy="85.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="173.0" cy="80.0" r="22" fill="transparent"/></g><g class="lb" data-n="2"><line class="ld" x1="104.0" y1="108.0" x2="162.0" y2="108.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="104.0" cy="108.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="162.0" y="104.0" width="95" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="169.0" y="123.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="169.0" dy="0"><tspan font-weight="700">Few platelets</tspan></tspan></text></g><g class="q"><circle cx="173.0" cy="108.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M169.8,105.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="173.1" cy="113.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="173.0" cy="108.0" r="22" fill="transparent"/></g><rect x="18.0" y="182.0" width="48.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="197.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever</tspan></tspan></text><rect x="72.0" y="182.0" width="123.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="79.0" y="197.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="79.0" dy="0"><tspan font-weight="700">Hemolytic anemia</tspan></tspan></text><rect x="201.7" y="182.0" width="94.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="208.7" y="197.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="208.7" dy="0"><tspan font-weight="700">Low platelets</tspan></tspan></text><rect x="18.0" y="210.0" width="92.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Kidney signs</tspan></tspan></text><rect x="116.8" y="210.0" width="116.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="123.8" y="225.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="123.8" dy="0"><tspan font-weight="700">Neurologic signs</tspan></tspan></text><clipPath id="s17p3"><rect x="2" y="258" width="300" height="182" rx="14"/></clipPath><rect x="2" y="258" width="300" height="182" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="258" width="5" height="182" fill="#0F766E" clip-path="url(#s17p3)"/><text x="18" y="282" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Do not wait for the result</tspan></text><circle cx="29.0" cy="309.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="314" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="50.0" y="312.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Draw ADAMTS13 </tspan><tspan font-weight="500">before plasma or</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">any blood product.</tspan></tspan></text><circle cx="29.0" cy="355.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="360" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="50.0" y="358.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Start now: </tspan><tspan font-weight="500">plasma exchange plus</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">corticosteroids.</tspan></tspan></text><circle cx="29.0" cy="401.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="406" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">+</text><text x="50.0" y="404.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Add-ons: </tspan><tspan font-weight="500">rituximab or</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">caplacizumab.</tspan></tspan></text><clipPath id="s17p4"><rect x="2" y="448" width="300" height="104" rx="14"/></clipPath><rect x="2" y="448" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="448" width="5" height="104" fill="#B7410E" clip-path="url(#s17p4)"/><text x="18" y="472" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="497.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">ADAMTS13 activity &lt;10 IU/dL confirms</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">TTP and separates it from HUS, but never</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">wait for the result to start treatment.</tspan></tspan></text></svg>