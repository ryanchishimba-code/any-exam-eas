<svg width="304" height="364" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 364" role="img" aria-label="Primary hyperparathyroidism: high calcium and PTH; surgery for calcium more than 1 above normal, age under 50, kidney or bone criteria." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="e142"><defs></defs><clipPath id="e142p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#e142p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="81.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">↑Ca ↑PTH</tspan></tspan></text><rect x="105.8" y="40.0" width="109.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="112.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="112.8" dy="0"><tspan font-weight="700">Surgery criteria</tspan></tspan></text><rect x="221.1" y="40.0" width="65.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="228.1" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="228.1" dy="0"><tspan font-weight="700">Age &lt;50</tspan></tspan></text><clipPath id="e142p2"><rect x="2" y="84" width="300" height="164" rx="14"/></clipPath><rect x="2" y="84" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="164" fill="#0F766E" clip-path="url(#e142p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="122.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confirm</tspan></tspan></text><text x="89.7" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Ca + PTH</tspan></tspan></text><rect x="18.0" y="152.0" width="53.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Serum</tspan></tspan></text><text x="89.7" y="167.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">&gt;1 mg/dL </tspan><tspan font-weight="500">above ULN</tspan></tspan></text><rect x="18.0" y="182.0" width="58.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="197.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Organs</tspan></tspan></text><text x="89.7" y="197.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">eGFR &lt;60, </tspan><tspan font-weight="500">stones, bone</tspan></tspan></text><rect x="18.0" y="212.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="227.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="89.7" y="227.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Parathyroidectomy</tspan></tspan></text><clipPath id="e142p3"><rect x="2" y="256" width="300" height="104" rx="14"/></clipPath><rect x="2" y="256" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="256" width="5" height="104" fill="#B7410E" clip-path="url(#e142p3)"/><text x="18" y="280" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="305.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Asymptomatic </tspan><tspan font-weight="500">patients still qualify if any</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">one criterion, including age &lt;50, is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">present.</tspan></tspan></text></svg>