<svg width="304" height="410" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 410" role="img" aria-label="Ectopic pregnancy: positive hCG with empty uterus; stable unruptured gets methotrexate, unstable goes to surgery." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r123"><defs></defs><clipPath id="r123p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#r123p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="136.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Empty uterus + hCG</tspan></tspan></text><rect x="18.0" y="68.0" width="141.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stable: methotrexate</tspan></tspan></text><rect x="165.6" y="68.0" width="93.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="172.6" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="172.6" dy="0"><tspan font-weight="700">Unstable: OR</tspan></tspan></text><clipPath id="r123p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#r123p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="94.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.5" dy="0"><tspan font-weight="700">TVUS </tspan><tspan font-weight="500">+ serial hCG</tspan></tspan></text><rect x="18.0" y="180.0" width="52.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stable</tspan></tspan></text><text x="94.5" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.5" dy="0"><tspan font-weight="700">Methotrexate, </tspan><tspan font-weight="500">follow hCG</tspan></tspan></text><rect x="18.0" y="210.0" width="68.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Unstable</tspan></tspan></text><text x="94.5" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.5" dy="0"><tspan font-weight="700">Laparoscopy</tspan></tspan></text><rect x="18.0" y="240.0" width="53.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Follow</tspan></tspan></text><text x="94.5" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.5" dy="0"><tspan font-weight="700">Serial hCG </tspan><tspan font-weight="500">to undetectable</tspan></tspan></text><clipPath id="r123p3"><rect x="2" y="284" width="300" height="122" rx="14"/></clipPath><rect x="2" y="284" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="122" fill="#B7410E" clip-path="url(#r123p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">hCG &gt;5,000, embryonic cardiac activity</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">or mass &gt;4 cm </tspan><tspan font-weight="500">are relative</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">contraindications that predict</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">methotrexate failure.</tspan></tspan></text></svg>