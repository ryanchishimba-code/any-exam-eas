<svg width="304" height="532" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 532" role="img" aria-label="Preeclampsia with severe features. Blood pressure dial in the severe range, 160 over 110 mmHg or higher. Three priorities: magnesium sulfate, treat severe hypertension within 30 to 60 minutes, and delivery after stabilization at 34 weeks or later. Magnesium toxicity: reflexes disappear first; the antidote is calcium gluconate." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s11"><defs></defs><clipPath id="s11p1"><rect x="2" y="2" width="300" height="186" rx="14"/></clipPath><rect x="2" y="2" width="300" height="186" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="186" fill="#0B5CAD" clip-path="url(#s11p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Severe-range blood pressure</tspan></text><path d="M28.0 126.0 A62 62 0 0 1 102.9 65.4" fill="none" stroke="#CFE0F2" stroke-width="12" stroke-linecap="butt"/><path d="M102.9 65.4 A62 62 0 0 1 152.0 126.0" fill="none" stroke="#0B5CAD" stroke-width="12" stroke-linecap="butt"/><line x1="37.0" y1="126.0" x2="44.0" y2="126.0" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="38.8" y1="112.3" x2="45.6" y2="114.1" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="44.1" y1="99.5" x2="50.2" y2="103.0" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="52.5" y1="88.5" x2="57.5" y2="93.5" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="63.5" y1="80.1" x2="67.0" y2="86.2" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="76.3" y1="74.8" x2="78.1" y2="81.6" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="90.0" y1="73.0" x2="90.0" y2="80.0" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="103.7" y1="74.8" x2="101.9" y2="81.6" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="116.5" y1="80.1" x2="113.0" y2="86.2" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="127.5" y1="88.5" x2="122.5" y2="93.5" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="135.9" y1="99.5" x2="129.8" y2="103.0" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="141.2" y1="112.3" x2="134.4" y2="114.1" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="143.0" y1="126.0" x2="136.0" y2="126.0" stroke="#4A625F" stroke-width="1.2" stroke-linecap="round"/><line x1="90.0" y1="126.0" x2="126.8" y2="95.1" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><circle cx="90.0" cy="126.0" r="6" fill="#0F2F2C" stroke="#fff" stroke-width="1.5"/><g class="lb" data-n="1"><line class="ld" x1="140.2" y1="89.6" x2="117.0" y2="148.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="140.2" cy="89.6" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="22.0" y="148.0" width="95" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="29.0" y="167.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="29.0" dy="0"><tspan font-weight="700">Severe range</tspan></tspan></text></g><g class="q" display="none"><circle cx="112.9" cy="158.2" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M109.7,155.6 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="113.0" cy="163.4" r="1.2" fill="#fff"/></g><circle class="hit" cx="112.9" cy="158.2" r="22" fill="transparent"/></g><text x="168.0" y="84.0" font-size="24" font-weight="800" fill="#0B5CAD" xml:space="preserve"><tspan x="168.0" dy="0"><tspan font-weight="700">≥160 / 110</tspan></tspan></text><text x="168.0" y="106.0" font-size="13" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="168.0" dy="0"><tspan font-weight="600">mmHg in pregnancy</tspan></tspan></text><text x="168.0" y="126.0" font-size="12" font-weight="600" fill="#4A625F" xml:space="preserve"><tspan x="168.0" dy="0"><tspan font-weight="600">systolic or diastolic</tspan></tspan></text><clipPath id="s11p2"><rect x="2" y="196" width="300" height="238" rx="14"/></clipPath><rect x="2" y="196" width="300" height="238" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="196" width="5" height="238" fill="#0F766E" clip-path="url(#s11p2)"/><text x="18" y="220" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Three priorities</tspan></text><rect x="18.0" y="234.0" width="270.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="244.0" width="4.0" height="38.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="256.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">Magnesium sulfate</tspan></tspan></text><rect x="155.0" y="242.0" width="125.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="162.0" y="257.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="162.0" dy="0"><tspan font-weight="700">24 h after delivery</tspan></tspan></text><text x="32.0" y="278.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">Seizure prevention and treatment.</tspan></tspan></text><rect x="18.0" y="298.0" width="270.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="308.0" width="4.0" height="38.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="320.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">Treat severe BP</tspan></tspan></text><rect x="160.8" y="306.0" width="119.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="167.8" y="321.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="167.8" dy="0"><tspan font-weight="700">within 30–60 min</tspan></tspan></text><text x="32.0" y="330.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">IV labetalol, hydralazine,</tspan></tspan><tspan x="32.0" dy="14"><tspan font-weight="500">nifedipine.</tspan></tspan></text><rect x="18.0" y="362.0" width="270.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="372.0" width="4.0" height="38.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="384.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">Deliver</tspan></tspan></text><rect x="198.5" y="370.0" width="81.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="205.5" y="385.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="205.5" dy="0"><tspan font-weight="700">≥34 weeks</tspan></tspan></text><text x="32.0" y="406.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">After maternal stabilization.</tspan></tspan></text><clipPath id="s11p3"><rect x="2" y="442" width="300" height="86" rx="14"/></clipPath><rect x="2" y="442" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="442" width="5" height="86" fill="#B7410E" clip-path="url(#s11p3)"/><text x="18" y="466" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="491.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Magnesium toxicity: reflexes disappear</tspan></tspan><tspan x="18.0" dy="14"><tspan font-weight="500">first. The antidote is calcium gluconate.</tspan></tspan></text></svg>