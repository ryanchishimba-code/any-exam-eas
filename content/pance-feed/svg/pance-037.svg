<svg width="304" height="506" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 506" role="img" aria-label="Syncope. Initial evaluation: history, orthostatic vital signs lying then standing, and a 12-lead ECG. Orthostatic hypotension is a fall of 20 systolic or 10 diastolic on standing. High-risk features: exertional syncope, palpitations, no prodrome, abnormal ECG, structural heart disease. Vasovagal syncope: reassure and avoid triggers." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s37"><defs></defs><clipPath id="s37p1"><rect x="2" y="2" width="300" height="220" rx="14"/></clipPath><rect x="2" y="2" width="300" height="220" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="220" fill="#0B5CAD" clip-path="url(#s37p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Lying to standing (schematic)</tspan></text><circle cx="30.0" cy="114.0" r="7" fill="#F6D9D3" stroke="#0B5CAD" stroke-width="1.8"/><line x1="37.0" y1="114.0" x2="84.0" y2="114.0" stroke="#0B5CAD" stroke-width="4" stroke-linecap="round"/><line x1="84.0" y1="114.0" x2="96.0" y2="122.0" stroke="#0B5CAD" stroke-width="3.5" stroke-linecap="round"/><line x1="84.0" y1="114.0" x2="98.0" y2="108.0" stroke="#0B5CAD" stroke-width="3.5" stroke-linecap="round"/><line x1="46.0" y1="114.0" x2="60.0" y2="123.0" stroke="#0B5CAD" stroke-width="3" stroke-linecap="round"/><line x1="98.0" y1="114.0" x2="123.6" y2="114.0" stroke="#0B5CAD" stroke-width="2.2" stroke-linecap="round"/><polygon points="130.0,114.0 122.8,117.5 122.8,110.5" fill="#0B5CAD"/><circle cx="154.0" cy="58.0" r="7" fill="#F6D9D3" stroke="#0B5CAD" stroke-width="1.8"/><line x1="154.0" y1="65.0" x2="154.0" y2="94.0" stroke="#0B5CAD" stroke-width="4" stroke-linecap="round"/><line x1="154.0" y1="94.0" x2="145.0" y2="116.0" stroke="#0B5CAD" stroke-width="3.5" stroke-linecap="round"/><line x1="154.0" y1="94.0" x2="163.0" y2="116.0" stroke="#0B5CAD" stroke-width="3.5" stroke-linecap="round"/><line x1="154.0" y1="72.0" x2="143.0" y2="88.0" stroke="#0B5CAD" stroke-width="3" stroke-linecap="round"/><line x1="154.0" y1="72.0" x2="165.0" y2="88.0" stroke="#0B5CAD" stroke-width="3" stroke-linecap="round"/><text x="182.0" y="68.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="182.0" dy="0"><tspan font-weight="700">Orthostatic</tspan></tspan><tspan x="182.0" dy="16"><tspan font-weight="700">hypotension: </tspan><tspan font-weight="500">fall</tspan></tspan><tspan x="182.0" dy="16"><tspan font-weight="500">of ≥20 systolic</tspan></tspan><tspan x="182.0" dy="16"><tspan font-weight="500">or ≥10 diastolic</tspan></tspan></text><text x="18.0" y="148.0" font-size="12" font-weight="700" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Red flags for a cardiac cause:</tspan></tspan></text><rect x="18.0" y="158.0" width="75.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Exertional</tspan></tspan></text><rect x="99.3" y="158.0" width="86.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="106.3" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="106.3" dy="0"><tspan font-weight="700">Palpitations</tspan></tspan></text><rect x="191.4" y="158.0" width="93.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="198.4" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="198.4" dy="0"><tspan font-weight="700">No prodrome</tspan></tspan></text><rect x="18.0" y="186.0" width="102.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="201.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Abnormal ECG</tspan></tspan></text><rect x="126.9" y="186.0" width="160.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="133.9" y="201.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="133.9" dy="0"><tspan font-weight="700">Structural heart disease</tspan></tspan></text><clipPath id="s37p2"><rect x="2" y="230" width="300" height="178" rx="14"/></clipPath><rect x="2" y="230" width="300" height="178" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="230" width="5" height="178" fill="#0F766E" clip-path="url(#s37p2)"/><text x="18" y="254" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Three first steps</tspan></text><rect x="18.0" y="268.0" width="76.0" height="38.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="56.0" y="291.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="56.0" dy="0"><tspan font-weight="700">History</tspan></tspan></text><rect x="100.0" y="268.0" width="100.0" height="38.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="150.0" y="283.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="150.0" dy="0"><tspan font-weight="700">Orthostatic</tspan></tspan><tspan x="150.0" dy="15"><tspan font-weight="700">vitals</tspan></tspan></text><rect x="206.0" y="268.0" width="76.0" height="38.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="244.0" y="283.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="244.0" dy="0"><tspan font-weight="700">12-lead</tspan></tspan><tspan x="244.0" dy="15"><tspan font-weight="700">ECG</tspan></tspan></text><text x="18.0" y="329.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Vasovagal: </tspan><tspan font-weight="500">reassure and avoid triggers; it</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">is diagnosed mainly from the history.</tspan></tspan></text><text x="18.0" y="371.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Cardiac syncope has a worse prognosis</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">than reflex syncope.</tspan></tspan></text><clipPath id="s37p3"><rect x="2" y="416" width="300" height="86" rx="14"/></clipPath><rect x="2" y="416" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="416" width="5" height="86" fill="#B7410E" clip-path="url(#s37p3)"/><text x="18" y="440" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="465.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">High-risk features point to a cardiac</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cause: evaluate further, and often admit.</tspan></tspan></text></svg>