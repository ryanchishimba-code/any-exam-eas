<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Atopic dermatitis: itchy relapsing rash on cheeks in infants and flexures in adults; treat with emollients and topical steroids; dupilumab for severe disease." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m188"><defs></defs><clipPath id="m188p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m188p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="101.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Itch + flexures</tspan></tspan></text><rect x="125.4" y="40.0" width="96.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="132.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="132.4" dy="0"><tspan font-weight="700">Atopy history</tspan></tspan></text><rect x="18.0" y="68.0" width="100.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Infant: cheeks</tspan></tspan></text><clipPath id="m188p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#m188p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="47.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Basic</tspan></tspan></text><text x="94.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.1" dy="0"><tspan font-weight="700">Emollients, </tspan><tspan font-weight="500">bathing care</tspan></tspan></text><rect x="18.0" y="180.0" width="51.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Flares</tspan></tspan></text><text x="94.1" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.1" dy="0"><tspan font-weight="700">Topical steroid </tspan><tspan font-weight="500">or calcineurin</tspan></tspan><tspan x="94.1" dy="17"><tspan font-weight="500">inhibitor</tspan></tspan></text><rect x="18.0" y="222.0" width="56.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="94.1" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.1" dy="0"><tspan font-weight="700">Dupilumab </tspan><tspan font-weight="500">or other systemic</tspan></tspan></text><rect x="18.0" y="252.0" width="68.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Infection</tspan></tspan></text><text x="94.1" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.1" dy="0"><tspan font-weight="700">Eczema herpeticum: </tspan><tspan font-weight="500">acyclovir</tspan></tspan></text><clipPath id="m188p3"><rect x="2" y="296" width="300" height="104" rx="14"/></clipPath><rect x="2" y="296" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="104" fill="#B7410E" clip-path="url(#m188p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Routine antimicrobials </tspan><tspan font-weight="500">add nothing;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">punched-out vesicles with fever mean</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">eczema herpeticum.</tspan></tspan></text></svg>