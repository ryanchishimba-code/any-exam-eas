<svg width="304" height="386" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 386" role="img" aria-label="Basal cell carcinoma is pearly with a rolled border; squamous cell carcinoma is scaly and ulcerated; excise low-risk lesions and use Mohs surgery for high-risk sites." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m187"><defs></defs><clipPath id="m187p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m187p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="127.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">BCC: pearly, rolled</tspan></tspan></text><rect x="18.0" y="68.0" width="144.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SCC: scaly, ulcerated</tspan></tspan></text><rect x="168.6" y="68.0" width="112.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="175.6" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="175.6" dy="0"><tspan font-weight="700">Ear/lip: high risk</tspan></tspan></text><clipPath id="m187p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#m187p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="55.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Biopsy</tspan></tspan></text><text x="123.4" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">Shave or punch </tspan><tspan font-weight="500">confirms</tspan></tspan><tspan x="123.4" dy="17"><tspan font-weight="500">type</tspan></tspan></text><rect x="18.0" y="192.0" width="97.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Low-risk BCC</tspan></tspan></text><text x="123.4" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">4 mm </tspan><tspan font-weight="500">margins</tspan></tspan></text><rect x="18.0" y="222.0" width="97.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Low-risk SCC</tspan></tspan></text><text x="123.4" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">4–6 mm </tspan><tspan font-weight="500">margins</tspan></tspan></text><rect x="18.0" y="252.0" width="71.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">High-risk</tspan></tspan></text><text x="123.4" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">Mohs </tspan><tspan font-weight="500">surgery</tspan></tspan></text><clipPath id="m187p3"><rect x="2" y="296" width="300" height="86" rx="14"/></clipPath><rect x="2" y="296" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="86" fill="#B7410E" clip-path="url(#m187p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">SCC </tspan><tspan font-weight="500">can metastasize; ear, lip, recurrent</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">or perineural tumors are high risk.</tspan></tspan></text></svg>