-width="1.2" stroke-linecap="round"/><circle class="dt" cx="126.0" cy="122.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="176.0" y="46.0" width="104" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="183.0" y="65.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="183.0" dy="0"><tspan font-weight="700">Blocked artery</tspan></tspan></text></g><g class="q" display="none"><circle cx="183.7" cy="63.1" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M180.5,60.5 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="183.8" cy="68.3" r="1.2" fill="#fff"/></g><circle class="hit" cx="183.7" cy="63.1" r="22" fill="transparent"/></g><g class="lb" data-n="2"><line class="ld" x1="140.0" y1="92.0" x2="176.0" y2="92.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="140.0" cy="92.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="176.0" y="92.0" width="104" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="183.0" y="111.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="183.0" dy="0"><tspan font-weight="700">Ischemic brain</tspan></tspan></text></g><g class="q" display="none"><circle cx="187.0" cy="92.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M183.8,89.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="187.1" cy="97.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="187.0" cy="92.0" r="22" fill="transparent"/></g><clipPath id="s13p3"><rect x="2" y="216" width="300" height="212" rx="14"/></clipPath><rect x="2" y="216" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="216" width="5" height="212" fill="#0F766E" clip-path="url(#s13p3)"/><text x="18" y="240" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Time is brain</tspan></text><rect x="18.0" y="256.0" width="135.0" height="24.0" rx="6" fill="#0F766E" stroke="none" stroke-width="1"/><text x="26.0" y="272.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="26.0" dy="0"><tspan font-weight="700">≤4.5 h</tspan></tspan></text><rect x="153.0" y="256.0" width="135.0" height="24.0" rx="6" fill="#DCEFEC" stroke="#9ED2CB" stroke-width="1"/><text x="161.0" y="272.5" font-size="12" font-weight="700" fill="#0B5A53" xml:space="preserve"><tspan x="161.0" dy="0"><tspan font-weight="700">selected by imaging</tspan></tspan></text><text x="18.0" y="298.0" font-size="12" font-weight="600" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="600">Hours from last known well</tspan></tspan></text><text x="18.0" y="321.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">First: </tspan><tspan font-weight="500">check glucose; noncontrast CT or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">MRI to exclude bleeding.</tspan></tspan></text><text x="18.0" y="365.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Disabling deficit: </tspan><tspan font-weight="500">tenecteplase or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">alteplase.</tspan></tspan></text><text x="18.0" y="409.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Large-vessel occlusion: </tspan><tspan font-weight="500">thrombectomy.</tspan></tspan></text><clipPath id="s13p4"><rect x="2" y="436" width="300" height="104" rx="14"/></clipPath><rect x="2" y="436" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="436" width="5" height="104" fill="#B7410E" clip-path="url(#s13p4)"/><text x="18" y="460" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="485.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Blood pressure must be &lt;185/110 before</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">lysis. A non-disabling deficit gets dual</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">antiplatelet therapy, not lysis.</tspan></tspan></text></svg>