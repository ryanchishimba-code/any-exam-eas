<svg width="304" height="478" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 478" role="img" aria-label="Microcytic anemia: ferritin below 45 means iron deficiency, so look for GI blood loss; thalassemia trait has a Mentzer index below 13; chronic disease has normal or high ferritin." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h169"><defs></defs><clipPath id="h169p1"><rect x="2" y="2" width="300" height="170" rx="14"/></clipPath><rect x="2" y="2" width="300" height="170" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="170" fill="#0B5CAD" clip-path="url(#h169p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><text x="18.0" y="53.0" font-size="12" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="800" fill="#92400E" letter-spacing=".8">MNEMONIC</tspan><tspan> </tspan><tspan font-weight="600">TICS: Thal, Iron, Chronic</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="600">disease, Sideroblastic</tspan></tspan></text><rect x="18.0" y="80.0" width="127.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ferritin &lt;45 ng/mL</tspan></tspan></text><rect x="18.0" y="108.0" width="151.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="123.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Thal trait: Mentzer &lt;13</tspan></tspan></text><rect x="18.0" y="136.0" width="166.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="151.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ACD: ferritin normal/high</tspan></tspan></text><clipPath id="h169p2"><rect x="2" y="180" width="300" height="200" rx="14"/></clipPath><rect x="2" y="180" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="180" width="5" height="200" fill="#0F766E" clip-path="url(#h169p2)"/><text x="18" y="204" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Work-up</tspan></text><rect x="18.0" y="218.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="233.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confirm</tspan></tspan></text><text x="89.7" y="233.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Ferritin </tspan><tspan font-weight="500">&lt;45 (add TSAT if</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">inflamed)</tspan></tspan></text><rect x="18.0" y="260.0" width="57.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="275.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Source</tspan></tspan></text><text x="89.7" y="275.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">EGD + colonoscopy </tspan><tspan font-weight="500">in men,</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">postmenopausal women</tspan></tspan></text><rect x="18.0" y="302.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="317.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="89.7" y="317.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Oral iron</tspan></tspan></text><rect x="18.0" y="332.0" width="41.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="347.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Trait</tspan></tspan></text><text x="89.7" y="347.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Hb electrophoresis </tspan><tspan font-weight="500">if ferritin</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">normal</tspan></tspan></text><clipPath id="h169p3"><rect x="2" y="388" width="300" height="86" rx="14"/></clipPath><rect x="2" y="388" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="388" width="5" height="86" fill="#B7410E" clip-path="url(#h169p3)"/><text x="18" y="412" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="437.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Inflammation </tspan><tspan font-weight="500">raises ferritin: a normal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">value does not exclude iron deficiency.</tspan></tspan></text></svg>