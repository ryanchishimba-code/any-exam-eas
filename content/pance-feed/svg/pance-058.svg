<svg width="304" height="597" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 597" role="img" aria-label="Acute pancreatitis diagnosed by two of three: typical pain, lipase above three times normal, or imaging. Moderate lactated Ringer's with frequent reassessment, early low-fat oral feeding, no prophylactic antibiotics." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g58"><defs></defs><clipPath id="g58p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#g58p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Pancreas (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M48.0,80.0 C48.0,90.0 38.0,129.3 48.0,140.0 C58.0,150.7 98.0,143.3 108.0,144.0" fill="none" stroke="#A8705F" stroke-width="16.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M48.0,80.0 C48.0,90.0 38.0,129.3 48.0,140.0 C58.0,150.7 98.0,143.3 108.0,144.0" fill="none" stroke="#E8B7A8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M78,114 Q138,92 256,90 Q264,102 252,108 Q158,112 92,136 Q66,134 78,114 Z" fill="#E39A5A" stroke="#E0533F" stroke-width="2.4" /><g class="lb" data-n="1"><line class="ld" x1="168.0" y1="102.0" x2="152.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="168.0" cy="102.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="128" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Inflamed pancreas</tspan></tspan></text></g><g class="q" display="none"><circle cx="149.9" cy="196.8" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M146.7,194.2 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="150.0" cy="202.0" r="1.2" fill="#fff"/></g><circle class="hit" cx="149.9" cy="196.8" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="78.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Gallstones</tspan></tspan></text><rect x="102.7" y="221.0" width="60.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="109.7" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="109.7" dy="0"><tspan font-weight="700">Alcohol</tspan></tspan></text><rect x="169.2" y="221.0" width="94.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="176.2" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="176.2" dy="0"><tspan font-weight="700">Triglycerides</tspan></tspan></text><rect x="18.0" y="249.0" width="146.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ultrasound for stones</tspan></tspan></text><clipPath id="g58p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#g58p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Fluids and early feeding</tspan></text><rect x="18.0" y="331.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fluids</tspan></tspan></text><text x="78.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.4" dy="0"><tspan font-weight="700">Moderate </tspan><tspan font-weight="500">lactated Ringer’s;</tspan></tspan><tspan x="78.4" dy="17"><tspan font-weight="500">reassess within 6 h</tspan></tspan></text><rect x="18.0" y="373.0" width="43.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Feed</tspan></tspan></text><text x="78.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.4" dy="0"><tspan font-weight="700">Low-fat solid diet </tspan><tspan font-weight="500">within 24–48 h</tspan></tspan><tspan x="78.4" dy="17"><tspan font-weight="500">if mild</tspan></tspan></text><rect x="18.0" y="415.0" width="52.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Biliary</tspan></tspan></text><text x="78.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.4" dy="0"><tspan font-weight="700">Cholecystectomy </tspan><tspan font-weight="500">same</tspan></tspan><tspan x="78.4" dy="17"><tspan font-weight="500">admission (mild gallstone AP)</tspan></tspan></text><clipPath id="g58p3"><rect x="2" y="471" width="300" height="122" rx="14"/></clipPath><rect x="2" y="471" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="122" fill="#B7410E" clip-path="url(#g58p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">No prophylactic antibiotics </tspan><tspan font-weight="500">even in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">severe AP. </tspan><tspan font-weight="700">ERCP within 72 h </tspan><tspan font-weight="500">only with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cholangitis or obstruction. Aggressive</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">fluids cause overload without benefit.</tspan></tspan></text></svg>