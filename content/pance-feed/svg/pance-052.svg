</tspan><tspan x="99.9" dy="17"><tspan font-weight="500">30–59 intermediate; &lt;30</tspan></tspan><tspan x="99.9" dy="17"><tspan font-weight="500">unlikely</tspan></tspan></text><rect x="18.0" y="390.0" width="73.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="405.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Genotype</tspan></tspan></text><text x="99.9" y="405.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.9" dy="0"><tspan font-weight="700">CFTR </tspan><tspan font-weight="500">variants guide</tspan></tspan><tspan x="99.9" dy="17"><tspan font-weight="500">modulator eligibility</tspan></tspan></text><rect x="18.0" y="432.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="447.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="99.9" y="447.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.9" dy="0"><tspan font-weight="700">Enzymes, </tspan><tspan font-weight="500">airway clearance,</tspan></tspan><tspan x="99.9" dy="17"><tspan font-weight="500">CFTR modulator</tspan></tspan></text><clipPath id="p52p3"><rect x="2" y="488" width="300" height="140" rx="14"/></clipPath><rect x="2" y="488" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="488" width="5" height="140" fill="#B7410E" clip-path="url(#p52p3)"/><text x="18" y="512" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="537.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">An </tspan><tspan font-weight="700">intermediate sweat chloride (30–59</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">mmol/L) </tspan><tspan font-weight="500">needs CFTR genetic testing, not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">reassurance. Newborn screening can</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">miss CF after in-utero modulator</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">exposure.</tspan></tspan></text></svg>