<svg width="304" height="422" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 422" role="img" aria-label="Renal colic: noncontrast CT is the usual first imaging test; an obstructed infected stone needs urgent drainage; use ultrasound in pregnancy." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n183"><defs></defs><clipPath id="n183p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n183p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="121.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Colic + hematuria</tspan></tspan></text><rect x="145.3" y="40.0" width="110.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="152.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="152.3" dy="0"><tspan font-weight="700">Noncontrast CT</tspan></tspan></text><rect x="18.0" y="68.0" width="130.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever: decompress</tspan></tspan></text><clipPath id="n183p2"><rect x="2" y="112" width="300" height="212" rx="14"/></clipPath><rect x="2" y="112" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="212" fill="#0F766E" clip-path="url(#n183p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Test</tspan></text><rect x="18.0" y="150.0" width="51.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Image</tspan></tspan></text><text x="108.9" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.9" dy="0"><tspan font-weight="700">Noncontrast CT</tspan></tspan><tspan x="108.9" dy="17"><tspan font-weight="500">(nonpregnant)</tspan></tspan></text><rect x="18.0" y="192.0" width="40.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pain</tspan></tspan></text><text x="108.9" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.9" dy="0"><tspan font-weight="700">NSAIDs; </tspan><tspan font-weight="500">tamsulosin for ≤10</tspan></tspan><tspan x="108.9" dy="17"><tspan font-weight="500">mm</tspan></tspan></text><rect x="18.0" y="234.0" width="82.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Emergency</tspan></tspan></text><text x="108.9" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.9" dy="0"><tspan font-weight="700">Fever + obstruction: </tspan><tspan font-weight="500">stent</tspan></tspan><tspan x="108.9" dy="17"><tspan font-weight="500">or nephrostomy</tspan></tspan></text><rect x="18.0" y="276.0" width="61.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prevent</tspan></tspan></text><text x="108.9" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.9" dy="0"><tspan font-weight="700">High fluid intake, </tspan><tspan font-weight="500">low</tspan></tspan><tspan x="108.9" dy="17"><tspan font-weight="500">sodium</tspan></tspan></text><clipPath id="n183p3"><rect x="2" y="332" width="300" height="86" rx="14"/></clipPath><rect x="2" y="332" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="332" width="5" height="86" fill="#B7410E" clip-path="url(#n183p3)"/><text x="18" y="356" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="381.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Pregnancy: </tspan><tspan font-weight="500">start with ultrasound, avoid</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">CT.</tspan></tspan></text></svg>