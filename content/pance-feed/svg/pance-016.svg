.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="173.1" cy="165.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="173.0" cy="160.0" r="22" fill="transparent"/></g><rect x="18.0" y="212.0" width="134.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="227.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Sudden severe pain</tspan></tspan></text><rect x="158.3" y="212.0" width="68.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="165.3" y="227.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="165.3" dy="0"><tspan font-weight="700">Vomiting</tspan></tspan></text><rect x="18.0" y="240.0" width="120.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">High-riding testis</tspan></tspan></text><rect x="144.4" y="240.0" width="145.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="151.4" y="255.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="151.4" dy="0"><tspan font-weight="700">No cremasteric reflex</tspan></tspan></text><clipPath id="s16p2"><rect x="2" y="288" width="300" height="130" rx="14"/></clipPath><rect x="2" y="288" width="300" height="130" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="288" width="5" height="130" fill="#0F766E" clip-path="url(#s16p2)"/><text x="18" y="312" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Operate, do not wait</tspan></text><text x="18.0" y="337.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Urgent surgical exploration and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">detorsion. </tspan><tspan font-weight="500">With high suspicion, imaging</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">must not delay it.</tspan></tspan></text><text x="18.0" y="399.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Fix the other testis too </tspan><tspan font-weight="500">(orchiopexy).</tspan></tspan></text><clipPath id="s16p3"><rect x="2" y="426" width="300" height="174" rx="14"/></clipPath><rect x="2" y="426" width="300" height="174" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="426" width="5" height="174" fill="#B7410E" clip-path="url(#s16p3)"/><text x="18" y="450" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="476.0" font-size="13" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="600">Salvage falls fast. AUA teaching figures,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="600">not guarantees:</tspan></tspan></text><text x="18.0" y="523.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">≤6 h</tspan></tspan></text><rect x="64.0" y="510.0" width="200.0" height="20.0" rx="5" fill="#92400E" stroke="none" stroke-width="1"/><text x="72.0" y="524.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="72.0" dy="0"><tspan font-weight="700">approaches 100%</tspan></tspan></text><text x="18.0" y="551.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">&gt;12 h</tspan></tspan></text><rect x="64.0" y="538.0" width="40.0" height="20.0" rx="5" fill="#92400E" stroke="none" stroke-width="1"/><text x="112.0" y="552.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="112.0" dy="0"><tspan font-weight="700">about 20%</tspan></tspan></text><text x="18.0" y="579.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">&gt;24 h</tspan></tspan></text><rect x="64.0" y="566.0" width="6.0" height="20.0" rx="5" fill="#92400E" stroke="none" stroke-width="1"/><text x="78.0" y="580.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="78.0" dy="0"><tspan font-weight="700">virtually none</tspan></tspan></text></svg>