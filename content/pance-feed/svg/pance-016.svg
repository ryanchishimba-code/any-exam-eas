<svg width="304" height="604" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 604" role="img" aria-label="Testicular torsion. Schematic testis with a twisted spermatic cord. Sudden severe pain, vomiting, high-riding testis, absent cremasteric reflex. Urgent exploration and detorsion without waiting for imaging when suspicion is high; fix the other testis too. AUA teaching figures for salvage: near 100 percent within 6 hours, about 20 percent after 12 hours, virtually none after 24 hours." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s16"><defs><radialGradient id="s16ts" cx="0.4" cy="0.3" r="1"><stop offset="0" stop-color="#B9A0C9"/><stop offset="1" stop-color="#7A5C93"/></radialGradient></defs><clipPath id="s16p1"><rect x="2" y="2" width="300" height="278" rx="14"/></clipPath><rect x="2" y="2" width="300" height="278" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="278" fill="#0B5CAD" clip-path="url(#s16p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Torsion of the cord (schematic)</tspan></text><path d="M88.0,40.0 C89.1,40.9 93.9,43.5 94.6,45.2 C95.3,46.9 94.0,48.7 92.2,50.4 C90.4,52.1 85.8,53.9 84.0,55.6 C82.2,57.3 80.7,59.1 81.3,60.8 C81.9,62.5 85.6,64.3 87.8,66.0 C90.0,67.7 93.8,69.5 94.6,71.2 C95.3,72.9 94.1,74.7 92.4,76.4 C90.6,78.1 86.0,79.9 84.2,81.6 C82.3,83.3 80.7,85.1 81.2,86.8 C81.8,88.5 85.3,90.3 87.5,92.0 C89.7,93.7 93.6,95.5 94.5,97.2 C95.3,98.9 94.2,100.7 92.6,102.4 C90.9,104.1 86.3,105.9 84.4,107.6 C82.5,109.3 80.7,111.1 81.2,112.8 C81.7,114.5 86.3,117.1 87.3,118.0" fill="none" stroke="#9C5B50" stroke-width="8.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M88.0,40.0 C89.1,40.9 93.9,43.5 94.6,45.2 C95.3,46.9 94.0,48.7 92.2,50.4 C90.4,52.1 85.8,53.9 84.0,55.6 C82.2,57.3 80.7,