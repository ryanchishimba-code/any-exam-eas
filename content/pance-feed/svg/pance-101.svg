<svg width="304" height="434" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 434" role="img" aria-label="Delirium is acute and fluctuating with inattention, screened with CAM and treated by finding the cause; dementia is gradual, worked up with B12 and TSH, and may use a cholinesterase inhibitor." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n101"><defs></defs><clipPath id="n101p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n101p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Delirium or dementia</tspan></text><rect x="18.0" y="40.0" width="158.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CAM: acute, fluctuating</tspan></tspan></text><rect x="182.6" y="40.0" width="80.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="189.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="189.6" dy="0"><tspan font-weight="700">Inattention</tspan></tspan></text><rect x="18.0" y="68.0" width="125.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Dementia: gradual</tspan></tspan></text><clipPath id="n101p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#n101p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Work-up</tspan></text><rect x="18.0" y="150.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="98.2" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.2" dy="0"><tspan font-weight="700">CAM </tspan><tspan font-weight="500">or 4AT</tspan></tspan></text><rect x="18.0" y="180.0" width="64.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Delirium</tspan></tspan></text><text x="98.2" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.2" dy="0"><tspan font-weight="700">Find the cause: </tspan><tspan font-weight="500">infection,</tspan></tspan><tspan x="98.2" dy="17"><tspan font-weight="500">drugs, retention</tspan></tspan></text><rect x="18.0" y="222.0" width="72.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Dementia</tspan></tspan></text><text x="98.2" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.2" dy="0"><tspan font-weight="700">B12, TSH, </tspan><tspan font-weight="500">imaging</tspan></tspan></text><rect x="18.0" y="252.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drugs</tspan></tspan></text><text x="98.2" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.2" dy="0"><tspan font-weight="700">Cholinesterase inhibitor </tspan><tspan font-weight="500">for</tspan></tspan><tspan x="98.2" dy="17"><tspan font-weight="500">dementia</tspan></tspan></text><clipPath id="n101p3"><rect x="2" y="308" width="300" height="122" rx="14"/></clipPath><rect x="2" y="308" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="122" fill="#B7410E" clip-path="url(#n101p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Benzodiazepines worsen delirium</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(except alcohol withdrawal).</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Antipsychotics: lowest dose, shortest</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">time, only for distress or safety risk.</tspan></tspan></text></svg>