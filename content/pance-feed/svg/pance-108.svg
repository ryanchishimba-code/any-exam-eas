<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Simple febrile seizure in a child 6 months to 5 years needs no EEG, blood work or imaging, with lumbar puncture only for meningeal signs; cerebral palsy is diagnosed early with MRI, General Movements Assessment and HINE." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n108"><defs></defs><clipPath id="n108p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n108p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Simple febrile seizure</tspan></text><rect x="18.0" y="40.0" width="95.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age 6 mo–5 y</tspan></tspan></text><rect x="119.9" y="40.0" width="139.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="126.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="126.9" dy="0"><tspan font-weight="700">&lt;15 min, generalized</tspan></tspan></text><rect x="18.0" y="68.0" width="90.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Once in 24 h</tspan></tspan></text><clipPath id="n108p2"><rect x="2" y="112" width="300" height="158" rx="14"/></clipPath><rect x="2" y="112" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="158" fill="#0F766E" clip-path="url(#n108p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Work-up</tspan></text><rect x="18.0" y="150.0" width="55.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Febrile</tspan></tspan></text><text x="81.6" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.6" dy="0"><tspan font-weight="700">No routine </tspan><tspan font-weight="500">EEG, labs or imaging</tspan></tspan></text><rect x="18.0" y="180.0" width="29.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">LP</tspan></tspan></text><text x="81.6" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.6" dy="0"><tspan font-weight="700">If meningeal signs </tspan><tspan font-weight="500">or infection</tspan></tspan><tspan x="81.6" dy="17"><tspan font-weight="500">suspected</tspan></tspan></text><rect x="18.0" y="222.0" width="31.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CP</tspan></tspan></text><text x="81.6" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.6" dy="0"><tspan font-weight="700">MRI, </tspan><tspan font-weight="500">General Movements, HINE</tspan></tspan><tspan x="81.6" dy="17"><tspan font-weight="500">before 6 mo</tspan></tspan></text><clipPath id="n108p3"><rect x="2" y="278" width="300" height="122" rx="14"/></clipPath><rect x="2" y="278" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="278" width="5" height="122" fill="#B7410E" clip-path="url(#n108p3)"/><text x="18" y="302" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="327.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Simple febrile seizures </tspan><tspan font-weight="500">need no EEG,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">blood tests or imaging. LP for meningeal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">signs; consider if under-immunized or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">pretreated with antibiotics.</tspan></tspan></text></svg>