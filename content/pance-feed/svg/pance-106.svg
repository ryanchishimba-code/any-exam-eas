<svg width="304" height="416" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 416" role="img" aria-label="Raised intracranial pressure from a brain mass with morning headache, vomiting and papilledema, imaged with contrast MRI and treated with dexamethasone only for symptomatic edema; Cushing triad warns of herniation." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n106"><defs></defs><clipPath id="n106p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n106p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="128.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Morning headache</tspan></tspan></text><rect x="152.4" y="40.0" width="88.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="159.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="159.4" dy="0"><tspan font-weight="700">Papilledema</tspan></tspan></text><rect x="18.0" y="68.0" width="89.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">New seizure</tspan></tspan></text><clipPath id="n106p2"><rect x="2" y="112" width="300" height="170" rx="14"/></clipPath><rect x="2" y="112" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="170" fill="#0F766E" clip-path="url(#n106p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="51.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Image</tspan></tspan></text><text x="93.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.1" dy="0"><tspan font-weight="700">MRI </tspan><tspan font-weight="500">with contrast (CT first if</tspan></tspan><tspan x="93.1" dy="17"><tspan font-weight="500">unstable)</tspan></tspan></text><rect x="18.0" y="192.0" width="55.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Edema</tspan></tspan></text><text x="93.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.1" dy="0"><tspan font-weight="700">Dexamethasone </tspan><tspan font-weight="500">if</tspan></tspan><tspan x="93.1" dy="17"><tspan font-weight="500">symptomatic</tspan></tspan></text><rect x="18.0" y="234.0" width="67.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Seizures</tspan></tspan></text><text x="93.1" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.1" dy="0"><tspan font-weight="700">No routine </tspan><tspan font-weight="500">antiseizure</tspan></tspan><tspan x="93.1" dy="17"><tspan font-weight="500">prophylaxis</tspan></tspan></text><clipPath id="n106p3"><rect x="2" y="290" width="300" height="122" rx="14"/></clipPath><rect x="2" y="290" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="290" width="5" height="122" fill="#B7410E" clip-path="url(#n106p3)"/><text x="18" y="314" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="339.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Cushing triad </tspan><tspan font-weight="500">means herniation risk.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Steroids are for symptoms; asymptomatic</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">metastases without mass effect do not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">need them.</tspan></tspan></text></svg>