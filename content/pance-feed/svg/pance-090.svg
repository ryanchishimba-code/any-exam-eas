<svg width="304" height="464" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 464" role="img" aria-label="Latent TB screening for increased-risk adults, using IGRA after BCG vaccination; a positive test needs a chest X-ray to exclude active TB before latent TB treatment." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i90"><defs></defs><clipPath id="i90p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#i90p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who to test</tspan></text><rect x="18.0" y="40.0" width="159.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Born in high-TB country</tspan></tspan></text><rect x="18.0" y="68.0" width="115.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Shelter or prison</tspan></tspan></text><rect x="139.4" y="68.0" width="127.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="146.4" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="146.4" dy="0"><tspan font-weight="700">HIV, TNF inhibitors</tspan></tspan></text><clipPath id="i90p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="200" fill="#0F766E" clip-path="url(#i90p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Test, then exclude disease</tspan></text><rect x="18.0" y="150.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="88.7" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.7" dy="0"><tspan font-weight="700">Increased-risk </tspan><tspan font-weight="500">adults only</tspan></tspan><tspan x="88.7" dy="17"><tspan font-weight="500">(USPSTF B)</tspan></tspan></text><rect x="18.0" y="192.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="88.7" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.7" dy="0"><tspan font-weight="700">IGRA </tspan><tspan font-weight="500">preferred after BCG; TST</tspan></tspan><tspan x="88.7" dy="17"><tspan font-weight="500">acceptable</tspan></tspan></text><rect x="18.0" y="234.0" width="62.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Positive</tspan></tspan></text><text x="88.7" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.7" dy="0"><tspan font-weight="700">Chest X-ray </tspan><tspan font-weight="500">and symptom</tspan></tspan><tspan x="88.7" dy="17"><tspan font-weight="500">check</tspan></tspan></text><rect x="18.0" y="276.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="88.7" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="88.7" dy="0"><tspan font-weight="700">Latent TB </tspan><tspan font-weight="500">regimen (card 050)</tspan></tspan></text><clipPath id="i90p3"><rect x="2" y="320" width="300" height="140" rx="14"/></clipPath><rect x="2" y="320" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="140" fill="#B7410E" clip-path="url(#i90p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">BCG vaccination </tspan><tspan font-weight="500">can make the TST</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">positive but not the IGRA, so IGRA is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">preferred. A positive test means infection,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">not disease: rule out active TB before</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">latent treatment.</tspan></tspan></text></svg>