<svg width="304" height="410" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 410" role="img" aria-label="Benign prostatic hyperplasia: smooth enlarged prostate with obstructive symptoms; alpha-blocker first, add a 5-alpha reductase inhibitor for large glands." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="u194"><defs></defs><clipPath id="u194p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#u194p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="121.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Smooth, enlarged</tspan></tspan></text><rect x="145.8" y="40.0" width="129.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="152.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="152.8" dy="0"><tspan font-weight="700">Alpha-blocker first</tspan></tspan></text><rect x="18.0" y="68.0" width="119.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">5-ARI halves PSA</tspan></tspan></text><clipPath id="u194p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="200" fill="#0F766E" clip-path="url(#u194p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First</tspan></tspan></text><text x="111.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="111.5" dy="0"><tspan font-weight="700">Tamsulosin </tspan><tspan font-weight="500">or other</tspan></tspan><tspan x="111.5" dy="17"><tspan font-weight="500">alpha-blocker</tspan></tspan></text><rect x="18.0" y="192.0" width="85.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Large gland</tspan></tspan></text><text x="111.5" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="111.5" dy="0"><tspan font-weight="700">Add finasteride </tspan><tspan font-weight="500">(months)</tspan></tspan></text><rect x="18.0" y="222.0" width="46.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Warn</tspan></tspan></text><text x="111.5" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="111.5" dy="0"><tspan font-weight="700">Orthostasis; </tspan><tspan font-weight="500">floppy iris in</tspan></tspan><tspan x="111.5" dy="17"><tspan font-weight="500">cataract surgery</tspan></tspan></text><rect x="18.0" y="264.0" width="39.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PSA</tspan></tspan></text><text x="111.5" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="111.5" dy="0"><tspan font-weight="700">Shared decision </tspan><tspan font-weight="500">at 55–69</tspan></tspan><tspan x="111.5" dy="17"><tspan font-weight="500">(USPSTF grade C)</tspan></tspan></text><clipPath id="u194p3"><rect x="2" y="320" width="300" height="86" rx="14"/></clipPath><rect x="2" y="320" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="86" fill="#B7410E" clip-path="url(#u194p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">5-ARIs halve PSA: </tspan><tspan font-weight="500">double the value when</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">interpreting screening.</tspan></tspan></text></svg>