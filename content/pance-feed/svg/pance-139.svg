<svg width="304" height="392" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 392" role="img" aria-label="Thyroid nodule: TSH first; low TSH leads to scan, normal TSH to ultrasound and FNA by pattern." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="e139"><defs></defs><clipPath id="e139p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#e139p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Workup</tspan></text><rect x="18.0" y="40.0" width="67.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">TSH first</tspan></tspan></text><rect x="91.8" y="40.0" width="75.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="98.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="98.8" dy="0"><tspan font-weight="700">Low: scan</tspan></tspan></text><rect x="18.0" y="68.0" width="123.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Normal: US ± FNA</tspan></tspan></text><clipPath id="e139p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#e139p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Next step</tspan></text><rect x="18.0" y="150.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="113.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="113.1" dy="0"><tspan font-weight="700">TSH</tspan></tspan></text><rect x="18.0" y="180.0" width="67.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Low TSH</tspan></tspan></text><text x="113.1" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="113.1" dy="0"><tspan font-weight="700">Radionuclide scan</tspan></tspan></text><rect x="18.0" y="210.0" width="87.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Normal TSH</tspan></tspan></text><text x="113.1" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="113.1" dy="0"><tspan font-weight="700">Ultrasound</tspan></tspan></text><rect x="18.0" y="240.0" width="81.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Suspicious</tspan></tspan></text><text x="113.1" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="113.1" dy="0"><tspan font-weight="700">FNA</tspan></tspan></text><clipPath id="e139p3"><rect x="2" y="284" width="300" height="104" rx="14"/></clipPath><rect x="2" y="284" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="104" fill="#B7410E" clip-path="url(#e139p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hot nodules </tspan><tspan font-weight="500">generally need no FNA; cold</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">or indeterminate ones get</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">ultrasound-guided evaluation.</tspan></tspan></text></svg>