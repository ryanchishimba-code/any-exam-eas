GF</tspan></tspan></text><clipPath id="t152p3"><rect x="2" y="284" width="300" height="86" rx="14"/></clipPath><rect x="2" y="284" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="86" fill="#B7410E" clip-path="url(#t152p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Retinopathy present </tspan><tspan font-weight="500">means annual or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">more frequent exams, not every 2 years.</tspan></tspan></text></svg>