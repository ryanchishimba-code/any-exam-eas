<svg width="304" height="597" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 597" role="img" aria-label="Left pleural effusion with a blunted costophrenic angle and meniscus. Light's criteria: any one of pleural to serum protein above 0.5, LDH ratio above 0.6, or pleural LDH above two thirds of the upper normal serum value means exudate." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p44"><defs><radialGradient id="p44lg" cx="0.38" cy="0.3" r="0.9"><stop offset="0" stop-color="#56707D"/><stop offset="1" stop-color="#3A505B"/></radialGradient></defs><clipPath id="p44p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#p44p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Left effusion (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M137.0,52.0 C128.9,49.3 101.7,53.0 86.4,66.0 C71.1,79.0 50.4,115.7 45.0,130.0 C39.6,144.3 41.2,149.3 54.2,152.0 C67.2,154.7 110.1,151.0 123.2,146.0 C136.3,141.0 131.0,132.7 133.0,122.0 C135.0,111.3 134.3,93.7 135.0,82.0 C135.7,70.3 145.1,54.7 137.0,52.0 Z" fill="url(#p44lg)" stroke="#8AA0AB" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><path d="M169.0,52.0 C177.1,49.3 204.3,53.0 219.6,66.0 C234.9,79.0 255.6,115.7 261.0,130.0 C266.4,144.3 264.8,149.3 251.8,152.0 C238.8,154.7 195.9,151.0 182.8,146.0 C169.7,141.0 175.0,132.7 173.0,122.0 C171.0,111.3 171.7,93.7 171.0,82.0 C170.3,70.3 160.9,54.7 169.0,52.0 Z" fill="url(#p44lg)" stroke="#8AA0AB" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="167.0