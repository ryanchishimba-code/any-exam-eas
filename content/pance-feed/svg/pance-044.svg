" dy="0"><tspan font-weight="700">LDH &gt;⅔ upper normal</tspan></tspan></text><clipPath id="p44p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#p44p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Tap, then classify</tspan></text><rect x="18.0" y="331.0" width="83.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Transudate</tspan></tspan></text><text x="109.3" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">HF, </tspan><tspan font-weight="500">cirrhosis, nephrotic:</tspan></tspan><tspan x="109.3" dy="17"><tspan font-weight="500">treat the cause</tspan></tspan></text><rect x="18.0" y="373.0" width="63.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Exudate</tspan></tspan></text><text x="109.3" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Infection, </tspan><tspan font-weight="500">cancer, PE: cell</tspan></tspan><tspan x="109.3" dy="17"><tspan font-weight="500">count, culture, cytology</tspan></tspan></text><rect x="18.0" y="415.0" width="60.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">pH &lt;7.2</tspan></tspan></text><text x="109.3" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Parapneumonic: </tspan><tspan font-weight="500">chest tube</tspan></tspan><tspan x="109.3" dy="17"><tspan font-weight="500">drainage</tspan></tspan></text><clipPath id="p44p3"><rect x="2" y="471" width="300" height="122" rx="14"/></clipPath><rect x="2" y="471" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="122" fill="#B7410E" clip-path="url(#p44p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Heart failure on diuretics can </tspan><tspan font-weight="700">falsely look</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">exudative</tspan><tspan font-weight="500">; if suspected, check the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">serum-pleural albumin gradient (&gt;1.2 g/dL</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">favours transudate) or NT-proBNP.</tspan></tspan></text></svg>