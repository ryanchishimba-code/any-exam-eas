ill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Screen and act</tspan></text><rect x="18.0" y="270.0" width="120.0" height="52.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="78.0" y="292.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="78.0" dy="0"><tspan font-weight="700">Failed screen:</tspan></tspan><tspan x="78.0" dy="15"><tspan font-weight="700">echocardiogram</tspan></tspan></text><rect x="144.0" y="270.0" width="144.0" height="52.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="216.0" y="285.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="216.0" dy="0"><tspan font-weight="700">Ductal-dependent</tspan></tspan><tspan x="216.0" dy="15"><tspan font-weight="700">lesion: prostaglandin</tspan></tspan><tspan x="216.0" dy="15"><tspan font-weight="700">E1</tspan></tspan></text><rect x="18.0" y="332.0" width="43.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="347.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pass</tspan></tspan></text><text x="70.0" y="347.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.0" dy="0"><tspan font-weight="700">≥95% in both </tspan><tspan font-weight="500">right hand and foot;</tspan></tspan><tspan x="70.0" dy="17"><tspan font-weight="500">one retest if indeterminate</tspan></tspan></text><clipPath id="s38p3"><rect x="2" y="390" width="300" height="122" rx="14"/></clipPath><rect x="2" y="390" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="390" width="5" height="122" fill="#B7410E" clip-path="url(#s38p3)"/><text x="18" y="414" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="439.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A normal pulse-oximetry screen does not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">rule out critical heart disease; coarctation</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">can be missed, so compare arm and leg</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">blood pressures.</tspan></tspan></text></svg>