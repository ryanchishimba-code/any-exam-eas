<svg width="304" height="516" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 516" role="img" aria-label="Congenital heart lesions. ASD: fixed split S2. VSD: holosystolic murmur. PDA: continuous murmur. Coarctation: arm-to-leg blood pressure gap. Newborn pulse oximetry screen passes at 95 percent or more in both right hand and foot; a failed screen needs an echocardiogram; ductal-dependent lesions get prostaglandin E1. A pass can still miss coarctation." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s38"><defs></defs><clipPath id="s38p1"><rect x="2" y="2" width="300" height="222" rx="14"/></clipPath><rect x="2" y="2" width="300" height="222" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="222" fill="#0B5CAD" clip-path="url(#s38p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Murmur sketches (schematic)</tspan></text><rect x="18.0" y="40.0" width="132.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#C7D8EE" stroke-width="1.2"/><line x1="22.0" y1="64.0" x2="146.0" y2="64.0" stroke="#B9C9DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="32.0" y1="54.0" x2="32.0" y2="74.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><line x1="78.0" y1="54.0" x2="78.0" y2="74.0" stroke="#4A625F" stroke-width="2.4" stroke-linecap="round"/><line x1="90.0" y1="54.0" x2="90.0" y2="74.0" stroke="#4A625F" stroke-width="2.4" stroke-linecap="round"/><line x1="136.0" y1="54.0" x2="136.0" y2="74.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><text x="20.0" y="104.0" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="20.0" dy="0"><tspan font-weight="700">ASD: fixed split S2</tspan></tspan></text><rect x="156.0" y="40.0" width="132.0" height="48.0" rx="8" fi