<svg width="304" height="392" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 392" role="img" aria-label="Cervical screening: no screening before 21, cytology every 3 years 21 to 29, HPV every 5 years 30 to 65." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r127"><defs></defs><clipPath id="r127p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#r127p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Screen</tspan></text><rect x="18.0" y="40.0" width="106.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">21–29: Pap q3y</tspan></tspan></text><rect x="130.0" y="40.0" width="112.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="137.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="137.0" dy="0"><tspan font-weight="700">30–65: HPV q5y</tspan></tspan></text><rect x="18.0" y="68.0" width="58.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;21: no</tspan></tspan></text><clipPath id="r127p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#r127p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Interval</tspan></text><rect x="18.0" y="150.0" width="35.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;21</tspan></tspan></text><text x="78.6" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.6" dy="0"><tspan font-weight="700">No screening</tspan></tspan></text><rect x="18.0" y="180.0" width="49.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">21–29</tspan></tspan></text><text x="78.6" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.6" dy="0"><tspan font-weight="700">Cytology </tspan><tspan font-weight="500">every 3 y</tspan></tspan></text><rect x="18.0" y="210.0" width="52.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">30–65</tspan></tspan></text><text x="78.6" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.6" dy="0"><tspan font-weight="700">HPV </tspan><tspan font-weight="500">every 5 y</tspan></tspan></text><rect x="18.0" y="240.0" width="38.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&gt;65</tspan></tspan></text><text x="78.6" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="78.6" dy="0"><tspan font-weight="700">Stop </tspan><tspan font-weight="500">if adequate prior</tspan></tspan></text><clipPath id="r127p3"><rect x="2" y="284" width="300" height="104" rx="14"/></clipPath><rect x="2" y="284" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="104" fill="#B7410E" clip-path="url(#r127p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Screening under 21 </tspan><tspan font-weight="500">or after total</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hysterectomy without CIN2+ history is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">recommended against (D).</tspan></tspan></text></svg>