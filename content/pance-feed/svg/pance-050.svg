y="293" width="5" height="187" fill="#0F766E" clip-path="url(#p50p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat disease vs infection</tspan></text><rect x="18.0" y="331.0" width="53.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Active</tspan></tspan></text><text x="80.9" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.9" dy="0"><tspan font-weight="700">2 mo RIPE </tspan><tspan font-weight="500">(rifampin, INH, PZA,</tspan></tspan><tspan x="80.9" dy="17"><tspan font-weight="500">ethambutol) + 4 mo INH-rifampin</tspan></tspan></text><rect x="18.0" y="373.0" width="54.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Option</tspan></tspan></text><text x="80.9" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.9" dy="0"><tspan font-weight="700">4-month</tspan></tspan><tspan x="80.9" dy="17"><tspan font-weight="500">INH-rifapentine-moxifloxacin-PZA</tspan></tspan><tspan x="80.9" dy="17"><tspan font-weight="500">(age ≥12)</tspan></tspan></text><rect x="18.0" y="432.0" width="52.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="447.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Latent</tspan></tspan></text><text x="80.9" y="447.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.9" dy="0"><tspan font-weight="700">3HP, 4R or 3HR </tspan><tspan font-weight="500">(rifamycin short</tspan></tspan><tspan x="80.9" dy="17"><tspan font-weight="500">courses)</tspan></tspan></text><clipPath id="p50p3"><rect x="2" y="488" width="300" height="122" rx="14"/></clipPath><rect x="2" y="488" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="488" width="5" height="122" fill="#B7410E" clip-path="url(#p50p3)"/><text x="18" y="512" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="537.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Isoniazid: </tspan><tspan font-weight="500">hepatitis and neuropathy (give</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">pyridoxine). </tspan><tspan font-weight="700">Ethambutol: </tspan><tspan font-weight="500">optic neuritis.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">Rifampin: </tspan><tspan font-weight="500">orange secretions, enzyme</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">induction.</tspan></tspan></text></svg>