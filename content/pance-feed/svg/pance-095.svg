<svg width="304" height="462" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 462" role="img" aria-label="Three pediatric fever-and-rash illnesses: measles with cough, coryza, conjunctivitis and Koplik spots treated with vitamin A; varicella with vesicles in all stages, contagious until crusted; and Kawasaki disease treated with IVIG and aspirin within 10 days." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i95"><defs></defs><clipPath id="i95p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#i95p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Three rashes</tspan></text><rect x="18.0" y="40.0" width="249.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Measles: cough, coryza, conjunctivitis</tspan></tspan></text><rect x="18.0" y="68.0" width="193.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Varicella: lesions in all stages</tspan></tspan></text><rect x="18.0" y="96.0" width="124.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Kawasaki: CRASH</tspan></tspan></text><clipPath id="i95p2"><rect x="2" y="140" width="300" height="170" rx="14"/></clipPath><rect x="2" y="140" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="170" fill="#0F766E" clip-path="url(#i95p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat and isolate</tspan></text><rect x="18.0" y="178.0" width="65.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Measles</tspan></tspan></text><text x="98.9" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.9" dy="0"><tspan font-weight="700">Vitamin A </tspan><tspan font-weight="500">two doses; airborne</tspan></tspan><tspan x="98.9" dy="17"><tspan font-weight="500">isolation</tspan></tspan></text><rect x="18.0" y="220.0" width="67.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Varicella</tspan></tspan></text><text x="98.9" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.9" dy="0"><tspan font-weight="700">Contagious </tspan><tspan font-weight="500">until all lesions</tspan></tspan><tspan x="98.9" dy="17"><tspan font-weight="500">crust</tspan></tspan></text><rect x="18.0" y="262.0" width="72.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Kawasaki</tspan></tspan></text><text x="98.9" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="98.9" dy="0"><tspan font-weight="700">IVIG 2 g/kg </tspan><tspan font-weight="500">+ aspirin;</tspan></tspan><tspan x="98.9" dy="17"><tspan font-weight="500">echocardiogram</tspan></tspan></text><clipPath id="i95p3"><rect x="2" y="318" width="300" height="140" rx="14"/></clipPath><rect x="2" y="318" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="318" width="5" height="140" fill="#B7410E" clip-path="url(#i95p3)"/><text x="18" y="342" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="367.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Kawasaki: </tspan><tspan font-weight="500">fever ≥5 days with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">conjunctivitis, rash, adenopathy,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">strawberry tongue, hand and foot</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">changes. Treat within 10 days of fever</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">onset to prevent coronary aneurysms.</tspan></tspan></text></svg>