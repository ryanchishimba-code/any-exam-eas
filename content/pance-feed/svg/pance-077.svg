<svg width="304" height="585" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 585" role="img" aria-label="Rotator cuff disease involving the supraspinatus tendon. Physical therapy and a single steroid injection first, MRI or ultrasound if weakness suggests a tear, and surgical repair when needed; frozen shoulder loses passive motion too." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m77"><defs></defs><clipPath id="m77p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#m77p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Shoulder (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M168.0,100.0 C178.0,110.0 218.0,150.0 228.0,160.0" fill="none" stroke="#A89A74" stroke-width="24.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M168.0,100.0 C178.0,110.0 218.0,150.0 228.0,160.0" fill="none" stroke="#E9E2CF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164.0" cy="96.0" r="22" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><path d="M78,60 L208,60 L208,70 L78,72 Z" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2" /><path d="M118,78 Q158,68 186,84" fill="none" stroke="#E0533F" stroke-width="5" /><g class="lb" data-n="1"><line class="ld" x1="154.0" y1="75.0" x2="154.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="154.0" cy="75.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="149" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Supraspinatus tendon</tspan></tspan></text></g><g class="q" display="none"><circle cx="154.0" cy="197.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M150.8,194.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="154.1" cy="202.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="154.0" cy="197.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="131.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Painful arc 60–120°</tspan></tspan></text><rect x="155.9" y="221.0" width="102.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="162.9" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="162.9" dy="0"><tspan font-weight="700">Neer, Hawkins</tspan></tspan></text><rect x="18.0" y="249.0" width="107.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Empty-can test</tspan></tspan></text><clipPath id="m77p2"><rect x="2" y="293" width="300" height="158" rx="14"/></clipPath><rect x="2" y="293" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="158" fill="#0F766E" clip-path="url(#m77p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Rehab first</tspan></text><rect x="18.0" y="331.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First</tspan></tspan></text><text x="103.6" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="103.6" dy="0"><tspan font-weight="700">Physical therapy; </tspan><tspan font-weight="500">one steroid</tspan></tspan><tspan x="103.6" dy="17"><tspan font-weight="500">injection</tspan></tspan></text><rect x="18.0" y="373.0" width="77.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Weakness</tspan></tspan></text><text x="103.6" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="103.6" dy="0"><tspan font-weight="700">MRI </tspan><tspan font-weight="500">or ultrasound for tear</tspan></tspan></text><rect x="18.0" y="403.0" width="53.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Repair</tspan></tspan></text><text x="103.6" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="103.6" dy="0"><tspan font-weight="700">Surgery </tspan><tspan font-weight="500">beats PT alone when</tspan></tspan><tspan x="103.6" dy="17"><tspan font-weight="500">repair heals</tspan></tspan></text><clipPath id="m77p3"><rect x="2" y="459" width="300" height="122" rx="14"/></clipPath><rect x="2" y="459" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="459" width="5" height="122" fill="#B7410E" clip-path="url(#m77p3)"/><text x="18" y="483" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="508.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Adhesive capsulitis </tspan><tspan font-weight="500">loses both active and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">passive motion (diabetes risk). Rotator</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cuff disease reduces active motion but</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">passive motion is preserved.</tspan></tspan></text></svg>