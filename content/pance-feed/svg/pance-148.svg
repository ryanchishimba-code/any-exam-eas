<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Epistaxis: firm compression of the lower nose for at least 5 minutes, then packing, resorbable if on anticoagulants." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="t148"><defs></defs><clipPath id="t148p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#t148p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  First step</tspan></text><rect x="18.0" y="40.0" width="121.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Compress ≥5 min</tspan></tspan></text><rect x="145.0" y="40.0" width="97.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="152.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="152.0" dy="0"><tspan font-weight="700">Then packing</tspan></tspan></text><rect x="18.0" y="68.0" width="142.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Anticoag: resorbable</tspan></tspan></text><clipPath id="t148p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#t148p2)"/><text x="18" y="1