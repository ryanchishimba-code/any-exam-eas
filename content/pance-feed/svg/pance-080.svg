<svg width="304" height="444" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 444" role="img" aria-label="Three pediatric hip disorders: slipped capital femoral epiphysis in obese teens treated with surgical pinning, Legg-Calvé-Perthes avascular necrosis at age 4 to 8, and developmental hip dysplasia in newborns found by Ortolani and Barlow and treated with a Pavlik harness." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m80"><defs></defs><clipPath id="m80p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#m80p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Age clues</tspan></text><rect x="18.0" y="40.0" width="130.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SCFE: 10–16, obese</tspan></tspan></text><rect x="18.0" y="68.0" width="178.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Perthes: 4–8, painless limp</tspan></tspan></text><rect x="18.0" y="96.0" width="151.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">DDH: newborn, breech</tspan></tspan></text><clipPath id="m80p2"><rect x="2" y="140" width="300" height="170" rx="14"/></clipPath><rect x="2" y="140" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="170" fill="#0F766E" clip-path="url(#m80p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Image, then treat</tspan></text><rect x="18.0" y="178.0" width="46.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SCFE</tspan></tspan></text><text x="87.5" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">Frog-leg X-ray;</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="500">non-weight-bearing, pin</tspan></tspan></text><rect x="18.0" y="220.0" width="61.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Perthes</tspan></tspan></text><text x="87.5" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">X-ray: </tspan><tspan font-weight="500">femoral head AVN;</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="500">activity limits</tspan></tspan></text><rect x="18.0" y="262.0" width="41.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">DDH</tspan></tspan></text><text x="87.5" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.5" dy="0"><tspan font-weight="700">Imaging </tspan><tspan font-weight="500">&lt;6 months if breech,</tspan></tspan><tspan x="87.5" dy="17"><tspan font-weight="500">family history; brace if unstable</tspan></tspan></text><clipPath id="m80p3"><rect x="2" y="318" width="300" height="122" rx="14"/></clipPath><rect x="2" y="318" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="318" width="5" height="122" fill="#B7410E" clip-path="url(#m80p3)"/><text x="18" y="342" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="367.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hip disease refers pain to the knee:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">examine and image the hip in a limping</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">child with knee pain. SCFE is an urgent</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">surgical problem.</tspan></tspan></text></svg>