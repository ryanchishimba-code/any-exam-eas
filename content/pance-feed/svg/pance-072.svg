<svg width="304" height="613" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 613" role="img" aria-label="Septic arthritis with a knee effusion. Aspirate the joint for cell count, Gram stain, culture and crystals before IV antibiotics, then drain; crystals do not exclude infection." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m72"><defs></defs><clipPath id="m72p1"><rect x="2" y="2" width="300" height="311" rx="14"/></clipPath><rect x="2" y="2" width="300" height="311" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="311" fill="#0B5CAD" clip-path="url(#m72p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Knee (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><ellipse cx="153.0" cy="104.0" rx="56" ry="34" fill="#4D7FA6" stroke="#8FB7D6" stroke-width="1.5"/><rect x="123.0" y="48.0" width="60.0" height="46.0" rx="14" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><rect x="123.0" y="112.0" width="60.0" height="46.0" rx="14" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><g class="lb" data-n="1"><line class="ld" x1="201.0" y1="104.0" x2="123.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="201.0" cy="104.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="99" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Joint effusion</tspan></tspan></text></g><g class="q"><circle cx="115.4" cy="194.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M112.2,191.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="115.5" cy="199.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="115.4" cy="194.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="160.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">S. aureus most common</tspan></tspan></text><rect x="18.0" y="249.0" width="196.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Gonococcus if sexually active</tspan></tspan></text><rect x="18.0" y="277.0" width="106.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="292.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prosthetic joint</tspan></tspan></text><clipPath id="m72p2"><rect x="2" y="321" width="300" height="158" rx="14"/></clipPath><rect x="2" y="321" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="321" width="5" height="158" fill="#0F766E" clip-path="url(#m72p2)"/><text x="18" y="345" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Tap, then treat</tspan></text><rect x="18.0" y="359.0" width="36.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="374.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tap</tspan></tspan></text><text x="72.3" y="374.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="72.3" dy="0"><tspan font-weight="700">Synovial fluid: </tspan><tspan font-weight="500">cell count, Gram</tspan></tspan><tspan x="72.3" dy="17"><tspan font-weight="500">stain, culture, crystals</tspan></tspan></text><rect x="18.0" y="401.0" width="45.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="416.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Then</tspan></tspan></text><text x="72.3" y="416.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="72.3" dy="0"><tspan font-weight="700">Blood cultures; </tspan><tspan font-weight="500">empiric IV</tspan></tspan><tspan x="72.3" dy="17"><tspan font-weight="500">antibiotics</tspan></tspan></text><rect x="18.0" y="443.0" width="46.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="458.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drain</tspan></tspan></text><text x="72.3" y="458.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="72.3" dy="0"><tspan font-weight="700">Joint washout </tspan><tspan font-weight="500">or repeat aspiration</tspan></tspan></text><clipPath id="m72p3"><rect x="2" y="487" width="300" height="122" rx="14"/></clipPath><rect x="2" y="487" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="487" width="5" height="122" fill="#B7410E" clip-path="url(#m72p3)"/><text x="18" y="511" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="536.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Gout and infection can coexist: </tspan><tspan font-weight="500">crystals</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">in the fluid do not rule out septic arthritis.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Synovial WBC &gt;50,000/µL with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">neutrophils strongly suggests infection.</tspan></tspan></text></svg>