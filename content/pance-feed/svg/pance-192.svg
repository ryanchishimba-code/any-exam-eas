<svg width="304" height="386" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 386" role="img" aria-label="Tinea has annular scaling plaques with central clearing and hyphae on KOH; scabies has burrows and nocturnal itch treated with permethrin; pityriasis rosea starts with a herald patch." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m192"><defs></defs><clipPath id="m192p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m192p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="127.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">KOH hyphae: tinea</tspan></tspan></text><rect x="151.4" y="40.0" width="119.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="158.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="158.4" dy="0"><tspan font-weight="700">Burrows: scabies</tspan></tspan></text><rect x="18.0" y="68.0" width="115.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Herald patch: PR</tspan></tspan></text><clipPath id="m192p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#m192p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="48.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tinea</tspan></tspan></text><text x="134.2" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="134.2" dy="0"><tspan font-weight="700">KOH, </tspan><tspan font-weight="500">topical antifungal</tspan></tspan></text><rect x="18.0" y="180.0" width="56.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Capitis</tspan></tspan></text><text x="134.2" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="134.2" dy="0"><tspan font-weight="700">Oral terbinafine</tspan></tspan></text><rect x="18.0" y="210.0" width="62.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Scabies</tspan></tspan></text><text x="134.2" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="134.2" dy="0"><tspan font-weight="700">Permethrin </tspan><tspan font-weight="500">neck down,</tspan></tspan><tspan x="134.2" dy="17"><tspan font-weight="500">repeat 1 wk</tspan></tspan></text><rect x="18.0" y="252.0" width="108.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pityriasis rosea</tspan></tspan></text><text x="134.2" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="134.2" dy="0"><tspan font-weight="700">Self-limited, </tspan><tspan font-weight="500">reassure</tspan></tspan></text><clipPath id="m192p3"><rect x="2" y="296" width="300" height="86" rx="14"/></clipPath><rect x="2" y="296" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="86" fill="#B7410E" clip-path="url(#m192p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Scalp and nail </tspan><tspan font-weight="500">fungal infections need oral</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">therapy; topicals alone fail.</tspan></tspan></text></svg>