<svg width="304" height="346" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 346" role="img" aria-label="HHS: glucose 600 or higher, effective osmolality above 300, minimal ketosis; fluids first, hold insulin if potassium below 3.5." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="e144"><defs></defs><clipPath id="e144p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#e144p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="100.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Glucose ≥600</tspan></tspan></text><rect x="124.3" y="40.0" width="78.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="131.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="131.3" dy="0"><tspan font-weight="700">Osm &gt;300</tspan></tspan></text><rect x="208.6" y="40.0" width="78.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="215.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="215.6" dy="0"><tspan font-weight="700">Fluids first</tspan></tspan></text><clipPath id="e144p2"><rect x="2" y="84" width="300" height="164" rx="14"/></clipPath><rect x="2" y="84" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="164" fill="#0F766E" clip-path="url(#e144p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="122.0" width="71.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Diagnose</tspan></tspan></text><text x="97.4" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">Osm &gt;300, </tspan><tspan font-weight="500">minimal ketones</tspan></tspan></text><rect x="18.0" y="152.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fluids</tspan></tspan></text><text x="97.4" y="167.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">Isotonic </tspan><tspan font-weight="500">IV</tspan></tspan></text><rect x="18.0" y="182.0" width="30.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="197.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">K+</tspan></tspan></text><text x="97.4" y="197.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">&lt;3.5: </tspan><tspan font-weight="500">hold insulin</tspan></tspan></text><rect x="18.0" y="212.0" width="54.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="227.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Insulin</tspan></tspan></text><text x="97.4" y="227.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">After </tspan><tspan font-weight="500">fluids</tspan></tspan></text><clipPath id="e144p3"><rect x="2" y="256" width="300" height="86" rx="14"/></clipPath><rect x="2" y="256" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="256" width="5" height="86" fill="#B7410E" clip-path="url(#e144p3)"/><text x="18" y="280" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="305.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Insulin with K+ &lt;3.5 </tspan><tspan font-weight="500">can trigger fatal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hypokalemia.</tspan></tspan></text></svg>