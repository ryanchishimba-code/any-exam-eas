<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Painless gross hematuria in an older smoker suggests bladder cancer; evaluate with cystoscopy and CT urography; renal cell carcinoma classically presents with hematuria, flank pain and a flank mass (triad, uncommon)." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="u198"><defs></defs><clipPath id="u198p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#u198p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="130.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Painless hematuria</tspan></tspan></text><rect x="154.0" y="40.0" width="60.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="161.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="161.0" dy="0"><tspan font-weight="700">Smoker</tspan></tspan></text><rect x="18.0" y="68.0" width="87.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cystoscopy</tspan></tspan></text><clipPath id="u198p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#u198p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Test</tspan></text><rect x="18.0" y="150.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="109.0" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.0" dy="0"><tspan font-weight="700">Cystoscopy</tspan></tspan></text><rect x="18.0" y="180.0" width="83.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Upper tract</tspan></tspan></text><text x="109.0" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.0" dy="0"><tspan font-weight="700">CT urography</tspan></tspan></text><rect x="18.0" y="210.0" width="39.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Risk</tspan></tspan></text><text x="109.0" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.0" dy="0"><tspan font-weight="700">Smoking, </tspan><tspan font-weight="500">dyes, age</tspan></tspan></text><rect x="18.0" y="240.0" width="40.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">RCC</tspan></tspan></text><text x="109.0" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.0" dy="0"><tspan font-weight="700">Hematuria, flank pain, </tspan><tspan font-weight="500">flank</tspan></tspan><tspan x="109.0" dy="17"><tspan font-weight="500">mass</tspan></tspan></text><clipPath id="u198p3"><rect x="2" y="296" width="300" height="104" rx="14"/></clipPath><rect x="2" y="296" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="104" fill="#B7410E" clip-path="url(#u198p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Anticoagulation </tspan><tspan font-weight="500">is not an explanation:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hematuria on warfarin still needs</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">evaluation.</tspan></tspan></text></svg>