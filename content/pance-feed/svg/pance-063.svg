<svg width="304" height="652" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 652" role="img" aria-label="Ulcerative colitis with continuous inflammation from the rectum, compared with Crohn disease skip lesions. Mild UC uses 5-ASA; moderate to severe disease uses steroids to induce and then advanced therapy; mesalamine is not used for Crohn." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g63"><defs></defs><clipPath id="g63p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#g63p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Colon (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><polyline points="78.0,148.0 78.0,68.0 228.0,68.0 228.0,136.0 188.0,150.0 168.0,140.0" fill="none" stroke="#A8705F" stroke-width="19" stroke-linejoin="round" stroke-linecap="round"/><polyline points="78.0,148.0 78.0,68.0 228.0,68.0 228.0,136.0 188.0,150.0 168.0,140.0" fill="none" stroke="#E8B7A8" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><polyline points="168.0,140.0 188.0,150.0 228.0,136.0 228.0,80.0" fill="none" stroke="#E0533F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><g class="lb" data-n="1"><line class="ld" x1="228.0" y1="110.0" x2="211.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="228.0" cy="110.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="187" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">UC: continuous from rectum</tspan></tspan></text></g><g class="q" display="none"><circle cx="208.6" cy="196.7" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M205.4,194.1 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="208.7" cy="201.9" r="1.2" fill="#fff"/></g><circle class="hit" cx="208.6" cy="196.7" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="160.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">UC: PSC, rectum always</tspan></tspan></text><rect x="18.0" y="249.0" width="209.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Crohn: skip lesions, granulomas</tspan></tspan></text><clipPath id="g63p2"><rect x="2" y="293" width="300" height="225" rx="14"/></clipPath><rect x="2" y="293" width="300" height="225" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="225" fill="#0F766E" clip-path="url(#g63p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Induce, then maintain</tspan></text><rect x="18.0" y="331.0" width="61.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mild UC</tspan></tspan></text><text x="18.0" y="368.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Oral and rectal 5-ASA</tspan></tspan></text><rect x="18.0" y="380.0" width="119.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="395.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Moderate-severe</tspan></tspan></text><text x="18.0" y="417.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Steroids </tspan><tspan font-weight="500">induce only; then biologic or small</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">molecule</tspan></tspan></text><rect x="18.0" y="446.0" width="51.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="461.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Crohn</tspan></tspan></text><text x="18.0" y="483.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Early advanced therapy; </tspan><tspan font-weight="500">budesonide</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">ileocecal only</tspan></tspan></text><clipPath id="g63p3"><rect x="2" y="526" width="300" height="122" rx="14"/></clipPath><rect x="2" y="526" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="526" width="5" height="122" fill="#B7410E" clip-path="url(#g63p3)"/><text x="18" y="550" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="575.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Mesalamine is not used for Crohn</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">disease </tspan><tspan font-weight="500">(2025 ACG). Steroids never</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">maintain remission in either. Check</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">calprotectin to monitor.</tspan></tspan></text></svg>