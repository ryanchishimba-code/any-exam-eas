<svg width="304" height="538" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 538" role="img" aria-label="Heart failure by ejection fraction: HFrEF 40 percent or less, HFmrEF 41 to 49, HFpEF 50 or more. Acute congestion is treated with an IV loop diuretic, escalating if the response is poor. In HFpEF an SGLT2 inhibitor helps. A normal ejection fraction does not rule out heart failure." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s26"><defs></defs><clipPath id="s26p1"><rect x="2" y="2" width="300" height="240" rx="14"/></clipPath><rect x="2" y="2" width="300" height="240" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="240" fill="#0B5CAD" clip-path="url(#s26p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Ejection-fraction bands (schematic)</tspan></text><text x="18.0" y="53.0" font-size="12" font-weight="700" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Left ventricular ejection fraction</tspan></tspan></text><rect x="18.0" y="60.0" width="63.0" height="36.0" rx="8" fill="#7FB0DB" stroke="none" stroke-width="1"/><text x="49.5" y="75.0" font-size="12" font-weight="800" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="49.5" dy="0"><tspan font-weight="700">HFrEF</tspan></tspan><tspan x="49.5" dy="15"><tspan font-weight="700">≤40%</tspan></tspan></text><rect x="84.0" y="60.0" width="63.0" height="36.0" rx="8" fill="#B9D6EE" stroke="none" stroke-width="1"/><text x="115.5" y="75.0" font-size="12" font-weight="800" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="115.5" dy="0"><tspan font-weight="700">HFmrEF</tspan></tspan><tspan x="115.5" dy="15"><tspan font-weight="700">41–49</tspan></tspan></text><rect x="150.0" y="60.0" width="135.0" height="36.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="217.5" y="75.0" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="217.5" dy="0"><tspan font-weight="700">HFpEF ≥50%</tspan></tspan></text><ellipse cx="70.0" cy="140.0" rx="36" ry="26" fill="#CFE3F5" stroke="#0B5CAD" stroke-width="1.6"/><ellipse cx="70.0" cy="140.0" rx="20" ry="14" fill="#0B5CAD" stroke="#0F2F2C" stroke-width="1.2"/><line x1="114.0" y1="140.0" x2="149.6" y2="140.0" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round"/><polygon points="156.0,140.0 148.8,143.5 148.8,136.5" fill="#0F766E"/><g class="lb" data-n="1"><line class="ld" x1="90.0" y1="130.0" x2="118.0" y2="130.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="90.0" cy="130.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="118.0" y="118.0" width="164" height="40" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="125.0" y="137.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="125.0" dy="0"><tspan font-weight="700">EF = share of filled blood</tspan></tspan><tspan x="125.0" dy="15"><tspan font-weight="700">ejected</tspan></tspan></text></g><g class="q"><circle cx="129.0" cy="130.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M125.8,127.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="129.1" cy="135.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="129.0" cy="130.0" r="22" fill="transparent"/></g><rect x="18.0" y="178.0" width="68.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Dyspnea</tspan></tspan></text><rect x="92.0" y="178.0" width="79.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="99.0" y="193.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="99.0" dy="0"><tspan font-weight="700">Orthopnea</tspan></tspan></text><rect x="177.4" y="178.0" width="55.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="184.4" y="193.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="184.4" dy="0"><tspan font-weight="700">Edema</tspan></tspan></text><rect x="238.9" y="178.0" width="39.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="245.9" y="193.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="245.9" dy="0"><tspan font-weight="700">JVD</tspan></tspan></text><rect x="18.0" y="206.0" width="47.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="221.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Rales</tspan></tspan></text><clipPath id="s26p2"><rect x="2" y="250" width="300" height="154" rx="14"/></clipPath><rect x="2" y="250" width="300" height="154" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="250" width="5" height="154" fill="#0F766E" clip-path="url(#s26p2)"/><text x="18" y="274" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Decongest</tspan></text><rect x="18.0" y="288.0" width="100.0" height="48.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="68.0" y="308.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="68.0" dy="0"><tspan font-weight="700">IV loop</tspan></tspan><tspan x="68.0" dy="15"><tspan font-weight="700">diuretic early</tspan></tspan></text><rect x="124.0" y="288.0" width="164.0" height="48.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="206.0" y="301.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="206.0" dy="0"><tspan font-weight="700">Poor response: raise</tspan></tspan><tspan x="206.0" dy="15"><tspan font-weight="700">dose or add second</tspan></tspan><tspan x="206.0" dy="15"><tspan font-weight="700">diuretic</tspan></tspan></text><rect x="18.0" y="348.0" width="53.2" height="22" rx="11" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><text x="25.0" y="363.5" font-size="12" font-weight="700" fill="#0F766E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HFpEF</tspan></tspan></text><text x="80.0" y="363.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.0" dy="0"><tspan font-weight="700">SGLT2 inhibitor </tspan><tspan font-weight="500">helps; diuretic</tspan></tspan><tspan x="80.0" dy="17"><tspan font-weight="500">only for congestion</tspan></tspan></text><clipPath id="s26p3"><rect x="2" y="412" width="300" height="122" rx="14"/></clipPath><rect x="2" y="412" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="412" width="5" height="122" fill="#B7410E" clip-path="url(#s26p3)"/><text x="18" y="436" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="461.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A normal ejection fraction does not rule</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">out heart failure: HFpEF is LVEF ≥50%</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">with signs of raised filling pressure, so</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">keep it in the differential.</tspan></tspan></text></svg>