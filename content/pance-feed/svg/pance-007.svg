ll="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="4.0" y="281.0" width="97" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="11.0" y="300.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="11.0" dy="0"><tspan font-weight="700">Proximal pole</tspan></tspan></text></g><g class="q" display="none"><circle cx="90.3" cy="283.6" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M87.1,281.0 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="90.4" cy="288.8" r="1.2" fill="#fff"/></g><circle class="hit" cx="90.3" cy="283.6" r="22" fill="transparent"/></g><clipPath id="s7p2"><rect x="2" y="330" width="300" height="174" rx="14"/></clipPath><rect x="2" y="330" width="300" height="174" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="330" width="5" height="174" fill="#0F766E" clip-path="url(#s7p2)"/><text x="18" y="354" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan></text><text x="18.0" y="379.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Splint now: </tspan><tspan font-weight="500">thumb spica splint or cast,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">treated as a fracture.</tspan></tspan></text><text x="18.0" y="423.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Then image: </tspan><tspan font-weight="500">MRI or CT of the wrist (no</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">contrast), or repeat X-rays at 10–14 days.</tspan></tspan></text><text x="18.0" y="467.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Usually not appropriate (ACR):</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">ultrasound, contrast MRI, bone scan.</tspan></tspan></text><clipPath id="s7p3"><rect x="2" y="512" width="300" height="122" rx="14"/></clipPath><rect x="2" y="512" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="512" width="5" height="122" fill="#B7410E" clip-path="url(#s7p3)"/><text x="18" y="536" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="561.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A normal early X-ray does not rule it out.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Proximal pole fractures have the higher</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">nonunion risk: their blood arrives only by</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">running back from the dorsal ridge.</tspan></tspan></text></svg>