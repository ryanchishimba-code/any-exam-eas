<svg width="304" height="546" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 546" role="img" aria-label="Hypertension, 2025 guideline. Blood pressure bands: normal under 120 over 80, elevated 120 to 129 over under 80, stage 1 130 to 139 or 80 to 89, stage 2 140 or higher or 90 or higher. Start drugs at 140 over 90, or at 130 over 80 with cardiovascular disease, stroke, diabetes, CKD or 10-year PREVENT risk 7.5 percent or higher. First-line: thiazide-type diuretic, dihydropyridine calcium channel blocker, ACE inhibitor or ARB." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s23"><defs></defs><clipPath id="s23p1"><rect x="2" y="2" width="300" height="196" rx="14"/></clipPath><rect x="2" y="2" width="300" height="196" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="196" fill="#0B5CAD" clip-path="url(#s23p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Blood pressure bands (schematic)</tspan></text><rect x="18.0" y="40.0" width="150.0" height="30.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1"/><text x="28.0" y="59.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">Normal &lt;120 and &lt;80</tspan></tspan></text><rect x="18.0" y="76.0" width="196.0" height="30.0" rx="8" fill="#B9D6EE" stroke="none" stroke-width="1"/><text x="28.0" y="95.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">Elevated 120–129 and &lt;80</tspan></tspan></text><rect x="18.0" y="112.0" width="232.0" height="30.0" rx="8" fill="#7FB0DB" stroke="none" stroke-width="1"/><text x="28.0" y="131.5" font-size="12" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">Stage 1 130–139 or 80–89</tspan></tspan></text><rect x="18.0" y="148.0" width="270.0" height="30.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="28.0" y="167.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">Stage 2 ≥140 or ≥90</tspan></tspan></text><clipPath id="s23p2"><rect x="2" y="206" width="300" height="206" rx="14"/></clipPath><rect x="2" y="206" width="300" height="206" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="206" width="5" height="206" fill="#0F766E" clip-path="url(#s23p2)"/><text x="18" y="230" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Start and choose</tspan></text><rect x="18.0" y="242.0" width="66.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="257.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≥140/90</tspan></tspan></text><text x="92.1" y="257.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.1" dy="0"><tspan font-weight="700">Start drugs </tspan><tspan font-weight="500">(stage 2: two</tspan></tspan><tspan x="92.1" dy="17"><tspan font-weight="500">classes, single pill)</tspan></tspan></text><rect x="18.0" y="284.0" width="65.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="299.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≥130/80</tspan></tspan></text><text x="91.7" y="299.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="91.7" dy="0"><tspan font-weight="700">with </tspan><tspan font-weight="500">CVD, stroke, diabetes,</tspan></tspan><tspan x="91.7" dy="17"><tspan font-weight="500">CKD or PREVENT ≥7.5%</tspan></tspan></text><rect x="18.0" y="328.0" width="96.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="343.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Goal &lt;130/80</tspan></tspan></text><rect x="18.0" y="356.0" width="92.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="64.0" y="373.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="64.0" dy="0"><tspan font-weight="700">Thiazide-type</tspan></tspan><tspan x="64.0" dy="15"><tspan font-weight="700">diuretic</tspan></tspan></text><rect x="116.0" y="356.0" width="96.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="164.0" y="373.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="164.0" dy="0"><tspan font-weight="700">Dihydropyridine</tspan></tspan><tspan x="164.0" dy="15"><tspan font-weight="700">CCB</tspan></tspan></text><rect x="218.0" y="356.0" width="66.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="251.0" y="373.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="251.0" dy="0"><tspan font-weight="700">ACEi or</tspan></tspan><tspan x="251.0" dy="15"><tspan font-weight="700">ARB</tspan></tspan></text><clipPath id="s23p3"><rect x="2" y="420" width="300" height="122" rx="14"/></clipPath><rect x="2" y="420" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="420" width="5" height="122" fill="#B7410E" clip-path="url(#s23p3)"/><text x="18" y="444" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="469.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Beta-blockers are not first-line without a</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">compelling indication (such as recent MI</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">or HFrEF). In pregnancy avoid ACE</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">inhibitors and ARBs.</tspan></tspan></text></svg>