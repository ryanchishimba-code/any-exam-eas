<svg width="304" height="426" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 426" role="img" aria-label="Auer rods point to acute myeloid leukemia and acute promyelocytic leukemia; smudge cells to CLL; Reed-Sternberg cells to Hodgkin lymphoma; Philadelphia chromosome to CML." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h173"><defs></defs><clipPath id="h173p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#h173p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Identify</tspan></text><rect x="18.0" y="40.0" width="138.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Auer rods: AML/APL</tspan></tspan></text><rect x="18.0" y="68.0" width="126.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Smudge cells: CLL</tspan></tspan></text><rect x="18.0" y="96.0" width="147.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ph chromosome: CML</tspan></tspan></text><clipPath id="h173p2"><rect x="2" y="140" width="300" height="188" rx="14"/></clipPath><rect x="2" y="140" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="188" f