/text><rect x="95.4" y="221.0" width="29.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="102.4" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="102.4" dy="0"><tspan font-weight="700">RF</tspan></tspan></text><rect x="131.0" y="221.0" width="70.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="138.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="138.0" dy="0"><tspan font-weight="700">ESR, CRP</tspan></tspan></text><rect x="18.0" y="249.0" width="122.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Erosions on X-ray</tspan></tspan></text><clipPath id="m71p2"><rect x="2" y="293" width="300" height="158" rx="14"/></clipPath><rect x="2" y="293" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="158" fill="#0F766E" clip-path="url(#m71p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat to target</tspan></text><rect x="18.0" y="331.0" width="43.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Start</tspan></tspan></text><text x="80.0" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.0" dy="0"><tspan font-weight="700">Methotrexate </tspan><tspan font-weight="500">+ folic acid</tspan></tspan></text><rect x="18.0" y="361.0" width="54.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="376.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bridge</tspan></tspan></text><text x="80.0" y="376.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.0" dy="0"><tspan font-weight="700">Glucocorticoid </tspan><tspan font-weight="500">&lt;3 months,</tspan></tspan><tspan x="80.0" dy="17"><tspan font-weight="500">lowest dose</tspan></tspan></text><rect x="18.0" y="403.0" width="53.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Target</tspan></tspan></text><text x="80.0" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.0" dy="0"><tspan font-weight="500">Not at target: </tspan><tspan font-weight="700">add biologic </tspan><tspan font-weight="500">or JAK</tspan></tspan><tspan x="80.0" dy="17"><tspan font-weight="500">inhibitor</tspan></tspan></text><clipPath id="m71p3"><rect x="2" y="459" width="300" height="140" rx="14"/></clipPath><rect x="2" y="459" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="459" width="5" height="140" fill="#B7410E" clip-path="url(#m71p3)"/><text x="18" y="483" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="508.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Avoid glucocorticoids ≥3 months.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Before methotrexate: CBC, LFTs,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">creatinine, hepatitis B/C; methotrexate is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">teratogenic. Screen for TB before</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">biologics.</tspan></tspan></text></svg>