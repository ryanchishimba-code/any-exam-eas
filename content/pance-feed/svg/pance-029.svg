<svg width="304" height="555" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 555" role="img" aria-label="Infective endocarditis. Schematic valve with vegetations on the leaflets. Mnemonic FROM JANE: Fever, Roth spots, Osler nodes, Murmur, Janeway lesions, Anemia, Nail-bed hemorrhages, Emboli. Work-up order: blood cultures before antibiotics, then transthoracic echo, then transesophageal echo if unclear. Dental prophylaxis only for prosthetic valves, prior endocarditis, or certain congenital disease." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s29"><defs><linearGradient id="s29lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C6BE"/><stop offset="1" stop-color="#D88F85"/></linearGradient><linearGradient id="s29vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D58E"/><stop offset="1" stop-color="#E2AA4E"/></linearGradient></defs><clipPath id="s29p1"><rect x="2" y="2" width="300" height="182" rx="14"/></clipPath><rect x="2" y="2" width="300" height="182" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="182" fill="#0B5CAD" clip-path="url(#s29p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Valve and mnemonic (schematic)</tspan></text><path d="M26.0,42.0 C26.0,47.7 24.3,66.0 26.0,76.0 C27.7,86.0 34.3,93.3 36.0,102.0 C37.7,110.7 36.0,123.7 36.0,128.0" fill="none" stroke="#9C4B43" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M106.0,42.0 C106.0,47.7 107.7,66.0 106.0,76.0 C104.3,86.0 97.7,93.3 96.0,102.0 C94.3,110.7 96.0,123.7 96.0,128.0" fill="none" stroke="#9C4B43" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M33.0,82.0 C36.2,84.0 47.2,90.3 52.0,94.0 C56.8,97.7 60.3,102.3 62.0,104.0" fill="none" stroke="#D88F85" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M99.0,82.0 C95.8,84.0 84.8,90.3 80.0,94.0 C75.2,97.7 71.7,102.3 70.0,104.0" fill="none" stroke="#D88F85" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><circle cx="52.0" cy="98.0" r="8" fill="url(#s29vg)" stroke="#8A5A12" stroke-width="1.3"/><circle cx="61.0" cy="108.0" r="6" fill="url(#s29vg)" stroke="#8A5A12" stroke-width="1.3"/><circle cx="79.0" cy="97.0" r="9" fill="url(#s29vg)" stroke="#8A5A12" stroke-width="1.3"/><circle cx="71.0" cy="109.0" r="5.5" fill="url(#s29vg)" stroke="#8A5A12" stroke-width="1.3"/><g class="lb" data-n="1"><line class="ld" x1="79.0" y1="102.0" x2="79.0" y2="138.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="79.0" cy="102.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="22.0" y="138.0" width="88" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="29.0" y="157.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="29.0" dy="0"><tspan font-weight="700">Vegetations</tspan></tspan></text></g><g class="q" display="none"><circle cx="79.0" cy="149.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M75.8,146.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="79.1" cy="154.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="79.0" cy="149.0" r="22" fill="transparent"/></g><text x="130.0" y="54.0" font-size="14" font-weight="800" fill="#0B5CAD" xml:space="preserve"><tspan x="130.0" dy="0"><tspan font-weight="700">FROM JANE</tspan></tspan></text><text x="130.0" y="76.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.0" dy="0"><tspan font-weight="700">F</tspan><tspan font-weight="500">ever </tspan><tspan font-weight="700">R</tspan><tspan font-weight="500">oth spots </tspan><tspan font-weight="700">O</tspan><tspan font-weight="500">sler</tspan></tspan><tspan x="130.0" dy="18"><tspan font-weight="500">nodes </tspan><tspan font-weight="700">M</tspan><tspan font-weight="500">urmur</tspan></tspan></text><text x="130.0" y="114.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.0" dy="0"><tspan font-weight="700">J</tspan><tspan font-weight="500">aneway lesions</tspan></tspan><tspan x="130.0" dy="18"><tspan font-weight="700">A</tspan><tspan font-weight="500">nemia </tspan><tspan font-weight="700">N</tspan><tspan font-weight="500">ail-bed</tspan></tspan><tspan x="130.0" dy="18"><tspan font-weight="500">hemorrhages </tspan><tspan font-weight="700">E</tspan><tspan font-weight="500">mboli</tspan></tspan></text><clipPath id="s29p2"><rect x="2" y="192" width="300" height="229" rx="14"/></clipPath><rect x="2" y="192" width="300" height="229" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="192" width="5" height="229" fill="#0F766E" clip-path="url(#s29p2)"/><text x="18" y="216" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Order of work-up</tspan></text><rect x="18.0" y="230.0" width="19.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="245.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1</tspan></tspan></text><text x="52.0" y="245.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="700">Blood cultures </tspan><tspan font-weight="500">(≥2 sets) </tspan><tspan font-weight="700">before</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">antibiotics</tspan></tspan></text><rect x="18.0" y="272.0" width="21.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="287.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2</tspan></tspan></text><text x="52.0" y="287.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="700">TTE first; </tspan><tspan font-weight="500">TEE if negative or</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">inadequate</tspan></tspan></text><rect x="18.0" y="314.0" width="22.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="329.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3</tspan></tspan></text><text x="52.0" y="329.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="700">Duke criteria: </tspan><tspan font-weight="500">positive cultures and</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">endocardial involvement are major</tspan></tspan></text><rect x="18.0" y="356.0" width="31.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="371.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">OR</tspan></tspan></text><text x="57.8" y="371.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="57.8" dy="0"><tspan font-weight="700">Surgery </tspan><tspan font-weight="500">for heart failure, abscess,</tspan></tspan><tspan x="57.8" dy="17"><tspan font-weight="500">persistent infection or recurrent</tspan></tspan><tspan x="57.8" dy="17"><tspan font-weight="500">emboli</tspan></tspan></text><clipPath id="s29p3"><rect x="2" y="429" width="300" height="122" rx="14"/></clipPath><rect x="2" y="429" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="429" width="5" height="122" fill="#B7410E" clip-path="url(#s29p3)"/><text x="18" y="453" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="478.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Dental prophylaxis is only for prosthetic</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">valves or repair material, prior</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">endocarditis, certain congenital disease,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">or transplant valvulopathy.</tspan></tspan></text></svg>