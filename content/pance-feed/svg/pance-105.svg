<svg width="304" height="428" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 428" role="img" aria-label="Positional vertigo diagnosed by Dix-Hallpike and treated with the Epley maneuver without vestibular suppressants; in continuous vertigo the HINTS exam finds central causes such as stroke." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n105"><defs></defs><clipPath id="n105p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n105p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Peripheral clues</tspan></text><rect x="18.0" y="40.0" width="132.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Positional, seconds</tspan></tspan></text><rect x="18.0" y="68.0" width="141.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Torsional nystagmus</tspan></tspan></text><rect x="165.4" y="68.0" width="107.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="172.4" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="172.4" dy="0"><tspan font-weight="700">Hearing normal</tspan></tspan></text><clipPath id="n105p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#n105p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Manage</tspan></text><rect x="18.0" y="150.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="84.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.5" dy="0"><tspan font-weight="700">Dix-Hallpike</tspan></tspan></text><rect x="18.0" y="180.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="84.5" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.5" dy="0"><tspan font-weight="700">Epley </tspan><tspan font-weight="500">maneuver</tspan></tspan></text><rect x="18.0" y="210.0" width="48.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Avoid</tspan></tspan></text><text x="84.5" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.5" dy="0"><tspan font-weight="700">Meclizine, </tspan><tspan font-weight="500">benzodiazepines</tspan></tspan></text><rect x="18.0" y="240.0" width="58.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Central</tspan></tspan></text><text x="84.5" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="84.5" dy="0"><tspan font-weight="700">HINTS: </tspan><tspan font-weight="500">normal impulse, skew</tspan></tspan></text><clipPath id="n105p3"><rect x="2" y="284" width="300" height="140" rx="14"/></clipPath><rect x="2" y="284" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="140" fill="#B7410E" clip-path="url(#n105p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">HINTS in continuous vertigo: </tspan><tspan font-weight="500">a normal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">head impulse, direction-changing</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">nystagmus or skew deviation suggests</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">stroke. Do not add post-maneuver</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">restrictions.</tspan></tspan></text></svg>