<svg width="304" height="476" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 476" role="img" aria-label="Hepatitis B serology: HBsAg means infection, anti-HBs alone means vaccination, anti-HBc with anti-HBs means resolved infection, and IgM anti-HBc marks acute infection in the window period. All adults are screened once for hepatitis B and C." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g65"><defs></defs><clipPath id="g65p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#g65p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Universal screening</tspan></text><rect x="18.0" y="40.0" width="116.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Adults ≥18: once</tspan></tspan></text><rect x="140.0" y="40.0" width="112.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="147.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="147.0" dy="0"><tspan font-weight="700">Each pregnancy</tspan></tspan></text><clipPath id="g65p2"><rect x="2" y="84" width="300" height="240" rx="14"/></clipPath><rect x="2" y="84" width="300" height="240" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="240" fill="#0F766E" clip-path="url(#g65p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Read the panel</tspan></text><rect x="18.0" y="122.0" width="66.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HBsAg +</tspan></tspan></text><text x="18.0" y="159.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Infected </tspan><tspan font-weight="500">(acute or chronic: &gt;6 months)</tspan></tspan></text><rect x="18.0" y="171.0" width="96.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="186.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">anti-HBs only</tspan></tspan></text><text x="18.0" y="208.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Vaccinated </tspan><tspan font-weight="500">(immune)</tspan></tspan></text><rect x="18.0" y="220.0" width="135.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">anti-HBc + anti-HBs</tspan></tspan></text><text x="18.0" y="257.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Resolved </tspan><tspan font-weight="500">infection</tspan></tspan></text><rect x="18.0" y="269.0" width="73.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="284.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HCV Ab +</tspan></tspan></text><text x="18.0" y="306.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Confirm with </tspan><tspan font-weight="700">HCV RNA; </tspan><tspan font-weight="500">DAA cure</tspan></tspan></text><clipPath id="g65p3"><rect x="2" y="332" width="300" height="140" rx="14"/></clipPath><rect x="2" y="332" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="332" width="5" height="140" fill="#B7410E" clip-path="url(#g65p3)"/><text x="18" y="356" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="381.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">In the </tspan><tspan font-weight="700">window period </tspan><tspan font-weight="500">HBsAg is gone and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">anti-HBs not yet up: </tspan><tspan font-weight="700">IgM anti-HBc </tspan><tspan font-weight="500">is the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">only marker. Total anti-HBc alone may</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">also mean resolved infection: reactivation</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">risk on immunosuppression.</tspan></tspan></text></svg>