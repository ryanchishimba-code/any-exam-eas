<svg width="304" height="566" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 566" role="img" aria-label="Malaria prophylaxis for chloroquine-resistant areas with atovaquone-proguanil continued 7 days after travel or doxycycline continued 4 weeks after, weekly mefloquine started 2 weeks before; severe malaria is treated with IV artesunate." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i93"><defs></defs><clipPath id="i93p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#i93p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="157.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Returned traveler, fever</tspan></tspan></text><rect x="18.0" y="68.0" width="148.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Thick and thin smears</tspan></tspan></text><rect x="18.0" y="96.0" width="171.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">P. falciparum most severe</tspan></tspan></text><clipPath id="i93p2"><rect x="2" y="140" width="300" height="274" rx="14"/></clipPath><rect x="2" y="140" width="300" height="274" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="274" fill="#0F766E" clip-path="url(#i93p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Prevent and treat</tspan></text><rect x="18.0" y="178.0" width="151.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Atovaquone-proguanil</tspan></tspan></text><text x="18.0" y="215.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Start </tspan><tspan font-weight="700">1–2 days before; </tspan><tspan font-weight="500">continue </tspan><tspan font-weight="700">7 days</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">after</tspan></tspan></text><rect x="18.0" y="244.0" width="88.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="259.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Doxycycline</tspan></tspan></text><text x="18.0" y="281.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Start 1–2 days before; continue </tspan><tspan font-weight="700">4 weeks</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">after</tspan></tspan></text><rect x="18.0" y="310.0" width="83.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="325.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mefloquine</tspan></tspan></text><text x="18.0" y="347.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Weekly; start </tspan><tspan font-weight="700">≥2 weeks </tspan><tspan font-weight="500">before</tspan></tspan></text><rect x="18.0" y="359.0" width="56.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="374.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="18.0" y="396.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">IV artesunate </tspan><tspan font-weight="500">0, 12, 24 h</tspan></tspan></text><clipPath id="i93p3"><rect x="2" y="422" width="300" height="140" rx="14"/></clipPath><rect x="2" y="422" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="422" width="5" height="140" fill="#B7410E" clip-path="url(#i93p3)"/><text x="18" y="446" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="471.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Fever after travel </tspan><tspan font-weight="500">to an endemic area:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">urgent thick and thin smears, repeated</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">every 12–24 h for 3 sets if negative.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Severe malaria gets IV artesunate, not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">oral therapy.</tspan></tspan></text></svg>