<svg width="304" height="585" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 585" role="img" aria-label="Acute compartment syndrome with swollen lower-leg compartments after a fracture or crush injury. Split the cast, keep the limb at heart level, measure pressure if unclear, and perform emergency fasciotomy; pulses are often preserved." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m81"><defs></defs><clipPath id="m81p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#m81p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Lower leg (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="70" ry="50" fill="#C9786B" stroke="#8E4A40" stroke-width="2"/><ellipse cx="123.0" cy="88.0" rx="22" ry="14" fill="#E0533F" stroke="#8E2A1E" stroke-width="1"/><ellipse cx="177.0" cy="84.0" rx="22" ry="14" fill="#E0533F" stroke="#8E2A1E" stroke-width="1"/><ellipse cx="153.0" cy="124.0" rx="22" ry="14" fill="#E0533F" stroke="#8E2A1E" stroke-width="1"/><circle cx="145.0" cy="100.0" r="10" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><circle cx="177.0" cy="106.0" r="6" fill="#E9E2CF" stroke="#A89A74" stroke-width="1.2"/><g class="lb" data-n="1"><line class="ld" x1="177.0" y1="84.0" x2="177.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="177.0" cy="84.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="155" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Swollen compartments</tspan></tspan></text></g><g class="q"><circle cx="177.0" cy="197.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M173.8,194.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="177.1" cy="202.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="177.0" cy="197.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="99.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tibial fracture</tspan></tspan></text><rect x="123.6" y="221.0" width="88.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="130.6" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="130.6" dy="0"><tspan font-weight="700">Crush injury</tspan></tspan></text><rect x="18.0" y="249.0" width="75.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tight cast</tspan></tspan></text><clipPath id="m81p2"><rect x="2" y="293" width="300" height="158" rx="14"/></clipPath><rect x="2" y="293" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="158" fill="#0F766E" clip-path="url(#m81p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Release now</tspan></text><rect x="18.0" y="331.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First</tspan></tspan></text><text x="93.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Split cast </tspan><tspan font-weight="500">and dressings; limb</tspan></tspan><tspan x="93.4" dy="17"><tspan font-weight="500">at heart level</tspan></tspan></text><rect x="18.0" y="373.0" width="67.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Measure</tspan></tspan></text><text x="93.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Compartment pressure </tspan><tspan font-weight="500">if</tspan></tspan><tspan x="93.4" dy="17"><tspan font-weight="500">exam unclear</tspan></tspan></text><rect x="18.0" y="415.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="93.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Emergency fasciotomy</tspan></tspan></text><clipPath id="m81p3"><rect x="2" y="459" width="300" height="122" rx="14"/></clipPath><rect x="2" y="459" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="459" width="5" height="122" fill="#B7410E" clip-path="url(#m81p3)"/><text x="18" y="483" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="508.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Do not wait for pulselessness or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">paralysis: </tspan><tspan font-weight="500">these are late. Do not elevate</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">the limb above the heart; it reduces</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">perfusion.</tspan></tspan></text></svg>