-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Conservative</tspan></tspan></text><text x="121.6" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="121.6" dy="0"><tspan font-weight="700">NPO, IV fluids, NG tube,</tspan></tspan><tspan x="121.6" dy="17"><tspan font-weight="500">correct electrolytes</tspan></tspan></text><rect x="18.0" y="415.0" width="75.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Challenge</tspan></tspan></text><text x="121.6" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="121.6" dy="0"><tspan font-weight="700">Water-soluble contrast: </tspan><tspan font-weight="500">in</tspan></tspan><tspan x="121.6" dy="17"><tspan font-weight="500">colon by 24 h predicts</tspan></tspan><tspan x="121.6" dy="17"><tspan font-weight="500">resolution</tspan></tspan></text><clipPath id="g61p3"><rect x="2" y="488" width="300" height="122" rx="14"/></clipPath><rect x="2" y="488" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="488" width="5" height="122" fill="#B7410E" clip-path="url(#g61p3)"/><text x="18" y="512" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="537.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Signs of strangulation </tspan><tspan font-weight="500">(fever,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">tachycardia, continuous pain, peritonitis,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">raised lactate, CT ischemia) need surgery</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">now, not a trial of conservative care.</tspan></tspan></text></svg>