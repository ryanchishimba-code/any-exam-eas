<svg width="304" height="522" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 522" role="img" aria-label="Aortic stenosis. Schematic phonocardiogram: crescendo-decrescendo systolic murmur between S1 and a soft S2. Symptoms are exertional dyspnea, angina or syncope. Symptomatic severe stenosis needs valve replacement: surgery under 65, either surgery or TAVR from 65 to 80, TAVR over 80. Do not stress-test symptomatic severe AS." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s27"><defs></defs><clipPath id="s27p1"><rect x="2" y="2" width="300" height="192" rx="14"/></clipPath><rect x="2" y="2" width="300" height="192" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="192" fill="#0B5CAD" clip-path="url(#s27p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Phonocardiogram (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="68.0" rx="8" fill="#FFFFFF" stroke="#C7D8EE" stroke-width="1.2"/><line x1="22.0" y1="74.0" x2="284.0" y2="74.0" stroke="#B9C9DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="48.0" y1="59.0" x2="48.0" y2="89.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><line x1="136.0" y1="66.0" x2="136.0" y2="82.0" stroke="#4A625F" stroke-width="2.4" stroke-linecap="round"/><line x1="250.0" y1="59.0" x2="250.0" y2="89.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><path d="M55.0,74.0 L58.1,71.1 L61.2,68.3 L64.2,65.6 L67.3,63.0 L70.4,60.6 L73.5,58.4 L76.6,56.5 L79.7,54.9 L82.8,53.7 L85.8,52.7 L88.9,52.2 L92.0,52.0 L95.1,52.2 L98.2,52.7 L101.2,53.7 L104.3,54.9 L107.4,56.5 L110.5,58.4 L113.6,60.6 L116.7,63.0 L119.8,65.6 L122.8,68.3 L125.9,71.1 L129.0,74.0 L129.0,74.0 L125.9,76.9 L122.8,79.7 L119.8,82.4 L116.7,85.0 L113.6,87.4 L110.5,89.6