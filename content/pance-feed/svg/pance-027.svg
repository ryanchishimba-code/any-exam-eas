2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="179.1" cy="73.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="179.0" cy="68.0" r="22" fill="transparent"/></g><rect x="18.0" y="158.0" width="131.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Exertional dyspnea</tspan></tspan></text><rect x="155.2" y="158.0" width="57.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="162.2" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="162.2" dy="0"><tspan font-weight="700">Angina</tspan></tspan></text><rect x="218.6" y="158.0" width="67.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="225.6" y="173.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="225.6" dy="0"><tspan font-weight="700">Syncope</tspan></tspan></text><clipPath id="s27p2"><rect x="2" y="202" width="300" height="186" rx="14"/></clipPath><rect x="2" y="202" width="300" height="186" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="202" width="5" height="186" fill="#0F766E" clip-path="url(#s27p2)"/><text x="18" y="226" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Replace the valve</tspan></text><rect x="22.0" y="240.0" width="48.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="29.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="29.0" dy="0"><tspan font-weight="700">&lt;65 y</tspan></tspan></text><rect x="18.0" y="268.0" width="84.0" height="40.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="60.0" y="292.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="60.0" dy="0"><tspan font-weight="700">Surgery</tspan></tspan><tspan x="60.0" dy="15"><tspan font-weight="700">(SAVR)</tspan></tspan></text><rect x="115.0" y="240.0" width="63.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="122.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="122.0" dy="0"><tspan font-weight="700">65–80 y</tspan></tspan></text><rect x="111.0" y="268.0" width="96.0" height="40.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="159.0" y="292.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="159.0" dy="0"><tspan font-weight="700">SAVR or</tspan></tspan><tspan x="159.0" dy="15"><tspan font-weight="700">TAVR</tspan></tspan></text><rect x="220.0" y="240.0" width="49.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="227.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="227.0" dy="0"><tspan font-weight="700">&gt;80 y</tspan></tspan></text><rect x="216.0" y="268.0" width="72.0" height="40.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="252.0" y="292.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="252.0" dy="0"><tspan font-weight="700">TAVR</tspan></tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Replace the valve </tspan><tspan font-weight="500">when severe AS</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">causes symptoms, or LVEF falls below</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">50%.</tspan></tspan></text><clipPath id="s27p3"><rect x="2" y="396" width="300" height="122" rx="14"/></clipPath><rect x="2" y="396" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="396" width="5" height="122" fill="#B7410E" clip-path="url(#s27p3)"/><text x="18" y="420" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="445.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Do not stress-test a patient with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">symptomatic severe AS. Exercise testing</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">is harmful here; send them to valve</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">replacement instead.</tspan></tspan></text></svg>