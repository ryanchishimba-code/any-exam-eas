<svg width="304" height="615" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 615" role="img" aria-label="A fluctuant skin abscess treated by incision and drainage, with TMP-SMX if systemic signs; nonpurulent cellulitis is treated with strep-active cephalexin, adding MRSA coverage only when warranted." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i87"><defs></defs><clipPath id="i87p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#i87p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Skin (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><rect x="30.0" y="52.0" width="246.0" height="100.0" rx="8" fill="#E8C9B5" stroke="#B98C70" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="74" ry="38" fill="#E7A08E" stroke="none" stroke-width="1"/><ellipse cx="153.0" cy="102.0" rx="34" ry="20" fill="#F2D98A" stroke="#E0533F" stroke-width="2.5"/><g class="lb" data-n="1"><line class="ld" x1="175.0" y1="90.0" x2="150.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="175.0" cy="90.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="126" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Fluctuant abscess</tspan></tspan></text></g><g class="q" display="none"><circle cx="147.2" cy="196.6" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M144.0,194.0 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="147.3" cy="201.8" r="1.2" fill="#fff"/></g><circle class="hit" cx="147.2" cy="196.6" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="129.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Purulent: S. aureus</tspan></tspan></text><rect x="18.0" y="249.0" width="174.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Nonpurulent: streptococci</tspan></tspan></text><clipPath id="i87p2"><rect x="2" y="293" width="300" height="188" rx="14"/></clipPath><rect x="2" y="293" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="188" fill="#0F766E" clip-path="url(#i87p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Drain or cover strep</tspan></text><rect x="18.0" y="331.0" width="66.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Abscess</tspan></tspan></text><text x="102.8" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="102.8" dy="0"><tspan font-weight="700">Incision and drainage</tspan></tspan></text><rect x="18.0" y="361.0" width="70.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="376.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Add drug</tspan></tspan></text><text x="102.8" y="376.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="102.8" dy="0"><tspan font-weight="700">TMP-SMX </tspan><tspan font-weight="500">or doxycycline if</tspan></tspan><tspan x="102.8" dy="17"><tspan font-weight="500">SIRS or immunocompromised</tspan></tspan></text><rect x="18.0" y="403.0" width="66.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cellulitis</tspan></tspan></text><text x="102.8" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="102.8" dy="0"><tspan font-weight="700">Cephalexin </tspan><tspan font-weight="500">(strep-active)</tspan></tspan></text><rect x="18.0" y="433.0" width="76.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="448.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">MRSA risk</tspan></tspan></text><text x="102.8" y="448.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="102.8" dy="0"><tspan font-weight="700">Add TMP-SMX </tspan><tspan font-weight="500">to cephalexin,</tspan></tspan><tspan x="102.8" dy="17"><tspan font-weight="500">or clindamycin</tspan></tspan></text><clipPath id="i87p3"><rect x="2" y="489" width="300" height="122" rx="14"/></clipPath><rect x="2" y="489" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="489" width="5" height="122" fill="#B7410E" clip-path="url(#i87p3)"/><text x="18" y="513" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="538.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">For </tspan><tspan font-weight="700">nonpurulent cellulitis, </tspan><tspan font-weight="500">TMP-SMX</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">alone has uncertain streptococcal activity.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Most simple abscesses need drainage</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">only, not antibiotics.</tspan></tspan></text></svg>