<svg width="304" height="438" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 438" role="img" aria-label="Mucosal bleeding such as nosebleeds and heavy periods suggests von Willebrand disease; joint bleeds in a male suggest hemophilia; check VWF antigen and activity." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h174"><defs></defs><clipPath id="h174p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#h174p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Ask / examine</tspan></text><rect x="18.0" y="40.0" width="104.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mucosal: VWD</tspan></tspan></text><rect x="18.0" y="68.0" width="171.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hemarthrosis: hemophilia</tspan></tspan></text><rect x="18.0" y="96.0" width="125.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">↑aPTT, normal PT</tspan></tspan></text><clipPath id="h174p2"><rect x="2" y="140" width="300" height="200" rx="14"/></clipPath><rect x="2" y="140" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="200" fill="#0F766E" clip-path="url(#h174p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Confirm</tspan></text><rect x="18.0" y="178.0" width="45.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">VWD</tspan></tspan></text><text x="108.8" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.8" dy="0"><tspan font-weight="700">VWF Ag, activity, </tspan><tspan font-weight="500">factor VIII</tspan></tspan></text><rect x="18.0" y="208.0" width="46.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Level</tspan></tspan></text><text x="108.8" y="223.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.8" dy="0"><tspan font-weight="700">VWF &lt;0.30 IU/mL </tspan><tspan font-weight="500">= VWD;</tspan></tspan><tspan x="108.8" dy="17"><tspan font-weight="500">0.30–0.50 = low VWF</tspan></tspan></text><rect x="18.0" y="250.0" width="82.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="265.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hemophilia</tspan></tspan></text><text x="108.8" y="265.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.8" dy="0"><tspan font-weight="700">Factor VIII (A) or IX (B)</tspan></tspan><tspan x="108.8" dy="17"><tspan font-weight="500">assay</tspan></tspan></text><rect x="18.0" y="292.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="307.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="108.8" y="307.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="108.8" dy="0"><tspan font-weight="700">Factor replacement;</tspan></tspan><tspan x="108.8" dy="17"><tspan font-weight="500">emicizumab for A</tspan></tspan></text><clipPath id="h174p3"><rect x="2" y="348" width="300" height="86" rx="14"/></clipPath><rect x="2" y="348" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="348" width="5" height="86" fill="#B7410E" clip-path="url(#h174p3)"/><text x="18" y="372" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="397.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">VWF rises </tspan><tspan font-weight="500">with stress, pregnancy and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">inflammation and can mask VWD.</tspan></tspan></text></svg>