<svg width="304" height="462" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 462" role="img" aria-label="All adults are screened for depression with PHQ-2 then PHQ-9, treated with psychotherapy or an antidepressant by preference; universal suicide screening has insufficient evidence but depressed patients are asked directly." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p109"><defs></defs><clipPath id="p109p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#p109p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Screen</tspan></text><rect x="18.0" y="40.0" width="140.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">All adults: screen (B)</tspan></tspan></text><rect x="18.0" y="68.0" width="157.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pregnancy, postpartum</tspan></tspan></text><rect x="18.0" y="96.0" width="114.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Suicide screen: I</tspan></tspan></text><clipPath id="p109p2"><rect x="2" y="140" width="300" height="188" rx="14"/></clipPath><rect x="2" y="140" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="188" fill="#0F766E" clip-path="url(#p109p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="128.3" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="128.3" dy="0"><tspan font-weight="700">PHQ-2, </tspan><tspan font-weight="500">then PHQ-9</tspan></tspan></text><rect x="18.0" y="208.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="128.3" y="223.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="128.3" dy="0"><tspan font-weight="700">Psychotherapy or SSRI</tspan></tspan><tspan x="128.3" dy="17"><tspan font-weight="500">monotherapy</tspan></tspan></text><rect x="18.0" y="250.0" width="102.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="265.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mild, pregnant</tspan></tspan></text><text x="128.3" y="265.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="128.3" dy="0"><tspan font-weight="700">Psychotherapy </tspan><tspan font-weight="500">first</tspan></tspan></text><rect x="18.0" y="280.0" width="39.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="295.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Risk</tspan></tspan></text><text x="128.3" y="295.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="128.3" dy="0"><tspan font-weight="700">Ask about suicide;</tspan></tspan><tspan x="128.3" dy="17"><tspan font-weight="500">safety plan</tspan></tspan></text><clipPath id="p109p3"><rect x="2" y="336" width="300" height="122" rx="14"/></clipPath><rect x="2" y="336" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="336" width="5" height="122" fill="#B7410E" clip-path="url(#p109p3)"/><text x="18" y="360" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="385.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Suicide-risk screening of everyone </tspan><tspan font-weight="500">is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">not recommended for or against (I).</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Anyone with depression still needs direct</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">suicide questions.</tspan></tspan></text></svg>