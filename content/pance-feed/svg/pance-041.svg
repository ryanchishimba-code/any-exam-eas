cted = severe</tspan></tspan></text><clipPath id="p41p2"><rect x="2" y="293" width="300" height="176" rx="14"/></clipPath><rect x="2" y="293" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="176" fill="#0F766E" clip-path="url(#p41p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  ED treatment</tspan></text><rect x="18.0" y="331.0" width="19.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1</tspan></tspan></text><text x="48.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">SABA </tspan><tspan font-weight="500">repeated (or ICS-formoterol)</tspan></tspan></text><rect x="18.0" y="361.0" width="21.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="376.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2</tspan></tspan></text><text x="48.4" y="376.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">Oxygen </tspan><tspan font-weight="500">to SpO2 93–95% (adults)</tspan></tspan></text><rect x="18.0" y="391.0" width="22.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="406.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3</tspan></tspan></text><text x="48.4" y="406.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">Oral corticosteroid </tspan><tspan font-weight="500">early, 5–7 days</tspan></tspan></text><rect x="18.0" y="421.0" width="22.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="436.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">4</tspan></tspan></text><text x="48.4" y="436.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="500">Severe: add </tspan><tspan font-weight="700">ipratropium</tspan><tspan font-weight="500">; consider IV</tspan></tspan><tspan x="48.4" dy="17"><tspan font-weight="700">magnesium</tspan></tspan></text><clipPath id="p41p3"><rect x="2" y="477" width="300" height="122" rx="14"/></clipPath><rect x="2" y="477" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="477" width="5" height="122" fill="#B7410E" clip-path="url(#p41p3)"/><text x="18" y="501" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="526.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A </tspan><tspan font-weight="700">normal or rising PaCO2 </tspan><tspan font-weight="500">in a breathless</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">asthmatic signals fatigue and impending</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">failure. Antibiotics are not routine.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Discharge on ICS-containing therapy.</tspan></tspan></text></svg>