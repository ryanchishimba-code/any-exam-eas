<svg width="304" height="524" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 524" role="img" aria-label="Sepsis hour-1 bundle: measure lactate, draw blood cultures, give broad-spectrum antibiotics within 1 hour, infuse 30 mL/kg crystalloid, and start norepinephrine to keep mean arterial pressure at 65 or higher." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i85"><defs></defs><clipPath id="i85p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#i85p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="127.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Lactate ≥4 mmol/L</tspan></tspan></text><rect x="151.9" y="40.0" width="91.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="158.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="158.9" dy="0"><tspan font-weight="700">Hypotension</tspan></tspan></text><rect x="18.0" y="68.0" width="128.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Organ dysfunction</tspan></tspan></text><clipPath id="i85p2"><rect x="2" y="112" width="300" height="242" rx="14"/></clipPath><rect x="2" y="112" width="300" height="242" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="242" fill="#0F766E" clip-path="url(#i85p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Hour-1 bundle</tspan></text><rect x="18.0" y="150.0" width="67.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Measure</tspan></tspan></text><text x="106.2" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Lactate; </tspan><tspan font-weight="500">repeat if high</tspan></tspan></text><rect x="18.0" y="180.0" width="66.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cultures</tspan></tspan></text><text x="106.2" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Blood cultures </tspan><tspan font-weight="500">before</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">antibiotics</tspan></tspan></text><rect x="18.0" y="222.0" width="80.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Antibiotics</tspan></tspan></text><text x="106.2" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Broad-spectrum </tspan><tspan font-weight="500">within 1</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">hour</tspan></tspan></text><rect x="18.0" y="264.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fluids</tspan></tspan></text><text x="106.2" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">30 mL/kg crystalloid </tspan><tspan font-weight="500">within</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">3 h</tspan></tspan></text><rect x="18.0" y="306.0" width="61.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="321.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pressor</tspan></tspan></text><text x="106.2" y="321.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="106.2" dy="0"><tspan font-weight="700">Norepinephrine </tspan><tspan font-weight="500">first; MAP</tspan></tspan><tspan x="106.2" dy="17"><tspan font-weight="500">≥65</tspan></tspan></text><clipPath id="i85p3"><rect x="2" y="362" width="300" height="158" rx="14"/></clipPath><rect x="2" y="362" width="300" height="158" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="362" width="5" height="158" fill="#B7410E" clip-path="url(#i85p3)"/><text x="18" y="386" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="411.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Antibiotics within 1 hour </tspan><tspan font-weight="500">in possible</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">septic shock; do not hold them for</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">cultures that cannot be drawn quickly.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Norepinephrine is first-line; add</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">vasopressin rather than escalate</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">indefinitely.</tspan></tspan></text></svg>