<svg width="304" height="485" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 485" role="img" aria-label="Diabetes insipidus: urine osmolality below 200 mOsm/kg with high-normal or high sodium. Desmopressin corrects central (AVP deficiency) but not nephrogenic (AVP resistance) disease; nephrogenic is treated with a thiazide plus an NSAID." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="e145"><defs></defs><clipPath id="e145p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#e145p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="120.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Dilute urine &lt;200</tspan></tspan></text><rect x="18.0" y="68.0" width="156.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">High-normal or high Na</tspan></tspan></text><rect x="18.0" y="96.0" width="156.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Central vs nephrogenic</tspan></tspan></text><clipPath id="e145p2"><rect x="2" y="140" width="300" height="229" rx="14"/></clipPath><rect x="2" y="140" width="300" height="229" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="229" fill="#0F766E" clip-path="url(#e145p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="118.8" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.8" dy="0"><tspan font-weight="700">Serum Na, </tspan><tspan font-weight="500">serum and</tspan></tspan><tspan x="118.8" dy="17"><tspan font-weight="500">urine osmolality</tspan></tspan></text><rect x="18.0" y="220.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Split</tspan></tspan></text><text x="118.8" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.8" dy="0"><tspan font-weight="700">Desmopressin: </tspan><tspan font-weight="500">central</tspan></tspan><tspan x="118.8" dy="17"><tspan font-weight="500">concentrates, nephrogenic</tspan></tspan><tspan x="118.8" dy="17"><tspan font-weight="500">does not</tspan></tspan></text><rect x="18.0" y="279.0" width="58.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="294.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Central</tspan></tspan></text><text x="118.8" y="294.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.8" dy="0"><tspan font-weight="700">Desmopressin </tspan><tspan font-weight="500">(AVP</tspan></tspan><tspan x="118.8" dy="17"><tspan font-weight="500">deficiency)</tspan></tspan></text><rect x="18.0" y="321.0" width="92.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="336.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Nephrogenic</tspan></tspan></text><text x="118.8" y="336.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.8" dy="0"><tspan font-weight="700">Thiazide </tspan><tspan font-weight="500">plus NSAID (AVP</tspan></tspan><tspan x="118.8" dy="17"><tspan font-weight="500">resistance)</tspan></tspan></text><clipPath id="e145p3"><rect x="2" y="377" width="300" height="104" rx="14"/></clipPath><rect x="2" y="377" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="377" width="5" height="104" fill="#B7410E" clip-path="url(#e145p3)"/><text x="18" y="401" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="426.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Water deprivation </tspan><tspan font-weight="500">is unsafe if already</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hypernatremic with dilute urine; copeptin</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">testing has largely replaced it.</tspan></tspan></text></svg>