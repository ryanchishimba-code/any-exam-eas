st</tspan></text><rect x="18.0" y="331.0" width="50.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Acute</tspan></tspan></text><text x="96.8" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Heat, massage, NSAIDs,</tspan></tspan><tspan x="96.8" dy="17"><tspan font-weight="500">muscle relaxants</tspan></tspan></text><rect x="18.0" y="373.0" width="61.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Chronic</tspan></tspan></text><text x="96.8" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Exercise, </tspan><tspan font-weight="500">physical therapy,</tspan></tspan><tspan x="96.8" dy="17"><tspan font-weight="500">CBT</tspan></tspan></text><rect x="18.0" y="415.0" width="70.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Red flags</tspan></tspan></text><text x="96.8" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Urgent MRI; </tspan><tspan font-weight="500">cauda equina:</tspan></tspan><tspan x="96.8" dy="17"><tspan font-weight="500">decompress</tspan></tspan></text><clipPath id="m73p3"><rect x="2" y="471" width="300" height="140" rx="14"/></clipPath><rect x="2" y="471" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="140" fill="#B7410E" clip-path="url(#m73p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Most acute back pain resolves in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">weeks. </tspan><tspan font-weight="500">Red flags (cancer history, fever,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">IV drug use, weight loss, progressive</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">deficit, saddle anesthesia) warrant</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">imaging.</tspan></tspan></text></svg>