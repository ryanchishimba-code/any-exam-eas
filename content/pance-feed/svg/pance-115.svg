<svg width="304" height="432" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 432" role="img" aria-label="PTSD treated with trauma-focused psychotherapy such as CPT, prolonged exposure or EMDR, or sertraline, paroxetine or venlafaxine, never benzodiazepines; OCD treated with exposure and response prevention or an SSRI." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p115"><defs></defs><clipPath id="p115p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#p115p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="119.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Trauma &gt;1 month</tspan></tspan></text><rect x="18.0" y="68.0" width="165.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Avoidance, hyperarousal</tspan></tspan></text><rect x="18.0" y="96.0" width="147.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Rituals relieve anxiety</tspan></tspan></text><clipPath id="p115p2"><rect x="2" y="140" width="300" height="158" rx="14"/></clipPath><rect x="2" y="140" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="158" fill="#0F766E" clip-path="url(#p115p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="97.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PTSD therapy</tspan></tspan></text><text x="123.6" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.6" dy="0"><tspan font-weight="700">CPT, PE or EMDR</tspan></tspan></text><rect x="18.0" y="208.0" width="79.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PTSD drug</tspan></tspan></text><text x="123.6" y="223.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.6" dy="0"><tspan font-weight="700">Sertraline, </tspan><tspan font-weight="500">paroxetine,</tspan></tspan><tspan x="123.6" dy="17"><tspan font-weight="500">venlafaxine</tspan></tspan></text><rect x="18.0" y="250.0" width="41.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="265.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">OCD</tspan></tspan></text><text x="123.6" y="265.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.6" dy="0"><tspan font-weight="700">ERP </tspan><tspan font-weight="500">or SSRI; both if</tspan></tspan><tspan x="123.6" dy="17"><tspan font-weight="500">severe</tspan></tspan></text><clipPath id="p115p3"><rect x="2" y="306" width="300" height="122" rx="14"/></clipPath><rect x="2" y="306" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="306" width="5" height="122" fill="#B7410E" clip-path="url(#p115p3)"/><text x="18" y="330" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="355.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">PTSD: no benzodiazepines or cannabis</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(strong against). Trauma-focused</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">psychotherapy is preferred over</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">medication.</tspan></tspan></text></svg>