<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Multiple sclerosis diagnosed with MRI under the 2024 McDonald criteria, relapses treated with high-dose methylprednisolone for 3 to 5 days, and disease-modifying therapy started early." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n102"><defs></defs><clipPath id="n102p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n102p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="96.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Optic neuritis</tspan></tspan></text><rect x="120.2" y="40.0" width="101.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="127.2" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="127.2" dy="0"><tspan font-weight="700">Lhermitte sign</tspan></tspan></text><rect x="18.0" y="68.0" width="150.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Periventricular lesions</tspan></tspan></text><clipPath id="n102p2"><rect x="2" y="112" width="300" height="158" rx="14"/></clipPath><rect x="2" y="112" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="158" fill="#0F766E" clip-path="url(#n102p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="71.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Diagnose</tspan></tspan></text><text x="101.8" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="101.8" dy="0"><tspan font-weight="700">MRI </tspan><tspan font-weight="500">brain and spine</tspan></tspan><tspan x="101.8" dy="17"><tspan font-weight="500">(McDonald 2024)</tspan></tspan></text><rect x="18.0" y="192.0" width="62.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Relapse</tspan></tspan></text><text x="101.8" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="101.8" dy="0"><tspan font-weight="700">Methylprednisolone </tspan><tspan font-weight="500">1 g/day</tspan></tspan><tspan x="101.8" dy="17"><tspan font-weight="500">IV 3–5 days</tspan></tspan></text><rect x="18.0" y="234.0" width="75.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Long term</tspan></tspan></text><text x="101.8" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="101.8" dy="0"><tspan font-weight="700">DMT </tspan><tspan font-weight="500">early</tspan></tspan></text><clipPath id="n102p3"><rect x="2" y="278" width="300" height="122" rx="14"/></clipPath><rect x="2" y="278" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="278" width="5" height="122" fill="#B7410E" clip-path="url(#n102p3)"/><text x="18" y="302" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="327.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">2024 McDonald </tspan><tspan font-weight="500">adds the optic nerve as</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">a lesion site. Steroids treat relapses only;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">disease-modifying therapy prevents</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">them.</tspan></tspan></text></svg>