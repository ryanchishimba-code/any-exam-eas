<svg width="304" height="380" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 380" role="img" aria-label="Anorexia nervosa managed with medical stabilization, weight goals and monitored refeeding with phosphate checks; bulimia nervosa treated with CBT plus fluoxetine 60 mg daily." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p116"><defs></defs><clipPath id="p116p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p116p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="87.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bradycardia</tspan></tspan></text><rect x="111.7" y="40.0" width="65.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="118.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="118.7" dy="0"><tspan font-weight="700">Low BMI</tspan></tspan></text><rect x="18.0" y="68.0" width="190.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Parotid swelling, Russell sign</tspan></tspan></text><clipPath id="p116p2"><rect x="2" y="112" width="300" height="134" rx="14"/></clipPath><rect x="2" y="112" width="300" height="134" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="134" fill="#0F766E" clip-path="url(#p116p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="68.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Anorexia</tspan></tspan></text><text x="94.6" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.6" dy="0"><tspan font-weight="700">Admit </tspan><tspan font-weight="500">if unstable; weight goals</tspan></tspan></text><rect x="18.0" y="180.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Refeed</tspan></tspan></text><text x="94.6" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.6" dy="0"><tspan font-weight="700">Monitor phosphate, </tspan><tspan font-weight="500">potassium</tspan></tspan></text><rect x="18.0" y="210.0" width="58.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bulimia</tspan></tspan></text><text x="94.6" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="94.6" dy="0"><tspan font-weight="700">CBT + fluoxetine </tspan><tspan font-weight="500">60 mg</tspan></tspan></text><clipPath id="p116p3"><rect x="2" y="254" width="300" height="122" rx="14"/></clipPath><rect x="2" y="254" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="254" width="5" height="122" fill="#B7410E" clip-path="url(#p116p3)"/><text x="18" y="278" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="303.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Refeeding syndrome:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hypophosphatemia, arrhythmia, heart</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">failure. Bupropion is avoided in eating</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">disorders because of seizures.</tspan></tspan></text></svg>