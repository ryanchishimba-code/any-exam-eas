" y="264.0" width="87.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Benzo taper</tspan></tspan></text><text x="117.6" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="117.6" dy="0"><tspan font-weight="700">5–10% </tspan><tspan font-weight="500">every 2–4 weeks</tspan></tspan></text><clipPath id="p120p3"><rect x="2" y="308" width="300" height="122" rx="14"/></clipPath><rect x="2" y="308" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="122" fill="#B7410E" clip-path="url(#p120p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Benzodiazepine withdrawal </tspan><tspan font-weight="500">can cause</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">seizures: never stop abruptly.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Cannabinoid hyperemesis: relief with hot</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">showers; cessation is the cure.</tspan></tspan></text></svg>