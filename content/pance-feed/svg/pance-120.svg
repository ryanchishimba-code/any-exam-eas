<svg width="304" height="434" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 434" role="img" aria-label="Stimulant intoxication with dilated pupils treated with benzodiazepines and contingency management for use disorder; opioid toxidrome with pinpoint pupils; cannabinoid hyperemesis cured by stopping cannabis; benzodiazepines tapered 5 to 10 percent every 2 to 4 weeks." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p120"><defs></defs><clipPath id="p120p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p120p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Toxidrome</tspan></text><rect x="18.0" y="40.0" width="138.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mydriasis: stimulant</tspan></tspan></text><rect x="162.2" y="40.0" width="99.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="169.2" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="169.2" dy="0"><tspan font-weight="700">Miosis: opioid</tspan></tspan></text><rect x="18.0" y="68.0" width="157.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cannabis: hyperemesis</tspan></tspan></text><clipPath id="p120p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" r