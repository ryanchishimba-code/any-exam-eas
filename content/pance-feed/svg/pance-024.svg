<svg width="304" height="558" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 558" role="img" aria-label="Hypertensive emergency: blood pressure above 180 over 120 with acute organ damage such as encephalopathy, acute coronary syndrome, pulmonary edema, aortic dissection or kidney injury. ICU and IV titratable drug; lower systolic pressure no more than 25 percent in hour 1, then under 160 over 100 by 2 to 6 hours, then 130 to 140 over 24 to 48 hours. Aortic dissection: systolic under 120." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s24"><defs></defs><clipPath id="s24p1"><rect x="2" y="2" width="300" height="200" rx="14"/></clipPath><rect x="2" y="2" width="300" height="200" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="200" fill="#0B5CAD" clip-path="url(#s24p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Emergency gauge (schematic)</tspan></text><path d="M26.0,108.0 A52,52 0 0 1 52.0,63.0" fill="none" stroke="#9CC3E4" stroke-width="11" stroke-linecap="butt"/><path d="M52.0,63.0 A52,52 0 0 1 104.0,63.0" fill="none" stroke="#5B93C9" stroke-width="11" stroke-linecap="butt"/><path d="M104.0,63.0 A52,52 0 0 1 130.0,108.0" fill="none" stroke="#B7410E" stroke-width="11" stroke-linecap="butt"/><line x1="78.0" y1="108.0" x2="116.0" y2="95.6" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><circle cx="78.0" cy="108.0" r="5" fill="#0F2F2C" stroke="none" stroke-width="1"/><text x="78.0" y="130.0" font-size="13" font-weight="800" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="78.0" dy="0"><tspan font-weight="700">&gt;180 / &gt;120</tspan></tspan></text><g class="lb" data-n="1"><line class="ld" x1="116.0" y1="95.6" x2="168.0" y2="84.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="116.0" cy="95.6" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="168.0" y="44.0" width="116" height="40" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="175.0" y="63.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="175.0" dy="0"><tspan font-weight="700">Plus acute organ</tspan></tspan><tspan x="175.0" dy="15"><tspan font-weight="700">damage</tspan></tspan></text></g><g class="q"><circle cx="178.7" cy="81.6" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M175.5,79.0 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="178.8" cy="86.8" r="1.2" fill="#fff"/></g><circle class="hit" cx="178.7" cy="81.6" r="22" fill="transparent"/></g><rect x="18.0" y="138.0" width="112.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="153.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Encephalopathy</tspan></tspan></text><rect x="136.9" y="138.0" width="40.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="143.9" y="153.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="143.9" dy="0"><tspan font-weight="700">ACS</tspan></tspan></text><rect x="18.0" y="166.0" width="124.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="181.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pulmonary edema</tspan></tspan></text><rect x="148.4" y="166.0" width="78.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="155.4" y="181.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="155.4" dy="0"><tspan font-weight="700">Dissection</tspan></tspan></text><rect x="232.9" y="166.0" width="35.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="239.9" y="181.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="239.9" dy="0"><tspan font-weight="700">AKI</tspan></tspan></text><clipPath id="s24p2"><rect x="2" y="210" width="300" height="196" rx="14"/></clipPath><rect x="2" y="210" width="300" height="196" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="210" width="5" height="196" fill="#0F766E" clip-path="url(#s24p2)"/><text x="18" y="234" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Lower slowly</tspan></text><rect x="18.0" y="246.0" width="30.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="261.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1 h</tspan></tspan></text><text x="66.0" y="261.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="66.0" dy="0"><tspan font-weight="700">ICU, IV titratable drug; </tspan><tspan font-weight="500">SBP down</tspan></tspan><tspan x="66.0" dy="17"><tspan font-weight="500">no more than 25%</tspan></tspan></text><rect x="18.0" y="288.0" width="46.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="303.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2–6 h</tspan></tspan></text><text x="74.0" y="303.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="74.0" dy="0"><tspan font-weight="500">Then </tspan><tspan font-weight="700">&lt;160/100</tspan><tspan font-weight="500">; 24–48 h: </tspan><tspan font-weight="700">130–140</tspan></tspan><tspan x="74.0" dy="17"><tspan font-weight="500">systolic</tspan></tspan></text><text x="18.0" y="345.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">IV, titratable: </tspan><tspan font-weight="500">nicardipine, clevidipine,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">labetalol or esmolol.</tspan></tspan></text><text x="18.0" y="387.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Dissection: </tspan><tspan font-weight="500">SBP </tspan><tspan font-weight="700">&lt;120</tspan><tspan font-weight="500">, beta-blocker first.</tspan></tspan></text><clipPath id="s24p3"><rect x="2" y="414" width="300" height="140" rx="14"/></clipPath><rect x="2" y="414" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="414" width="5" height="140" fill="#B7410E" clip-path="url(#s24p3)"/><text x="18" y="438" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="463.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">BP above 180/120 without acute organ</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">damage is not an emergency. Use oral</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">therapy with outpatient follow-up;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">intermittent IV drugs to drop BP fast are</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">harmful.</tspan></tspan></text></svg>