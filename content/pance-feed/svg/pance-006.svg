<svg width="304" height="510" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 510" role="img" aria-label="Gout. Schematic polarized-light view of joint fluid with needle-shaped, negatively birefringent urate crystals and a white blood cell. Treat the flare with colchicine, an NSAID or a glucocorticoid; start allopurinol low (100 mg a day or less) to reach serum urate under 6 mg/dL, with anti-inflammatory prophylaxis for 3 to 6 months." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s6"><defs><clipPath id="s6c1"><circle cx="86" cy="110" r="66"/></clipPath></defs><clipPath id="s6p2"><rect x="2" y="2" width="300" height="200" rx="14"/></clipPath><rect x="2" y="2" width="300" height="200" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="200" fill="#0B5CAD" clip-path="url(#s6p2)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Joint aspirate, polarized light (schematic)</tspan></text><circle cx="86" cy="110" r="69" fill="#1B2A33" stroke="#0F1A20" stroke-width="2"/><circle cx="86" cy="110" r="66" fill="#26323A"/><g clip-path="url(#s6c1)"><path d="M44.2 90.9 L67.8 61.1" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M62.4 79.6 L97.6 60.4" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M100.3 95.2 L115.7 64.8" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M28.4 107.6 L63.6 100.4" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M62.6 114.3 L93.4 85.7" stroke="#4F8DF0" stroke-width="3.2" stroke-linecap="round"/><path d="M95.4 113.0 L128.6 99.0" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M51.2 148.8 L72.8 115.2" stroke="#F6C928" stroke-width="3.2" stroke-linecap="round"/><path d="M78.3 144.7 L109.7 123.3" strok