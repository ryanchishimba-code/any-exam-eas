ight="500">glucocorticoid.</tspan></tspan></text><text x="18.0" y="303.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Long term: </tspan><tspan font-weight="500">allopurinol, then titrate to the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">target.</tspan></tspan></text><rect x="18.0" y="330.0" width="125.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="345.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">start ≤100 mg/day</tspan></tspan></text><rect x="149.9" y="330.0" width="107.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="156.9" y="345.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="156.9" dy="0"><tspan font-weight="700">urate &lt;6 mg/dL</tspan></tspan></text><rect x="18.0" y="358.0" width="180.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="373.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">prophylaxis for 3–6 months</tspan></tspan></text><clipPath id="s6p4"><rect x="2" y="402" width="300" height="104" rx="14"/></clipPath><rect x="2" y="402" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="402" width="5" height="104" fill="#B7410E" clip-path="url(#s6p4)"/><text x="18" y="426" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="451.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Starting allopurinol can trigger a flare:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">begin low and add anti-inflammatory</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">prophylaxis for 3–6 months.</tspan></tspan></text></svg>