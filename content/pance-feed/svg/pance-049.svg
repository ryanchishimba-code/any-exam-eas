<svg width="304" height="615" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 615" role="img" aria-label="Obstructive sleep apnea with a collapsed oropharyngeal airway: diagnose with a home sleep apnea test or polysomnography, apnea-hypopnea index 15 or more, or 5 or more with symptoms, then positive airway pressure." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p49"><defs><radialGradient id="p49lg" cx="0.38" cy="0.3" r="0.9"><stop offset="0" stop-color="#56707D"/><stop offset="1" stop-color="#3A505B"/></radialGradient></defs><clipPath id="p49p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#p49p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Upper airway (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M88.0,50.0 C96.3,33.3 124.7,45.0 138.0,50.0 C151.3,55.0 161.3,63.3 168.0,80.0 C174.7,96.7 191.3,138.3 178.0,150.0 C164.7,161.7 103.0,166.7 88.0,150.0 C73.0,133.3 79.7,66.7 88.0,50.0 Z" fill="#E8C9B5" stroke="#B98C70" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><path d="M136.0,60.0 C137.7,65.8 142.3,80.3 146.0,95.0 C149.7,109.7 156.0,139.2 158.0,148.0" fill="none" stroke="#5E717C" stroke-width="11.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M136.0,60.0 C137.7,65.8 142.3,80.3 146.0,95.0 C149.7,109.7 156.0,139.2 158.0,148.0" fill="none" stroke="#2A3A44" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="142.0" cy="88.0" rx="9" ry="5" fill="#C9786B" stroke="#8E4A40" stroke-width="1"/><g class="lb" data-n="1"