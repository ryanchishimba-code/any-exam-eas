dy="0"><tspan font-weight="700">Sleepy</tspan></tspan></text><clipPath id="p49p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#p49p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Test, then PAP</tspan></text><rect x="18.0" y="331.0" width="40.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Test</tspan></tspan></text><text x="97.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">HSAT or polysomnography</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">(uncomplicated adults)</tspan></tspan></text><rect x="18.0" y="373.0" width="71.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Diagnose</tspan></tspan></text><text x="97.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">AHI ≥15, </tspan><tspan font-weight="500">or ≥5 with typical</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">symptoms</tspan></tspan></text><rect x="18.0" y="415.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="97.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="97.4" dy="0"><tspan font-weight="700">PAP </tspan><tspan font-weight="500">(CPAP/APAP); weight loss</tspan></tspan><tspan x="97.4" dy="17"><tspan font-weight="500">as adjunct</tspan></tspan></text><clipPath id="p49p3"><rect x="2" y="471" width="300" height="140" rx="14"/></clipPath><rect x="2" y="471" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="140" fill="#B7410E" clip-path="url(#p49p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A </tspan><tspan font-weight="700">negative or technically inadequate</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">home test </tspan><tspan font-weight="500">does not rule OSA out:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">proceed to in-lab polysomnography.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Questionnaires alone do not diagnose</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">OSA.</tspan></tspan></text></svg>