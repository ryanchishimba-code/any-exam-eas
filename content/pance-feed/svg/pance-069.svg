<svg width="304" height="475" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 475" role="img" aria-label="Vitamin deficiencies: thiamine with Wernicke encephalopathy and beriberi, niacin with pellagra, vitamin C with scurvy, and B12 with megaloblastic anemia and neuropathy; give IV thiamine before glucose." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g69"><defs></defs><clipPath id="g69p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#g69p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Key deficiencies</tspan></text><rect x="18.0" y="40.0" width="147.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">B1: Wernicke, beriberi</tspan></tspan></text><rect x="171.0" y="40.0" width="86.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="178.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="178.0" dy="0"><tspan font-weight="700">B3: pellagra</tspan></tspan></text><rect x="18.0" y="68.0" width="72.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">C: scurvy</tspan></tspan></text><rect x="96.7" y="68.0" width="112.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="103.7" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="103.7" dy="0"><tspan font-weight="700">B12: neuropathy</tspan></tspan></text><clipPath id="g69p2"><rect x="2" y="112" width="300" height="229" rx="14"/></clipPath><rect x="2" y="112" width="300" height="229" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="229" fill="#0F766E" clip-path="url(#g69p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Name the vitamin</tspan></text><rect x="18.0" y="150.0" width="27.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">B1</tspan></tspan></text><text x="61.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="61.5" dy="0"><tspan font-weight="700">Confusion, ataxia,</tspan></tspan><tspan x="61.5" dy="17"><tspan font-weight="700">ophthalmoplegia; </tspan><tspan font-weight="500">high-output HF</tspan></tspan><tspan x="61.5" dy="17"><tspan font-weight="500">(beriberi)</tspan></tspan></text><rect x="18.0" y="209.0" width="30.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="224.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">B3</tspan></tspan></text><text x="61.5" y="224.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="61.5" dy="0"><tspan font-weight="700">Pellagra: </tspan><tspan font-weight="500">dermatitis, diarrhea,</tspan></tspan><tspan x="61.5" dy="17"><tspan font-weight="500">dementia</tspan></tspan></text><rect x="18.0" y="251.0" width="23.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="266.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">C</tspan></tspan></text><text x="61.5" y="266.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="61.5" dy="0"><tspan font-weight="700">Scurvy: </tspan><tspan font-weight="500">gum bleeding, perifollicular</tspan></tspan><tspan x="61.5" dy="17"><tspan font-weight="500">hemorrhage</tspan></tspan></text><rect x="18.0" y="293.0" width="35.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="308.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">B12</tspan></tspan></text><text x="61.5" y="308.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="61.5" dy="0"><tspan font-weight="700">Megaloblastic anemia, </tspan><tspan font-weight="500">neuropathy;</tspan></tspan><tspan x="61.5" dy="17"><tspan font-weight="500">high MMA</tspan></tspan></text><clipPath id="g69p3"><rect x="2" y="349" width="300" height="122" rx="14"/></clipPath><rect x="2" y="349" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="349" width="5" height="122" fill="#B7410E" clip-path="url(#g69p3)"/><text x="18" y="373" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="398.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Give </tspan><tspan font-weight="700">IV thiamine before glucose </tspan><tspan font-weight="500">in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">at-risk patients (alcohol use, malnutrition,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hyperemesis, bariatric surgery); glucose</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">first can precipitate Wernicke.</tspan></tspan></text></svg>