<svg width="304" height="486" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 486" role="img" aria-label="Opportunistic infection prophylaxis in HIV: TMP-SMX at CD4 below 200 for Pneumocystis and below 100 for Toxoplasma if IgG positive; MAC prophylaxis below 50 only if ART is not started immediately." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i94"><defs></defs><clipPath id="i94p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#i94p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  CD4 thresholds</tspan></text><rect x="18.0" y="40.0" width="109.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CD4 &lt;200: PCP</tspan></tspan></text><rect x="18.0" y="68.0" width="175.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CD4 &lt;100 + Toxo IgG: toxo</tspan></tspan></text><rect x="18.0" y="96.0" width="163.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CD4 &lt;50: MAC if no ART</tspan></tspan></text><clipPath id="i94p2"><rect x="2" y="140" width="300" height="212" rx="14"/></clipPath><rect x="2" y="140" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="212" fill="#0F766E" clip-path="url(#i94p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Prophylaxis</tspan></text><rect x="18.0" y="178.0" width="47.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;200</tspan></tspan></text><text x="115.9" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="115.9" dy="0"><tspan font-weight="700">TMP-SMX </tspan><tspan font-weight="500">for</tspan></tspan><tspan x="115.9" dy="17"><tspan font-weight="500">Pneumocystis</tspan></tspan></text><rect x="18.0" y="220.0" width="44.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;100</tspan></tspan></text><text x="115.9" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="115.9" dy="0"><tspan font-weight="700">TMP-SMX </tspan><tspan font-weight="500">for Toxoplasma</tspan></tspan><tspan x="115.9" dy="17"><tspan font-weight="500">(IgG+)</tspan></tspan></text><rect x="18.0" y="262.0" width="38.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;50</tspan></tspan></text><text x="115.9" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="115.9" dy="0"><tspan font-weight="700">MAC </tspan><tspan font-weight="500">only if not starting</tspan></tspan><tspan x="115.9" dy="17"><tspan font-weight="500">ART</tspan></tspan></text><rect x="18.0" y="304.0" width="89.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="319.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Sulfa allergy</tspan></tspan></text><text x="115.9" y="319.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="115.9" dy="0"><tspan font-weight="700">Dapsone </tspan><tspan font-weight="500">(check G6PD) or</tspan></tspan><tspan x="115.9" dy="17"><tspan font-weight="500">atovaquone</tspan></tspan></text><clipPath id="i94p3"><rect x="2" y="360" width="300" height="122" rx="14"/></clipPath><rect x="2" y="360" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="360" width="5" height="122" fill="#B7410E" clip-path="url(#i94p3)"/><text x="18" y="384" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="409.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Starting ART immediately removes the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">need for MAC prophylaxis </tspan><tspan font-weight="500">at any CD4.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Stop PCP prophylaxis once CD4 stays</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">above 200 for 3 months on ART.</tspan></tspan></text></svg>