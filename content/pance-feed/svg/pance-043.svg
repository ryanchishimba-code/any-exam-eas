<svg width="304" height="617" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 617" role="img" aria-label="Right-sided pneumothorax with a visceral pleural line and no lung markings beyond it. Minimally symptomatic primary pneumothorax can be observed; symptomatic ones get needle aspiration, an ambulatory valve or a chest drain; tension pneumothorax is decompressed at once." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p43"><defs><radialGradient id="p43lg" cx="0.38" cy="0.3" r="0.9"><stop offset="0" stop-color="#56707D"/><stop offset="1" stop-color="#3A505B"/></radialGradient></defs><clipPath id="p43p1"><rect x="2" y="2" width="300" height="298" rx="14"/></clipPath><rect x="2" y="2" width="300" height="298" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="298" fill="#0B5CAD" clip-path="url(#p43p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Right pneumothorax (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M137.0,52.0 C128.9,49.3 101.7,53.0 86.4,66.0 C71.1,79.0 50.4,115.7 45.0,130.0 C39.6,144.3 41.2,149.3 54.2,152.0 C67.2,154.7 110.1,151.0 123.2,146.0 C136.3,141.0 131.0,132.7 133.0,122.0 C135.0,111.3 134.3,93.7 135.0,82.0 C135.7,70.3 145.1,54.7 137.0,52.0 Z" fill="#0B1216" stroke="#8AA0AB" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><path d="M133.0,74.0 C128.4,71.3 112.3,80.3 103.3,88.0 C94.3,95.7 82.2,111.0 79.0,120.0 C75.8,129.0 76.8,139.3 84.4,142.0 C92.1,144.7 117.5,141.0 124.9,136.0 C132.3,131.0 128.0,117.3 129.0,112.0 C130.0,106.7 130.3,110.3 131.0,104.0 C131.7,97.7 137.6,76.7 133.0,74.0 Z" fill="url(#p43lg)" stroke="#E9EEF0" stroke-width="1.6" stroke-linejoin="round" stroke-linec