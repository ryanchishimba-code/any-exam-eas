F5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="378" width="5" height="144" fill="#B7410E" clip-path="url(#s30p4)"/><text x="18" y="402" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><ellipse cx="54.0" cy="450.0" rx="36" ry="33" fill="#CFE3F5" stroke="#0B5CAD" stroke-width="1.8"/><ellipse cx="54.0" cy="450.0" rx="22" ry="20" fill="#E8A09A" stroke="#7C2F2B" stroke-width="1.4"/><ellipse cx="54.0" cy="450.0" rx="26" ry="24" fill="none" stroke="#7C2F2B" stroke-width="1"/><text x="100.0" y="428.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.0" dy="0"><tspan font-weight="700">Tamponade: </tspan><tspan font-weight="500">hypotension,</tspan></tspan><tspan x="100.0" dy="18"><tspan font-weight="500">JVD, muffled heart sounds</tspan></tspan></text><text x="18.0" y="490.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Urgent pericardiocentesis, </tspan><tspan font-weight="500">not NSAIDs.</tspan></tspan></text></svg>