<svg width="304" height="508" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 508" role="img" aria-label="HFrEF. Reduced ejection fraction gauge, then the four foundational drug classes: ARNI, evidence-based beta-blocker, mineralocorticoid receptor antagonist, and SGLT2 inhibitor. Never combine an ARNI with an ACE inhibitor." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s3"><defs></defs><clipPath id="s3p1"><rect x="2" y="2" width="300" height="122" rx="14"/></clipPath><rect x="2" y="2" width="300" height="122" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="122" fill="#0B5CAD" clip-path="url(#s3p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who qualifies</tspan></text><rect x="18.0" y="40.0" width="270.0" height="26.0" rx="8" fill="#E3ECF7" stroke="#CFE0F2" stroke-width="1"/><rect x="18.0" y="40.0" width="108.0" height="26.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="28.0" y="57.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">LVEF ≤40%</tspan></tspan></text><text x="136.0" y="57.5" font-size="12" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="136.0" dy="0"><tspan font-weight="600">reduced ejection fraction</tspan></tspan></text><text x="18.0" y="87.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Stage C HFrEF: </tspan><tspan font-weight="500">symptomatic heart failure</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">with a low ejection fraction.</tspan></tspan></text><clipPath id="s3p2"><rect x="2" y="132" width="300" height="260" rx="14"/></clipPath><rect x="2" y="132" width="300" height="260" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="132" width="5" height="260" fill="#0F766E" clip-path="url(#s3p2)"/><text x="18" y="156" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Use all four classes</tspan></text><rect x="18.0" y="170.0" width="131.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="182.0" width="4.0" height="76.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="192.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">ARNI</tspan></tspan></text><text x="32.0" y="214.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">Sacubitril/valsartan.</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">ACE inhibitor or</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">ARB if not</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">feasible.</tspan></tspan></text><rect x="157.0" y="170.0" width="131.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="158.0" y="182.0" width="4.0" height="76.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="171.0" y="192.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="700">Beta-blocker</tspan></tspan></text><text x="171.0" y="214.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="500">Carvedilol,</tspan></tspan><tspan x="171.0" dy="16"><tspan font-weight="500">metoprolol</tspan></tspan><tspan x="171.0" dy="16"><tspan font-weight="500">succinate or</tspan></tspan><tspan x="171.0" dy="16"><tspan font-weight="500">bisoprolol.</tspan></tspan></text><rect x="18.0" y="278.0" width="131.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="19.0" y="290.0" width="4.0" height="76.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="32.0" y="300.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="700">MRA</tspan></tspan></text><text x="32.0" y="322.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="32.0" dy="0"><tspan font-weight="500">Spironolactone or</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">eplerenone.</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">Needs eGFR &gt;30</tspan></tspan><tspan x="32.0" dy="16"><tspan font-weight="500">and K &lt;5.0.</tspan></tspan></text><rect x="157.0" y="278.0" width="131.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#CBE7E3" stroke-width="1.2"/><rect x="158.0" y="290.0" width="4.0" height="76.0" rx="2" fill="#0F766E" stroke="none" stroke-width="1"/><text x="171.0" y="300.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="700">SGLT2 inhibitor</tspan></tspan></text><text x="171.0" y="322.0" font-size="12" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="171.0" dy="0"><tspan font-weight="500">Benefit with or</tspan></tspan><tspan x="171.0" dy="16"><tspan font-weight="500">without diabetes.</tspan></tspan></text><clipPath id="s3p3"><rect x="2" y="400" width="300" height="104" rx="14"/></clipPath><rect x="2" y="400" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="400" width="5" height="104" fill="#B7410E" clip-path="url(#s3p3)"/><text x="18" y="424" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="449.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Never combine an ARNI with an ACE</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">inhibitor, or start it within 36 hours of the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">last ACE-inhibitor dose (angioedema).</tspan></tspan></text></svg>