FF" stroke="#C7D8EE" stroke-width="1.2"/><line x1="206.0" y1="78.0" x2="284.0" y2="78.0" stroke="#B9C9DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="214.0" y1="62.0" x2="214.0" y2="94.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><line x1="246.0" y1="62.0" x2="246.0" y2="94.0" stroke="#0F2F2C" stroke-width="3" stroke-linecap="round"/><line x1="258.0" y1="69.0" x2="258.0" y2="87.0" stroke="#B7410E" stroke-width="2.2" stroke-linecap="round"/><path d="M263.0,73.0 L263.7,72.0 L264.4,73.3 L265.1,74.1 L265.8,72.6 L266.5,72.1 L267.2,73.6 L268.0,73.9 L268.7,72.3 L269.4,72.3 L270.1,74.0 L270.8,73.6 L271.5,72.0 L272.2,72.7 L272.9,74.1 L273.6,73.2 L274.3,72.0 L275.0,73.1 L275.8,74.1 L276.5,72.8 L277.2,72.0 L277.9,73.5 L278.6,74.0 L279.3,72.4 L280.0,72.2 L280.0,83.8 L279.3,83.6 L278.6,82.0 L277.9,82.5 L277.2,84.0 L276.5,83.2 L275.8,81.9 L275.0,82.9 L274.3,84.0 L273.6,82.8 L272.9,81.9 L272.2,83.3 L271.5,84.0 L270.8,82.4 L270.1,82.0 L269.4,83.7 L268.7,83.7 L268.0,82.1 L267.2,82.4 L266.5,83.9 L265.8,83.4 L265.1,81.9 L264.4,82.7 L263.7,84.0 L263.0,83.0 Z" fill="#9CC3E4" fill-opacity=".75" stroke="#0B5CAD" stroke-width="1.3" stroke-linejoin="round"/><text x="204.0" y="134.0" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="204.0" dy="0"><tspan font-weight="700">MS: snap,</tspan></tspan><tspan x="204.0" dy="15"><tspan font-weight="700">then rumble</tspan></tspan></text><clipPath id="s28p2"><rect x="2" y="202" width="300" height="206" rx="14"/></clipPath><rect x="2" y="202" width="300" height="206" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="202" width="5" height="206" fill="#0F766E" clip-path="url(#s28p2)"/><text x="18" y="226" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Symptoms trigger surgery</tspan></text><rect x="18.0" y="240.0" width="130.0" height="56.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="83.0" y="257.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0"><tspan font-weight="700">Symptomatic</tspan></tspan><tspan x="83.0" dy="15"><tspan font-weight="700">severe MR or AR:</tspan></tspan><tspan x="83.0" dy="15"><tspan font-weight="700">surgery</tspan></tspan></text><rect x="154.0" y="240.0" width="134.0" height="56.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="221.0" y="257.0" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0"><tspan font-weight="700">Severe rheumatic</tspan></tspan><tspan x="221.0" dy="15"><tspan font-weight="700">MS: balloon</tspan></tspan><tspan x="221.0" dy="15"><tspan font-weight="700">commissurotomy</tspan></tspan></text><text x="18.0" y="319.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">AR without symptoms: </tspan><tspan font-weight="500">surgery if LVEF</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">≤55% or LVESD &gt;50 mm.</tspan></tspan></text><rect x="18.0" y="352.0" width="33.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="367.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">MS</tspan></tspan></text><text x="62.0" y="367.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="62.0" dy="0"><tspan font-weight="500">valve area </tspan><tspan font-weight="700">≤1.5 cm² </tspan><tspan font-weight="500">is severe; </tspan><tspan font-weight="700">TEE</tspan></tspan><tspan x="62.0" dy="17"><tspan font-weight="700">first </tspan><tspan font-weight="500">to exclude LA clot</tspan></tspan></text><clipPath id="s28p3"><rect x="2" y="416" width="300" height="86" rx="14"/></clipPath><rect x="2" 