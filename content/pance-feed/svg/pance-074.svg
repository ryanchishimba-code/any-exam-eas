<svg width="304" height="509" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 509" role="img" aria-label="Osteoporosis screening with DXA in women 65 and older and younger postmenopausal women at increased risk; T-score of minus 2.5 or lower or a fragility fracture is osteoporosis, and bisphosphonates are first-line." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m74"><defs></defs><clipPath id="m74p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#m74p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who to screen</tspan></text><rect x="18.0" y="40.0" width="103.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Women ≥65: B</tspan></tspan></text><rect x="18.0" y="68.0" width="213.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Postmenopausal &lt;65 with risk: B</tspan></tspan></text><rect x="18.0" y="96.0" width="116.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Men: I statement</tspan></tspan></text><clipPath id="m74p2"><rect x="2" y="140" width="300" height="217" rx="14"/></clipPath><rect x="2" y="140" width="300" height="217" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="217" fill="#0F766E" clip-path="url(#m74p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  T-score to treatment</tspan></text><rect x="18.0" y="178.0" width="53.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≤ −2.5</tspan></tspan></text><text x="99.8" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.8" dy="0"><tspan font-weight="700">Osteoporosis </tspan><tspan font-weight="500">(or fragility</tspan></tspan><tspan x="99.8" dy="17"><tspan font-weight="500">fracture)</tspan></tspan></text><rect x="18.0" y="220.0" width="73.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">−1 to −2.5</tspan></tspan></text><text x="99.8" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.8" dy="0"><tspan font-weight="700">Osteopenia: </tspan><tspan font-weight="500">treat if FRAX</tspan></tspan><tspan x="99.8" dy="17"><tspan font-weight="500">high</tspan></tspan></text><rect x="18.0" y="262.0" width="43.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drug</tspan></tspan></text><text x="99.8" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.8" dy="0"><tspan font-weight="700">Bisphosphonate </tspan><tspan font-weight="500">first-line</tspan></tspan></text><rect x="18.0" y="292.0" width="72.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="307.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Very high</tspan></tspan></text><text x="99.8" y="307.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.8" dy="0"><tspan font-weight="700">Romosozumab </tspan><tspan font-weight="500">or</tspan></tspan><tspan x="99.8" dy="17"><tspan font-weight="500">teriparatide, then</tspan></tspan><tspan x="99.8" dy="17"><tspan font-weight="500">bisphosphonate</tspan></tspan></text><clipPath id="m74p3"><rect x="2" y="365" width="300" height="140" rx="14"/></clipPath><rect x="2" y="365" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="365" width="5" height="140" fill="#B7410E" clip-path="url(#m74p3)"/><text x="18" y="389" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="414.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Take oral </tspan><tspan font-weight="700">bisphosphonates fasting with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">water, upright 30 minutes. </tspan><tspan font-weight="500">Avoid with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">low creatinine clearance. Rare: jaw</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">osteonecrosis, atypical femur fracture:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">drug holiday considered.</tspan></tspan></text></svg>