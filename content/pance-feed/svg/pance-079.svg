<svg width="304" height="452" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 452" role="img" aria-label="Polymyalgia rheumatica and giant cell arteritis in adults over 50 with high ESR. PMR uses prednisone 12.5 to 25 mg; GCA needs high-dose steroids immediately, temporal artery biopsy within 2 weeks, and tocilizumab as a steroid-sparing option." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m79"><defs></defs><clipPath id="m79p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m79p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Two linked diseases</tspan></text><rect x="18.0" y="40.0" width="65.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age &gt;50</tspan></tspan></text><rect x="89.9" y="40.0" width="100.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="96.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="96.9" dy="0"><tspan font-weight="700">ESR, CRP high</tspan></tspan></text><rect x="18.0" y="68.0" width="117.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Jaw claudication</tspan></tspan></text><rect x="141.2" y="68.0" width="80.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="148.2" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="148.2" dy="0"><tspan font-weight="700">Vision loss</tspan></tspan></text><clipPath id="m79p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#m79p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Steroids now</tspan></text><rect x="18.0" y="150.0" width="41.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PMR</tspan></tspan></text><text x="81.7" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.7" dy="0"><tspan font-weight="700">Prednisone 12.5–25 mg</tspan><tspan font-weight="500">/day,</tspan></tspan><tspan x="81.7" dy="17"><tspan font-weight="500">slow taper</tspan></tspan></text><rect x="18.0" y="192.0" width="41.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GCA</tspan></tspan></text><text x="81.7" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.7" dy="0"><tspan font-weight="700">High-dose steroids </tspan><tspan font-weight="500">immediately</tspan></tspan></text><rect x="18.0" y="222.0" width="55.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Biopsy</tspan></tspan></text><text x="81.7" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.7" dy="0"><tspan font-weight="700">Temporal artery biopsy </tspan><tspan font-weight="500">within 2</tspan></tspan><tspan x="81.7" dy="17"><tspan font-weight="500">weeks</tspan></tspan></text><rect x="18.0" y="264.0" width="38.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Add</tspan></tspan></text><text x="81.7" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="81.7" dy="0"><tspan font-weight="700">Tocilizumab </tspan><tspan font-weight="500">steroid-sparing</tspan></tspan></text><clipPath id="m79p3"><rect x="2" y="308" width="300" height="140" rx="14"/></clipPath><rect x="2" y="308" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="140" fill="#B7410E" clip-path="url(#m79p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Start steroids before the biopsy </tspan><tspan font-weight="500">in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">suspected GCA to protect vision; biopsy</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">stays positive for about 2 weeks. PMR</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">that does not respond quickly to low-dose</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">steroids: reconsider the diagnosis.</tspan></tspan></text></svg>