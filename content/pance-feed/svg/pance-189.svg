<svg width="304" height="480" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 480" role="img" aria-label="Plaque psoriasis: silvery scale on extensor surfaces, Auspitz sign, nail pitting and Koebner phenomenon; treat mild disease topically and moderate to severe disease with biologics." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m189"><defs></defs><clipPath id="m189p1"><rect x="2" y="2" width="300" height="114" rx="14"/></clipPath><rect x="2" y="2" width="300" height="114" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="114" fill="#0B5CAD" clip-path="url(#m189p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><text x="18.0" y="53.0" font-size="12" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="800" fill="#92400E" letter-spacing=".8">MNEMONIC</tspan><tspan> </tspan><tspan font-weight="600">Auspitz bleeding, pitting nails,</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="600">Koebner at scars</tspan></tspan></text><rect x="18.0" y="80.0" width="84.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Silver scale</tspan></tspan></text><rect x="108.3" y="80.0" width="90.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="115.3" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="115.3" dy="0"><tspan font-weight="700">Auspitz sign</tspan></tspan></text><rect x="204.4" y="80.0" width="79.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="211.4" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="211.4" dy="0"><tspan font-weight="700">Nail pitting</tspan></tspan></text><clipPath id="m189p2"><rect x="2" y="124" width="300" height="240" rx="14"/></clipPath><rect x="2" y="124" width="300" height="240" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="124" width="5" height="240" fill="#0F766E" clip-path="url(#m189p2)"/><text x="18" y="148" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="162.0" width="40.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="177.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mild</tspan></tspan></text><text x="18.0" y="199.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Topical steroid </tspan><tspan font-weight="500">+ vitamin D analog</tspan></tspan></text><rect x="18.0" y="211.0" width="120.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="226.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Moderate–severe</tspan></tspan></text><text x="18.0" y="248.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Biologic </tspan><tspan font-weight="500">(TNF, IL-17, IL-23)</tspan></tspan></text><rect x="18.0" y="260.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="275.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="18.0" y="297.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Psoriatic arthritis </tspan><tspan font-weight="500">each visit</tspan></tspan></text><rect x="18.0" y="309.0" width="48.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="324.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Avoid</tspan></tspan></text><text x="18.0" y="346.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Systemic steroids</tspan></tspan></text><clipPath id="m189p3"><rect x="2" y="372" width="300" height="104" rx="14"/></clipPath><rect x="2" y="372" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="372" width="5" height="104" fill="#B7410E" clip-path="url(#m189p3)"/><text x="18" y="396" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="421.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Psoriatic arthritis </tspan><tspan font-weight="500">screening matters;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">stopping systemic steroids can trigger</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">pustular flares.</tspan></tspan></text></svg>