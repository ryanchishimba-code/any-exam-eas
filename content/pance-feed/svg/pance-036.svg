nt-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2</tspan></tspan></text><text x="52.0" y="261.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="700">Defibrillate </tspan><tspan font-weight="500">(VF or pulseless VT)</tspan></tspan></text><rect x="18.0" y="276.0" width="22.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3</tspan></tspan></text><text x="52.0" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="700">Epinephrine </tspan><tspan font-weight="500">after failed shocks, every</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">3–5 min</tspan></tspan></text><rect x="18.0" y="318.0" width="22.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="333.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">4</tspan></tspan></text><text x="52.0" y="333.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="500">Refractory: </tspan><tspan font-weight="700">amiodarone or lidocaine</tspan></tspan></text><clipPath id="s36p5"><rect x="2" y="362" width="300" height="158" rx="14"/></clipPath><rect x="2" y="362" width="300" height="158" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="362" width="5" height="158" fill="#B7410E" clip-path="url(#s36p5)"/><text x="18" y="386" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541">  Hs and Ts</tspan></text><text x="18.0" y="411.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Asystole or PEA: </tspan><tspan font-weight="500">epinephrine as soon as</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">possible; no shock.</tspan></tspan></text><text x="18.0" y="453.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hs: </tspan><tspan font-weight="500">hypovolemia, hypoxia, hydrogen ion,</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">hypo/hyperkalemia, hypothermia. </tspan><tspan font-weight="700">Ts:</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">tension pneumothorax, tamponade, toxins,</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">thrombosis.</tspan></tspan></text></svg>