<svg width="304" height="524" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 524" role="img" aria-label="Adult cardiac arrest with ventricular fibrillation: compress 100 to 120 per minute, defibrillate, epinephrine after failed shocks repeated every 3 to 5 minutes, then amiodarone or lidocaine. Asystole or PEA: epinephrine as soon as possible, no shock. Reversible causes: the Hs and Ts." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s36"><defs><clipPath id="s36k1"><rect x="18" y="40" width="132" height="54" rx="8"/></clipPath><clipPath id="s36k2"><rect x="156" y="40" width="132" height="54" rx="8"/></clipPath></defs><clipPath id="s36p3"><rect x="2" y="2" width="300" height="156" rx="14"/></clipPath><rect x="2" y="2" width="300" height="156" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="156" fill="#0B5CAD" clip-path="url(#s36p3)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Arrest rhythms (schematic)</tspan></text><g clip-path="url(#s36k1)"><rect x="18" y="40" width="132" height="54" fill="#fff"/><line x1="18.0" y1="40" x2="18.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="36.0" y1="40" x2="36.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="54.0" y1="40" x2="54.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="72.0" y1="40" x2="72.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="90.0" y1="40" x2="90.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="108.0" y1="40" x2="108.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="126.0" y1="40" x2="126.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="144.0" y1="40" x2="144.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="162.0" y1="40" x2="162.0" y2="94" stroke="#D5E6E3" stroke-width="1"/><line x1="18" y1="40.