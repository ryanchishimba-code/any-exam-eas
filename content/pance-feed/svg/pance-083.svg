<svg width="304" height="444" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 444" role="img" aria-label="Bone tumors versus fibromyalgia: osteosarcoma has a sunburst pattern, Ewing sarcoma onion skinning, and osteoid osteoma a nidus with night pain relieved by NSAIDs; fibromyalgia has widespread pain with normal labs and is treated with exercise first." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m83"><defs></defs><clipPath id="m83p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#m83p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Pattern clues</tspan></text><rect x="18.0" y="40.0" width="164.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Osteosarcoma: sunburst</tspan></tspan></text><rect x="18.0" y="68.0" width="120.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ewing: onion skin</tspan></tspan></text><rect x="18.0" y="96.0" width="158.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Osteoid osteoma: nidus</tspan></tspan></text><clipPath id="m83p2"><rect x="2" y="140" width="300" height="170" rx="14"/></clipPath><rect x="2" y="140" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="170" fill="#0F766E" clip-path="url(#m83p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Image or reassure</tspan></text><rect x="18.0" y="178.0" width="84.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bone tumor</tspan></tspan></text><text x="118.7" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.7" dy="0"><tspan font-weight="700">X-ray, </tspan><tspan font-weight="500">then MRI; refer</tspan></tspan><tspan x="118.7" dy="17"><tspan font-weight="500">before biopsy</tspan></tspan></text><rect x="18.0" y="220.0" width="92.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fibromyalgia</tspan></tspan></text><text x="118.7" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.7" dy="0"><tspan font-weight="700">Exercise </tspan><tspan font-weight="500">and education</tspan></tspan><tspan x="118.7" dy="17"><tspan font-weight="500">first; CBT next</tspan></tspan></text><rect x="18.0" y="262.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drugs</tspan></tspan></text><text x="118.7" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="118.7" dy="0"><tspan font-weight="700">Duloxetine, </tspan><tspan font-weight="500">pregabalin,</tspan></tspan><tspan x="118.7" dy="17"><tspan font-weight="500">amitriptyline</tspan></tspan></text><clipPath id="m83p3"><rect x="2" y="318" width="300" height="122" rx="14"/></clipPath><rect x="2" y="318" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="318" width="5" height="122" fill="#B7410E" clip-path="url(#m83p3)"/><text x="18" y="342" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="367.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Night pain, weight loss or a mass </tspan><tspan font-weight="500">with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">bone pain needs imaging. Fibromyalgia</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">labs are normal; strong opioids and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">steroids are not recommended.</tspan></tspan></text></svg>