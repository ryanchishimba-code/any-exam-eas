<svg width="304" height="504" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 504" role="img" aria-label="Alcohol withdrawal timeline after the last drink: tremor and anxiety at 6 to 24 hours, hallucinations at 12 to 24 hours, seizures at 8 to 48 hours, delirium tremens at 72 to 96 hours. Benzodiazepines are first-line, longer-acting agents preferred, with less hepatically metabolized agents in liver disease, plus thiamine. Phenytoin does not treat withdrawal seizures." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s14"><defs></defs><clipPath id="s14p1"><rect x="2" y="2" width="300" height="248" rx="14"/></clipPath><rect x="2" y="2" width="300" height="248" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="248" fill="#0B5CAD" clip-path="url(#s14p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Timeline (schematic)</tspan></text><text x="18.0" y="54.0" font-size="12" font-weight="700" fill="#0F2F2C" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Tremor, anxiety</tspan></tspan></text><text x="18.0" y="72.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">6–24 h</tspan></tspan></text><text x="18.0" y="94.0" font-size="12" font-weight="700" fill="#0F2F2C" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hallucinations</tspan></tspan></text><text x="18.0" y="112.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">12–24 h</tspan></tspan></text><text x="18.0" y="134.0" font-size="12" font-weight="700" fill="#0F2F2C" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Seizures</tspan></tspan></text><text x="18.0" y="152.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">8–48 h</tspan></tspan></text><text x="18.0" y="174.0" font-size="12" font-weight="700" fill="#0F2F2C" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Delirium tremens</tspan></tspan></text><text x="18.0" y="192.0" font-size="12" font-weight="800" fill="#92400E" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">72–96 h</tspan></tspan></text><line x1="134.0" y1="38.0" x2="134.0" y2="198.0" stroke="#C7D6E6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="171.0" y1="38.0" x2="171.0" y2="198.0" stroke="#C7D6E6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="207.9" y1="38.0" x2="207.9" y2="198.0" stroke="#C7D6E6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="244.9" y1="38.0" x2="244.9" y2="198.0" stroke="#C7D6E6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="281.8" y1="38.0" x2="281.8" y2="198.0" stroke="#C7D6E6" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><rect x="143.2" y="50.0" width="27.7" height="22.0" rx="6" fill="#0B5CAD" stroke="none" stroke-width="1"/><rect x="152.5" y="90.0" width="18.5" height="22.0" rx="6" fill="#0B5CAD" stroke="none" stroke-width="1"/><rect x="146.3" y="130.0" width="61.6" height="22.0" rx="6" fill="#0B5CAD" stroke="none" stroke-width="1"/><rect x="244.9" y="170.0" width="37.0" height="22.0" rx="6" fill="#0B5CAD" stroke="none" stroke-width="1"/><circle cx="171.0" cy="141.0" r="4" fill="#fff" stroke="#0B5CAD" stroke-width="1.6"/><text x="134.0" y="206.0" font-size="12" font-weight="600" fill="#4A625F" xml:space="preserve"><tspan x="134.0" dy="0"><tspan font-weight="600">Hours after the last drink</tspan></tspan><tspan x="134.0" dy="15"><tspan font-weight="600">(gridlines every 24 h)</tspan></tspan></text><clipPath id="s14p2"><rect x="2" y="258" width="300" height="148" rx="14"/></clipPath><rect x="2" y="258" width="300" height="148" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="258" width="5" height="148" fill="#0F766E" clip-path="url(#s14p2)"/><text x="18" y="282" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Benzodiazepines plus thiamine</tspan></text><text x="18.0" y="307.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Benzodiazepines are first-line.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Longer-acting agents preferred; with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">significant liver disease, use one with less</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hepatic metabolism, such as lorazepam.</tspan></tspan></text><text x="18.0" y="387.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Thiamine </tspan><tspan font-weight="500">100 mg daily for 3–5 days.</tspan></tspan></text><clipPath id="s14p3"><rect x="2" y="414" width="300" height="86" rx="14"/></clipPath><rect x="2" y="414" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="414" width="5" height="86" fill="#B7410E" clip-path="url(#s14p3)"/><text x="18" y="438" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="463.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Phenytoin does not prevent or treat</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">withdrawal seizures.</tspan></tspan></text></svg>