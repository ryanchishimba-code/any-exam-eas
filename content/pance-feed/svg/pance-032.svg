: </tspan><tspan font-weight="500">heart rate </tspan><tspan font-weight="700">60–80,</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">SBP </tspan><tspan font-weight="700">&lt;120</tspan></tspan></text><rect x="18.0" y="358.0" width="22.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="373.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3</tspan></tspan></text><text x="52.0" y="373.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="52.0" dy="0"><tspan font-weight="500">Vasodilator only </tspan><tspan font-weight="700">after </tspan><tspan font-weight="500">the</tspan></tspan><tspan x="52.0" dy="17"><tspan font-weight="500">beta-blocker</tspan></tspan></text><clipPath id="s32p3"><rect x="2" y="414" width="300" height="122" rx="14"/></clipPath><rect x="2" y="414" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="414" width="5" height="122" fill="#B7410E" clip-path="url(#s32p3)"/><text x="18" y="438" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="463.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A vasodilator before a beta-blocker raises</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">heart rate and aortic wall stress. Also:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">screen men ≥65 who ever smoked for</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">AAA once with ultrasound.</tspan></tspan></text></svg>