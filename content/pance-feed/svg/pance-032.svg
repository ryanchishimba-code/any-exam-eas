<svg width="304" height="540" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 540" role="img" aria-label="Aortic dissection. Schematic aorta: Stanford type A involves the ascending aorta and needs emergency surgery; type B is distal to the left subclavian and is managed medically if uncomplicated. CT angiography, then IV beta-blocker to heart rate 60 to 80 and systolic pressure under 120. Never start a vasodilator before a beta-blocker." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s32"><defs></defs><clipPath id="s32p1"><rect x="2" y="2" width="300" height="238" rx="14"/></clipPath><rect x="2" y="2" width="300" height="238" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="238" fill="#0B5CAD" clip-path="url(#s32p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Aorta (schematic)</tspan></text><rect x="24.0" y="44.0" width="112.0" height="118.0" rx="14" fill="#DCEBF8" stroke="#9CC3E4" stroke-width="1"/><rect x="138.0" y="72.0" width="48.0" height="90.0" rx="14" fill="#D5EFEA" stroke="#8CCFC6" stroke-width="1"/><path d="M58.0,158.0 C58.0,149.7 56.0,121.7 58.0,108.0 C60.0,94.3 62.3,83.7 70.0,76.0 C77.7,68.3 93.0,63.3 104.0,62.0 C115.0,60.7 127.3,62.7 136.0,68.0 C144.7,73.3 152.7,89.7 156.0,94.0" fill="none" stroke="#9C4B43" stroke-width="22.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58.0,158.0 C58.0,149.7 56.0,121.7 58.0,108.0 C60.0,94.3 62.3,83.7 70.0,76.0 C77.7,68.3 93.0,63.3 104.0,62.0 C115.0,60.7 127.3,62.7 136.0,68.0 C144.7,73.3 152.7,89.7 156.0,94.0" fill="none" stroke="#E7A39B" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M156.0,94.0 C156.7,99.3 159.3,115.3 160.0,126.0 C160.7,136.7 160.0,152.7 160.0,158.0" fill="none" stroke="#9C4B43" stroke-width="22.4" str