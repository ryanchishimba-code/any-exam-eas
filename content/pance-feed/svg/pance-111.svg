<svg width="304" height="410" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 410" role="img" aria-label="Generalized anxiety and panic disorder screened in adults 64 and younger and treated with CBT or an SSRI or SNRI, after ruling out thyroid, cardiac and substance causes; avoid long-term benzodiazepines." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p111"><defs></defs><clipPath id="p111p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p111p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="98.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GAD-7 screen</tspan></tspan></text><rect x="122.7" y="40.0" width="120.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="129.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="129.7" dy="0"><tspan font-weight="700">Worry ≥6 months</tspan></tspan></text><rect x="18.0" y="68.0" width="151.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Panic: peak in minutes</tspan></tspan></text><clipPath id="p111p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#p111p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="90.8" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.8" dy="0"><tspan font-weight="700">Adults ≤64 </tspan><tspan font-weight="500">(GAD-7)</tspan></tspan></text><rect x="18.0" y="180.0" width="64.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Therapy</tspan></tspan></text><text x="90.8" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.8" dy="0"><tspan font-weight="700">CBT</tspan></tspan></text><rect x="18.0" y="210.0" width="43.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Drug</tspan></tspan></text><text x="90.8" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.8" dy="0"><tspan font-weight="700">SSRI or SNRI</tspan></tspan></text><rect x="18.0" y="240.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Rule out</tspan></tspan></text><text x="90.8" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.8" dy="0"><tspan font-weight="700">Thyroid, </tspan><tspan font-weight="500">cardiac, substances</tspan></tspan></text><clipPath id="p111p3"><rect x="2" y="284" width="300" height="122" rx="14"/></clipPath><rect x="2" y="284" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="122" fill="#B7410E" clip-path="url(#p111p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Benzodiazepines </tspan><tspan font-weight="500">are not long-term</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">therapy: dependence, falls. Rule out</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hyperthyroidism, arrhythmia and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">stimulants before diagnosing panic.</tspan></tspan></text></svg>