<svg width="304" height="476" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 476" role="img" aria-label="Adult vaccines from age 50: two doses of recombinant zoster vaccine, one dose of PCV20 or PCV21, Tdap once then Td or Tdap every 10 years, and a single RSV dose at 75 or at 50 to 74 with increased risk." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i92"><defs></defs><clipPath id="i92p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#i92p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Due at 50</tspan></text><rect x="18.0" y="40.0" width="85.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Zoster: ≥50</tspan></tspan></text><rect x="109.7" y="40.0" width="136.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="116.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="116.7" dy="0"><tspan font-weight="700">Pneumococcal: ≥50</tspan></tspan></text><rect x="18.0" y="68.0" width="169.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">RSV: ≥75, or 50–74 at risk</tspan></tspan></text><clipPath id="i92p2"><rect x="2" y="112" width="300" height="212" rx="14"/></clipPath><rect x="2" y="112" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="212" fill="#0F766E" clip-path="url(#i92p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Vaccines by age</tspan></text><rect x="18.0" y="150.0" width="53.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Zoster</tspan></tspan></text><text x="90.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.1" dy="0"><tspan font-weight="700">Recombinant </tspan><tspan font-weight="500">2 doses, 2–6</tspan></tspan><tspan x="90.1" dy="17"><tspan font-weight="500">months apart</tspan></tspan></text><rect x="18.0" y="192.0" width="64.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pneumo</tspan></tspan></text><text x="90.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.1" dy="0"><tspan font-weight="700">PCV20 or PCV21 </tspan><tspan font-weight="500">once (PCV15</tspan></tspan><tspan x="90.1" dy="17"><tspan font-weight="500">+ PPSV23)</tspan></tspan></text><rect x="18.0" y="234.0" width="44.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tdap</tspan></tspan></text><text x="90.1" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.1" dy="0"><tspan font-weight="700">Once, </tspan><tspan font-weight="500">then Td/Tdap every 10</tspan></tspan><tspan x="90.1" dy="17"><tspan font-weight="500">years</tspan></tspan></text><rect x="18.0" y="276.0" width="39.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">RSV</tspan></tspan></text><text x="90.1" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="90.1" dy="0"><tspan font-weight="700">Single dose </tspan><tspan font-weight="500">at ≥75, or 50–74 at</tspan></tspan><tspan x="90.1" dy="17"><tspan font-weight="500">risk</tspan></tspan></text><clipPath id="i92p3"><rect x="2" y="332" width="300" height="140" rx="14"/></clipPath><rect x="2" y="332" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="332" width="5" height="140" fill="#B7410E" clip-path="url(#i92p3)"/><text x="18" y="356" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="381.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">RSV vaccine is a single lifetime dose</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(not annual). Recombinant zoster is given</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">even after prior shingles or live zoster</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">vaccine. Schedules change yearly: check</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">the current CDC schedule.</tspan></tspan></text></svg>