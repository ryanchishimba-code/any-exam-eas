<svg width="304" height="422" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 422" role="img" aria-label="Bipolar disorder: lithium or quetiapine for mania and maintenance, quetiapine for bipolar depression, no antidepressant monotherapy, and lithium toxicity near 1.5 mEq/L." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p110"><defs></defs><clipPath id="p110p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p110p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="132.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Less need for sleep</tspan></tspan></text><rect x="156.4" y="40.0" width="84.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="163.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="163.4" dy="0"><tspan font-weight="700">Grandiosity</tspan></tspan></text><rect x="18.0" y="68.0" width="111.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">≥7 days (mania)</tspan></tspan></text><clipPath id="p110p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#p110p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="51.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Mania</tspan></tspan></text><text x="109.3" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Lithium </tspan><tspan font-weight="500">or </tspan><tspan font-weight="700">quetiapine</tspan></tspan></text><rect x="18.0" y="180.0" width="83.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Depression</tspan></tspan></text><text x="109.3" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Quetiapine; </tspan><tspan font-weight="500">add lamotrigine</tspan></tspan><tspan x="109.3" dy="17"><tspan font-weight="500">to lithium</tspan></tspan></text><rect x="18.0" y="222.0" width="67.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Maintain</tspan></tspan></text><text x="109.3" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Lithium </tspan><tspan font-weight="500">or quetiapine</tspan></tspan></text><rect x="18.0" y="252.0" width="59.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Lithium</tspan></tspan></text><text x="109.3" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="109.3" dy="0"><tspan font-weight="700">Level ≥1.5 </tspan><tspan font-weight="500">is toxic</tspan></tspan></text><clipPath id="p110p3"><rect x="2" y="296" width="300" height="122" rx="14"/></clipPath><rect x="2" y="296" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="122" fill="#B7410E" clip-path="url(#p110p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">No antidepressant monotherapy </tspan><tspan font-weight="500">in</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">bipolar disorder. Lithium toxicity starts</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">near 1.5 mEq/L: tremor, ataxia, confusion;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">check kidney and thyroid.</tspan></tspan></text></svg>