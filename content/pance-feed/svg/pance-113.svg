<svg width="304" height="446" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 446" role="img" aria-label="Opioid use disorder treated with buprenorphine started once withdrawal begins, methadone through a treatment program, or naltrexone after detox, with naloxone for every patient; no X-waiver is needed since 2023." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p113"><defs></defs><clipPath id="p113p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p113p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="130.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Withdrawal: COWS</tspan></tspan></text><rect x="154.6" y="40.0" width="98.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="161.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="161.6" dy="0"><tspan font-weight="700">Overdose risk</tspan></tspan></text><rect x="18.0" y="68.0" width="89.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Naloxone kit</tspan></tspan></text><clipPath id="p113p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="200" fill="#0F766E" clip-path="url(#p113p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Medications</tspan></text><rect x="18.0" y="150.0" width="104.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Buprenorphine</tspan></tspan></text><text x="130.9" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.9" dy="0"><tspan font-weight="700">Start in withdrawal</tspan></tspan><tspan x="130.9" dy="17"><tspan font-weight="500">(avoid precipitated)</tspan></tspan></text><rect x="18.0" y="192.0" width="83.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Methadone</tspan></tspan></text><text x="130.9" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.9" dy="0"><tspan font-weight="700">Opioid treatment</tspan></tspan><tspan x="130.9" dy="17"><tspan font-weight="700">program</tspan></tspan></text><rect x="18.0" y="234.0" width="80.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Naltrexone</tspan></tspan></text><text x="130.9" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.9" dy="0"><tspan font-weight="700">Only after </tspan><tspan font-weight="500">no opioid</tspan></tspan><tspan x="130.9" dy="17"><tspan font-weight="500">dependence</tspan></tspan></text><rect x="18.0" y="276.0" width="71.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="291.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Naloxone</tspan></tspan></text><text x="130.9" y="291.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="130.9" dy="0"><tspan font-weight="700">Every patient </tspan><tspan font-weight="500">and family</tspan></tspan></text><clipPath id="p113p3"><rect x="2" y="320" width="300" height="122" rx="14"/></clipPath><rect x="2" y="320" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="122" fill="#B7410E" clip-path="url(#p113p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Starting buprenorphine too early</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">precipitates withdrawal. Psychosocial</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">care helps but declining it should not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">delay medication.</tspan></tspan></text></svg>