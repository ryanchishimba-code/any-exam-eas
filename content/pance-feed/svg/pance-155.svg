<svg width="304" height="416" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 416" role="img" aria-label="Pressure injury stages: stage 1 intact skin with non-blanchable erythema, stage 2 partial thickness with dermis, stage 3 full thickness with fat, stage 4 exposed muscle or bone; unstageable when slough or eschar hides the base; deep tissue injury is maroon non-blanchable skin." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m155"><defs></defs><clipPath id="m155p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m155p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="145.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1: non-blanchable red</tspan></tspan></text><rect x="169.9" y="40.0" width="71.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="176.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="176.9" dy="0"><tspan font-weight="700">2: dermis</tspan></tspan></text><rect x="18.0" y="68.0" width="45.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3: fat</tspan></tspan></text><rect x="69.7" y="68.0" width="123.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="76.7" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="76.7" dy="0"><tspan font-weight="700">4: muscle or bone</tspan></tspan></text><clipPath id="m155p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#m155p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="59.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Offload</tspan></tspan></text><text x="85.3" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="85.3" dy="0"><tspan font-weight="700">Reposition; </tspan><tspan font-weight="500">pressure-relieving</tspan></tspan><tspan x="85.3" dy="17"><tspan font-weight="500">surface</tspan></tspan></text><rect x="18.0" y="192.0" width="48.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Heels</tspan></tspan></text><text x="85.3" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="85.3" dy="0"><tspan font-weight="700">Offload heels</tspan></tspan></text><rect x="18.0" y="222.0" width="56.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Eschar</tspan></tspan></text><text x="85.3" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="85.3" dy="0"><tspan font-weight="700">Stable heel eschar: </tspan><tspan font-weight="500">leave intact</tspan></tspan></text><rect x="18.0" y="252.0" width="50.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Not PI</tspan></tspan></text><text x="85.3" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="85.3" dy="0"><tspan font-weight="700">Moisture, skin tears, </tspan><tspan font-weight="500">burns:</tspan></tspan><tspan x="85.3" dy="17"><tspan font-weight="500">other diagnoses</tspan></tspan></text><clipPath id="m155p3"><rect x="2" y="308" width="300" height="104" rx="14"/></clipPath><rect x="2" y="308" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="104" fill="#B7410E" clip-path="url(#m155p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Unstageable: </tspan><tspan font-weight="500">slough or eschar hides the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">base. </tspan><tspan font-weight="700">Deep tissue: </tspan><tspan font-weight="500">maroon or purple,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">non-blanchable.</tspan></tspan></text></svg>