<svg width="304" height="450" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 450" role="img" aria-label="Uncomplicated cystitis treated with nitrofurantoin for 5 days, TMP-SMX for 3 days, or single-dose fosfomycin; pyelonephritis needs a urine culture and a fluoroquinolone for 5 to 7 days; nitrofurantoin and fosfomycin do not treat pyelonephritis." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i86"><defs></defs><clipPath id="i86p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#i86p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Two presentations</tspan></text><rect x="18.0" y="40.0" width="117.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cystitis: no fever</tspan></tspan></text><rect x="18.0" y="68.0" width="152.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pyelo: fever, flank pain</tspan></tspan></text><rect x="18.0" y="96.0" width="115.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Culture for pyelo</tspan></tspan></text><clipPath id="i86p2"><rect x="2" y="140" width="300" height="158" rx="14"/></clipPath><rect x="2" y="140" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="158" fill="#0F766E" clip-path="url(#i86p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Match the drug</tspan></text><rect x="18.0" y="178.0" width="60.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cystitis</tspan></tspan></text><text x="86.7" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.7" dy="0"><tspan font-weight="700">Nitrofurantoin </tspan><tspan font-weight="500">5 d, </tspan><tspan font-weight="700">TMP-SMX </tspan><tspan font-weight="500">3</tspan></tspan><tspan x="86.7" dy="17"><tspan font-weight="500">d, fosfomycin once</tspan></tspan></text><rect x="18.0" y="220.0" width="47.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pyelo</tspan></tspan></text><text x="86.7" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.7" dy="0"><tspan font-weight="700">Urine culture; </tspan><tspan font-weight="500">FQ 5–7 d or other</tspan></tspan><tspan x="86.7" dy="17"><tspan font-weight="500">7 d</tspan></tspan></text><rect x="18.0" y="262.0" width="56.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="86.7" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.7" dy="0"><tspan font-weight="700">IV </tspan><tspan font-weight="500">therapy; image if no response</tspan></tspan></text><clipPath id="i86p3"><rect x="2" y="306" width="300" height="140" rx="14"/></clipPath><rect x="2" y="306" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="306" width="5" height="140" fill="#B7410E" clip-path="url(#i86p3)"/><text x="18" y="330" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="355.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Nitrofurantoin and oral fosfomycin </tspan><tspan font-weight="500">reach</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">too little drug in kidney and blood: never</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">use them for pyelonephritis. TMP-SMX</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">only if local resistance ≤20% or</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">susceptible.</tspan></tspan></text></svg>