.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="91.5" cy="131.7" r="1.2" fill="#fff"/></g><circle class="hit" cx="91.4" cy="126.5" r="22" fill="transparent"/></g><rect x="18.0" y="152.0" width="150.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Troponin up = NSTEMI</tspan></tspan></text><rect x="18.0" y="180.0" width="225.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Troponin normal = unstable angina</tspan></tspan></text><clipPath id="s21p3"><rect x="2" y="224" width="300" height="216" rx="14"/></clipPath><rect x="2" y="224" width="300" height="216" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="224" width="5" height="216" fill="#0F766E" clip-path="url(#s21p3)"/><text x="18" y="248" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Start now, time the cath</tspan></text><rect x="18.0" y="260.0" width="41.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="275.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;2 h</tspan></tspan></text><text x="70.0" y="275.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.0" dy="0"><tspan font-weight="700">Shock, instability, refractory</tspan></tspan><tspan x="70.0" dy="17"><tspan font-weight="700">angina or acute HF</tspan></tspan></text><rect x="18.0" y="302.0" width="49.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="317.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">&lt;24 h</tspan></tspan></text><text x="75.3" y="317.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.3" dy="0"><tspan font-weight="700">GRACE &gt;140, </tspan><tspan font-weight="500">rising troponin or</tspan></tspan><tspan x="75.3" dy="17"><tspan font-weight="500">dynamic ST change</tspan></tspan></text><rect x="18.0" y="344.0" width="48.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="359.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Other</tspan></tspan></text><text x="74.5" y="359.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="74.5" dy="0"><tspan font-weight="500">Remaining intermediate risk:</tspan></tspan><tspan x="74.5" dy="17"><tspan font-weight="500">invasive strategy before discharge</tspan></tspan></text><text x="18.0" y="403.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Now: </tspan><tspan font-weight="500">aspirin 162–325 mg chewed, then</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">75–100 mg daily, plus IV heparin.</tspan></tspan></text><clipPath id="s21p4"><rect x="2" y="448" width="300" height="140" rx="14"/></clipPath><rect x="2" y="448" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="448" width="5" height="140" fill="#B7410E" clip-path="url(#s21p4)"/><text x="18" y="472" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="497.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">No routine </tspan><tspan font-weight="700">P2Y12 pretreatment </tspan><tspan font-weight="500">if</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">angiography is within 24 hours; give it at</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">angiography (ticagrelor or prasugrel over</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">clopidogrel). </tspan><tspan font-weight="700">Prasugrel is</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">contraindicated after stroke or TIA.</tspan></tspan></text></svg>