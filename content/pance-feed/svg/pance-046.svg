.0" width="102.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="147.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="147.0" dy="0"><tspan font-weight="700">Onset ≤1 week</tspan></tspan></text><rect x="18.0" y="249.0" width="84.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Not cardiac</tspan></tspan></text><clipPath id="p46p2"><rect x="2" y="293" width="300" height="208" rx="14"/></clipPath><rect x="2" y="293" width="300" height="208" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="208" fill="#0F766E" clip-path="url(#p46p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Ventilate gently</tspan></text><rect x="18.0" y="331.0" width="112.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Lung-protective</tspan></tspan></text><text x="18.0" y="368.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">4–8 mL/kg </tspan><tspan font-weight="500">predicted weight; plateau &lt;30</tspan></tspan></text><rect x="18.0" y="380.0" width="56.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="395.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="18.0" y="417.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Prone </tspan><tspan font-weight="500">&gt;12 h/day; higher PEEP</tspan></tspan></text><rect x="18.0" y="429.0" width="69.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="444.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Consider</tspan></tspan></text><text x="18.0" y="466.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Corticosteroids; </tspan><tspan font-weight="500">VV-ECMO in selected</tspan></tspan><tspan x="18.0" dy="17"><tspan font-weight="500">cases</tspan></tspan></text><clipPath id="p46p3"><rect x="2" y="509" width="300" height="122" rx="14"/></clipPath><rect x="2" y="509" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="509" width="5" height="122" fill="#B7410E" clip-path="url(#p46p3)"/><text x="18" y="533" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="558.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Tidal volume uses </tspan><tspan font-weight="700">predicted body weight</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">(height and sex), not actual weight.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Prolonged recruitment manoeuvres are</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">recommended against.</tspan></tspan></text></svg>