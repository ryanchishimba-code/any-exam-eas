<svg width="304" height="486" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 486" role="img" aria-label="Systemic lupus erythematosus: ANA is sensitive and anti-dsDNA and anti-Smith are specific. Hydroxychloroquine for all patients, steroids as a bridge kept at 5 mg or less, and steroid-sparing drugs or nephritis therapy as needed." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m78"><defs></defs><clipPath id="m78p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#m78p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Serology</tspan></text><rect x="18.0" y="40.0" width="109.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ANA (sensitive)</tspan></tspan></text><rect x="18.0" y="68.0" width="219.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Anti-dsDNA, anti-Smith (specific)</tspan></tspan></text><rect x="18.0" y="96.0" width="83.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Low C3, C4</tspan></tspan></text><clipPath id="m78p2"><rect x="2" y="140" width="300" height="212" rx="14"/></clipPath><rect x="2" y="140" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="212" fill="#0F766E" clip-path="url(#m78p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treatment ladder</tspan></text><rect x="18.0" y="178.0" width="30.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">All</tspan></tspan></text><text x="96.1" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.1" dy="0"><tspan font-weight="700">Hydroxychloroquine </tspan><tspan font-weight="500">≤5</tspan></tspan><tspan x="96.1" dy="17"><tspan font-weight="500">mg/kg/day</tspan></tspan></text><rect x="18.0" y="220.0" width="44.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Flare</tspan></tspan></text><text x="96.1" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.1" dy="0"><tspan font-weight="700">Steroids </tspan><tspan font-weight="500">as bridge; maintain</tspan></tspan><tspan x="96.1" dy="17"><tspan font-weight="500">≤5 mg/day</tspan></tspan></text><rect x="18.0" y="262.0" width="61.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Sparing</tspan></tspan></text><text x="96.1" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.1" dy="0"><tspan font-weight="700">Methotrexate, </tspan><tspan font-weight="500">azathioprine,</tspan></tspan><tspan x="96.1" dy="17"><tspan font-weight="500">mycophenolate, belimumab</tspan></tspan></text><rect x="18.0" y="304.0" width="70.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="319.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Nephritis</tspan></tspan></text><text x="96.1" y="319.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.1" dy="0"><tspan font-weight="700">Mycophenolate </tspan><tspan font-weight="500">or IV</tspan></tspan><tspan x="96.1" dy="17"><tspan font-weight="500">cyclophosphamide</tspan></tspan></text><clipPath id="m78p3"><rect x="2" y="360" width="300" height="122" rx="14"/></clipPath><rect x="2" y="360" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="360" width="5" height="122" fill="#B7410E" clip-path="url(#m78p3)"/><text x="18" y="384" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="409.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hydroxychloroquine: </tspan><tspan font-weight="500">baseline and yearly</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">retinal screening (after 5 years, or sooner</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">with risk). Anti-dsDNA and low</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">complement track nephritis activity.</tspan></tspan></text></svg>