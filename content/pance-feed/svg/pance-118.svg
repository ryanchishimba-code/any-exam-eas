<svg width="304" height="422" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 422" role="img" aria-label="Serotonin syndrome with clonus and hyperreflexia within a day, treated by stopping serotonergic drugs and cyproheptadine; neuroleptic malignant syndrome with rigidity over days, treated with dantrolene or bromocriptine." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p118"><defs></defs><clipPath id="p118p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p118p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Tell apart</tspan></text><rect x="18.0" y="40.0" width="121.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Clonus: serotonin</tspan></tspan></text><rect x="145.8" y="40.0" width="96.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="152.8" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="152.8" dy="0"><tspan font-weight="700">Rigidity: NMS</tspan></tspan></text><rect x="18.0" y="68.0" width="81.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Both: fever</tspan></tspan></text><clipPath id="p118p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#p118p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="42.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Both</tspan></tspan></text><text x="99.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Stop drug, </tspan><tspan font-weight="500">cool,</tspan></tspan><tspan x="99.1" dy="17"><tspan font-weight="500">benzodiazepine</tspan></tspan></text><rect x="18.0" y="192.0" width="73.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Serotonin</tspan></tspan></text><text x="99.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Cyproheptadine</tspan></tspan></text><rect x="18.0" y="222.0" width="43.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">NMS</tspan></tspan></text><text x="99.1" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Dantrolene </tspan><tspan font-weight="500">or bromocriptine</tspan></tspan></text><rect x="18.0" y="252.0" width="59.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Lithium</tspan></tspan></text><text x="99.1" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.1" dy="0"><tspan font-weight="700">Hydrate; </tspan><tspan font-weight="500">dialysis if severe</tspan></tspan></text><clipPath id="p118p3"><rect x="2" y="296" width="300" height="122" rx="14"/></clipPath><rect x="2" y="296" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="122" fill="#B7410E" clip-path="url(#p118p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hunter criteria: </tspan><tspan font-weight="500">clonus is key for</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">serotonin syndrome. Lithium toxicity:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">tremor, ataxia, confusion; no antidote,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">dialysis if severe.</tspan></tspan></text></svg>