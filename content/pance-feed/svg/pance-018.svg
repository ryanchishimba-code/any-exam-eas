" y="115.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="169.0" dy="0"><tspan font-weight="700">Infected CSF</tspan></tspan><tspan x="169.0" dy="15"><tspan font-weight="700">around the brain</tspan></tspan></text></g><g class="q"><circle cx="173.0" cy="124.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M169.8,121.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="173.1" cy="129.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="173.0" cy="124.0" r="22" fill="transparent"/></g><rect x="18.0" y="180.0" width="48.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever</tspan></tspan></text><rect x="72.0" y="180.0" width="75.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="79.0" y="195.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="79.0" dy="0"><tspan font-weight="700">Headache</tspan></tspan></text><rect x="153.7" y="180.0" width="72.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="160.7" y="195.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="160.7" dy="0"><tspan font-weight="700">Stiff neck</tspan></tspan></text><rect x="18.0" y="208.0" width="77.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confusion</tspan></tspan></text><clipPath id="s18p2"><rect x="2" y="256" width="300" height="220" rx="14"/></clipPath><rect x="2" y="256" width="300" height="220" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="256" width="5" height="220" fill="#0F766E" clip-path="url(#s18p2)"/><text x="18" y="280" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Antibiotics now</tspan></text><text x="18.0" y="305.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Do not delay antibiotics. </tspan><tspan font-weight="500">Empiric therapy:</tspan></tspan></text><rect x="18.0" y="312.0" width="93.5" height="24.0" rx="12" fill="#0F766E" stroke="none" stroke-width="1"/><text x="27.0" y="328.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="27.0" dy="0"><tspan font-weight="700">Vancomycin</tspan></tspan></text><rect x="117.5" y="312.0" width="98.9" height="24.0" rx="12" fill="#0F766E" stroke="none" stroke-width="1"/><text x="126.5" y="328.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="126.5" dy="0"><tspan font-weight="700">+ ceftriaxone</tspan></tspan></text><rect x="18.0" y="342.0" width="209.9" height="24.0" rx="12" fill="#0F766E" stroke="none" stroke-width="1"/><text x="27.0" y="358.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="27.0" dy="0"><tspan font-weight="700">+ ampicillin if age &gt;50 (Listeria)</tspan></tspan></text><text x="18.0" y="389.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Dexamethasone </tspan><tspan font-weight="500">with or just before the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">first antibiotic dose:</tspan></tspan></text><rect x="18.0" y="416.0" width="139.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="431.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">0.15 mg/kg every 6 h</tspan></tspan></text><rect x="163.6" y="416.0" width="68.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="170.6" y="431.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="170.6" dy="0"><tspan font-weight="700">2–4 days</tspan></tspan></text><text x="18.0" y="456.0" font-size="12" font-weight="600" fill="#4A625F" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="600">Age cut-offs follow IDSA 2004; other</tspan></tspan><tspan x="18.0" dy="15"><tspan font-weight="600">guidelines differ.</tspan></tspan></text><clipPath id="s18p3"><rect x="2" y="484" width="300" height="140" rx="14"/></clipPath><rect x="2" y="484" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="484" width="5" height="140" fill="#B7410E" clip-path="url(#s18p3)"/><text x="18" y="508" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="533.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">CT before lumbar puncture only with risk</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">features: immunocompromise, CNS</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">disease, new seizure, papilledema,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">abnormal consciousness or a focal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">deficit. Do not delay antibiotics for it.</tspan></tspan></text></svg>