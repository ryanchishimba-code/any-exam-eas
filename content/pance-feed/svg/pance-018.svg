<svg width="304" height="628" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 628" role="img" aria-label="Bacterial meningitis. Schematic section through the head showing inflamed meninges and infected cerebrospinal fluid around the brain. Fever, headache, stiff neck, confusion. Do not delay antibiotics: vancomycin plus ceftriaxone, adding ampicillin over age 50 for Listeria, with dexamethasone 0.15 mg/kg every 6 hours for 2 to 4 days started with or just before the first antibiotic dose. CT before lumbar puncture only with risk features. This card follows the 2004 IDSA guideline; other guidelines use different age cut-offs." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s18"><defs><radialGradient id="s18br" cx="0.45" cy="0.4" r="1"><stop offset="0" stop-color="#F3E3DD"/><stop offset="1" stop-color="#DDB9AE"/></radialGradient></defs><clipPath id="s18p1"><rect x="2" y="2" width="300" height="246" rx="14"/></clipPath><rect x="2" y="2" width="300" height="246" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="246" fill="#0B5CAD" clip-path="url(#s18p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Meninges and CSF (schematic)</tspan></text><circle cx="84" cy="104" r="62" fill="#EADBC2" stroke="#B9A27F" stroke-width="1.5"/><circle cx="84" cy="104" r="54" fill="#E58C84" stroke="#B5564E" stroke-width="1.2"/><circle cx="84" cy="104" r="48" fill="#DCEAF2"/><circle cx="104.2" cy="143.5" r="1.9" fill="#1F5F8B"/><circle cx="100.9" cy="145.0" r="1.9" fill="#1F5F8B"/><circle cx="64.3" cy="141.1" r="1.9" fill="#1F5F8B"/><circle cx="61.2" cy="139.3" r="1.9" fill="#1F5F8B"/><circle cx="40.7" cy="108.7" r="1.9" fill="#1F5F8B"/><circle cx="40.5" cy="105.1" r="1.9" fill="#1F5F8B"/><circle cx="41.3" cy="111.3" r="1.9" fill="#1F5F