<svg width="304" height="410" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 410" role="img" aria-label="Sickle cell disease with fever of 38.5 or higher: urgent evaluation, cultures and prompt parenteral antibiotics; penicillin prophylaxis and hydroxyurea prevent complications." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h171"><defs></defs><clipPath id="h171p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#h171p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="104.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fever ≥38.5 °C</tspan></tspan></text><rect x="128.9" y="40.0" width="144.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="135.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="135.9" dy="0"><tspan font-weight="700">Cultures + antibiotics</tspan></tspan></text><rect x="18.0" y="68.0" width="157.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hydroxyurea from 9 mo</tspan></tspan></text><clipPath id="h171p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" hei