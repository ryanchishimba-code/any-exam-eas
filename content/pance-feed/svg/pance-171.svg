ll="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prevent</tspan></tspan></text><text x="99.2" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.2" dy="0"><tspan font-weight="700">Penicillin to age 5, </tspan><tspan font-weight="500">vaccines,</tspan></tspan><tspan x="99.2" dy="17"><tspan font-weight="500">hydroxyurea</tspan></tspan></text><clipPath id="h171p3"><rect x="2" y="320" width="300" height="86" rx="14"/></clipPath><rect x="2" y="320" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="86" fill="#B7410E" clip-path="url(#h171p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Cough, rales or hypoxia </tspan><tspan font-weight="500">with fever: chest</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">X-ray for acute chest syndrome.</tspan></tspan></text></svg>