<svg width="304" height="404" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 404" role="img" aria-label="Nephrotoxic drugs: NSAIDs cause prerenal injury, aminoglycosides cause acute tubular necrosis, penicillins and PPIs cause interstitial nephritis; give saline before contrast if eGFR is below 30." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n185"><defs></defs><clipPath id="n185p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#n185p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Identify</tspan></text><rect x="18.0" y="40.0" width="147.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">AIN: rash, eosinophils</tspan></tspan></text><rect x="18.0" y="68.0" width="134.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Contrast: eGFR &lt;30</tspan></tspan></text><rect x="158.3" y="68.0" width="111.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="165.3" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="165.3" dy="0"><tspan font-weight="700">NSAID: prerenal</tspan></tspan></text><clipPath id="n185p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#n185p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Prevent</tspan></text><rect x="18.0" y="150.0" width="66.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Contrast</tspan></tspan></text><text x="92.9" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.9" dy="0"><tspan font-weight="700">Saline </tspan><tspan font-weight="500">if eGFR &lt;30 or AKI</tspan></tspan></text><rect x="18.0" y="180.0" width="36.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">AIN</tspan></tspan></text><text x="92.9" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.9" dy="0"><tspan font-weight="700">Stop PPI, </tspan><tspan font-weight="500">beta-lactam, NSAID</tspan></tspan></text><rect x="18.0" y="210.0" width="40.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ATN</tspan></tspan></text><text x="92.9" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.9" dy="0"><tspan font-weight="700">Aminoglycoside, </tspan><tspan font-weight="500">vancomycin,</tspan></tspan><tspan x="92.9" dy="17"><tspan font-weight="500">contrast</tspan></tspan></text><rect x="18.0" y="252.0" width="64.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prerenal</tspan></tspan></text><text x="92.9" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.9" dy="0"><tspan font-weight="700">NSAID, </tspan><tspan font-weight="500">ACEi/ARB, diuretic</tspan></tspan></text><clipPath id="n185p3"><rect x="2" y="296" width="300" height="104" rx="14"/></clipPath><rect x="2" y="296" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="104" fill="#B7410E" clip-path="url(#n185p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Do not withhold </tspan><tspan font-weight="500">needed contrast:</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">prophylaxis is for eGFR &lt;30 or AKI, not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">every patient.</tspan></tspan></text></svg>