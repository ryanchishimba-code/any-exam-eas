<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Nigrostriatal blockade causes movement effects. Tuberoinfundibular blockade raises prolactin">
<title>Nigrostriatal blockade causes movement effects. Tuberoinfundibular blockade raises prolactin</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">PSYCHIATRY/BEHAVIORAL</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Nigrostriatal blockade causes</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">movement effects. Tuberoinfundibular</text>
<text x="28" y="112" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">blockade raises prolactin</text>
<line x1="28" y1="148" x2="372" y2="148" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="176" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">Mesolimbic blockade treats psychosis.</text>
<rect x="28" y="196" width="344" height="94" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="214" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">Clozapine is for illness that failed two</text>
<text x="42" y="236" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">antipsychotics, not for a first episode</text>
<text x="42" y="258" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">(APA 2020).</text>
</svg>
