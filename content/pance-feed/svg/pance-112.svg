<svg width="304" height="422" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 422" role="img" aria-label="Schizophrenia: clozapine for treatment resistance or ongoing suicide risk; anticholinergic for acute dystonia, dose reduction or beta-blocker for akathisia, VMAT2 inhibitor for tardive dyskinesia, plus metabolic monitoring." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p112"><defs></defs><clipPath id="p112p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p112p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="110.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Two failed trials</tspan></tspan></text><rect x="134.3" y="40.0" width="85.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="141.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="141.3" dy="0"><tspan font-weight="700">Suicide risk</tspan></tspan></text><rect x="18.0" y="68.0" width="144.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Metabolic monitoring</tspan></tspan></text><clipPath id="p112p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#p112p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Side effects</tspan></text><rect x="18.0" y="150.0" width="74.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Clozapine</tspan></tspan></text><text x="100.9" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.9" dy="0"><tspan font-weight="700">Treatment-resistant </tspan><tspan font-weight="500">or</tspan></tspan><tspan x="100.9" dy="17"><tspan font-weight="500">suicidal</tspan></tspan></text><rect x="18.0" y="192.0" width="68.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Dystonia</tspan></tspan></text><text x="100.9" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.9" dy="0"><tspan font-weight="700">Anticholinergic </tspan><tspan font-weight="500">(benztropine)</tspan></tspan></text><rect x="18.0" y="222.0" width="71.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Akathisia</tspan></tspan></text><text x="100.9" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.9" dy="0"><tspan font-weight="700">Lower dose, </tspan><tspan font-weight="500">beta-blocker</tspan></tspan></text><rect x="18.0" y="252.0" width="31.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" 