<svg width="304" height="374" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 374" role="img" aria-label="Postpartum hemorrhage: atony is most common; massage, oxytocin and early tranexamic acid." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r133"><defs></defs><clipPath id="r133p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#r133p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="102.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Tone: 70–80%</tspan></tspan></text><rect x="126.3" y="40.0" width="136.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="133.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="133.3" dy="0"><tspan font-weight="700">Massage + oxytocin</tspan></tspan></text><rect x="18.0" y="68.0" width="71.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">TXA ≤3 h</tspan></tspan></text><clipPath id="r133p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#r133p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="61.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prevent</tspan></tspan></text><text x="93.4" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Oxytocin </tspan><tspan font-weight="500">after delivery</tspan></tspan></text><rect x="18.0" y="180.0" width="50.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Atony</tspan></tspan></text><text x="93.4" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Massage, </tspan><tspan font-weight="500">empty bladder</tspan></tspan></text><rect x="18.0" y="210.0" width="38.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Add</tspan></tspan></text><text x="93.4" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">Second uterotonics</tspan></tspan></text><rect x="18.0" y="240.0" width="67.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bleeding</tspan></tspan></text><text x="93.4" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="93.4" dy="0"><tspan font-weight="700">TXA </tspan><tspan font-weight="500">within 3 h</tspan></tspan></text><clipPath id="r133p3"><rect x="2" y="284" width="300" height="86" rx="14"/></clipPath><rect x="2" y="284" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="86" fill="#B7410E" clip-path="url(#r133p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Late TXA </tspan><tspan font-weight="500">loses benefit; start it early when</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">initial therapy fails.</tspan></tspan></text></svg>