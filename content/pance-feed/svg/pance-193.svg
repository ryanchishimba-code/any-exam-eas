<svg width="304" height="428" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 428" role="img" aria-label="Burn resuscitation: start lactated Ringer's at 2 milliliters per kilogram per percent body surface area over 24 hours and titrate to urine output; refer major burns to a burn center." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m193"><defs></defs><clipPath id="m193p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#m193p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Assess</tspan></text><rect x="18.0" y="40.0" width="92.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Rule of nines</tspan></tspan></text><rect x="116.7" y="40.0" width="132.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="123.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="123.7" dy="0"><tspan font-weight="700">LR 2 mL/kg/%TBSA</tspan></tspan></text><rect x="18.0" y="68.0" width="123.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Urine 0.5 mL/kg/h</tspan></tspan></text><clipPath id="m193p2"><rect x="2" y="112" width="300" height="200" rx="14"/></clipPath><rect x="2" y="112" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="200" fill="#0F766E" clip-path="url(#m193p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Resuscitate</tspan></text><rect x="18.0" y="150.0" width="50.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Fluids</tspan></tspan></text><text x="80.3" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.3" dy="0"><tspan font-weight="700">Lactated Ringer's </tspan><tspan font-weight="500">2</tspan></tspan><tspan x="80.3" dy="17"><tspan font-weight="500">mL/kg/%TBSA over 24 h</tspan></tspan></text><rect x="18.0" y="192.0" width="54.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Titrate</tspan></tspan></text><text x="80.3" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.3" dy="0"><tspan font-weight="700">Urine 0.5 mL/kg/h</tspan></tspan></text><rect x="18.0" y="222.0" width="46.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Refer</tspan></tspan></text><text x="80.3" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.3" dy="0"><tspan font-weight="700">Full-thickness, ≥10% partial,</tspan></tspan><tspan x="80.3" dy="17"><tspan font-weight="500">face, hands, feet, genitalia, joints</tspan></tspan></text><rect x="18.0" y="264.0" width="41.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Also</tspan></tspan></text><text x="80.3" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="80.3" dy="0"><tspan font-weight="700">Inhalation, chemical,</tspan></tspan><tspan x="80.3" dy="17"><tspan font-weight="700">high-voltage </tspan><tspan font-weight="500">injury</tspan></tspan></text><clipPath id="m193p3"><rect x="2" y="320" width="300" height="104" rx="14"/></clipPath><rect x="2" y="320" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="320" width="5" height="104" fill="#B7410E" clip-path="url(#m193p3)"/><text x="18" y="344" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="369.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Parkland (4 mL/kg) </tspan><tspan font-weight="500">appears in older</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">texts; over-resuscitation causes edema</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">and compartment syndrome.</tspan></tspan></text></svg>