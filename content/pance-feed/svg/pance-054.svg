<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Extra oxygen worsens ventilation-perfusion matching in COPD">
<title>Extra oxygen worsens ventilation-perfusion matching in COPD</title>
<rect width="100%" height="100%" fill="#F7F4EF"/>
<rect x="0" y="0" width="8" height="100%" fill="#0F766E"/>
<text x="28" y="28" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#0F766E" letter-spacing="1.5">PULMONARY</text>
<text x="28" y="56" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">Extra oxygen worsens</text>
<text x="28" y="84" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">ventilation-perfusion matching in</text>
<text x="28" y="112" font-family="Georgia, 'Iowan Old Style', serif" font-size="22" font-weight="700" fill="#102027">COPD</text>
<line x1="28" y1="148" x2="372" y2="148" stroke="#D6D0C6" stroke-width="1"/>
<text x="28" y="176" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">Poorly ventilated lung units constrict</text>
<text x="28" y="198" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">their blood flow. Oxygen releases that</text>
<text x="28" y="220" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="16" fill="#243038">constriction.</text>
<rect x="28" y="240" width="344" height="50" rx="8" fill="#FFF6F1" stroke="#E7C4B4"/>
<text x="42" y="258" font-family="'Source Sans 3', 'Segoe UI', sans-serif" font-size="15" fill="#9A3412">Hypoxic drive is not the main explanation.</text>
</svg>
