<svg width="304" height="416" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 416" role="img" aria-label="Pertussis stages, catarrhal, paroxysmal and convalescent; azithromycin treatment, prophylaxis for household and high-risk contacts within 21 days, and Tdap in every pregnancy between 27 and 36 weeks. Acute bronchitis needs no antibiotics." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p54"><defs></defs><clipPath id="p54p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p54p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Three stages</tspan></text><rect x="18.0" y="40.0" width="114.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Catarrhal 1–2 wk</tspan></tspan></text><rect x="138.4" y="40.0" width="85.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="145.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="145.4" dy="0"><tspan font-weight="700">Paroxysmal</tspan></tspan></text><rect x="18.0" y="68.0" width="98.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Convalescent</tspan></tspan></text><clipPath id="p54p2"><rect x="2" y="112" width="300" height="170" rx="14"/></clipPath><rect x="2" y="112" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="170" fill="#0F766E" clip-path="url(#p54p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat and protect</tspan></text><rect x="18.0" y="150.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="87.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.1" dy="0"><tspan font-weight="700">Azithromycin </tspan><tspan font-weight="500">5 days (adult:</tspan></tspan><tspan x="87.1" dy="17"><tspan font-weight="500">within 3 weeks of cough)</tspan></tspan></text><rect x="18.0" y="192.0" width="37.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PEP</tspan></tspan></text><text x="87.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.1" dy="0"><tspan font-weight="700">Household </tspan><tspan font-weight="500">and high-risk</tspan></tspan><tspan x="87.1" dy="17"><tspan font-weight="500">contacts within 21 days</tspan></tspan></text><rect x="18.0" y="234.0" width="61.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Prevent</tspan></tspan></text><text x="87.1" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="87.1" dy="0"><tspan font-weight="700">Tdap </tspan><tspan font-weight="500">each pregnancy, 27–36</tspan></tspan><tspan x="87.1" dy="17"><tspan font-weight="500">weeks</tspan></tspan></text><clipPath id="p54p3"><rect x="2" y="290" width="300" height="122" rx="14"/></clipPath><rect x="2" y="290" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="290" width="5" height="122" fill="#B7410E" clip-path="url(#p54p3)"/><text x="18" y="314" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="339.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Acute bronchitis </tspan><tspan font-weight="500">(cough up to 3 weeks,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">no pneumonia signs) is usually viral: no</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">antibiotics; colored sputum does not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">mean bacteria.</tspan></tspan></text></svg>