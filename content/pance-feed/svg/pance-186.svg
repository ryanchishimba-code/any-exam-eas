<svg width="304" height="452" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 452" role="img" aria-label="Hypocalcemia: Chvostek sign, Trousseau sign, long QT; treat symptomatic patients with IV calcium gluconate and correct magnesium." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n186"><defs></defs><clipPath id="n186p1"><rect x="2" y="2" width="300" height="114" rx="14"/></clipPath><rect x="2" y="2" width="300" height="114" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="114" fill="#0B5CAD" clip-path="url(#n186p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Examine</tspan></text><text x="18.0" y="53.0" font-size="12" font-weight="600" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="800" fill="#92400E" letter-spacing=".8">MNEMONIC</tspan><tspan> </tspan><tspan font-weight="600">CATS go numb: Convulsions,</tspan></tspan><tspan x="18.0" dy="16"><tspan font-weight="600">Arrhythmias, Tetany, Spasm</tspan></tspan></text><rect x="18.0" y="80.0" width="71.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Chvostek</tspan></tspan></text><rect x="95.8" y="80.0" width="78.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="102.8" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="102.8" dy="0"><tspan font-weight="700">Trousseau</tspan></tspan></text><rect x="180.2" y="80.0" width="64.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="187.2" y="95.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="187.2" dy="0"><tspan font-weight="700">Long QT</tspan></tspan></text><clipPath id="n186p2"><rect x="2" y="124" width="300" height="212" rx="14"/></clipPath><rect x="2" y="124" width="300" height="212" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="124" width="5" height="212" fill="#0F766E" clip-path="url(#n186p2)"/><text x="18" y="148" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="162.0" width="71.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="177.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Chvostek</tspan></tspan></text><text x="104.4" y="177.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.4" dy="0"><tspan font-weight="700">Tap </tspan><tspan font-weight="500">facial nerve, face</tspan></tspan><tspan x="104.4" dy="17"><tspan font-weight="500">twitches</tspan></tspan></text><rect x="18.0" y="204.0" width="78.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="219.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Trousseau</tspan></tspan></text><text x="104.4" y="219.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.4" dy="0"><tspan font-weight="700">Cuff </tspan><tspan font-weight="500">above SBP, 3 min,</tspan></tspan><tspan x="104.4" dy="17"><tspan font-weight="500">carpal spasm</tspan></tspan></text><rect x="18.0" y="246.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="261.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="104.4" y="261.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.4" dy="0"><tspan font-weight="700">Calcium gluconate </tspan><tspan font-weight="500">IV, ECG</tspan></tspan><tspan x="104.4" dy="17"><tspan font-weight="500">monitor</tspan></tspan></text><rect x="18.0" y="288.0" width="52.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="303.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cause</tspan></tspan></text><text x="104.4" y="303.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="104.4" dy="0"><tspan font-weight="700">Low PTH, </tspan><tspan font-weight="500">low vitamin D, </tspan><tspan font-weight="700">low</tspan></tspan><tspan x="104.4" dy="17"><tspan font-weight="700">Mg</tspan></tspan></text><clipPath id="n186p3"><rect x="2" y="344" width="300" height="104" rx="14"/></clipPath><rect x="2" y="344" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="344" width="5" height="104" fill="#B7410E" clip-path="url(#n186p3)"/><text x="18" y="368" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="393.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Low magnesium </tspan><tspan font-weight="500">causes refractory</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hypocalcemia and hypokalemia: replace</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">it.</tspan></tspan></text></svg>