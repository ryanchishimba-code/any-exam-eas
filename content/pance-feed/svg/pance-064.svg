<svg width="304" height="422" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 422" role="img" aria-label="Colorectal cancer screening from age 45 to 75 with colonoscopy every 10 years, FIT every year, stool DNA-FIT every 1 to 3 years, or CT colonography every 5 years; a positive stool test needs colonoscopy." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g64"><defs></defs><clipPath id="g64p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#g64p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who to screen</tspan></text><rect x="18.0" y="40.0" width="95.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age 45–49: B</tspan></tspan></text><rect x="119.7" y="40.0" width="95.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="126.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="126.7" dy="0"><tspan font-weight="700">Age 50–75: A</tspan></tspan></text><rect x="18.0" y="68.0" width="163.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age 76–85: individualize</tspan></tspan></text><clipPath id="g64p2"><rect x="2" y="112" width="300" height="176" rx="14"/></clipPath><rect x="2" y="112" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="176" fill="#0F766E" clip-path="url(#g64p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Pick one test</tspan></text><rect x="18.0" y="150.0" width="38.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">10 y</tspan></tspan></text><text x="70.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.1" dy="0"><tspan font-weight="700">Colonoscopy</tspan></tspan></text><rect x="18.0" y="180.0" width="29.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1 y</tspan></tspan></text><text x="70.1" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.1" dy="0"><tspan font-weight="700">FIT </tspan><tspan font-weight="500">(fecal immunochemical test)</tspan></tspan></text><rect x="18.0" y="210.0" width="44.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1–3 y</tspan></tspan></text><text x="70.1" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.1" dy="0"><tspan font-weight="700">Stool DNA-FIT</tspan></tspan></text><rect x="18.0" y="240.0" width="32.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">5 y</tspan></tspan></text><text x="70.1" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="70.1" dy="0"><tspan font-weight="700">CT colonography </tspan><tspan font-weight="500">or flexible</tspan></tspan><tspan x="70.1" dy="17"><tspan font-weight="500">sigmoidoscopy</tspan></tspan></text><clipPath id="g64p3"><rect x="2" y="296" width="300" height="122" rx="14"/></clipPath><rect x="2" y="296" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="296" width="5" height="122" fill="#B7410E" clip-path="url(#g64p3)"/><text x="18" y="320" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="345.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">A </tspan><tspan font-weight="700">positive stool test </tspan><tspan font-weight="500">is not a diagnosis: it</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">requires a follow-up colonoscopy.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">First-degree relative with CRC: start</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">earlier (high-risk pathway).</tspan></tspan></text></svg>