<svg width="304" height="492" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 492" role="img" aria-label="Ottawa ankle rules: X-ray for bone tenderness at the posterior malleolus, navicular or fifth metatarsal, or inability to bear weight for four steps. Lachman tests the ACL, McMurray the meniscus, and MRI confirms." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m76"><defs></defs><clipPath id="m76p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#m76p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who needs an X-ray</tspan></text><rect x="18.0" y="40.0" width="164.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Posterior malleolus edge</tspan></tspan></text><rect x="18.0" y="68.0" width="166.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Navicular, 5th metatarsal</tspan></tspan></text><rect x="18.0" y="96.0" width="135.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cannot take 4 steps</tspan></tspan></text><clipPath id="m76p2"><rect x="2" y="140" width="300" height="200" rx="14"/></clipPath><rect x="2" y="140" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="200" fill="#0F766E" clip-path="url(#m76p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Exam tests</tspan></text><rect x="18.0" y="178.0" width="49.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ankle</tspan></tspan></text><text x="99.3" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.3" dy="0"><tspan font-weight="700">X-ray </tspan><tspan font-weight="500">if malleolar tenderness</tspan></tspan><tspan x="99.3" dy="17"><tspan font-weight="500">or no weight bearing</tspan></tspan></text><rect x="18.0" y="220.0" width="39.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ACL</tspan></tspan></text><text x="99.3" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.3" dy="0"><tspan font-weight="700">Lachman, </tspan><tspan font-weight="500">anterior drawer;</tspan></tspan><tspan x="99.3" dy="17"><tspan font-weight="500">pop + swelling</tspan></tspan></text><rect x="18.0" y="262.0" width="73.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Meniscus</tspan></tspan></text><text x="99.3" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.3" dy="0"><tspan font-weight="700">McMurray; </tspan><tspan font-weight="500">locking, joint-line</tspan></tspan><tspan x="99.3" dy="17"><tspan font-weight="500">pain</tspan></tspan></text><rect x="18.0" y="304.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="319.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confirm</tspan></tspan></text><text x="99.3" y="319.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.3" dy="0"><tspan font-weight="700">MRI </tspan><tspan font-weight="500">knee</tspan></tspan></text><clipPath id="m76p3"><rect x="2" y="348" width="300" height="140" rx="14"/></clipPath><rect x="2" y="348" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="348" width="5" height="140" fill="#B7410E" clip-path="url(#m76p3)"/><text x="18" y="372" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="397.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Lachman </tspan><tspan font-weight="500">is the most sensitive ACL test.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Rapid swelling after a pop suggests</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hemarthrosis (ACL). Ottawa ankle rules</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">are very sensitive: negative means no</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">X-ray.</tspan></tspan></text></svg>