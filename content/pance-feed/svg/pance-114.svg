<svg width="304" height="434" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 434" role="img" aria-label="ADHD in children 4 to 5 treated first with parent training and classroom behavior interventions, methylphenidate only if still impaired; ages 6 to 11 get FDA-approved medication plus behavioral therapy and school supports." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p114"><defs></defs><clipPath id="p114p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#p114p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="92.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Two settings</tspan></tspan></text><rect x="116.1" y="40.0" width="109.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="123.1" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="123.1" dy="0"><tspan font-weight="700">Onset before 12</tspan></tspan></text><rect x="18.0" y="68.0" width="160.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Teacher + parent scales</tspan></tspan></text><clipPath id="p114p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#p114p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat by age</tspan></text><rect x="18.0" y="150.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age 4–5</tspan></tspan></text><text x="92.5" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.5" dy="0"><tspan font-weight="700">Parent training, </tspan><tspan font-weight="500">classroom</tspan></tspan><tspan x="92.5" dy="17"><tspan font-weight="500">behavior</tspan></tspan></text><rect x="18.0" y="192.0" width="66.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">If severe</tspan></tspan></text><text x="92.5" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.5" dy="0"><tspan font-weight="700">Methylphenidate</tspan></tspan></text><rect x="18.0" y="222.0" width="66.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Age 6–11</tspan></tspan></text><text x="92.5" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.5" dy="0"><tspan font-weight="700">FDA-approved drug </tspan><tspan font-weight="500">+ behavior</tspan></tspan><tspan x="92.5" dy="17"><tspan font-weight="500">therapy</tspan></tspan></text><rect x="18.0" y="264.0" width="56.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">School</tspan></tspan></text><text x="92.5" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.5" dy="0"><tspan font-weight="700">IEP or 504 plan</tspan></tspan></text><clipPath id="p114p3"><rect x="2" y="308" width="300" height="122" rx="14"/></clipPath><rect x="2" y="308" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="122" fill="#B7410E" clip-path="url(#p114p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Preschoolers get behavior therapy first;</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">methylphenidate only if still impaired. Ask</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">about cardiac symptoms and family</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">sudden death before stimulants.</tspan></tspan></text></svg>