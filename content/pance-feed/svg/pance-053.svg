<svg width="304" height="376" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 376" role="img" aria-label="Arterial blood gas reading: low pH, low bicarbonate, primary metabolic acidosis; Winter formula predicts PaCO2 of 26 plus or minus 2, so compensation is appropriate; then calculate the anion gap." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p53"><defs></defs><clipPath id="p53p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#p53p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Read in order</tspan></text><rect x="18.0" y="40.0" width="60.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">pH 7.30</tspan></tspan></text><rect x="84.2" y="40.0" width="74.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="91.2" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="91.2" dy="0"><tspan font-weight="700">PaCO2 25</tspan></tspan></text><rect x="164.6" y="40.0" width="66.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="171.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="171.6" dy="0"><tspan font-weight="700">HCO3 12</tspan></tspan></text><clipPath id="p53p2"><rect x="2" y="84" width="300" height="176" rx="14"/></clipPath><rect x="2" y="84" width="300" height="176" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="176" fill="#0F766E" clip-path="url(#p53p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Four steps</tspan></text><rect x="18.0" y="122.0" width="19.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">1</tspan></tspan></text><text x="48.4" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">pH: </tspan><tspan font-weight="500">&lt;7.35 acidemia</tspan></tspan></text><rect x="18.0" y="152.0" width="21.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">2</tspan></tspan></text><text x="48.4" y="167.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">Primary: </tspan><tspan font-weight="500">HCO3 low = metabolic</tspan></tspan></text><rect x="18.0" y="182.0" width="22.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="197.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">3</tspan></tspan></text><text x="48.4" y="197.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">Winter: </tspan><tspan font-weight="500">1.5 × 12 + 8 = 26 ± 2:</tspan></tspan><tspan x="48.4" dy="17"><tspan font-weight="500">appropriate</tspan></tspan></text><rect x="18.0" y="224.0" width="22.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="239.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">4</tspan></tspan></text><text x="48.4" y="239.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="48.4" dy="0"><tspan font-weight="700">Anion gap: </tspan><tspan font-weight="500">Na − (Cl + HCO3)</tspan></tspan></text><clipPath id="p53p3"><rect x="2" y="268" width="300" height="104" rx="14"/></clipPath><rect x="2" y="268" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="268" width="5" height="104" fill="#B7410E" clip-path="url(#p53p3)"/><text x="18" y="292" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="317.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">If measured PaCO2 is </tspan><tspan font-weight="700">higher than</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">expected</tspan><tspan font-weight="500">, a respiratory acidosis is also</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">present; if lower, a respiratory alkalosis.</tspan></tspan></text></svg>