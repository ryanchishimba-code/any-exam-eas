<svg width="304" height="382" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 382" role="img" aria-label="Severe symptomatic hyponatremia: 150 milliliters of 3 percent saline over 20 minutes, and limit the rise to 10 mEq/L in 24 hours to avoid osmotic demyelination." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n180"><defs></defs><clipPath id="n180p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#n180p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="52.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Na 116</tspan></tspan></text><rect x="76.6" y="40.0" width="60.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="83.6" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="83.6" dy="0"><tspan font-weight="700">Seizure</tspan></tspan></text><rect x="142.7" y="40.0" width="73.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="149.7" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="149.7" dy="0"><tspan font-weight="700">3% saline</tspan></tspan></text><clipPath id="n180p2"><rect x="2" y="84" width="300" height="200" rx="14"/></clipPath><rect x="2" y="84" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="200" fill="#0F766E" clip-path="url(#n180p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="122.0" width="56.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Severe</tspan></tspan></text><text x="120.1" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="120.1" dy="0"><tspan font-weight="700">150 mL 3% saline </tspan><tspan font-weight="500">over 20</tspan></tspan><tspan x="120.1" dy="17"><tspan font-weight="500">min</tspan></tspan></text><rect x="18.0" y="164.0" width="43.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="179.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Limit</tspan></tspan></text><text x="120.1" y="179.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="120.1" dy="0"><tspan font-weight="700">≤10 mEq/L </tspan><tspan font-weight="500">in 24 h (≤8 if</tspan></tspan><tspan x="120.1" dy="17"><tspan font-weight="500">high ODS risk)</tspan></tspan></text><rect x="18.0" y="206.0" width="94.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="221.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hypovolemic</tspan></tspan></text><text x="120.1" y="221.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="120.1" dy="0"><tspan font-weight="700">Isotonic saline</tspan></tspan></text><rect x="18.0" y="236.0" width="53.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="251.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SIADH</tspan></tspan></text><text x="120.1" y="251.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="120.1" dy="0"><tspan font-weight="700">Fluid restriction, </tspan><tspan font-weight="500">treat</tspan></tspan><tspan x="120.1" dy="17"><tspan font-weight="500">cause</tspan></tspan></text><clipPath id="n180p3"><rect x="2" y="292" width="300" height="86" rx="14"/></clipPath><rect x="2" y="292" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="292" width="5" height="86" fill="#B7410E" clip-path="url(#n180p3)"/><text x="18" y="316" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="341.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Overcorrection </tspan><tspan font-weight="500">(&gt;10 mEq/L in 24 h) risks</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">osmotic demyelination 2–6 days later.</tspan></tspan></text></svg>