18.0" dy="18"><tspan font-weight="500">age 65–74, female sex.</tspan></tspan></text><text x="18.0" y="403.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Hemodynamically unstable: </tspan><tspan font-weight="500">immediate</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">electrical cardioversion.</tspan></tspan></text><text x="18.0" y="447.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">AF ≥48 h or unknown, elective</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">cardioversion:</tspan></tspan></text><rect x="18.0" y="478.0" width="113.7" height="24.0" rx="6" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="26.0" y="494.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="26.0" dy="0"><tspan font-weight="700">≥3 weeks before</tspan></tspan></text><rect x="133.7" y="478.0" width="154.3" height="24.0" rx="6" fill="#0F766E" stroke="none" stroke-width="1"/><text x="141.7" y="494.5" font-size="12" font-weight="700" fill="#FFFFFF" xml:space="preserve"><tspan x="141.7" dy="0"><tspan font-weight="700">≥4 weeks after</tspan></tspan></text><clipPath id="s2p4"><rect x="2" y="524" width="300" height="104" rx="14"/></clipPath><rect x="2" y="524" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="524" width="5" height="104" fill="#B7410E" clip-path="url(#s2p4)"/><text x="18" y="548" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="573.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Mechanical valve or moderate–severe</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">rheumatic mitral stenosis: use warfarin,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">not a DOAC.</tspan></tspan></text></svg>