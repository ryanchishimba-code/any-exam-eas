<svg width="304" height="587" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 587" role="img" aria-label="Cirrhosis complications: spontaneous bacterial peritonitis diagnosed by ascitic neutrophils of 250 or more and treated with ceftriaxone and albumin, carvedilol for portal hypertension, octreotide, antibiotics and banding for variceal bleeding, and lactulose for encephalopathy." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="g66"><defs></defs><clipPath id="g66p1"><rect x="2" y="2" width="300" height="255" rx="14"/></clipPath><rect x="2" y="2" width="300" height="255" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="255" fill="#0B5CAD" clip-path="url(#g66p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Cirrhosis (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M48,62 Q168,48 254,70 Q218,104 88,110 Q48,102 48,62 Z" fill="#A0524A" stroke="#6B302A" stroke-width="1.2" /><circle cx="78.0" cy="76.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="102.0" cy="86.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="126.0" cy="76.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="150.0" cy="86.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="174.0" cy="76.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="198.0" cy="86.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><circle cx="222.0" cy="76.0" r="6" fill="#8A443D" stroke="#C0675C" stroke-width="1"/><rect x="32" y="120" width="242" height="34" rx="12" fill="#4D7FA6" fill-opacity=".55"/><g class="lb" data-n="1"><line class="ld" x1="158.0" y1="137.0" x2="158.0" y2