roke="#F1DDB0" stroke-width="1"/><text x="25.0" y="318.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SBP</tspan></tspan></text><text x="86.1" y="318.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.1" dy="0"><tspan font-weight="700">Ceftriaxone + albumin </tspan><tspan font-weight="500">day 1</tspan></tspan><tspan x="86.1" dy="17"><tspan font-weight="500">and 3</tspan></tspan></text><rect x="18.0" y="345.0" width="60.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="360.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Varices</tspan></tspan></text><text x="86.1" y="360.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.1" dy="0"><tspan font-weight="700">Carvedilol </tspan><tspan font-weight="500">preferred NSBB</tspan></tspan></text><rect x="18.0" y="375.0" width="48.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="390.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bleed</tspan></tspan></text><text x="86.1" y="390.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.1" dy="0"><tspan font-weight="700">Octreotide, </tspan><tspan font-weight="500">ceftriaxone, banding</tspan></tspan><tspan x="86.1" dy="17"><tspan font-weight="500">≤12 h</tspan></tspan></text><rect x="18.0" y="417.0" width="30.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="432.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">HE</tspan></tspan></text><text x="86.1" y="432.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="86.1" dy="0"><tspan font-weight="700">Lactulose, </tspan><tspan font-weight="500">add rifaximin</tspan></tspan></text><clipPath id="g66p3"><rect x="2" y="461" width="300" height="122" rx="14"/></clipPath><rect x="2" y="461" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="461" width="5" height="122" fill="#B7410E" clip-path="url(#g66p3)"/><text x="18" y="485" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="510.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Every hospitalized patient with ascites</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">gets a diagnostic paracentesis. Variceal</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">bleed: restrictive transfusion and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">antibiotic prophylaxis </tspan><tspan font-weight="500">reduce mortality.</tspan></tspan></text></svg>