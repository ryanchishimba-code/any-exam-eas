<svg width="304" height="474" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 474" role="img" aria-label="HIV screening for everyone aged 15 to 65, antiretroviral therapy started at diagnosis, and PrEP with daily oral tenofovir-emtricitabine, cabotegravir injections, or lenacapavir every 6 months after a negative HIV test." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i84"><defs></defs><clipPath id="i84p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#i84p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Who to screen</tspan></text><rect x="18.0" y="40.0" width="154.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ages 15–65: screen (A)</tspan></tspan></text><rect x="18.0" y="68.0" width="128.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pregnancy: screen</tspan></tspan></text><rect x="18.0" y="96.0" width="172.0" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Older or younger with risk</tspan></tspan></text><clipPath id="i84p2"><rect x="2" y="140" width="300" height="200" rx="14"/></clipPath><rect x="2" y="140" width="300" height="200" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="200" fill="#0F766E" clip-path="url(#i84p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat and prevent</tspan></text><rect x="18.0" y="178.0" width="71.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Diagnose</tspan></tspan></text><text x="99.0" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.0" dy="0"><tspan font-weight="700">Antigen/antibody </tspan><tspan font-weight="500">test, then</tspan></tspan><tspan x="99.0" dy="17"><tspan font-weight="500">confirm</tspan></tspan></text><rect x="18.0" y="220.0" width="39.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="235.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">ART</tspan></tspan></text><text x="99.0" y="235.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.0" dy="0"><tspan font-weight="700">At diagnosis, </tspan><tspan font-weight="500">same day when</tspan></tspan><tspan x="99.0" dy="17"><tspan font-weight="500">feasible</tspan></tspan></text><rect x="18.0" y="262.0" width="69.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="277.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PrEP oral</tspan></tspan></text><text x="99.0" y="277.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.0" dy="0"><tspan font-weight="700">TDF/FTC </tspan><tspan font-weight="500">or TAF/FTC daily</tspan></tspan></text><rect x="18.0" y="292.0" width="73.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="307.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">PrEP shot</tspan></tspan></text><text x="99.0" y="307.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="99.0" dy="0"><tspan font-weight="700">Cabotegravir </tspan><tspan font-weight="500">or </tspan><tspan font-weight="700">lenacapavir</tspan></tspan><tspan x="99.0" dy="17"><tspan font-weight="500">(every 6 months)</tspan></tspan></text><clipPath id="i84p3"><rect x="2" y="348" width="300" height="122" rx="14"/></clipPath><rect x="2" y="348" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="348" width="5" height="122" fill="#B7410E" clip-path="url(#i84p3)"/><text x="18" y="372" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="397.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Confirm HIV-negative </tspan><tspan font-weight="500">before PrEP (and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">check kidney function for oral PrEP);</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">starting PrEP during undiagnosed</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">infection breeds resistance.</tspan></tspan></text></svg>