<svg width="304" height="382" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 382" role="img" aria-label="Parkinson disease with resting tremor, rigidity and bradykinesia treated first with immediate-release levodopa; dopamine agonists only for selected patients under 60 and avoided over 70." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n100"><defs></defs><clipPath id="n100p1"><rect x="2" y="2" width="300" height="74" rx="14"/></clipPath><rect x="2" y="2" width="300" height="74" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="74" fill="#0B5CAD" clip-path="url(#n100p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Triad</tspan></text><rect x="18.0" y="40.0" width="103.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Resting tremor</tspan></tspan></text><rect x="127.9" y="40.0" width="60.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="134.9" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="134.9" dy="0"><tspan font-weight="700">Rigidity</tspan></tspan></text><rect x="194.4" y="40.0" width="93.4" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="201.4" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="201.4" dy="0"><tspan font-weight="700">Bradykinesia</tspan></tspan></text><clipPath id="n100p2"><rect x="2" y="84" width="300" height="146" rx="14"/></clipPath><rect x="2" y="84" width="300" height="146" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="84" width="5" height="146" fill="#0F766E" clip-path="url(#n100p2)"/><text x="18" y="108" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="122.0" width="41.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="137.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">First</tspan></tspan></text><text x="96.8" y="137.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Levodopa </tspan><tspan font-weight="500">(immediate-release)</tspan></tspan></text><rect x="18.0" y="152.0" width="70.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="167.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Under 60</tspan></tspan></text><text x="96.8" y="167.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Dopamine agonist </tspan><tspan font-weight="500">if</tspan></tspan><tspan x="96.8" dy="17"><tspan font-weight="500">dyskinesia risk high</tspan></tspan></text><rect x="18.0" y="194.0" width="53.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="209.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Watch</tspan></tspan></text><text x="96.8" y="209.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="96.8" dy="0"><tspan font-weight="700">Dyskinesia, </tspan><tspan font-weight="500">impulse control</tspan></tspan></text><clipPath id="n100p3"><rect x="2" y="238" width="300" height="140" rx="14"/></clipPath><rect x="2" y="238" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="238" width="5" height="140" fill="#B7410E" clip-path="url(#n100p3)"/><text x="18" y="262" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="287.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Dopamine agonists </tspan><tspan font-weight="500">cause</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">impulse-control disorders, sleepiness and</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">hallucinations; avoid over 70.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">Antipsychotics like haloperidol worsen</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">parkinsonism.</tspan></tspan></text></svg>