<svg width="304" height="514" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 514" role="img" aria-label="Deep vein thrombosis. Schematic leg vein with a clot. Two-level Wells score: if DVT is likely go straight to compression ultrasound; if unlikely do a D-dimer first. Treat with a DOAC rather than warfarin; three months when provoked by a transient factor." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s34"><defs><linearGradient id="s34ct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E3B46"/><stop offset="1" stop-color="#5E1F2C"/></linearGradient></defs><clipPath id="s34p1"><rect x="2" y="2" width="300" height="184" rx="14"/></clipPath><rect x="2" y="2" width="300" height="184" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="184" fill="#0B5CAD" clip-path="url(#s34p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Clot in a leg vein (schematic)</tspan></text><rect x="20.0" y="54.0" width="266.0" height="48.0" rx="6" fill="#B7C8E6" stroke="#4C6EA8" stroke-width="1.4"/><rect x="23.0" y="59.0" width="260.0" height="38.0" rx="4" fill="#D5E1F4" stroke="#6C8BBF" stroke-width="1"/><path d="M114.0,61.0 C115.6,58.9 134.4,62.9 138.0,63.0 C141.6,63.1 164.5,63.1 168.0,63.0 C171.5,62.9 188.5,58.9 190.0,61.0 C191.5,63.1 191.5,92.9 190.0,95.0 C188.5,97.1 171.5,93.1 168.0,93.0 C164.5,92.9 141.6,92.9 138.0,93.0 C134.4,93.1 115.6,97.1 114.0,95.0 C112.4,92.9 112.4,63.1 114.0,61.0 Z" fill="url(#s34ct)" stroke="#3E1420" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><line x1="34.0" y1="78.0" x2="93.6" y2="78.0" stroke="#0B5CAD" stroke-width="2.4" stroke-linecap="round"/><polygon points="100.0,78.0 92.8,81.5 92.8,74.5" fill="#0B5CAD"/><line x1="204.0" y1="78.0" x2="262.4" y2="78.0" stroke="#0B5CAD" stroke-width="1.4" stroke-linecap="round"/><polygon points="268.0,78.0 261.7,81.0 261.7,75.0" fill="#0B5CAD"/><g class="lb" data-n="1"><line class="ld" x1="152.0" y1="90.0" x2="168.0" y2="114.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="152.0" cy="90.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="168.0" y="114.0" width="134" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="175.0" y="133.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="175.0" dy="0"><tspan font-weight="700">Clot blocks the vein</tspan></tspan></text></g><g class="q"><circle cx="174.1" cy="123.2" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M170.9,120.6 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="174.2" cy="128.4" r="1.2" fill="#fff"/></g><circle class="hit" cx="174.1" cy="123.2" r="22" fill="transparent"/></g><rect x="18.0" y="150.0" width="147.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Unilateral leg swelling</tspan></tspan></text><rect x="171.6" y="150.0" width="111.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="178.6" y="165.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="178.6" dy="0"><tspan font-weight="700">Calf tenderness</tspan></tspan></text><clipPath id="s34p2"><rect x="2" y="194" width="300" height="186" rx="14"/></clipPath><rect x="2" y="194" width="300" height="186" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="194" width="5" height="186" fill="#0F766E" clip-path="url(#s34p2)"/><text x="18" y="218" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Probability first</tspan></text><rect x="18.0" y="232.0" width="49.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="247.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Likely</tspan></tspan></text><text x="75.9" y="247.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="75.9" dy="0"><tspan font-weight="500">(Wells ≥2): </tspan><tspan font-weight="700">compression</tspan></tspan><tspan x="75.9" dy="17"><tspan font-weight="700">ultrasound </tspan><tspan font-weight="500">straight away</tspan></tspan></text><rect x="18.0" y="274.0" width="63.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="289.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Unlikely</tspan></tspan></text><text x="89.1" y="289.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.1" dy="0"><tspan font-weight="500">(Wells ≤1): </tspan><tspan font-weight="700">D-dimer </tspan><tspan font-weight="500">first;</tspan></tspan><tspan x="89.1" dy="17"><tspan font-weight="500">ultrasound if positive</tspan></tspan></text><rect x="18.0" y="320.0" width="96.0" height="46.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="66.0" y="339.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="66.0" dy="0"><tspan font-weight="700">DOAC over</tspan></tspan><tspan x="66.0" dy="15"><tspan font-weight="700">warfarin</tspan></tspan></text><rect x="120.0" y="320.0" width="168.0" height="46.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="204.0" y="339.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="204.0" dy="0"><tspan font-weight="700">Provoked by a transient</tspan></tspan><tspan x="204.0" dy="15"><tspan font-weight="700">factor: 3 months</tspan></tspan></text><clipPath id="s34p3"><rect x="2" y="388" width="300" height="122" rx="14"/></clipPath><rect x="2" y="388" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="388" width="5" height="122" fill="#B7410E" clip-path="url(#s34p3)"/><text x="18" y="412" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="437.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">When Wells says DVT is likely, do not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">start with D-dimer; go straight to</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">ultrasound. D-dimer is only for the</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">unlikely group.</tspan></tspan></text></svg>