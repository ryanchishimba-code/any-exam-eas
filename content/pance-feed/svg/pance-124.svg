<svg width="304" height="392" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 392" role="img" aria-label="Third-trimester bleeding: painless suggests previa, painful suggests abruption; ultrasound before any digital exam." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="r124"><defs></defs><clipPath id="r124p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#r124p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="110.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Painless: previa</tspan></tspan></text><rect x="134.2" y="40.0" width="122.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="141.2" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="141.2" dy="0"><tspan font-weight="700">Painful: abruption</tspan></tspan></text><rect x="18.0" y="68.0" width="109.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Ultrasound first</tspan></tspan></text><clipPath id="r124p2"><rect x="2" y="112" width="300" height="164" rx="14"/></clipPath><rect x="2" y="112" width="300" height="164" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="164" fill="#0F766E" clip-path="url(#r124p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="150.0" width="66.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stabilize</tspan></tspan></text><text x="92.4" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.4" dy="0"><tspan font-weight="700">IV access, </tspan><tspan font-weight="500">type and cross</tspan></tspan></text><rect x="18.0" y="180.0" width="51.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Image</tspan></tspan></text><text x="92.4" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.4" dy="0"><tspan font-weight="700">Ultrasound </tspan><tspan font-weight="500">before any exam</tspan></tspan></text><rect x="18.0" y="210.0" width="61.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="225.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Monitor</tspan></tspan></text><text x="92.4" y="225.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.4" dy="0"><tspan font-weight="700">Fetal heart </tspan><tspan font-weight="500">tracing</tspan></tspan></text><rect x="18.0" y="240.0" width="57.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="255.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Deliver</tspan></tspan></text><text x="92.4" y="255.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="92.4" dy="0"><tspan font-weight="700">Timing </tspan><tspan font-weight="500">by stability</tspan></tspan></text><clipPath id="r124p3"><rect x="2" y="284" width="300" height="104" rx="14"/></clipPath><rect x="2" y="284" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="284" width="5" height="104" fill="#B7410E" clip-path="url(#r124p3)"/><text x="18" y="308" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="333.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Digital exam with previa </tspan><tspan font-weight="500">can provoke</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">catastrophic hemorrhage. Get ultrasound</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">first.</tspan></tspan></text></svg>