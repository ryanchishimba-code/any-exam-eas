<svg width="304" height="462" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 462" role="img" aria-label="Migraine treated with an NSAID then a triptan, gepants after triptan failure; cluster headache treated with 100 percent oxygen or subcutaneous sumatriptan; red flags such as thunderclap onset need imaging." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n99"><defs></defs><clipPath id="n99p1"><rect x="2" y="2" width="300" height="130" rx="14"/></clipPath><rect x="2" y="2" width="300" height="130" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="130" fill="#0B5CAD" clip-path="url(#n99p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="185.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Migraine: throbbing, nausea</tspan></tspan></text><rect x="18.0" y="68.0" width="155.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cluster: orbital, tearing</tspan></tspan></text><rect x="18.0" y="96.0" width="115.5" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="111.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">SNOOP red flags</tspan></tspan></text><clipPath id="n99p2"><rect x="2" y="140" width="300" height="188" rx="14"/></clipPath><rect x="2" y="140" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="140" width="5" height="188" fill="#0F766E" clip-path="url(#n99p2)"/><text x="18" y="164" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat</tspan></text><rect x="18.0" y="178.0" width="67.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="193.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Migraine</tspan></tspan></text><text x="112.4" y="193.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.4" dy="0"><tspan font-weight="700">NSAID, </tspan><tspan font-weight="500">then triptan</tspan></tspan></text><rect x="18.0" y="208.0" width="86.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="223.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Triptan fails</tspan></tspan></text><text x="112.4" y="223.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.4" dy="0"><tspan font-weight="700">Gepant </tspan><tspan font-weight="500">or lasmiditan</tspan></tspan></text><rect x="18.0" y="238.0" width="58.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="253.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Cluster</tspan></tspan></text><text x="112.4" y="253.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.4" dy="0"><tspan font-weight="700">100% oxygen </tspan><tspan font-weight="500">or SC</tspan></tspan><tspan x="112.4" dy="17"><tspan font-weight="500">sumatriptan</tspan></tspan></text><rect x="18.0" y="280.0" width="70.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="295.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Red flags</tspan></tspan></text><text x="112.4" y="295.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="112.4" dy="0"><tspan font-weight="700">Image: </tspan><tspan font-weight="500">thunderclap, age</tspan></tspan><tspan x="112.4" dy="17"><tspan font-weight="500">&gt;50, papilledema</tspan></tspan></text><clipPath id="n99p3"><rect x="2" y="336" width="300" height="122" rx="14"/></clipPath><rect x="2" y="336" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="336" width="5" height="122" fill="#B7410E" clip-path="url(#n99p3)"/><text x="18" y="360" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="385.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Limit acute drugs </tspan><tspan font-weight="500">to about 2 days a week</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">to avoid medication-overuse headache.</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">SNOOP: systemic signs, neuro deficit,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">onset sudden or after 50, pattern change.</tspan></tspan></text></svg>