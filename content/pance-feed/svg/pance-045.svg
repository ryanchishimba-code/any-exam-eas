th id="p45p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#p45p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Screen and follow</tspan></text><rect x="18.0" y="331.0" width="56.9" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen</tspan></tspan></text><text x="100.3" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.3" dy="0"><tspan font-weight="700">Annual LDCT </tspan><tspan font-weight="500">with shared</tspan></tspan><tspan x="100.3" dy="17"><tspan font-weight="500">decision-making</tspan></tspan></text><rect x="18.0" y="373.0" width="57.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Nodule</tspan></tspan></text><text x="100.3" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.3" dy="0"><tspan font-weight="500">Screen-found: </tspan><tspan font-weight="700">Lung-RADS</tspan></tspan><tspan x="100.3" dy="17"><tspan font-weight="500">category sets follow-up</tspan></tspan></text><rect x="18.0" y="415.0" width="74.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Incidental</tspan></tspan></text><text x="100.3" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="100.3" dy="0"><tspan font-weight="700">Fleischner: </tspan><tspan font-weight="500">solid &lt;6 mm low</tspan></tspan><tspan x="100.3" dy="17"><tspan font-weight="500">risk, no routine follow-up</tspan></tspan></text><clipPath id="p45p3"><rect x="2" y="471" width="300" height="104" rx="14"/></clipPath><rect x="2" y="471" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="104" fill="#B7410E" clip-path="url(#p45p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Stop screening </tspan><tspan font-weight="500">once a person has not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">smoked for 15 years or cannot or will not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">have curative lung surgery.</tspan></tspan></text></svg>