<svg width="304" height="596" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 596" role="img" aria-label="Peripheral artery disease. Ankle-brachial index of 0.90 or less confirms it. First-line: supervised exercise, high-intensity statin and single antiplatelet therapy. Acute limb ischemia, the 6 Ps: Pain, Pallor, Pulselessness, Poikilothermia, Paresthesia, Paralysis. Treat with heparin and urgent revascularization." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s33"><defs><linearGradient id="s33wl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D88F85"/><stop offset="1" stop-color="#B8574D"/></linearGradient><linearGradient id="s33lu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C6BE"/><stop offset="1" stop-color="#E39C92"/></linearGradient></defs><clipPath id="s33p1"><rect x="2" y="2" width="300" height="260" rx="14"/></clipPath><rect x="2" y="2" width="300" height="260" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="260" fill="#0B5CAD" clip-path="url(#s33p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  ABI (schematic)</tspan></text><rect x="20.0" y="54.0" width="266.0" height="36.0" rx="6" fill="url(#s33wl)" stroke="#7C2F2B" stroke-width="1.4"/><rect x="23.0" y="59.0" width="260.0" height="26.0" rx="4" fill="url(#s33lu)" stroke="#9C4B43" stroke-width="1.1"/><rect x="130.0" y="54.0" width="44.0" height="36.0" rx="4" fill="#F4E3B0" stroke="#8A5A12" stroke-width="1.6"/><line x1="143.0" y1="72.0" x2="161.0" y2="72.0" stroke="#B7410E" stroke-width="2.6" stroke-linecap="round"/><path d="M122,58 C130,28 174,28 182,58" fill="none" stroke="#9C4B43" stroke-width="2.2" stroke-dasharray="4 3"/><line x1="38.0" y1="72.0" x2="95.6" y2="72.0" stroke="#0B5CAD" stroke-width="2.4" stroke-linecap="round"/><polygon points="102.0,72.0 94.8,75.5 94.8,68.5" fill="#0B5CAD"/><g class="lb" data-n="1"><line class="ld" x1="152.0" y1="86.0" x2="152.0" y2="102.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="152.0" cy="86.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="78.0" y="102.0" width="173" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="85.0" y="121.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="85.0" dy="0"><tspan font-weight="700">Blocked artery, collaterals</tspan></tspan></text></g><g class="q" display="none"><circle cx="152.0" cy="113.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M148.8,110.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="152.1" cy="118.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="152.0" cy="113.0" r="22" fill="transparent"/></g><text x="18.0" y="144.0" font-size="14" font-weight="800" fill="#0B5CAD" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">ABI = ankle SBP ÷ arm SBP</tspan></tspan></text><rect x="18.0" y="156.0" width="270.0" height="30.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1"/><rect x="18.0" y="156.0" width="80.0" height="30.0" rx="8" fill="#B7410E" stroke="none" stroke-width="1"/><rect x="28.0" y="156.0" width="70.0" height="30.0" rx="0" fill="#B7410E" stroke="none" stroke-width="1"/><text x="28.0" y="175.5" font-size="12" font-weight="800" fill="#FFFFFF" xml:space="preserve"><tspan x="28.0" dy="0"><tspan font-weight="700">≤0.90</tspan></tspan></text><text x="114.0" y="175.5" font-size="11" font-weight="700" fill="#0F2F2C" xml:space="preserve"><tspan x="114.0" dy="0"><tspan font-weight="700">PAD confirmed; lower is worse</tspan></tspan></text><rect x="18.0" y="198.0" width="118.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="213.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Calf pain walking</tspan></tspan></text><rect x="142.6" y="198.0" width="110.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="149.6" y="213.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="149.6" dy="0"><tspan font-weight="700">Relieved by rest</tspan></tspan></text><rect x="18.0" y="226.0" width="91.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="241.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Weak pulses</tspan></tspan></text><clipPath id="s33p2"><rect x="2" y="270" width="300" height="182" rx="14"/></clipPath><rect x="2" y="270" width="300" height="182" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="270" width="5" height="182" fill="#0F766E" clip-path="url(#s33p2)"/><text x="18" y="294" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Risk-factor care and exercise</tspan></text><rect x="18.0" y="308.0" width="84.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="60.0" y="325.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="60.0" dy="0"><tspan font-weight="700">Supervised</tspan></tspan><tspan x="60.0" dy="15"><tspan font-weight="700">exercise</tspan></tspan></text><rect x="108.0" y="308.0" width="92.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="154.0" y="325.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="154.0" dy="0"><tspan font-weight="700">High-intensity</tspan></tspan><tspan x="154.0" dy="15"><tspan font-weight="700">statin</tspan></tspan></text><rect x="206.0" y="308.0" width="84.0" height="42.0" rx="10" fill="#0F766E" stroke="none" stroke-width="1"/><text x="248.0" y="325.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="248.0" dy="0"><tspan font-weight="700">Single</tspan></tspan><tspan x="248.0" dy="15"><tspan font-weight="700">antiplatelet</tspan></tspan></text><text x="18.0" y="373.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Add </tspan><tspan font-weight="700">rivaroxaban 2.5 mg twice daily </tspan><tspan font-weight="500">with</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">aspirin if bleeding risk is not increased.</tspan></tspan></text><text x="18.0" y="415.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Revascularize claudication only after</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">medical and exercise therapy fail.</tspan></tspan></text><clipPath id="s33p3"><rect x="2" y="460" width="300" height="132" rx="14"/></clipPath><rect x="2" y="460" width="300" height="132" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="460" width="5" height="132" fill="#B7410E" clip-path="url(#s33p3)"/><text x="18" y="484" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="509.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Acute limb ischemia: </tspan><tspan font-weight="500">heparin now plus</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">urgent revascularization.</tspan></tspan></text><text x="18.0" y="551.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">P</