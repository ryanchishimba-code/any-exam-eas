4.5" y="202.0" width="48.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="141.5" y="217.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="141.5" dy="0"><tspan font-weight="700">Halos</tspan></tspan></text><rect x="189.1" y="202.0" width="60.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="196.1" y="217.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="196.1" dy="0"><tspan font-weight="700">Nausea</tspan></tspan></text><clipPath id="s10p2"><rect x="2" y="248" width="300" height="172" rx="14"/></clipPath><rect x="2" y="248" width="300" height="172" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="248" width="5" height="172" fill="#0F766E" clip-path="url(#s10p2)"/><text x="18" y="272" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Pressure first, then laser</tspan></text><circle cx="29.0" cy="299.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="304" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="50.0" y="302.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Lower eye pressure now: </tspan><tspan font-weight="500">topical</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">beta-blocker, carbonic anhydrase</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">inhibitor, hyperosmotic agent</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">(mannitol).</tspan></tspan></text><circle cx="29.0" cy="381.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="386" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="50.0" y="384.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Definitive: </tspan><tspan font-weight="500">laser peripheral iridotomy</tspan></tspan><tspan x="50.0" dy="18"><tspan font-weight="500">as soon as safely feasible.</tspan></tspan></text><clipPath id="s10p3"><rect x="2" y="428" width="300" height="86" rx="14"/></clipPath><rect x="2" y="428" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="428" width="5" height="86" fill="#B7410E" clip-path="url(#s10p3)"/><text x="18" y="452" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="477.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">Treat the other eye too with prophylactic</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">laser. Avoid dilating drops.</tspan></tspan></text></svg>