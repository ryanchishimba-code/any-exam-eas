<svg width="304" height="470" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 470" role="img" aria-label="Gonorrhea is treated with ceftriaxone 500 mg IM once and chlamydia with doxycycline 100 mg twice daily for 7 days, azithromycin in pregnancy; partners are treated and patients retested at 3 months." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="i89"><defs></defs><clipPath id="i89p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#i89p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Diagnose</tspan></text><rect x="18.0" y="40.0" width="144.3" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">NAAT (vaginal, urine)</tspan></tspan></text><rect x="168.3" y="40.0" width="101.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="175.3" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="175.3" dy="0"><tspan font-weight="700">Treat partners</tspan></tspan></text><rect x="18.0" y="68.0" width="131.6" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Screen women &lt;25</tspan></tspan></text><clipPath id="i89p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#i89p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Treat both</tspan></text><rect x="18.0" y="150.0" width="32.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">GC</tspan></tspan></text><text x="116.1" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="116.1" dy="0"><tspan font-weight="700">Ceftriaxone 500 mg </tspan><tspan font-weight="500">IM</tspan></tspan><tspan x="116.1" dy="17"><tspan font-weight="500">once</tspan></tspan></text><rect x="18.0" y="192.0" width="31.6" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="207.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">CT</tspan></tspan></text><text x="116.1" y="207.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="116.1" dy="0"><tspan font-weight="700">Doxycycline </tspan><tspan font-weight="500">100 mg BID 7</tspan></tspan><tspan x="116.1" dy="17"><tspan font-weight="500">days</tspan></tspan></text><rect x="18.0" y="234.0" width="90.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="249.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Pregnant CT</tspan></tspan></text><text x="116.1" y="249.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="116.1" dy="0"><tspan font-weight="700">Azithromycin </tspan><tspan font-weight="500">1 g once</tspan></tspan></text><rect x="18.0" y="264.0" width="66.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="279.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Partners</tspan></tspan></text><text x="116.1" y="279.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="116.1" dy="0"><tspan font-weight="700">Expedited </tspan><tspan font-weight="500">partner therapy</tspan></tspan></text><clipPath id="i89p3"><rect x="2" y="308" width="300" height="158" rx="14"/></clipPath><rect x="2" y="308" width="300" height="158" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="158" fill="#B7410E" clip-path="url(#i89p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Add doxycycline </tspan><tspan font-weight="500">for chlamydia if not</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">excluded. Retest everyone about 3</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">months after treatment (reinfection). Test</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">of cure: pharyngeal gonorrhea (7–14</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">days) and chlamydia in pregnancy (4</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">weeks).</tspan></tspan></text></svg>