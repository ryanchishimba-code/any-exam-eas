<svg width="304" height="530" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 530" role="img" aria-label="Diabetic ketoacidosis. Diagnosis: glucose above 200 mg/dL, ketones (beta-hydroxybutyrate 3.0 mmol/L or more), and acidosis (pH below 7.30 or bicarbonate below 18). Sequence: IV fluids, check potassium, then fixed-rate IV insulin 0.1 units/kg/h once potassium is above 3.5. SGLT2 inhibitors can cause euglycemic DKA." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="s12"><defs></defs><clipPath id="s12p1"><rect x="2" y="2" width="300" height="146" rx="14"/></clipPath><rect x="2" y="2" width="300" height="146" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="146" fill="#0B5CAD" clip-path="url(#s12p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Three criteria</tspan></text><rect x="18.0" y="40.0" width="86.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#CFE0F2" stroke-width="1.2"/><rect x="28.0" y="40.0" width="66.0" height="4.0" rx="2" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="27.0" y="64.0" font-size="13" font-weight="500" fill="#0F2F2C" xml:space="preserve"><tspan x="27.0" dy="0"><tspan font-weight="700">Glucose</tspan></tspan><tspan x="27.0" dy="17"><tspan font-weight="500">&gt;200</tspan></tspan><tspan x="27.0" dy="17"><tspan font-weight="500">mg/dL</tspan></tspan></text><rect x="110.0" y="40.0" width="86.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#CFE0F2" stroke-width="1.2"/><rect x="120.0" y="40.0" width="66.0" height="4.0" rx="2" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="119.0" y="64.0" font-size="13" font-weight="500" fill="#0F2F2C" xml:space="preserve"><tspan x="119.0" dy="0"><tspan font-weight="700">Ketones</tspan></tspan><tspan x="119.0" dy="17"><tspan font-weight="500">BHB ≥3.0</tspan></tspan><tspan x="119.0" dy="17"><tspan font-weight="500">mmol/L</tspan></tspan></text><rect x="202.0" y="40.0" width="86.0" height="90.0" rx="12" fill="#FFFFFF" stroke="#CFE0F2" stroke-width="1.2"/><rect x="212.0" y="40.0" width="66.0" height="4.0" rx="2" fill="#0B5CAD" stroke="none" stroke-width="1"/><text x="211.0" y="64.0" font-size="13" font-weight="500" fill="#0F2F2C" xml:space="preserve"><tspan x="211.0" dy="0"><tspan font-weight="700">Acidosis</tspan></tspan><tspan x="211.0" dy="17"><tspan font-weight="500">pH &lt;7.30</tspan></tspan><tspan x="211.0" dy="17"><tspan font-weight="500">or HCO₃</tspan></tspan><tspan x="211.0" dy="17"><tspan font-weight="500">&lt;18</tspan></tspan></text><clipPath id="s12p2"><rect x="2" y="156" width="300" height="276" rx="14"/></clipPath><rect x="2" y="156" width="300" height="276" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="156" width="5" height="276" fill="#0F766E" clip-path="url(#s12p2)"/><text x="18" y="180" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Sequence matters</tspan></text><circle cx="29.0" cy="207.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="212" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="50.0" y="212.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">IV fluids first</tspan></tspan></text><text x="50.0" y="230.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="500">Isotonic saline or balanced crystalloid,</tspan></tspan><tspan x="50.0" dy="16"><tspan font-weight="500">500–1,000 mL/h for the first 2–4 h.</tspan></tspan></text><line x1="29.0" y1="220.0" x2="29.0" y2="268.0" stroke="#7FBDB5" stroke-width="2" stroke-linecap="round"/><circle cx="29.0" cy="285.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="290" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="50.0" y="290.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Check potassium</tspan></tspan></text><text x="50.0" y="308.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="500">If K &lt;3.5, replace potassium and hold</tspan></tspan><tspan x="50.0" dy="16"><tspan font-weight="500">insulin.</tspan></tspan></text><line x1="29.0" y1="298.0" x2="29.0" y2="346.0" stroke="#7FBDB5" stroke-width="2" stroke-linecap="round"/><circle cx="29.0" cy="363.0" r="11" fill="#0F766E" stroke="none" stroke-width="1"/><text x="29" y="368" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="50.0" y="368.0" font-size="13" font-weight="800" fill="#0F2F2C" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="700">Then IV insulin</tspan></tspan></text><text x="50.0" y="386.0" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="50.0" dy="0"><tspan font-weight="500">0.1 units/kg/h once K &gt;3.5; add</tspan></tspan><tspan x="50.0" dy="16"><tspan font-weight="500">dextrose when glucose &lt;250 mg/dL.</tspan></tspan></text><clipPath id="s12p3"><rect x="2" y="440" width="300" height="86" rx="14"/></clipPath><rect x="2" y="440" width="300" height="86" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="440" width="5" height="86" fill="#B7410E" clip-path="url(#s12p3)"/><text x="18" y="464" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="489.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="500">On an SGLT2 inhibitor? Glucose can be</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">normal (euglycemic DKA).</tspan></tspan></text></svg>