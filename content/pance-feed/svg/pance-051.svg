<svg width="304" height="615" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 615" role="img" aria-label="Pediatric airway: croup shows subglottic narrowing, the steeple sign, and is treated with single-dose dexamethasone plus nebulized epinephrine for stridor at rest; bronchiolitis is treated supportively." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="p51"><defs><radialGradient id="p51lg" cx="0.38" cy="0.3" r="0.9"><stop offset="0" stop-color="#56707D"/><stop offset="1" stop-color="#3A505B"/></radialGradient></defs><clipPath id="p51p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#p51p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Neck X-ray (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><rect x="145.0" y="52.0" width="16.0" height="100.0" rx="3" fill="#0B1216" stroke="none" stroke-width="1"/><polyline points="139.0,152.0 139.0,102.0 150.0,76.0 150.0,52.0" fill="none" stroke="#E9EEF0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="167.0,152.0 167.0,102.0 156.0,76.0 156.0,52.0" fill="none" stroke="#E9EEF0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g class="lb" data-n="1"><line class="ld" x1="156.0" y1="80.0" x2="156.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="156.0" cy="80.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="228" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Subglottic narrowing (steeple sign)</tspan></tspan></text></g><g class="q" display="none"><circle cx="156.0" cy="197.0" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M152.8,194.4 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="156.1" cy="202.2" r="1.2" fill="#fff"/></g><circle class="hit" cx="156.0" cy="197.0" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="156.2" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bronchiolitis: &lt;2 y, RSV</tspan></tspan></text><rect x="18.0" y="249.0" width="203.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Croup: 6 mo–3 y, parainfluenza</tspan></tspan></text><clipPath id="p51p2"><rect x="2" y="293" width="300" height="170" rx="14"/></clipPath><rect x="2" y="293" width="300" height="170" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="170" fill="#0F766E" clip-path="url(#p51p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Two pediatric airways</tspan></text><rect x="18.0" y="331.0" width="90.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Bronchiolitis</tspan></tspan></text><text x="123.4" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">Supportive: </tspan><tspan font-weight="500">nasal suction,</tspan></tspan><tspan x="123.4" dy="17"><tspan font-weight="500">hydration, oxygen if low</tspan></tspan></text><rect x="18.0" y="373.0" width="51.3" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Croup</tspan></tspan></text><text x="123.4" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">Dexamethasone </tspan><tspan font-weight="500">single</tspan></tspan><tspan x="123.4" dy="17"><tspan font-weight="500">oral dose, all severities</tspan></tspan></text><rect x="18.0" y="415.0" width="97.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="430.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stridor at rest</tspan></tspan></text><text x="123.4" y="430.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="123.4" dy="0"><tspan font-weight="700">Nebulized epinephrine,</tspan></tspan><tspan x="123.4" dy="17"><tspan font-weight="500">observe ≥2 h</tspan></tspan></text><clipPath id="p51p3"><rect x="2" y="471" width="300" height="140" rx="14"/></clipPath><rect x="2" y="471" width="300" height="140" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="471" width="5" height="140" fill="#B7410E" clip-path="url(#p51p3)"/><text x="18" y="495" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="520.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">Bronchiolitis: </tspan><tspan font-weight="500">no routine albuterol,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">epinephrine, steroids, antibiotics or chest</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">X-ray; diagnosis is clinical. </tspan><tspan font-weight="700">Drooling,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="700">toxic look, no cough: </tspan><tspan font-weight="500">think epiglottitis</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">instead.</tspan></tspan></text></svg>