<svg width="304" height="585" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 585" role="img" aria-label="Osteomyelitis with a lytic bone focus. Plain X-ray first, MRI if unclear, bone biopsy and culture to guide about 6 weeks of antibiotics; early X-ray can be normal." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="m82"><defs></defs><clipPath id="m82p1"><rect x="2" y="2" width="300" height="283" rx="14"/></clipPath><rect x="2" y="2" width="300" height="283" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="283" fill="#0B5CAD" clip-path="url(#m82p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Bone (schematic)</tspan></text><rect x="18.0" y="40.0" width="270.0" height="124.0" rx="10" fill="#1E2B33" stroke="#0F171C" stroke-width="1"/><path d="M58.0,102.0 C89.7,102.0 216.3,102.0 248.0,102.0" fill="none" stroke="#A89A74" stroke-width="36.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M58.0,102.0 C89.7,102.0 216.3,102.0 248.0,102.0" fill="none" stroke="#E9E2CF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="188.0" cy="102.0" rx="14" ry="9" fill="#3A505B" stroke="#E0533F" stroke-width="2"/><g class="lb" data-n="1"><line class="ld" x1="188.0" y1="102.0" x2="139.0" y2="186.0" stroke="#0F2F2C" stroke-width="1.2" stroke-linecap="round"/><circle class="dt" cx="188.0" cy="102.0" r="3.2" fill="#0F2F2C" stroke="#fff" stroke-width="1.3"/><g class="t"><rect x="24.0" y="186.0" width="115" height="25" rx="8" fill="#fff" stroke="#BFD0CD" stroke-width="1"/><text x="31.0" y="205.0" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan x="31.0" dy="0"><tspan font-weight="700">Lytic bone focus</tspan></tspan></text></g><g class="q"><circle cx="133.5" cy="195.5" r="10" fill="#0F766E" stroke="#fff" stroke-width="1.5"/><path d="M130.3,192.9 a3.2,3.2 0 1 1 4.6,2.9 c-1.2,.7 -1.4,1.1 -1.4,2.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><circle cx="133.6" cy="200.7" r="1.2" fill="#fff"/></g><circle class="hit" cx="133.5" cy="195.5" r="22" fill="transparent"/></g><rect x="18.0" y="221.0" width="91.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="236.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Diabetic foot</tspan></tspan></text><rect x="18.0" y="249.0" width="173.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Hematogenous in children</tspan></tspan></text><rect x="197.8" y="249.0" width="70.9" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="204.8" y="264.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="204.8" dy="0"><tspan font-weight="700">S. aureus</tspan></tspan></text><clipPath id="m82p2"><rect x="2" y="293" width="300" height="158" rx="14"/></clipPath><rect x="2" y="293" width="300" height="158" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="293" width="5" height="158" fill="#0F766E" clip-path="url(#m82p2)"/><text x="18" y="317" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Image and culture</tspan></text><rect x="18.0" y="331.0" width="51.4" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="346.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Image</tspan></tspan></text><text x="89.7" y="346.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Plain X-ray </tspan><tspan font-weight="500">first; </tspan><tspan font-weight="700">MRI </tspan><tspan font-weight="500">most</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">sensitive</tspan></tspan></text><rect x="18.0" y="373.0" width="63.7" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="388.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Confirm</tspan></tspan></text><text x="89.7" y="388.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Bone biopsy </tspan><tspan font-weight="500">and culture</tspan></tspan></text><rect x="18.0" y="403.0" width="45.8" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="418.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Treat</tspan></tspan></text><text x="89.7" y="418.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.7" dy="0"><tspan font-weight="700">Antibiotics ~6 weeks</tspan><tspan font-weight="500">; debride</tspan></tspan><tspan x="89.7" dy="17"><tspan font-weight="500">dead bone</tspan></tspan></text><clipPath id="m82p3"><rect x="2" y="459" width="300" height="122" rx="14"/></clipPath><rect x="2" y="459" width="300" height="122" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="459" width="5" height="122" fill="#B7410E" clip-path="url(#m82p3)"/><text x="18" y="483" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="508.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">X-ray changes lag 10–14 days, </tspan><tspan font-weight="500">so a</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">normal film does not exclude</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">osteomyelitis. Positive probe-to-bone</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">plus high ESR makes the diagnosis likely.</tspan></tspan></text></svg>