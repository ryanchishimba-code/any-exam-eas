<svg width="304" height="416" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 416" role="img" aria-label="Transfusion reaction with fever, flank pain and dark urine: stop the transfusion, recheck labels, send direct antiglobulin test; TRALI and TACO cause pulmonary edema." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="h176"><defs></defs><clipPath id="h176p1"><rect x="2" y="2" width="300" height="102" rx="14"/></clipPath><rect x="2" y="2" width="300" height="102" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="102" fill="#0B5CAD" clip-path="url(#h176p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Recognize</tspan></text><rect x="18.0" y="40.0" width="115.1" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stop transfusion</tspan></tspan></text><rect x="139.1" y="40.0" width="148.8" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="146.1" y="55.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="146.1" dy="0"><tspan font-weight="700">Red urine = hemolysis</tspan></tspan></text><rect x="18.0" y="68.0" width="80.7" height="22" rx="11" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><text x="25.0" y="83.5" font-size="12" font-weight="700" fill="#0B5CAD" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">TRALI ≤6 h</tspan></tspan></text><clipPath id="h176p2"><rect x="2" y="112" width="300" height="188" rx="14"/></clipPath><rect x="2" y="112" width="300" height="188" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="112" width="5" height="188" fill="#0F766E" clip-path="url(#h176p2)"/><text x="18" y="136" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541">  Act</tspan></text><rect x="18.0" y="150.0" width="42.1" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="165.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Stop</tspan></tspan></text><text x="89.2" y="165.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.2" dy="0"><tspan font-weight="700">Transfusion, </tspan><tspan font-weight="500">keep IV open</tspan></tspan></text><rect x="18.0" y="180.0" width="53.0" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="195.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Check</tspan></tspan></text><text x="89.2" y="195.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.2" dy="0"><tspan font-weight="700">Labels, DAT, </tspan><tspan font-weight="500">blood bank</tspan></tspan><tspan x="89.2" dy="17"><tspan font-weight="500">work-up</tspan></tspan></text><rect x="18.0" y="222.0" width="63.2" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="237.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Support</tspan></tspan></text><text x="89.2" y="237.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.2" dy="0"><tspan font-weight="700">Fluids, BP, </tspan><tspan font-weight="500">urine output</tspan></tspan></text><rect x="18.0" y="252.0" width="44.5" height="22" rx="11" fill="#FFF4DD" stroke="#F1DDB0" stroke-width="1"/><text x="25.0" y="267.5" font-size="12" font-weight="700" fill="#92400E" xml:space="preserve"><tspan x="25.0" dy="0"><tspan font-weight="700">Lung</tspan></tspan></text><text x="89.2" y="267.5" font-size="12.5" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="89.2" dy="0"><tspan font-weight="700">TACO: </tspan><tspan font-weight="500">↑BNP, diurese. </tspan><tspan font-weight="700">TRALI:</tspan></tspan><tspan x="89.2" dy="17"><tspan font-weight="500">normal BNP, support</tspan></tspan></text><clipPath id="h176p3"><rect x="2" y="308" width="300" height="104" rx="14"/></clipPath><rect x="2" y="308" width="300" height="104" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="104" fill="#B7410E" clip-path="url(#h176p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan></text><text x="18.0" y="357.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0"><tspan font-weight="700">TACO </tspan><tspan font-weight="500">is volume overload (BNP high,</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">diuretics help); </tspan><tspan font-weight="700">TRALI </tspan><tspan font-weight="500">is permeability</tspan></tspan><tspan x="18.0" dy="18"><tspan font-weight="500">edema.</tspan></tspan></text></svg>