<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>The nurse assess</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse assess</text><rect x="20" y="52" width="250" height="164" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Second-trimester</tspan><tspan x="32.0" dy="22">visits check fundal</tspan><tspan x="32.0" dy="22">height, fetal heart</tspan><tspan x="32.0" dy="22">tones, BP, urine and</tspan><tspan x="32.0" dy="22">glucose screening at</tspan><tspan x="32.0" dy="22">24 to 28 weeks.</tspan></text><rect x="20" y="228" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Teach warning signs:</tspan><tspan x="32.0" dy="22">bleeding, severe</tspan><tspan x="32.0" dy="22">headache, fluid leakage,</tspan><tspan x="32.0" dy="22">or decreased movement.</tspan></text><rect x="20" y="360" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Skipping glucose screening</tspan><tspan x="32.0" dy="22">at 24 to 28 weeks.</tspan></text></svg>
