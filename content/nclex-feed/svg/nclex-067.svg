<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 466" width="420" height="466" role="img" data-layout="anatomy"><title>Maternity schematic</title><rect width="420" height="466" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Maternity schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="162.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Second-trimester visits</tspan><tspan x="188.0" dy="22">check fundal height,</tspan><tspan x="188.0" dy="22">fetal heart tones, BP,</tspan><tspan x="188.0" dy="22">urine and glucose</tspan><tspan x="188.0" dy="22">screening at 24 to 28</tspan><tspan x="188.0" dy="22">weeks.</tspan></text><rect x="176.0" y="220.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="244.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Teach warning signs:</tspan><tspan x="188.0" dy="22">bleeding, severe</tspan><tspan x="188.0" dy="22">headache, fluid leakage,</tspan><tspan x="188.0" dy="22">or decreased movement.</tspan></text><rect x="176.0" y="348.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="372.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Skipping glucose</tspan><tspan x="188.0" dy="22">screening at 24 to 28</tspan><tspan x="188.0" dy="22">weeks.</tspan></text></svg>
