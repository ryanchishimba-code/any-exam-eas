<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 182" width="420" height="182" role="img" aria-labelledby="tnclex007"><title id="tnclex007">Respect the refusal; educate, document and notify the provider.</title><rect width="420" height="182" fill="#ffffff"/><rect x="0" y="0" width="8" height="182" fill="#0d7f8c"/><text x="28" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Respect the refusal; educate,</text><text x="28" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">document and notify the</text><text x="28" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">provider.</text><text x="28" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Capacity means the client</text><text x="28" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">understands, appreciates, reasons</text></svg>
