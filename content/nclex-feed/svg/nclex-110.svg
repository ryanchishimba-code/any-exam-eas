<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 272" width="420" height="272" role="img" data-layout="anatomy"><title>Mobility schematic</title><rect width="420" height="272" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Mobility schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Unilateral weakness</tspan><tspan x="188.0" dy="22">after injury or stroke.</tspan></text><rect x="176.0" y="132.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Advance the cane with</tspan><tspan x="188.0" dy="22">the weak leg; on stairs,</tspan><tspan x="188.0" dy="22">the strong leg leads up</tspan><tspan x="188.0" dy="22">and the cane leads down.</tspan></text></svg>
