<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>May know</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">May know</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. A friend, coworker</tspan><tspan x="32.0" dy="22">or relative asks</tspan><tspan x="32.0" dy="22">about a client's</tspan><tspan x="32.0" dy="22">condition.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Share for treatment</tspan><tspan x="32.0" dy="22">with the care team; limit</tspan><tspan x="32.0" dy="22">other uses to the minimum</tspan><tspan x="32.0" dy="22">necessary.</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Discussing clients in</tspan><tspan x="32.0" dy="22">public areas, on social</tspan><tspan x="32.0" dy="22">media, or with uninvolved</tspan><tspan x="32.0" dy="22">staff.</tspan></text></svg>
