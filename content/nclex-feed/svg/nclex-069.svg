<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 444" width="420" height="444" role="img" data-layout="anatomy"><title>Maternity schematic</title><rect width="420" height="444" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Maternity schematic</text><path d="M70 78 C70 58 96 50 110 68 C124 50 150 58 150 78 C150 108 110 140 110 140 C110 140 70 108 70 78 Z" fill="#f8e8e6" stroke="#9a3412" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Presumptive: amenorrhea,</tspan><tspan x="188.0" dy="22">nausea. Probable:</tspan><tspan x="188.0" dy="22">positive test, Hegar</tspan><tspan x="188.0" dy="22">sign.</tspan></text><rect x="176.0" y="176.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="200.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Classify each sign as</tspan><tspan x="188.0" dy="22">presumptive, probable or</tspan><tspan x="188.0" dy="22">positive to answer</tspan><tspan x="188.0" dy="22">certainty questions.</tspan></text><rect x="176.0" y="304.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Calling a positive</tspan><tspan x="188.0" dy="22">pregnancy test a</tspan><tspan x="188.0" dy="22">positive sign rather</tspan><tspan x="188.0" dy="22">than probable.</tspan></text></svg>
