<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img" data-layout="contrast"><title>Signs of pregnancy are positive</title><rect width="420" height="302" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Signs of pregnancy are positive</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Presumptive:</tspan><tspan x="28.0" dy="22">amenorrhea,</tspan><tspan x="28.0" dy="22">nausea.</tspan><tspan x="28.0" dy="22">Probable:</tspan><tspan x="28.0" dy="22">positive test,</tspan><tspan x="28.0" dy="22">Hegar sign.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Classify each</tspan><tspan x="228.0" dy="22">sign as</tspan><tspan x="228.0" dy="22">presumptive,</tspan><tspan x="228.0" dy="22">probable or</tspan><tspan x="228.0" dy="22">positive to</tspan><tspan x="228.0" dy="22">answer certainty</tspan><tspan x="228.0" dy="22">questions.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Calling a positive pregnancy test a</tspan><tspan x="20.0" dy="22">positive sign rather than probable.</tspan></text></svg>
