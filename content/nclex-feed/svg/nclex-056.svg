">lead shield</tspan></text><clipPath id="n056p2"><rect x="2" y="174" width="300" height="82" rx="14"/></clipPath><rect x="2" y="174" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="174" width="5" height="82" fill="#0F766E" clip-path="url(#n056p2)"/><text x="18" y="198" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="222.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Limit time, increase distance, and use</tspan><tspan x="18.0" dy="18">shielding.</tspan></text><clipPath id="n056p3"><rect x="2" y="264" width="300" height="82" rx="14"/></clipPath><rect x="2" y="264" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="264" width="5" height="82" fill="#B7410E" clip-path="url(#n056p3)"/><text x="18" y="288" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="312.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Picking up a dislodged implant by hand</tspan><tspan x="18.0" dy="18">instead of using long forceps.</tspan></text></svg>