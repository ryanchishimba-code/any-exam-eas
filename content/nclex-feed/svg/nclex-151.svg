<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 238" width="420" height="238" role="img" data-layout="contrast"><title>Labs two paths</title><rect width="420" height="238" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Labs two paths</text><rect x="16" y="48" width="188" height="150" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="150" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">PH below 7.35 is</tspan><tspan x="28.0" dy="22">acidosis; above</tspan><tspan x="28.0" dy="22">7.45 is</tspan><tspan x="28.0" dy="22">alkalosis.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Check pH first,</tspan><tspan x="228.0" dy="22">then PaCO2 for</tspan><tspan x="228.0" dy="22">respiratory,</tspan><tspan x="228.0" dy="22">then HCO3 for</tspan><tspan x="228.0" dy="22">metabolic.</tspan></text><text x="20.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Reading PaCO2 or HCO3 before the pH.</tspan></text></svg>
