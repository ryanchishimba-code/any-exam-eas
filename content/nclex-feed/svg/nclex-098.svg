<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Culture ordered steps</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Culture ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. The client</tspan><tspan x="32.0" dy="22">declines a food or</tspan><tspan x="32.0" dy="22">treatment for</tspan><tspan x="32.0" dy="22">religious reasons.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Respect practices,</tspan><tspan x="32.0" dy="22">involve the chaplain or</tspan><tspan x="32.0" dy="22">interpreter, and adjust</tspan><tspan x="32.0" dy="22">the care plan.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Stereotyping the client</tspan><tspan x="32.0" dy="22">based on background.</tspan></text></svg>
