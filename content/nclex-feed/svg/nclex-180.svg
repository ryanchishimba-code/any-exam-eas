<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170" role="img" aria-labelledby="tnclex180"><title id="tnclex180">Note the last known well time and call a stroke alert.</title><rect width="420" height="170" fill="#ffffff"/><text x="20" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Note the last known well time and</text><circle cx="36" cy="68" r="14" fill="#0d7f8c"/><text x="36" y="73" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Get a CT quickly</text><line x1="36" y1="84" x2="36" y2="92" stroke="#0d7f8c" stroke-width="2"/><circle cx="36" cy="106" r="14" fill="#0d7f8c"/><text x="36" y="111" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="60" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">thrombolysis may be given within</text><text x="60" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">4.5 hours if eligible</text></svg>
