<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>Staffing two paths</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Staffing two paths</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">The float nurse</tspan><tspan x="28.0" dy="22">is unfamiliar</tspan><tspan x="28.0" dy="22">with the</tspan><tspan x="28.0" dy="22">specialty unit.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Assign stable</tspan><tspan x="228.0" dy="22">clients that</tspan><tspan x="228.0" dy="22">match skills;</tspan><tspan x="228.0" dy="22">pair for</tspan><tspan x="228.0" dy="22">specialty tasks</tspan><tspan x="228.0" dy="22">or devices.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Assigning the most complex or unstable</tspan><tspan x="20.0" dy="22">client to the float nurse.</tspan></text></svg>
