<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Immunizations ordered steps</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Immunizations ordered steps</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. A mild cold or low</tspan><tspan x="32.0" dy="22">fever does not delay</tspan><tspan x="32.0" dy="22">vaccination.</tspan></text><rect x="20" y="162" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Follow the CDC</tspan><tspan x="32.0" dy="22">schedule your facility</tspan><tspan x="32.0" dy="22">uses; AAP publishes its</tspan><tspan x="32.0" dy="22">own schedule; screen</tspan><tspan x="32.0" dy="22">first.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Delaying vaccines for a</tspan><tspan x="32.0" dy="22">mild illness such as a cold</tspan><tspan x="32.0" dy="22">or low fever.</tspan></text></svg>
