<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 218" width="420" height="218" role="img" aria-labelledby="tnclex132"><title id="tnclex132">Stimulate the client and support breathing; give naloxone as ordered.</title><rect width="420" height="218" fill="#ffffff"/><rect x="16" y="16" width="388" height="114" rx="12" fill="#0f2e42"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Stimulate the client and support</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">breathing; give naloxone as</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">ordered.</text><text x="28" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Sedation usually comes before</text><text x="28" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">respiratory depression.</text></svg>
