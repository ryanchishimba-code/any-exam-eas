<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 176" width="420" height="176" role="img" aria-labelledby="tnclex079"><title id="tnclex079">Ask, advise, and offer counseling plus medication.</title><rect width="420" height="176" fill="#ffffff"/><rect x="16" y="16" width="388" height="144" rx="14" fill="#f4f7f8"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Ask, advise, and offer</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">counseling plus medication.</text><text x="32" y="108" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Any adult who uses tobacco, at any</text><text x="32" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">visit.</text></svg>
