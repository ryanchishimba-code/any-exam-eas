<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>This mean</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">This mean</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. A silent chest,</tspan><tspan x="32.0" dy="22">inability to speak in</tspan><tspan x="32.0" dy="22">full sentences, or</tspan><tspan x="32.0" dy="22">new confusion.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Give a SABA, oxygen</tspan><tspan x="32.0" dy="22">and systemic</tspan><tspan x="32.0" dy="22">corticosteroids as</tspan><tspan x="32.0" dy="22">ordered, and call for</tspan><tspan x="32.0" dy="22">help.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Assuming that less</tspan><tspan x="32.0" dy="22">wheezing means the client is</tspan><tspan x="32.0" dy="22">improving.</tspan></text></svg>
