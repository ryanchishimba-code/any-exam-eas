<svg width="304" height="322" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 322" role="img" aria-label="Joint range-of-motion and side-lying positioning diagram." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n111"><defs></defs><clipPath id="n111p1"><rect x="2" y="2" width="300" height="154" rx="14"/></clipPath><rect x="2" y="2" width="300" height="154" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="154" fill="#0B5CAD" clip-path="url(#n111p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Range of motion</tspan></text><rect x="18.0" y="40.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="83.0" y="66.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Support joints</tspan></text><rect x="156.0" y="40.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="66.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Move slowly</tspan></text><rect x="18.0" y="94.0" width="130.0" height="46.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="83.0" y="113.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Stop at resistance</tspan></text><text x="83.0" y="128.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Stop for pain</tspan></text><rect x="156.0" y="94.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="113.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Pillows</tspan></text><text x="221.0" y="128.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">alignment</tspan></text><clipPath id="n111p2"><rect x="2" y="164" width="300" height="82" rx="14"/></clipPath><rect x="2" y="164" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="164" width="5" height="82" fill="#0F766E" clip-path="url(#n111p2)"/><text x="18" y="188" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="212.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Active or passive range of motion and</tspan><tspan x="18.0" dy="18">repositioning at least every 2 hours.</tspan></text><clipPath id="n111p3"><rect x="2" y="254" width="300" height="64" rx="14"/></clipPath><rect x="2" y="254" width="300" height="64" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="254" width="5" height="64" fill="#B7410E" clip-path="url(#n111p3)"/><text x="18" y="278" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="302.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Forcing a joint past resistance or pain.</tspan></text></svg>