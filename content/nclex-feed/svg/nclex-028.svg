<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 294" width="420" height="294" role="img" data-layout="cycle"><title>Legal and ethical repeat cycle</title><rect width="420" height="294" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Legal and ethical repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Admission to a hospital or facility that</tspan><tspan x="24.0" dy="22">receives Medicare or Medicaid funds.</tspan></text><text x="24.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Ask whether the client has a directive,</tspan><tspan x="24.0" dy="22">give written information, and document.</tspan></text><text x="24.0" y="232.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Thinking the law requires every client to</tspan><tspan x="24.0" dy="22">complete an advance directive.</tspan></text></svg>
