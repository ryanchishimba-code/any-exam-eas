<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 156" width="420" height="156" role="img" aria-labelledby="tnclex028"><title id="tnclex028">Ask about advance directives and give information at admission.</title><rect width="420" height="156" fill="#ffffff"/><rect x="0" y="0" width="8" height="156" fill="#0d7f8c"/><text x="28" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Ask about advance directives and</text><text x="28" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">give information at admission.</text><text x="28" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Admission to a hospital or facility</text><text x="28" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">that receives Medicare or Medicaid</text></svg>
