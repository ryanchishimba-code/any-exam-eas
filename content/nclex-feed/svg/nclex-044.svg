<svg width="304" height="342" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 342" role="img" aria-label="Sterile field rules diagram." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n044"><defs></defs><clipPath id="n044p1"><rect x="2" y="2" width="300" height="174" rx="14"/></clipPath><rect x="2" y="2" width="300" height="174" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="174" fill="#0B5CAD" clip-path="url(#n044p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Sterile field</tspan></text><rect x="38.0" y="40.0" width="228.0" height="96.0" rx="8" fill="#FFFFFF" stroke="#9FB6B2" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="56.0" y="58.0" width="192.0" height="60.0" rx="6" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="152.0" y="84.0" font-size="13" font-weight="700" fill="#0B5CAD" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">Sterile area</tspan></text><text x="152.0" y="102.0" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">keep in view, above waist</tspan></text><text x="152.0" y="152.0" font-size="12" font-weight="700" fill="#B7410E" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">1-inch border = not sterile (dashed edge)</tspan></text><clipPath id="n044p2"><rect x="2" y="184" width="300" height="82" rx="14"/></clipPath><rect x="2" y="184" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="184" width="5" height="82" fill="#0F766E" clip-path="url(#n044p2)"/><text x="18" y="208" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="232.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Anything nonsterile touching it, or turning</tspan><tspan x="18.0" dy="18">your back.</tspan></text><clipPath id="n044p3"><rect x="2" y="274" width="300" height="64" rx="14"/></clipPath><rect x="2" y="274" width="300" height="64" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="274" width="5" height="64" fill="#B7410E" clip-path="url(#n044p3)"/><text x="18" y="298" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="322.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Reaching across the sterile field.</tspan></text></svg>