<svg width="304" height="364" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 364" role="img" aria-label="Scope pyramid: law, then board rules, then facility policy." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n020"><defs></defs><clipPath id="n020p1"><rect x="2" y="2" width="300" height="178" rx="14"/></clipPath><rect x="2" y="2" width="300" height="178" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="178" fill="#0B5CAD" clip-path="url(#n020p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Scope narrows downward</tspan></text><rect x="92.0" y="40.0" width="120.0" height="32.0" rx="8" fill="#0F766E" stroke="none" stroke-width="1.2"/><text x="152.0" y="59.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">Facility policy</tspan></text><rect x="55.0" y="76.0" width="194.0" height="32.0" rx="8" fill="#0b5e57" stroke="none" stroke-width="1.2"/><text x="152.0" y="95.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">Board of nursing rules</tspan></text><rect x="18.0" y="112.0" width="268.0" height="32.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="152.0" y="131.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">State nurse practice act (law)</tspan></text><text x="18.0" y="164.0" font-size="12" font-weight="700" fill="#B7410E" xml:space="preserve"><tspan x="18.0" dy="0">Policy can limit scope, never expand it.</tspan></text><clipPath id="n020p2"><rect x="2" y="188" width="300" height="82" rx="14"/></clipPath><rect x="2" y="188" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="188" width="5" height="82" fill="#0F766E" clip-path="url(#n020p2)"/><text x="18" y="212" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="236.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">The state nurse practice act defines scope</tspan><tspan x="18.0" dy="18">of practice.</tspan></text><clipPath id="n020p3"><rect x="2" y="278" width="300" height="82" rx="14"/></clipPath><rect x="2" y="278" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="278" width="5" height="82" fill="#B7410E" clip-path="url(#n020p3)"/><text x="18" y="302" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="326.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Thinking facility policy can expand practice</tspan><tspan x="18.0" dy="18">beyond what state law allows.</tspan></text></svg>