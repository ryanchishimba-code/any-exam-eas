<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>The nurse teach</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse teach</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Good latch, enough</tspan><tspan x="32.0" dy="22">wet diapers and</tspan><tspan x="32.0" dy="22">weight gain show</tspan><tspan x="32.0" dy="22">adequate intake.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Exclusive</tspan><tspan x="32.0" dy="22">breastfeeding for about 6</tspan><tspan x="32.0" dy="22">months, then continue</tspan><tspan x="32.0" dy="22">with solid foods.</tspan></text><rect x="20" y="316" width="330" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Routinely supplementing</tspan><tspan x="32.0" dy="22">with formula in the first</tspan><tspan x="32.0" dy="22">days without a medical</tspan><tspan x="32.0" dy="22">reason.</tspan></text></svg>
