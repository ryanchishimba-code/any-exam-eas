<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 236" width="420" height="236" role="img"><title>Decision path</title><rect width="420" height="236" fill="#ffffff"/><rect x="0" y="0" width="420" height="36" fill="#0f2e42"/><text x="20" y="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Decision path</text><rect x="48" y="52" width="340" height="72" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><circle cx="28" cy="88.0" r="12" fill="#0d7f8c"/><text x="28" y="93.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="64" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Injuries that do not match the</text><text x="64" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">history or the child's</text><line x1="210" y1="124" x2="210" y2="138" stroke="#0d7f8c" stroke-width="2"/><rect x="48" y="140" width="340" height="72" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><circle cx="28" cy="176.0" r="12" fill="#0d7f8c"/><text x="28" y="181.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="64" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Waiting for proof or</text><text x="64" y="186" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">confronting the caregiver</text></svg>
