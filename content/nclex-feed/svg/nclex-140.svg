<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 392" width="420" height="392" role="img" data-layout="ladder"><title>The concern</title><rect width="420" height="392" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The concern</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Agitation, fever,</tspan><tspan x="32.0" dy="22">sweating, tremor,</tspan><tspan x="32.0" dy="22">clonus and diarrhea.</tspan></text><rect x="20" y="162" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Review drug</tspan><tspan x="32.0" dy="22">interactions; teach early</tspan><tspan x="32.0" dy="22">warning signs.</tspan></text><rect x="20" y="272" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Combining SSRIs with other</tspan><tspan x="32.0" dy="22">serotonergic drugs without</tspan><tspan x="32.0" dy="22">monitoring.</tspan></text></svg>
