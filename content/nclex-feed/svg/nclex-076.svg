<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 258" width="420" height="258" role="img" data-layout="contrast"><title>The nurse say</title><rect width="420" height="258" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse say</text><rect x="16" y="48" width="188" height="150" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="150" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Sudden confusion</tspan><tspan x="28.0" dy="22">is never a</tspan><tspan x="28.0" dy="22">normal part of</tspan><tspan x="28.0" dy="22">aging.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Teach safety for</tspan><tspan x="228.0" dy="22">normal changes,</tspan><tspan x="228.0" dy="22">and report acute</tspan><tspan x="228.0" dy="22">changes right</tspan><tspan x="228.0" dy="22">away.</tspan></text><text x="20.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Labeling new confusion or delirium as</tspan><tspan x="20.0" dy="22">normal aging.</tspan></text></svg>
