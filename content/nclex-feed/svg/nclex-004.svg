<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" data-layout="branch"><title>Delegation decision flow</title><rect width="420" height="420" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Delegation decision flow</text><rect x="48.0" y="48.0" width="352.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Reinforcing teaching, giving</tspan><tspan x="60.0" dy="22">many routine medications, and</tspan><tspan x="60.0" dy="22">collecting data on stable</tspan><tspan x="60.0" dy="22">clients.</tspan></text><circle cx="26" cy="107.0" r="12" fill="#0d7f8c"/><text x="26.0" y="112.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="166.0" x2="210" y2="182.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="184.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="208.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">The RN keeps initial assessment,</tspan><tspan x="60.0" dy="22">care planning, unstable clients</tspan><tspan x="60.0" dy="22">and initial teaching.</tspan></text><circle cx="26" cy="232.0" r="12" fill="#0d7f8c"/><text x="26.0" y="237.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="280.0" x2="210" y2="296.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="298.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="322.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Assigning initial teaching to</tspan><tspan x="60.0" dy="22">the LPN/PN instead of</tspan><tspan x="60.0" dy="22">reinforcement of RN teaching.</tspan></text><circle cx="26" cy="346.0" r="12" fill="#0d7f8c"/><text x="26.0" y="351.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text></svg>
