<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>The RN is making assignments</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The RN is making assignments</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Reinforcing</tspan><tspan x="32.0" dy="22">teaching, giving many</tspan><tspan x="32.0" dy="22">routine medications,</tspan><tspan x="32.0" dy="22">and collecting data</tspan><tspan x="32.0" dy="22">on stable clients.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. The RN keeps initial</tspan><tspan x="32.0" dy="22">assessment, care</tspan><tspan x="32.0" dy="22">planning, unstable</tspan><tspan x="32.0" dy="22">clients and initial</tspan><tspan x="32.0" dy="22">teaching.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Assigning initial teaching</tspan><tspan x="32.0" dy="22">to the LPN/PN instead of</tspan><tspan x="32.0" dy="22">reinforcement of RN teaching.</tspan></text></svg>
