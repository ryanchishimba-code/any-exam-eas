<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" data-layout="contrast"><title>Safety two paths</title><rect width="420" height="280" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Safety two paths</text><rect x="16" y="48" width="188" height="172" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="172" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0d7f8c" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Spina bifida,</tspan><tspan x="28.0" dy="22">many prior</tspan><tspan x="28.0" dy="22">surgeries, or</tspan><tspan x="28.0" dy="22">banana, avocado,</tspan><tspan x="28.0" dy="22">kiwi or chestnut</tspan><tspan x="28.0" dy="22">allergy.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Use a latex-free</tspan><tspan x="228.0" dy="22">room and</tspan><tspan x="228.0" dy="22">supplies, and</tspan><tspan x="228.0" dy="22">flag the chart</tspan><tspan x="228.0" dy="22">and band.</tspan></text><text x="20.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Assuming non-latex gloves alone make the</tspan><tspan x="20.0" dy="22">room safe.</tspan></text></svg>
