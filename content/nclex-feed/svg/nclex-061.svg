<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 392" width="420" height="392" role="img" data-layout="ladder"><title>Risk is this</title><rect width="420" height="392" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Risk is this</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Spina bifida, many</tspan><tspan x="32.0" dy="22">prior surgeries, or</tspan><tspan x="32.0" dy="22">banana, avocado, kiwi</tspan><tspan x="32.0" dy="22">or chestnut allergy.</tspan></text><rect x="20" y="184" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Use a latex-free room</tspan><tspan x="32.0" dy="22">and supplies, and flag</tspan><tspan x="32.0" dy="22">the chart and band.</tspan></text><rect x="20" y="294" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Assuming non-latex gloves</tspan><tspan x="32.0" dy="22">alone make the room safe.</tspan></text></svg>
