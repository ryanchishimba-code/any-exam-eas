<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 348" width="420" height="348" role="img" data-layout="ladder"><title>The nurse prepares a scheduled</title><rect width="420" height="348" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse prepares a scheduled</text><rect x="20" y="52" width="250" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Any medication</tspan><tspan x="32.0" dy="22">administration step.</tspan></text><rect x="20" y="140" width="290" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="162.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Use two identifiers</tspan><tspan x="32.0" dy="22">and check the order</tspan><tspan x="32.0" dy="22">against the MAR.</tspan></text><rect x="20" y="250" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Skipping the check because</tspan><tspan x="32.0" dy="22">the client is familiar.</tspan></text></svg>
