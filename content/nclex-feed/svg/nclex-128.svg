<svg width="304" height="354" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 354" role="img" aria-label="IV site pictures comparing infiltration, phlebitis and extravasation." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n128"><defs></defs><clipPath id="n128p1"><rect x="2" y="2" width="300" height="186" rx="14"/></clipPath><rect x="2" y="2" width="300" height="186" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="186" fill="#0B5CAD" clip-path="url(#n128p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  IV site</tspan></text><rect x="18.0" y="40.0" width="130.0" height="62.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="67.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Infiltration</tspan></text><text x="83.0" y="82.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">cool, pale, swollen</tspan></text><rect x="156.0" y="40.0" width="130.0" height="62.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="221.0" y="59.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Phlebitis</tspan></text><text x="221.0" y="74.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">red, warm, tender</tspan></text><text x="221.0" y="89.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">along vein</tspan></text><rect x="18.0" y="110.0" width="130.0" height="62.0" rx="8" fill="#B7410E" stroke="none" stroke-width="1.2"/><text x="83.0" y="129.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Extravasation</tspan></text><text x="83.0" y="144.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">vesicant leak: follow</tspan></text><text x="83.0" y="159.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">protocol</tspan></text><rect x="156.0" y="110.0" width="130.0" height="62.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="129.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Stop infusion</tspan></text><text x="221.0" y="144.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">remove catheter,</tspan></text><text x="221.0" y="159.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">elevate, document</tspan></text><clipPath id="n128p2"><rect x="2" y="196" width="300" height="82" rx="14"/></clipPath><rect x="2" y="196" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="196" width="5" height="82" fill="#0F766E" clip-path="url(#n128p2)"/><text x="18" y="220" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="244.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Cool and pale is infiltration; red, warm and</tspan><tspan x="18.0" dy="18">tender is phlebitis.</tspan></text><clipPath id="n128p3"><rect x="2" y="286" width="300" height="64" rx="14"/></clipPath><rect x="2" y="286" width="300" height="64" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="286" width="5" height="64" fill="#B7410E" clip-path="url(#n128p3)"/><text x="18" y="310" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="334.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Flushing a catheter that is infiltrated.</tspan></text></svg>