.0" font-size="11" font-weight="600" fill="#0F2F2C" xml:space="preserve"><tspan x="238.0" dy="0">left mid-</tspan></text><text x="238.0" y="122.0" font-size="11" font-weight="600" fill="#0F2F2C" xml:space="preserve"><tspan x="238.0" dy="0">Clavicular</tspan></text><text x="238.0" y="137.0" font-size="11" font-weight="600" fill="#0F2F2C" xml:space="preserve"><tspan x="238.0" dy="0">Line</tspan></text><text x="152.0" y="200.0" font-size="12" font-weight="700" fill="#0B5CAD" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">Count a full 60 seconds</tspan></text><clipPath id="n124p2"><rect x="2" y="234" width="300" height="82" rx="14"/></clipPath><rect x="2" y="234" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="234" width="5" height="82" fill="#0F766E" clip-path="url(#n124p2)"/><text x="18" y="258" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="282.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Hold digoxin and notify the provider; check</tspan><tspan x="18.0" dy="18">potassium and digoxin level.</tspan></text><clipPath id="n124p3"><rect x="2" y="324" width="300" height="82" rx="14"/></clipPath><rect x="2" y="324" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="324" width="5" height="82" fill="#B7410E" clip-path="url(#n124p3)"/><text x="18" y="348" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="372.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Ignoring low potassium, which raises the</tspan><tspan x="18.0" dy="18">risk of toxicity.</tspan></text></svg>