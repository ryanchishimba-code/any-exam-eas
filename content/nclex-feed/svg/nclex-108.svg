<svg width="304" height="412" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 412" role="img" aria-label="Bladder diagrams comparing stress, urge and overflow incontinence." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n108"><defs></defs><clipPath id="n108p1"><rect x="2" y="2" width="300" height="208" rx="14"/></clipPath><rect x="2" y="2" width="300" height="208" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="208" fill="#0B5CAD" clip-path="url(#n108p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Incontinence types</tspan></text><rect x="18.0" y="40.0" width="130.0" height="46.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="59.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Stress</tspan></text><text x="83.0" y="74.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">leak with sneeze or lift</tspan></text><rect x="156.0" y="40.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="66.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Kegels</tspan></text><rect x="18.0" y="94.0" width="130.0" height="46.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="113.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Urge</tspan></text><text x="83.0" y="128.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">sudden strong need</tspan></text><rect x="156.0" y="94.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="120.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Timed voiding</tspan></text><rect x="18.0" y="148.0" width="130.0" height="46.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="167.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Overflow</tspan></text><text x="83.0" y="182.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">retention, dribbling</tspan></text><rect x="156.0" y="148.0" width="130.0" height="46.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="174.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Bladder scan</tspan></text><clipPath id="n108p2"><rect x="2" y="218" width="300" height="82" rx="14"/></clipPath><rect x="2" y="218" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="218" width="5" height="82" fill="#0F766E" clip-path="url(#n108p2)"/><text x="18" y="242" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="266.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Stress leaks with coughing; urge has</tspan><tspan x="18.0" dy="18">sudden need; overflow constantly dribbles.</tspan></text><clipPath id="n108p3"><rect x="2" y="308" width="300" height="100" rx="14"/></clipPath><rect x="2" y="308" width="300" height="100" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="308" width="5" height="100" fill="#B7410E" clip-path="url(#n108p3)"/><text x="18" y="332" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="356.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Treating overflow incontinence as urge</tspan><tspan x="18.0" dy="18">incontinence without checking for</tspan><tspan x="18.0" dy="18">retention.</tspan></text></svg>