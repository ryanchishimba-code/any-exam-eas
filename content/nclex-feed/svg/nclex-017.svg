<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img" data-layout="contrast"><title>Needed for restraints</title><rect width="420" height="302" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Needed for restraints</text><rect x="16" y="48" width="188" height="194" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="194" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Restraints are</tspan><tspan x="28.0" dy="22">used only after</tspan><tspan x="28.0" dy="22">less restrictive</tspan><tspan x="28.0" dy="22">measures have</tspan><tspan x="28.0" dy="22">failed.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Get an order;</tspan><tspan x="228.0" dy="22">check</tspan><tspan x="228.0" dy="22">circulation and</tspan><tspan x="228.0" dy="22">skin; release,</tspan><tspan x="228.0" dy="22">give fluids and</tspan><tspan x="228.0" dy="22">toileting per</tspan><tspan x="228.0" dy="22">policy.</tspan></text><text x="20.0" y="250.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Using PRN or standing restraint orders,</tspan><tspan x="20.0" dy="22">which are not allowed.</tspan></text></svg>
