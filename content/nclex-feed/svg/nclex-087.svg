<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Mental health ordered steps</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Mental health ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Command</tspan><tspan x="32.0" dy="22">hallucinations</tspan><tspan x="32.0" dy="22">directing the client</tspan><tspan x="32.0" dy="22">to cause harm.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Ask what the voices</tspan><tspan x="32.0" dy="22">say, assess for harm to</tspan><tspan x="32.0" dy="22">self or others, and</tspan><tspan x="32.0" dy="22">redirect.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Agreeing with the</tspan><tspan x="32.0" dy="22">hallucination or arguing</tspan><tspan x="32.0" dy="22">about it.</tspan></text></svg>
