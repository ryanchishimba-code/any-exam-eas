<svg width="304" height="382" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 382" role="img" aria-label="Lumbar puncture positioning." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n163"><defs></defs><clipPath id="n163p1"><rect x="2" y="2" width="300" height="178" rx="14"/></clipPath><rect x="2" y="2" width="300" height="178" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="178" fill="#0B5CAD" clip-path="url(#n163p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Lumbar puncture</tspan></text><rect x="18.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="57.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Side-lying</tspan></text><text x="83.0" y="72.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">knees to chest, back</tspan></text><text x="83.0" y="87.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">curled</tspan></text><rect x="156.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="221.0" y="57.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Sitting</tspan></text><text x="221.0" y="72.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">lean forward, back</tspan></text><text x="221.0" y="87.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">curled</tspan></text><rect x="18.0" y="106.0" width="130.0" height="58.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="83.0" y="123.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">After</tspan></text><text x="83.0" y="138.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">lie flat, fluids as</tspan></text><text x="83.0" y="153.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">allowed</tspan></text><rect x="156.0" y="106.0" width="130.0" height="58.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="221.0" y="123.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Report</tspan></text><text x="221.0" y="138.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">persistent headache</tspan></text><text x="221.0" y="153.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">or leak</tspan></text><clipPath id="n163p2"><rect x="2" y="188" width="300" height="100" rx="14"/></clipPath><rect x="2" y="188" width="300" height="100" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="188" width="5" height="100" fill="#0F766E" clip-path="url(#n163p2)"/><text x="18" y="212" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="236.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Headache worse upright and better lying</tspan><tspan x="18.0" dy="18">flat suggests post-dural puncture</tspan><tspan x="18.0" dy="18">headache.</tspan></text><clipPath id="n163p3"><rect x="2" y="296" width="300" height="82" rx="14"/>