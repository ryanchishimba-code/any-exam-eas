<svg width="304" height="342" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 342" role="img" aria-label="Pancreas inflammation diagram." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n196"><defs></defs><clipPath id="n196p1"><rect x="2" y="2" width="300" height="174" rx="14"/></clipPath><rect x="2" y="2" width="300" height="174" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="174" fill="#0B5CAD" clip-path="url(#n196p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Acute pancreatitis</tspan></text><rect x="18.0" y="40.0" width="130.0" height="56.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="83.0" y="64.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Epigastric pain</tspan></text><text x="83.0" y="79.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">radiates to back</tspan></text><rect x="156.0" y="40.0" width="130.0" height="56.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="221.0" y="56.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Lipase</tspan></text><text x="221.0" y="71.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">3 times normal or</tspan></text><text x="221.0" y="86.9" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">more</tspan></text><rect x="18.0" y="104.0" width="130.0" height="56.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="83.0" y="135.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Moderate IV fluids</tspan></text><rect x="156.0" y="104.0" width="130.0" height="56.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="128.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Pain control, early</tspan></text><text x="221.0" y="143.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">feeding</tspan></text><clipPath id="n196p2"><rect x="2" y="184" width="300" height="82" rx="14"/></clipPath><rect x="2" y="184" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="184" width="5" height="82" fill="#0F766E" clip-path="url(#n196p2)"/><text x="18" y="208" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="232.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Acute pancreatitis; give IV fluids and pain</tspan><tspan x="18.0" dy="18">control.</tspan></text><clipPath id="n196p3"><rect x="2" y="274" width="300" height="64" rx="14"/></clipPath><rect x="2" y="274" width="300" height="64" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="274" width="5" height="64" fill="#B7410E" clip-path="url(#n196p3)"/><text x="18" y="298" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="322.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Keeping the client NPO longer than needed.</tspan></text></svg>