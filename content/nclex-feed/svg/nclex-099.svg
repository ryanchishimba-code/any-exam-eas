<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" data-layout="anatomy"><title>Skin schematic</title><rect width="420" height="400" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Skin schematic</text><rect x="96" y="62" width="28" height="100" rx="14" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="62" r="16" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><circle cx="110" cy="162" r="16" fill="#f4f1ea" stroke="#0f2e42" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">A bedbound client with a</tspan><tspan x="188.0" dy="22">sacral wound.</tspan></text><rect x="176.0" y="132.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Reposition, use support</tspan><tspan x="188.0" dy="22">surfaces, optimize</tspan><tspan x="188.0" dy="22">nutrition, and stage the</tspan><tspan x="188.0" dy="22">wound accurately.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Reverse-staging a</tspan><tspan x="188.0" dy="22">healing wound, such as</tspan><tspan x="188.0" dy="22">calling a stage 4 a</tspan><tspan x="188.0" dy="22">stage 2.</tspan></text></svg>
