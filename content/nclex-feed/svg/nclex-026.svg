<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Team member gets each referral</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Team member gets each referral</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Swallowing</tspan><tspan x="32.0" dy="22">problems, mobility</tspan><tspan x="32.0" dy="22">limits, home safety</tspan><tspan x="32.0" dy="22">needs or financial</tspan><tspan x="32.0" dy="22">concerns.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Speech for swallowing,</tspan><tspan x="32.0" dy="22">PT for gait, OT for daily</tspan><tspan x="32.0" dy="22">living, social work for</tspan><tspan x="32.0" dy="22">resources.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Referring dysphagia to the</tspan><tspan x="32.0" dy="22">dietitian instead of speech</tspan><tspan x="32.0" dy="22">therapy first.</tspan></text></svg>
