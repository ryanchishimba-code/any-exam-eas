<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 202" width="420" height="202" role="img" aria-labelledby="tnclex139"><title id="tnclex139">Avoid tyramine-rich foods such as aged cheese, cured meats and tap beer.</title><rect width="420" height="202" fill="#ffffff"/><rect x="16" y="16" width="388" height="170" rx="14" fill="#f4f7f8"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Avoid tyramine-rich foods such</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">as aged cheese, cured meats and</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">tap beer.</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Severe headache or high BP after a</text><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">tyramine-rich meal.</text></svg>
