<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 356" width="420" height="356" role="img" data-layout="anatomy"><title>Psych meds schematic</title><rect width="420" height="356" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Psych meds schematic</text><ellipse cx="110" cy="108" rx="46" ry="36" fill="#efe8f6" stroke="#5b3a78" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Severe headache or high</tspan><tspan x="188.0" dy="22">BP after a tyramine-rich</tspan><tspan x="188.0" dy="22">meal.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Teach the food list and</tspan><tspan x="188.0" dy="22">to avoid drug</tspan><tspan x="188.0" dy="22">interactions.</tspan></text><rect x="176.0" y="260.0" width="224.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Allowing aged cheese or</tspan><tspan x="188.0" dy="22">cured meats.</tspan></text></svg>
