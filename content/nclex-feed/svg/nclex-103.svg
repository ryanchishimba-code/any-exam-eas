<svg width="304" height="436" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 436" role="img" aria-label="IDDSI framework pyramid of drink and food levels." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n103"><defs></defs><clipPath id="n103p1"><rect x="2" y="2" width="300" height="250" rx="14"/></clipPath><rect x="2" y="2" width="300" height="250" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="250" fill="#0B5CAD" clip-path="url(#n103p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  IDDSI levels</tspan></text><rect x="18.0" y="40.0" width="130.0" height="26.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1.2"/><text x="83.0" y="56.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Drinks</tspan></text><rect x="156.0" y="40.0" width="130.0" height="26.0" rx="8" fill="#0F766E" stroke="none" stroke-width="1.2"/><text x="221.0" y="56.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Foods</tspan></text><rect x="18.0" y="74.0" width="130.0" height="26.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="90.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">0 Thin</tspan></text><rect x="156.0" y="74.0" width="130.0" height="26.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="90.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">3 Liquidised</tspan></text><rect x="18.0" y="108.0" width="130.0" height="26.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="124.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">1 Slightly thick</tspan></text><rect x="156.0" y="108.0" width="130.0" height="26.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="124.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">4 Pureed</tspan></text><rect x="18.0" y="142.0" width="130.0" height="26.0" rx="8" fill="#B9D6EE" stroke="none" stroke-width="1.2"/><text x="83.0" y="158.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">2 Mildly thick</tspan></text><rect x="156.0" y="142.0" width="130.0" height="26.0" rx="8" fill="#A9DDD5" stroke="none" stroke-width="1.2"/><text x="221.0" y="151.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">5 Minced moist</tspan></text><text x="221.0" y="166.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">food</tspan></text><rect x="18.0" y="176.0" width="130.0" height="26.0" rx="8" fill="#B9D6EE" stroke="none" stroke-width="1.2"/><text x="83.0" y="185.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">3 Moderately</tspan></text><text x="83.0" y="200.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">thick</tspan></text><rect x="156.0" y="176.0" width="130.0" height="26.0" rx="8" fill="#A9DDD5" stroke="none" stroke-width="1.2"/><text x="221.0" y="192.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">6 Soft, bite-sized</tspan></text><rect x="18.0" y="210.0" width="130.0" height="26.0" rx="8" fill="#7FB0DB" stroke="none" stroke-width="1.2"/><text x="83.0" y="226.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">4 Extremely thick</tspan></text><rect x="156.0" y="210.0" width="130.0" height="26.0" rx="8" fill="#7CC8BC" stroke="none" stroke-width="1.2"/><text x="221.0" y="226.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">7 Regular</tspan></text><clipPath id="n103p2"><rect x="2" y="260" width="300" height="82" rx="14"/></clipPath><rect x="2" y="260" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="260" width="5" height="82" fill="#0F766E" clip-path="url(#n103p2)"/><text x="18" y="284" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="308.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Keep NPO until the swallow screen; sit fully</tspan><tspan x="18.0" dy="18">upright and request a speech evaluation.</tspan></text><clipPath id="n103p3"><rect x="2" y="350" width="300" height="82" rx="14"/></clipPath><rect x="2" y="350" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="350" width="5" height="82" fill="#B7410E" clip-path="url(#n103p3)"/><text x="18" y="374" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="398.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Giving thin liquids or a straw without a</tspan><tspan x="18.0" dy="18">swallow evaluation.</tspan></text></svg>