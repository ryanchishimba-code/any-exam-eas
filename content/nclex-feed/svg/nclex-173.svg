<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Shock type is it, and what first</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Shock type is it, and what first</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Flat neck veins</tspan><tspan x="32.0" dy="22">and blood loss</tspan><tspan x="32.0" dy="22">suggest hypovolemia;</tspan><tspan x="32.0" dy="22">crackles and JVD</tspan><tspan x="32.0" dy="22">suggest cardiogenic.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Place two large-bore</tspan><tspan x="32.0" dy="22">IVs and give fluids or</tspan><tspan x="32.0" dy="22">blood as ordered;</tspan><tspan x="32.0" dy="22">reassess often.</tspan></text><rect x="20" y="338" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Giving large fluid boluses</tspan><tspan x="32.0" dy="22">in cardiogenic shock.</tspan></text></svg>
