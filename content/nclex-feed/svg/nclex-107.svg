<svg width="304" height="364" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 364" role="img" aria-label="Stoma color chart from healthy red to dusky and black." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n107"><defs></defs><clipPath id="n107p1"><rect x="2" y="2" width="300" height="178" rx="14"/></clipPath><rect x="2" y="2" width="300" height="178" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="178" fill="#0B5CAD" clip-path="url(#n107p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Stoma color</tspan></text><rect x="18.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#E8858A" stroke="none" stroke-width="1.2"/><text x="83.0" y="65.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Pink to red, moist</tspan></text><text x="83.0" y="80.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">healthy</tspan></text><rect x="156.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#F5D6D3" stroke="none" stroke-width="1.2"/><text x="221.0" y="65.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Pale</tspan></text><text x="221.0" y="80.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">report</tspan></text><rect x="18.0" y="106.0" width="130.0" height="58.0" rx="8" fill="#7B4A78" stroke="none" stroke-width="1.2"/><text x="83.0" y="123.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Dusky or purple</tspan></text><text x="83.0" y="138.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">ischemia: report</tspan></text><text x="83.0" y="153.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">promptly</tspan></text><rect x="156.0" y="106.0" width="130.0" height="58.0" rx="8" fill="#2A2228" stroke="none" stroke-width="1.2"/><text x="221.0" y="123.9" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">Black</tspan></text><text x="221.0" y="138.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">necrosis: report</tspan></text><text x="221.0" y="153.9" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">promptly</tspan></text><clipPath id="n107p2"><rect x="2" y="188" width="300" height="82" rx="14"/></clipPath><rect x="2" y="188" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="188" width="5" height="82" fill="#0F766E" clip-path="url(#n107p2)"/><text x="18" y="212" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="236.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">A healthy stoma is moist and pink to red;</tspan><tspan x="18.0" dy="18">dusky means ischemia.</tspan></text><clipPath id="n107p3"><rect x="2" y="278" width="300" height="82" rx="14"/></clipPath><rect x="2" y="278" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="278" width="5" height="82" fill="#B7410E" clip-path="url(#n107p3)"/><text x="18" y="302" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="326.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Treating a dusky or black stoma as normal</tspan><tspan x="18.0" dy="18">postoperative swelling.</tspan></text></svg>