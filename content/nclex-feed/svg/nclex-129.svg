<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 202" width="420" height="202" role="img" aria-labelledby="tnclex129"><title id="tnclex129">Hand hygiene, chlorhexidine skin prep, and scrubbing the hub before each access.</title><rect width="420" height="202" fill="#ffffff"/><rect x="16" y="16" width="388" height="170" rx="14" fill="#f4f7f8"/><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Hand hygiene, chlorhexidine skin</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">prep, and scrubbing the hub</text><text x="32" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">before each access.</text><text x="32" y="134" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Fever or redness at a central line</text><text x="32" y="158" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">site.</text></svg>
