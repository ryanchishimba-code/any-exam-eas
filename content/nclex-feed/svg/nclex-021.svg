<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 302" width="420" height="302" role="img"><title>Decision path</title><rect width="420" height="302" fill="#ffffff"/><rect x="0" y="0" width="420" height="36" fill="#0f2e42"/><text x="20" y="24" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Decision path</text><rect x="48" y="52" width="340" height="50" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><circle cx="28" cy="77.0" r="12" fill="#0d7f8c"/><text x="28" y="82.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="64" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Walking wounded are green</text><line x1="210" y1="102" x2="210" y2="116" stroke="#0d7f8c" stroke-width="2"/><rect x="48" y="118" width="340" height="72" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><circle cx="28" cy="154.0" r="12" fill="#0d7f8c"/><text x="28" y="159.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="64" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">No breathing after opening the</text><text x="64" y="164" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">airway is black</text><line x1="210" y1="190" x2="210" y2="204" stroke="#0d7f8c" stroke-width="2"/><rect x="48" y="206" width="340" height="72" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><circle cx="28" cy="242.0" r="12" fill="#0d7f8c"/><text x="28" y="247.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="64" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Treat red tags first, and</text><text x="64" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">reassess all clients often as</text></svg>
