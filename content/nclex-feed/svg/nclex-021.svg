<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>At a mass-casualty scene, the nurse</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">At a mass-casualty scene, the nurse</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Walking wounded</tspan><tspan x="32.0" dy="22">are green; no</tspan><tspan x="32.0" dy="22">breathing after</tspan><tspan x="32.0" dy="22">opening the airway is</tspan><tspan x="32.0" dy="22">black.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Treat red tags first,</tspan><tspan x="32.0" dy="22">and reassess all clients</tspan><tspan x="32.0" dy="22">often as conditions</tspan><tspan x="32.0" dy="22">change.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Spending resources on</tspan><tspan x="32.0" dy="22">expectant clients while</tspan><tspan x="32.0" dy="22">immediate clients wait.</tspan></text></svg>
