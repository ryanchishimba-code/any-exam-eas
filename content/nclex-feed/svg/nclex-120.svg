<svg width="304" height="430" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 430" role="img" aria-label="Rule of 15 cycle diagram." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n120"><defs></defs><clipPath id="n120p1"><rect x="2" y="2" width="300" height="244" rx="14"/></clipPath><rect x="2" y="2" width="300" height="244" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="244" fill="#0B5CAD" clip-path="url(#n120p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Rule of 15</tspan></text><rect x="18.0" y="40.0" width="228.0" height="32.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="132.0" y="59.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="132.0" dy="0">Glucose &lt;70 mg/dL</tspan></text><line x1="132.0" y1="74.0" x2="132.0" y2="84.0" stroke="#4A625F" stroke-width="1.6" stroke-linecap="round"/><polygon points="132.0,84.0 129.0,77.7 135.0,77.7" fill="#4A625F"/><rect x="18.0" y="86.0" width="228.0" height="32.0" rx="8" fill="#0B5CAD" stroke="none" stroke-width="1.2"/><text x="132.0" y="98.4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="132.0" dy="0">Give 15 g fast-acting</tspan></text><text x="132.0" y="113.4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve"><tspan x="132.0" dy="0">carbohydrate</tspan></text><line x1="132.0" y1="120.0" x2="132.0" y2="130.0" stroke="#4A625F" stroke-width="1.6" stroke-linecap="round"/><polygon points="132.0,130.0 129.0,123.7 135.0,123.7" fill="#4A625F"/><rect x="18.0" y="132.0" width="228.0" height="32.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="132.0" y="151.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="132.0" dy="0">Recheck in 15 minutes</tspan></text><line x1="246.0" y1="148.0" x2="268.0" y2="148.0" stroke="#4A625F" stroke-width="1.5" stroke-linecap="round"/><line x1="268.0" y1="148.0" x2="268.0" y2="102.0" stroke="#4A625F" stroke-width="1.5" stroke-linecap="round"/><line x1="268.0" y1="102.0" x2="248.0" y2="102.0" stroke="#4A625F" stroke-width="1.6" stroke-linecap="round"/><polygon points="248.0,102.0 254.3,99.0 254.3,105.0" fill="#4A625F"/><text x="286.0" y="136.0" font-size="10" font-weight="700" fill="#B7410E" text-anchor="end" xml:space="preserve"><tspan x="286.0" dy="0">still</tspan></text><text x="286.0" y="164.0" font-size="10" font-weight="700" fill="#B7410E" text-anchor="end" xml:space="preserve"><tspan x="286.0" dy="0">&lt;70</tspan></text><line x1="132.0" y1="166.0" x2="132.0" y2="176.0" stroke="#4A625F" stroke-width="1.6" stroke-linecap="round"/><polygon points="132.0,176.0 129.0,169.7 135.0,169.7" fill="#4A625F"/><rect x="18.0" y="178.0" width="228.0" height="32.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="132.0" y="197.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="132.0" dy="0">Normal: snack or meal</tspan></text><clipPath id="n120p2"><rect x="2" y="254" width="300" height="82" rx="14"/></clipPath><rect x="2" y="254" width="300" height="82" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="254" width="5" height="82" fill="#0F766E" clip-path="url(#n120p2)"/><text x="18" y="278" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="302.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">If unable to swallow, give glucagon or IV</tspan><tspan x="18.0" dy="18">dextrose as ordered.</tspan></text><clipPath id="n120p3"><rect x="2" y="344" width="300" height="82" rx="14"/></clipPath><rect x="2" y="344" width="300" height="82" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="344" width="5" height="82" fill="#B7410E" clip-path="url(#n120p3)"/><text x="18" y="368" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="392.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Giving food or fluids by mouth to an</tspan><tspan x="18.0" dy="18">unconscious client.</tspan></text></svg>