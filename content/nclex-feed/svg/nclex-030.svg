<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 314" width="420" height="314" role="img" data-layout="cycle"><title>Delegation repeat cycle</title><rect width="420" height="314" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Delegation repeat cycle</text><circle cx="210" cy="86" r="26" fill="none" stroke="#0d7f8c" stroke-width="3"/><text x="210.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d7f8c" text-anchor="middle">Repeat</text><text x="24.0" y="132.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Assistive personnel report a change in</tspan><tspan x="24.0" dy="22">vital signs or the client's condition.</tspan></text><text x="24.0" y="182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Follow up promptly, reassess the client</tspan><tspan x="24.0" dy="22">yourself, and give feedback to the</tspan><tspan x="24.0" dy="22">delegatee.</tspan></text><text x="24.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="24.0" dy="0">Assuming the task went well without</tspan><tspan x="24.0" dy="22">checking the outcome.</tspan></text></svg>
