<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Protective care include</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Protective care include</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. An absolute</tspan><tspan x="32.0" dy="22">neutrophil count</tspan><tspan x="32.0" dy="22">below about 1,000</tspan><tspan x="32.0" dy="22">cells/mm3.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Private room, strict</tspan><tspan x="32.0" dy="22">hand hygiene, no fresh</tspan><tspan x="32.0" dy="22">flowers or sick visitors;</tspan><tspan x="32.0" dy="22">report fever.</tspan></text><rect x="20" y="316" width="330" height="76" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Taking rectal temperatures</tspan><tspan x="32.0" dy="22">or giving suppositories.</tspan></text></svg>
