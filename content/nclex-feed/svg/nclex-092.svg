<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 182" width="420" height="182" role="img" aria-labelledby="tnclex092"><title id="tnclex092">Refeeding syndrome with low phosphate, potassium and magnesium.</title><rect width="420" height="182" fill="#ffffff"/><rect x="0" y="0" width="8" height="182" fill="#0d7f8c"/><text x="28" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Refeeding syndrome with low</text><text x="28" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">phosphate, potassium and</text><text x="28" y="80" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">magnesium.</text><text x="28" y="114" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Anorexia with low weight,</text><text x="28" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">bradycardia or electrolyte problems.</text></svg>
