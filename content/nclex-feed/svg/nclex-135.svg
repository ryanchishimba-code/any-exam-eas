<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 414" width="420" height="414" role="img" data-layout="ladder"><title>Before giving metoprolol, the heart</title><rect width="420" height="414" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Before giving metoprolol, the heart</text><rect x="20" y="52" width="250" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Bradycardia,</tspan><tspan x="32.0" dy="22">hypotension,</tspan><tspan x="32.0" dy="22">dizziness or fatigue.</tspan></text><rect x="20" y="162" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Check apical pulse and</tspan><tspan x="32.0" dy="22">BP before each dose;</tspan><tspan x="32.0" dy="22">teach not to stop</tspan><tspan x="32.0" dy="22">abruptly.</tspan></text><rect x="20" y="294" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="316.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Stopping a beta blocker</tspan><tspan x="32.0" dy="22">suddenly, which can cause</tspan><tspan x="32.0" dy="22">rebound effects.</tspan></text></svg>
