<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>Comes first</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Comes first</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Any threat to</tspan><tspan x="28.0" dy="22">airway or</tspan><tspan x="28.0" dy="22">breathing</tspan><tspan x="28.0" dy="22">outranks</tspan><tspan x="28.0" dy="22">comfort,</tspan><tspan x="28.0" dy="22">elimination or</tspan><tspan x="28.0" dy="22">teaching needs.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Apply ABCs</tspan><tspan x="228.0" dy="22">first, then</tspan><tspan x="228.0" dy="22">Maslow:</tspan><tspan x="228.0" dy="22">physiologic</tspan><tspan x="228.0" dy="22">needs before</tspan><tspan x="228.0" dy="22">safety and</tspan><tspan x="228.0" dy="22">psychosocial</tspan><tspan x="228.0" dy="22">needs.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Choosing pain or comfort when it does not</tspan><tspan x="20.0" dy="22">signal a physiologic threat.</tspan></text></svg>
