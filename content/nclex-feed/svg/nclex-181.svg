<svg width="304" height="276" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 276" role="img" aria-label="Cushing triad diagram." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n181"><defs></defs><clipPath id="n181p1"><rect x="2" y="2" width="300" height="126" rx="14"/></clipPath><rect x="2" y="2" width="300" height="126" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="126" fill="#0B5CAD" clip-path="url(#n181p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Cushing triad</tspan></text><rect x="18.0" y="40.0" width="84.0" height="52.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="60.0" y="62.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="60.0" dy="0">Rising</tspan></text><text x="60.0" y="77.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="60.0" dy="0">systolic BP</tspan></text><rect x="110.0" y="40.0" width="84.0" height="52.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="152.0" y="69.9" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="152.0" dy="0">Bradycardia</tspan></text><rect x="202.0" y="40.0" width="84.0" height="52.0" rx="8" fill="#FBE3D6" stroke="none" stroke-width="1.2"/><text x="244.0" y="62.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="244.0" dy="0">Irregular</tspan></text><text x="244.0" y="77.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="244.0" dy="0">breathing</tspan></text><text x="18.0" y="112.0" font-size="12" font-weight="700" fill="#B7410E" xml:space="preserve"><tspan x="18.0" dy="0">Late sign. Earliest sign: change in LOC.</tspan></text><clipPath id="n181p2"><rect x="2" y="136" width="300" height="64" rx="14"/></clipPath><rect x="2" y="136" width="300" height="64" rx="14" fill="#F0FAF8" stroke="#CBE7E3" stroke-width="1"/><rect x="2" y="136" width="5" height="64" fill="#0F766E" clip-path="url(#n181p2)"/><text x="18" y="160" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0F766E" letter-spacing=".9">FIRST-LINE</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="184.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Cushing triad is a late sign of rising ICP.</tspan></text><clipPath id="n181p3"><rect x="2" y="208" width="300" height="64" rx="14"/></clipPath><rect x="2" y="208" width="300" height="64" rx="14" fill="#FFF5EF" stroke="#F2D3C3" stroke-width="1"/><rect x="2" y="208" width="5" height="64" fill="#B7410E" clip-path="url(#n181p3)"/><text x="18" y="232" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#B7410E" letter-spacing=".9">EXAM TRAP</tspan><tspan fill="#2B4541"></tspan></text><text x="18.0" y="256.0" font-size="13" font-weight="500" fill="#2B4541" xml:space="preserve"><tspan x="18.0" dy="0">Missing an early change in consciousness.</tspan></text></svg>