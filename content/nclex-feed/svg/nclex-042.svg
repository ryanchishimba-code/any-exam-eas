<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>The nurse is entering and leaving</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse is entering and leaving</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Putting on PPE</tspan><tspan x="32.0" dy="22">before entering, and</tspan><tspan x="32.0" dy="22">removing it when</tspan><tspan x="32.0" dy="22">leaving an isolation</tspan><tspan x="32.0" dy="22">room.</tspan></text><rect x="20" y="206" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Remove gloves,</tspan><tspan x="32.0" dy="22">goggles, gown, then mask;</tspan><tspan x="32.0" dy="22">perform hand hygiene</tspan><tspan x="32.0" dy="22">right after.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Removing the mask or</tspan><tspan x="32.0" dy="22">respirator before the gloves</tspan><tspan x="32.0" dy="22">and gown.</tspan></text></svg>
