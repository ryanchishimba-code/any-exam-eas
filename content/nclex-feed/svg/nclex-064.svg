<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 376" width="420" height="376" role="img" data-layout="branch"><title>Decision flow</title><rect width="420" height="376" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Decision flow</text><rect x="48.0" y="48.0" width="352.0" height="74.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">A toddler seeks independence; a</tspan><tspan x="60.0" dy="22">teen seeks identity.</tspan></text><circle cx="26" cy="85.0" r="12" fill="#0d7f8c"/><text x="26.0" y="90.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="210" y1="122.0" x2="210" y2="138.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="140.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy="0">Support each stage task: choices</tspan><tspan x="60.0" dy="22">for toddlers, privacy and</tspan><tspan x="60.0" dy="22">respect for teens.</tspan></text><circle cx="26" cy="188.0" r="12" fill="#0d7f8c"/><text x="26.0" y="193.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="210" y1="236.0" x2="210" y2="252.0" stroke="#0d7f8c" stroke-width="2"/><rect x="48.0" y="254.0" width="352.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="60.0" y="278.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="60.0" dy=