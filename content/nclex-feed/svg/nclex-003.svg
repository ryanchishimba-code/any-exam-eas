<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Delegation ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Delegation ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Vital signs,</tspan><tspan x="32.0" dy="22">hygiene, ambulation,</tspan><tspan x="32.0" dy="22">and intake and output</tspan><tspan x="32.0" dy="22">for stable clients.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Delegate routine</tspan><tspan x="32.0" dy="22">tasks; keep assessment,</tspan><tspan x="32.0" dy="22">teaching, evaluation and</tspan><tspan x="32.0" dy="22">clinical judgment with</tspan><tspan x="32.0" dy="22">the RN.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Delegating the initial</tspan><tspan x="32.0" dy="22">assessment or care of a new</tspan><tspan x="32.0" dy="22">or unstable client.</tspan></text></svg>
