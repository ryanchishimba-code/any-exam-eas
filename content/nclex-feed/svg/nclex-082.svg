<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 232" width="420" height="232" role="img" aria-labelledby="tnclex082"><title id="tnclex082">False reassurance, advice and changing the subject block communication.</title><rect width="420" height="232" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">False reassurance, advice and</text><rect x="16" y="44" width="388" height="80" rx="12" fill="#e7f5ef"/><text x="32" y="68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6b4a" text-anchor="start">Do</text><text x="32" y="90" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Acknowledge the client's feelings</text><text x="32" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">and explore the specific concerns.</text><rect x="16" y="136" width="388" height="80" rx="12" fill="#fdecec"/><text x="32" y="160" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c3a3a" text-anchor="start">Not this</text><text x="32" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">Giving personal opinions or advice</text><text x="32" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">instead of exploring feelings.</text></svg>
