<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" role="img" data-layout="ladder"><title>Legal and ethical ordered steps</title><rect width="420" height="480" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Legal and ethical ordered steps</text><rect x="20" y="52" width="250" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. The client must be</tspan><tspan x="32.0" dy="22">competent, informed</tspan><tspan x="32.0" dy="22">and signing</tspan><tspan x="32.0" dy="22">voluntarily, without</tspan><tspan x="32.0" dy="22">sedation.</tspan></text><rect x="20" y="206" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Confirm understanding;</tspan><tspan x="32.0" dy="22">if the client has</tspan><tspan x="32.0" dy="22">questions, hold the</tspan><tspan x="32.0" dy="22">signing and notify the</tspan><tspan x="32.0" dy="22">provider.</tspan></text><rect x="20" y="360" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Explaining surgical risks</tspan><tspan x="32.0" dy="22">yourself or letting a sedated</tspan><tspan x="32.0" dy="22">client sign.</tspan></text></svg>
