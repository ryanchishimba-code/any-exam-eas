<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" data-layout="anatomy"><title>Respiratory schematic</title><rect width="420" height="400" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Respiratory schematic</text><ellipse cx="88" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><ellipse cx="132" cy="110" rx="28" ry="48" fill="#e7f2fb" stroke="#1d4e89" stroke-width="2"/><rect x="176.0" y="48.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Chronic CO2 retention</tspan><tspan x="188.0" dy="22">can worsen with excess</tspan><tspan x="188.0" dy="22">oxygen.</tspan></text><rect x="176.0" y="154.0" width="224.0" height="118.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="178.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Teach pursed-lip</tspan><tspan x="188.0" dy="22">breathing and the tripod</tspan><tspan x="188.0" dy="22">position; check ABGs as</tspan><tspan x="188.0" dy="22">ordered.</tspan></text><rect x="176.0" y="282.0" width="224.0" height="96.0" rx="10" fill="#f4f8f8" stroke="#d5e2e4"/><text x="188.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="188.0" dy="0">Withholding oxygen from</tspan><tspan x="188.0" dy="22">a hypoxic client because</tspan><tspan x="188.0" dy="22">of CO2 retention fears.</tspan></text></svg>
