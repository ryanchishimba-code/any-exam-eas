<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" width="420" height="458" role="img" data-layout="ladder"><title>Hematology ordered steps</title><rect width="420" height="458" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Hematology ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. Platelets fall</tspan><tspan x="32.0" dy="22">more than 50% about 5</tspan><tspan x="32.0" dy="22">to 10 days after</tspan><tspan x="32.0" dy="22">starting heparin.</tspan></text><rect x="20" y="184" width="290" height="142" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Stop all heparin,</tspan><tspan x="32.0" dy="22">including flushes and</tspan><tspan x="32.0" dy="22">coated lines; expect a</tspan><tspan x="32.0" dy="22">non-heparin</tspan><tspan x="32.0" dy="22">anticoagulant.</tspan></text><rect x="20" y="338" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Continuing heparin,</tspan><tspan x="32.0" dy="22">including flushes, when HIT</tspan><tspan x="32.0" dy="22">is suspected.</tspan></text></svg>
