<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 324" width="420" height="324" role="img" data-layout="contrast"><title>The nurse suspect</title><rect width="420" height="324" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">The nurse suspect</text><rect x="16" y="48" width="188" height="216" rx="10" fill="#e7f5f3" stroke="#d5e2e4"/><rect x="216" y="48" width="188" height="216" rx="10" fill="#fff6f1" stroke="#f0d2c4"/><text x="28.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2e42" text-anchor="start">Do this</text><text x="228.0" y="70.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412" text-anchor="start">Do not</text><text x="28.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="28.0" dy="0">Platelets fall</tspan><tspan x="28.0" dy="22">more than 50%</tspan><tspan x="28.0" dy="22">about 5 to 10</tspan><tspan x="28.0" dy="22">days after</tspan><tspan x="28.0" dy="22">starting</tspan><tspan x="28.0" dy="22">heparin.</tspan></text><text x="228.0" y="96.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="228.0" dy="0">Stop all</tspan><tspan x="228.0" dy="22">heparin,</tspan><tspan x="228.0" dy="22">including</tspan><tspan x="228.0" dy="22">flushes and</tspan><tspan x="228.0" dy="22">coated lines;</tspan><tspan x="228.0" dy="22">expect a</tspan><tspan x="228.0" dy="22">non-heparin</tspan><tspan x="228.0" dy="22">anticoagulant.</tspan></text><text x="20.0" y="272.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a3d4a" text-anchor="start"><tspan x="20.0" dy="0">Continuing heparin, including flushes,</tspan><tspan x="20.0" dy="22">when HIT is suspected.</tspan></text></svg>
