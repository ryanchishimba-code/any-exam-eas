<svg width="304" height="364" xmlns="http://www.w3.org/2000/svg" class="v3" viewBox="0 0 304 364" role="img" aria-label="Thoracentesis and paracentesis positioning." font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-uid="n162"><defs></defs><clipPath id="n162p1"><rect x="2" y="2" width="300" height="178" rx="14"/></clipPath><rect x="2" y="2" width="300" height="178" rx="14" fill="#F1F6FC" stroke="#CFE0F2" stroke-width="1"/><rect x="2" y="2" width="5" height="178" fill="#0B5CAD" clip-path="url(#n162p1)"/><text x="18" y="26" font-size="12" fill="#0F2F2C" font-weight="600" xml:space="preserve"><tspan font-weight="800" fill="#0B5CAD" letter-spacing=".9">CLUE</tspan><tspan fill="#2B4541">  Thoracentesis</tspan></text><rect x="18.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#DCEBF8" stroke="none" stroke-width="1.2"/><text x="83.0" y="65.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Position</tspan></text><text x="83.0" y="80.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">sit up, lean over table</tspan></text><rect x="156.0" y="40.0" width="130.0" height="58.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="221.0" y="65.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">After</tspan></text><text x="221.0" y="80.4" font-size="11" font-weight="500" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="221.0" dy="0">sit upright</tspan></text><rect x="18.0" y="106.0" width="130.0" height="58.0" rx="8" fill="#D7F0EC" stroke="none" stroke-width="1.2"/><text x="83.0" y="131.4" font-size="12" font-weight="700" fill="#0F2F2C" text-anchor="middle" xml:space="preserve"><tspan x="83.0" dy="0">Check</tspan></text><text x="83.0" y="146.4" font-size="11" font-weight="500" fill="#0F2F2C" text-ancho