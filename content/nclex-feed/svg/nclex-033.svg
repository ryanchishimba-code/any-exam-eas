<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 156" width="420" height="156" role="img" aria-labelledby="tnclex033"><title id="tnclex033">Log out, lock screens and never share passwords.</title><rect width="420" height="156" fill="#ffffff"/><rect x="0" y="0" width="8" height="156" fill="#0d7f8c"/><text x="28" y="28" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">Log out, lock screens and never</text><text x="28" y="54" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2e42" text-anchor="start">share passwords.</text><text x="28" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">An unattended screen or a request to</text><text x="28" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1a3d4a" text-anchor="start">use another person's login.</text></svg>
