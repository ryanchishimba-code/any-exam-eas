<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 436" width="420" height="436" role="img" data-layout="ladder"><title>Informatics ordered steps</title><rect width="420" height="436" fill="#ffffff"/><text x="20.0" y="28.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2e42" text-anchor="start">Informatics ordered steps</text><rect x="20" y="52" width="250" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="74.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">1. An unattended</tspan><tspan x="32.0" dy="22">screen or a request</tspan><tspan x="32.0" dy="22">to use another</tspan><tspan x="32.0" dy="22">person's login.</tspan></text><rect x="20" y="184" width="290" height="120" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">2. Lock screens, follow</tspan><tspan x="32.0" dy="22">downtime procedures, and</tspan><tspan x="32.0" dy="22">protect or shred</tspan><tspan x="32.0" dy="22">printouts.</tspan></text><rect x="20" y="316" width="330" height="98" rx="8" fill="#f4f8f8" stroke="#0d7f8c"/><text x="32.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2e42" text-anchor="start"><tspan x="32.0" dy="0">3. Documenting under another</tspan><tspan x="32.0" dy="22">nurse's login or sharing</tspan><tspan x="32.0" dy="22">credentials.</tspan></text></svg>
