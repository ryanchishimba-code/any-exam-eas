name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Question bank quality QA
        run: npm run test:qa:questions

      - name: Install SVG tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if command -v xmllint >/dev/null 2>&1; then
            xmllint --version
            exit 0
          fi
          # apt-get waits forever on a lock or a dead mirror. That step sat for
          # six hours on this branch and cancelled the job before unit tests.
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service >/dev/null 2>&1 || true
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o DPkg::Lock::Timeout=60
          )
          for attempt in 1 2 3; do
            if sudo apt-get "${APT_OPTS[@]}" update && sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends libxml2-utils; then
              command -v xmllint >/dev/null
              exit 0
            fi
            echo "libxml2-utils install attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done
          echo "libxml2-utils install failed"
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Component tests
        run: npm run test:component

      - name: Build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXTAUTH_SECRET: ci-build-secret-min-16-chars
          NEXTAUTH_URL: http://localhost:3000
        run: |
          node scripts/set-prisma-provider.mjs postgresql
          npm run build
          node scripts/check-perf-budget.mjs
