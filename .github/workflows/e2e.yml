name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d build"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prepare database schema
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npx prisma db push

      - name: Seed dev user
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run db:seed-user

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXTAUTH_SECRET: ci-e2e-secret-min-16-chars
          NEXTAUTH_URL: http://127.0.0.1:3100
          PLAYWRIGHT_PORT: "3100"
          CI: "true"
        run: npm run test:e2e:chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Public landings only. Does not boot Postgres and does not set the
  # placeholder DATABASE_URL the app rejects. Browsers install to the default
  # cache (the chromium job above uses PLAYWRIGHT_BROWSERS_PATH=0).
  landing-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Landing parity (Chromium, Firefox, WebKit)
        env:
          NEXTAUTH_SECRET: ci-e2e-secret-min-16-chars
          NEXTAUTH_URL: http://127.0.0.1:3100
          PLAYWRIGHT_PORT: "3100"
          CI: "true"
        run: npx playwright test tests/e2e/landing-parity.spec.ts --project=parity-chromium --project=parity-firefox --project=parity-webkit

      - name: Upload landing parity report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landing-parity-report
          path: playwright-report/
          retention-days: 7
