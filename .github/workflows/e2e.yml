name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: anyexam_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d anyexam_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prepare database schema
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/anyexam_e2e
        run: npx prisma db push

      - name: Seed dev user
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/anyexam_e2e
        run: npm run db:seed-user

      - name: Install Playwright browsers
        env:
          # test:e2e:chromium sets PLAYWRIGHT_BROWSERS_PATH=0, so the binary
          # must land in node_modules/playwright-core/.local-browsers.
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (chromium)
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/anyexam_e2e
          NEXTAUTH_SECRET: ci-e2e-secret-min-16-chars
          NEXTAUTH_URL: http://127.0.0.1:3100
          PLAYWRIGHT_PORT: "3100"
          CI: "true"
        run: npm run test:e2e:chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
